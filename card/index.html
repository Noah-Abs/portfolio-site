<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(130% 130% at 50% 0%,#191c33,#05060c 72%);min-height:100vh;
    display:grid;place-items:center;font-family:"Oswald",sans-serif;overflow:hidden}
  /* drifting ambient glow */
  body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(95px);opacity:.45;z-index:0}
  body:before{width:520px;height:520px;background:#6b46ff;left:-140px;top:-110px;animation:drift1 13s ease-in-out infinite alternate}
  body:after{width:460px;height:460px;background:#1f9cf0;right:-120px;bottom:-110px;animation:drift2 16s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(150px,90px) scale(1.1)}}
  @keyframes drift2{to{transform:translate(-120px,-70px) scale(1.05)}}

  .scene{perspective:1200px;z-index:1;padding:40px}
  .card{position:relative;width:330px;height:462px;border-radius:22px;transform-style:preserve-3d;
    transition:transform .3s cubic-bezier(.2,.8,.3,1);will-change:transform;cursor:pointer;animation:float 6.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:rotateX(5deg) rotateY(-4deg) translateY(0)}50%{transform:rotateX(-3deg) rotateY(5deg) translateY(-14px)}}
  .card.live{animation:none}

  /* glowing rotating gradient ring */
  .card:before{content:"";position:absolute;inset:-2.5px;border-radius:25px;z-index:-1;
    background:conic-gradient(from 0deg,#6b46ff,#1f9cf0,#23e3a3,#ffd24a,#ff5a8a,#6b46ff);
    filter:blur(11px);opacity:.9;animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .face{position:absolute;inset:0;border-radius:22px;overflow:hidden;
    background:linear-gradient(160deg,#141733 0%,#0a0c1a 60%,#0c0f22 100%);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 45px 90px rgba(0,0,0,.65)}

  /* fine grid + radial vignette */
  .grid{position:absolute;inset:0;opacity:.22;
    background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:27px 27px}
  .vig{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 38%,rgba(120,150,255,.18),transparent 60%)}

  /* faceted gem */
  .gem{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:176px;z-index:3;
    filter:drop-shadow(0 0 30px rgba(130,160,255,.6))}
  .gem svg{width:100%;height:auto;display:block;animation:hue 5s linear infinite}
  @keyframes hue{to{filter:hue-rotate(360deg)}}

  .label{position:absolute;left:0;right:0;bottom:46px;text-align:center;z-index:3}
  .label .t{font-family:"Anton",sans-serif;font-size:34px;letter-spacing:7px;line-height:1;
    background:linear-gradient(90deg,#9fb4ff,#7ef0d0,#ffd27a,#ff9ad0,#9fb4ff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
  @keyframes flow{to{background-position:200% center}}
  .label .s{font-size:11px;letter-spacing:6px;color:rgba(255,255,255,.42);margin-top:6px;font-weight:300}

  .rating{position:absolute;top:16px;left:18px;z-index:4;font-family:"Anton",sans-serif;font-size:40px;line-height:.8;color:#fff;
    text-shadow:0 0 18px rgba(120,160,255,.7)}
  .rating small{display:block;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:4px;font-weight:600;color:rgba(255,255,255,.55)}

  /* holographic foil — shifts with cursor */
  .holo{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:color-dodge;opacity:.4;
    background:repeating-linear-gradient(115deg,
      rgba(255,0,128,.5) 0%,rgba(0,229,255,.5) 9%,rgba(255,214,0,.5) 16%,rgba(122,0,255,.5) 23%,rgba(0,255,170,.5) 30%,rgba(255,0,128,.5) 38%);
    background-size:300% 300%;background-position:50% 50%;transition:background-position .12s ease-out}
  /* glitter sparkle */
  .sparkle{position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:screen;opacity:.55;
    background-image:radial-gradient(circle,#fff .7px,transparent 1.1px);background-size:9px 9px;
    -webkit-mask-image:repeating-linear-gradient(115deg,#000 0 5%,transparent 5% 13%);
    mask-image:repeating-linear-gradient(115deg,#000 0 5%,transparent 5% 13%)}
  /* cursor glare */
  .glare{position:absolute;inset:0;z-index:7;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .25s;
    background:radial-gradient(circle at var(--mx,50%) var(--my,40%),rgba(255,255,255,.5),rgba(255,255,255,.06) 28%,transparent 46%)}
  /* shine sweep */
  .face:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);
    transform:translateX(-140%);animation:sweep 5s ease-in-out infinite}
  @keyframes sweep{0%,72%{transform:translateX(-140%)}100%{transform:translateX(140%)}}

  .hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.3);
    font-size:12px;letter-spacing:3px;text-transform:uppercase;z-index:2}
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face">
        <div class="grid"></div>
        <div class="vig"></div>

        <div class="rating">99<small>OVR</small></div>

        <div class="gem">
          <svg viewBox="0 0 200 232" aria-hidden="true">
            <defs>
              <linearGradient id="gemg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#aef0ff"/><stop offset=".5" stop-color="#7d9bff"/><stop offset="1" stop-color="#c79bff"/>
              </linearGradient>
            </defs>
            <polygon points="100,6 184,70 100,226 16,70" fill="url(#gemg)" stroke="#ffffff" stroke-width="2.2" opacity=".96"/>
            <polygon points="100,6 152,52 100,80 48,52" fill="#ffffff" opacity=".34"/>
            <polyline points="16,70 100,92 184,70" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6"/>
            <g stroke="#ffffff" fill="none">
              <line x1="48" y1="52" x2="16" y2="70" stroke-width=".9" opacity=".45"/>
              <line x1="152" y1="52" x2="184" y2="70" stroke-width=".9" opacity=".45"/>
              <line x1="48" y1="52" x2="64" y2="80" stroke-width=".8" opacity=".4"/>
              <line x1="152" y1="52" x2="136" y2="80" stroke-width=".8" opacity=".4"/>
              <line x1="64" y1="80" x2="48" y2="52" stroke-width=".6" opacity=".3"/>
              <line x1="16" y1="70" x2="100" y2="226" stroke-width="1" opacity=".5"/>
              <line x1="184" y1="70" x2="100" y2="226" stroke-width="1" opacity=".5"/>
              <line x1="100" y1="92" x2="100" y2="226" stroke-width="1" opacity=".4"/>
              <line x1="58" y1="78" x2="100" y2="226" stroke-width=".7" opacity=".28"/>
              <line x1="142" y1="78" x2="100" y2="226" stroke-width=".7" opacity=".28"/>
            </g>
          </svg>
        </div>

        <div class="label"><div class="t">DIAMOND</div><div class="s">PRISTINE EDITION</div></div>

        <div class="holo" id="holo"></div>
        <div class="sparkle"></div>
        <div class="glare" id="glare"></div>
      </div>
    </div>
  </div>
  <div class="hint">move your cursor over the card</div>

<script>
  const card=document.getElementById('card');
  const scene=document.getElementById('scene');
  const holo=document.getElementById('holo');
  const glare=document.getElementById('glare');
  const MAX=20;
  function move(px,py){
    const r=card.getBoundingClientRect();
    const x=Math.min(1,Math.max(0,(px-r.left)/r.width));
    const y=Math.min(1,Math.max(0,(py-r.top)/r.height));
    const rx=(0.5-y)*MAX, ry=(x-0.5)*MAX;
    card.classList.add('live');
    card.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
    card.style.setProperty('--mx',(x*100).toFixed(1)+'%');
    card.style.setProperty('--my',(y*100).toFixed(1)+'%');
    holo.style.backgroundPosition=(x*100).toFixed(0)+'% '+(y*100).toFixed(0)+'%';
    glare.style.opacity=1;
  }
  function reset(){card.classList.remove('live');card.style.transform='';glare.style.opacity=0;}
  scene.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  scene.addEventListener('mouseleave',reset);
  scene.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)move(t.clientX,t.clientY);},{passive:true});
  scene.addEventListener('touchend',reset);
</script>
</body>
</html>
