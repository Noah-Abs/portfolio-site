<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --c1:#5ec8f0; --c2:#bfeaff;          /* blue diamond-tier gem */
    --glow:rgba(94,200,240,.5);
    --banner:#1f72c2;
    --anton:"Anton",sans-serif; --cond:"Oswald",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,#2a2f37,#14171c 70%);
    display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--cond)}

  .card{position:relative;width:380px;max-width:94vw;aspect-ratio:380/532;border-radius:22px;padding:13px;overflow:hidden;
    background:linear-gradient(135deg,#eef1f4,#aab2bb 20%,#f8fafb 48%,#9aa3ad 74%,#e4e8ec);
    box-shadow:0 36px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.6)}
  /* beaded silver border */
  .beads{position:absolute;inset:5px;border-radius:17px;z-index:0;pointer-events:none;opacity:.55;
    background-image:radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.3px);background-size:6.5px 6.5px}

  .inner{position:relative;z-index:1;height:100%;border-radius:14px;overflow:hidden;
    background:
      radial-gradient(130% 70% at 50% 120%, #2b2257 0%, transparent 60%),
      radial-gradient(120% 80% at 50% -8%, #b49bf0 0%, transparent 46%),
      conic-gradient(from 215deg at 74% 14%, rgba(150,110,235,.30), rgba(110,160,245,.22) 28%, rgba(210,150,240,.18) 52%, rgba(130,100,230,.28) 80%, rgba(150,110,235,.30)),
      linear-gradient(160deg,#7659c4 0%,#5a44a0 48%,#3c2f78 100%);}
  /* nested-diamond geometric pattern */
  .geo{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.16;
    background-image:
      repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 1px,transparent 1px 26px),
      repeating-linear-gradient(-45deg,rgba(255,255,255,.7) 0 1px,transparent 1px 26px)}
  .geo svg{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
  .shine{position:absolute;inset:0;z-index:9;pointer-events:none;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.3) 49%,rgba(255,255,255,.07) 56%,transparent 66%);
    transform:translateX(-130%);animation:shine 1.4s ease .4s 1}
  @keyframes shine{to{transform:translateX(130%)}}

  .wm{position:absolute;z-index:2;width:210px;height:210px;left:-34px;bottom:-30px;opacity:.85;
    filter:drop-shadow(0 0 16px rgba(255,255,255,.35)) drop-shadow(0 3px 6px rgba(0,0,0,.4))}

  .set{position:absolute;z-index:6;top:14px;left:15px;display:flex;align-items:center;gap:7px;
    font-family:var(--anton);font-size:15px;letter-spacing:1.5px;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.45)}
  .set i{width:14px;height:14px;transform:rotate(45deg);border-radius:2px;
    background:linear-gradient(180deg,var(--c2),var(--c1));box-shadow:0 0 8px var(--glow)}

  .gem{position:absolute;z-index:8;top:-6px;right:-4px;width:92px;height:108px}
  .gem svg{width:100%;height:100%;filter:drop-shadow(0 5px 10px rgba(0,0,0,.5))}
  .ovr{position:absolute;top:20px;left:0;right:4px;text-align:center;z-index:9;
    font-family:var(--anton);font-size:38px;color:#fff;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.55)}

  .photo{position:absolute;z-index:4;left:51%;top:4%;transform:translateX(-50%);height:74%;width:auto;max-width:104%;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
  .scrim{position:absolute;z-index:5;left:0;right:0;bottom:0;height:42%;pointer-events:none;
    background:linear-gradient(180deg,transparent 10%,rgba(40,30,80,.35) 55%,rgba(28,22,60,.6) 100%)}

  .id{position:absolute;z-index:7;right:18px;bottom:40px;text-align:right;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .fn{font-family:var(--cond);font-weight:600;font-size:21px;letter-spacing:1px;text-transform:uppercase;color:#fff;line-height:1}
  .ln{font-family:var(--anton);font-size:40px;letter-spacing:.5px;text-transform:uppercase;color:#fff;line-height:.92}

  /* angled blue position banner across the bottom */
  .pos-banner{position:absolute;z-index:6;left:0;right:0;bottom:0;height:34px;
    background:linear-gradient(90deg,#1a64b0,#2b86d0);clip-path:polygon(0 42%,100% 0,100% 100%,0 100%)}
  .pos{position:absolute;z-index:7;right:18px;bottom:8px;font-family:var(--cond);font-weight:600;font-style:italic;
    font-size:15px;letter-spacing:1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div class="card">
    <div class="beads"></div>
    <div class="inner">
      <div class="geo">
        <svg viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.5">
            <polygon points="50,18 78,70 50,122 22,70"/>
            <polygon points="50,30 68,70 50,110 32,70"/>
            <polygon points="50,44 58,70 50,96 42,70"/>
            <polygon points="50,2 96,70 50,138 4,70"/>
          </g>
        </svg>
      </div>
      <div class="shine"></div>

      <img class="wm" src="https://www.mlbstatic.com/team-logos/119.svg" alt="" onerror="this.remove()">

      <div class="set"><i></i>DIAMOND</div>

      <div class="gem">
        <svg viewBox="0 0 104 122" aria-hidden="true">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="var(--c2)"/><stop offset=".5" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/>
          </linearGradient></defs>
          <polygon points="52,3 101,42 52,119 3,42" fill="url(#dg)" stroke="#fbfdff" stroke-width="2.6"/>
          <polygon points="52,3 101,42 52,54 3,42" fill="rgba(255,255,255,.22)"/>
          <polyline points="3,42 52,54 101,42" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.1"/>
          <line x1="52" y1="3" x2="52" y2="119" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
          <line x1="27" y1="22" x2="52" y2="54" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
          <line x1="77" y1="22" x2="52" y2="54" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
        </svg>
        <span class="ovr">92</span>
      </div>

      <img class="photo" src="https://img.mlbstatic.com/mlb-photos/image/upload/w_500,q_auto:best/v1/people/660271/headshot/silo/current" alt="Shohei Ohtani"
        onerror="this.onerror=null;this.src='https://midfield.mlbstatic.com/v1/people/660271/spots/240'">
      <div class="scrim"></div>

      <div class="id">
        <div class="fn">Shohei</div>
        <div class="ln">Ohtani</div>
      </div>
      <div class="pos-banner"></div>
      <div class="pos">SP - L/R</div>
    </div>
  </div>
</body>
</html>
