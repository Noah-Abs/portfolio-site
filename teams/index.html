<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0b0c0e;color:#fff;font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}

  header{padding:40px 24px 6px;text-align:center}
  .back{position:absolute;top:26px;left:24px;color:#7e858f;text-decoration:none;font-size:13px;letter-spacing:2px;text-transform:uppercase}
  .back:hover{color:#fff}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(34px,7vw,64px);line-height:.95;letter-spacing:2px}
  .sub{margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:7px;font-size:13px;color:#7e858f}

  .wrap{max-width:1000px;margin:26px auto 0;padding:0 14px 70px;width:100%}
  .scroller{overflow-x:auto;border:1px solid #1b1e24;border-radius:16px;background:#101115}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  thead th{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:11px;
    color:#7e858f;text-align:right;padding:13px 12px;border-bottom:1px solid #23262c;white-space:nowrap;position:sticky;top:0;background:#101115}
  thead th.l{text-align:left}
  tbody td{padding:11px 12px;border-bottom:1px solid #16181d;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody td.l{text-align:left}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#15171c}
  .rank{color:#565d67;width:30px;text-align:right;font-weight:600}
  .team{display:flex;align-items:center;gap:11px;min-width:190px}
  .team img{width:27px;height:27px;object-fit:contain;flex:0 0 auto}
  .team .nm{font-weight:500;color:#fff}
  .wl{font-weight:600}
  .pct{color:#c7ccd3}
  .pos{color:#46c77e;font-weight:600}.neg{color:#e0556a;font-weight:600}.zero{color:#8a8f98}
  .stw{color:#46c77e}.stl{color:#e0556a}
  .divc{color:#8a8f98;font-size:12.5px;letter-spacing:.5px}
  .state{text-align:center;color:#7e858f;padding:50px 10px;letter-spacing:2px;text-transform:uppercase;font-size:13px}
</style>
</head>
<body>
  <a class="back" href="/homescreen/">← Back</a>
  <header>
    <h1 class="brand">Teams</h1>
    <p class="sub" id="sub">Standings</p>
  </header>

  <div class="wrap">
    <div class="scroller">
      <table>
        <thead><tr>
          <th class="l">#</th>
          <th class="l">Team</th>
          <th>Record</th>
          <th>Pct</th>
          <th>Diff</th>
          <th>L10</th>
          <th>Streak</th>
          <th class="l">Division</th>
        </tr></thead>
        <tbody id="rows"><tr><td class="state" colspan="8">Loading standings…</td></tr></tbody>
      </table>
    </div>
  </div>

<script>
  const DIV={200:'AL West',201:'AL East',202:'AL Central',203:'NL West',204:'NL East',205:'NL Central'};
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function fetchYear(y){
    const r=await fetch(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=${y}&standingsTypes=regularSeason`);
    if(!r.ok) return [];
    const j=await r.json();
    const out=[];
    (j.records||[]).forEach(g=>{
      const div=DIV[g.division&&g.division.id]||'';
      (g.teamRecords||[]).forEach(t=>{
        const l10=((t.records&&t.records.splitRecords)||[]).find(x=>x.type==='lastTen');
        out.push({id:t.team.id,name:t.team.name,w:+t.wins||0,l:+t.losses||0,
          pct:t.winningPercentage||'.000',rd:(t.runDifferential==null?0:+t.runDifferential),
          l10:l10?`${l10.wins}-${l10.losses}`:'—',streak:(t.streak&&t.streak.streakCode)||'—',div});
      });
    });
    return out;
  }

  function render(teams,year){
    teams.sort((a,b)=>(parseFloat(b.pct)-parseFloat(a.pct))||(b.rd-a.rd)||(b.w-a.w));
    document.getElementById('sub').textContent=`${year} Standings · by win%`;
    document.getElementById('rows').innerHTML=teams.map((t,i)=>{
      const rdc=t.rd>0?'pos':t.rd<0?'neg':'zero', rds=(t.rd>0?'+':'')+t.rd;
      const stc=/^W/.test(t.streak)?'stw':/^L/.test(t.streak)?'stl':'';
      const pct=String(t.pct).replace(/^0/,'');
      return `<tr>
        <td class="rank">${i+1}</td>
        <td class="l"><span class="team"><img src="${logo(t.id)}" onerror="this.style.visibility='hidden'"><span class="nm">${esc(t.name)}</span></span></td>
        <td class="wl">${t.w}-${t.l}</td>
        <td class="pct">${esc(pct)}</td>
        <td class="${rdc}">${esc(rds)}</td>
        <td>${esc(t.l10)}</td>
        <td class="${stc}">${esc(t.streak)}</td>
        <td class="l divc">${esc(t.div)}</td>
      </tr>`;
    }).join('');
  }

  (async function(){
    try{
      const now=new Date().getFullYear();
      let teams=[], used=now;
      for(const y of [now,now-1,now-2]){
        teams=await fetchYear(y);
        if(teams.length){ used=y; break; }
      }
      if(!teams.length){ document.getElementById('rows').innerHTML='<tr><td class="state" colspan="8">No standings available.</td></tr>'; return; }
      render(teams,used);
    }catch(e){
      document.getElementById('rows').innerHTML='<tr><td class="state" colspan="8">Couldn’t load standings.</td></tr>';
    }
  })();
</script>
</body>
</html>
