<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Team Trends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:row-reverse}
  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);
    border-left:1px solid var(--border,#1b1e24);padding:30px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:11px 15px;border-radius:11px;color:var(--text3,#aab0b9);
    text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .side-foot{margin-top:auto;padding-top:18px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}
  .main{flex:1 1 auto;min-width:0;padding:40px 30px 70px}
  .page{max-width:1080px;margin:0 auto;width:100%}
  .page-head{margin-bottom:22px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,54px);letter-spacing:1px;line-height:1}
  .page-sub{margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:12px;color:var(--muted,#7e858f)}

  /* team header */
  .team-head{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:30px;
    background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;padding:22px 24px}
  .team-logo{width:80px;height:80px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
  .team-name{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(26px,4.5vw,46px);letter-spacing:1px;line-height:.95}
  .team-meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--text2,#cfd4da);background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);border-radius:8px;padding:6px 11px}
  .chip b{color:var(--text,#fff)}.chip .pos{color:#46c77e}.chip .neg{color:#e0556a}

  /* trends area (to be populated) */
  .trends{display:flex;flex-direction:column;gap:18px}
  .panel{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;padding:20px 22px}
  .panel-h{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:13px;color:var(--text,#fff);margin-bottom:8px}
  .panel-note{color:var(--muted,#7e858f);font-size:13px;letter-spacing:.5px;line-height:1.5}
  .state{color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:13px;padding:40px 4px}
  @media(max-width:760px){
    body{flex-direction:column}
    .side{position:static;height:auto;width:100%;border-left:0;border-bottom:1px solid var(--border,#1b1e24);padding:20px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:14px;gap:8px}
    .tab{padding:9px 13px}.side-foot{display:none}
    .main{padding:26px 16px 60px}
  }
</style>
<script src="/settings.js"></script>
</head>
<body>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <div class="nav-label">Teams</div>
      <a class="tab" href="../clubs/"><span class="dot"></span>Clubs</a>
      <a class="tab" href="../standings/"><span class="dot"></span>Standings</a>
      <a class="tab" href="../team-offense/"><span class="dot"></span>Team Offense</a>
      <a class="tab" href="../team-defense/"><span class="dot"></span>Team Defense</a>
      <a class="tab" href="../team-pitching/"><span class="dot"></span>Team Pitching</a>
      <a class="tab" href="../starting-pitching/"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="../bullpen/"><span class="dot"></span>Bullpen</a>
      <a class="tab active" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>
      <a class="tab" href="../leaders-relievers/"><span class="dot"></span>Relievers</a>
      <a class="tab" href="../leaders-defense/"><span class="dot"></span>Fielders</a>
    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-t">Team Trends</h1>
        <p class="page-sub">2026 Season</p>
      </div>
      <div id="team"><div class="state">Loading team…</div></div>
      <div class="trends">
        <div class="panel">
          <div class="panel-h">Trends</div>
          <div class="panel-note">Trend modules will appear here.</div>
        </div>
      </div>
    </div>
  </main>

<script>
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const showp=p=>String(p==null?'':p).replace(/^0/,'');
  const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');
  const TEAM_ID=119; // Los Angeles Dodgers

  async function getJSON(u){const r=await fetch(u);return r.ok?r.json():null;}

  async function loadTeam(y){
    const team=await getJSON(`https://statsapi.mlb.com/api/v1/teams/${TEAM_ID}?season=${y}`).catch(()=>null);
    const t=team&&team.teams&&team.teams[0];
    if(!t)return null;
    const st=await getJSON(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=${y}&standingsTypes=regularSeason`);
    let rec=null;((st&&st.records)||[]).forEach(g=>(g.teamRecords||[]).forEach(r=>{if(r.team&&r.team.id===TEAM_ID)rec=r;}));
    return {t,rec};
  }

  function renderTeam(d){
    const {t,rec}=d;
    const div=(t.division&&t.division.name)||'';
    let meta='';
    if(rec){
      const rd=rec.runDifferential;
      meta+=`<span class="chip"><b>${rec.wins}-${rec.losses}</b> · ${esc(showp(rec.winningPercentage))}</span>`;
      meta+=`<span class="chip">${esc(div)} · <b>${ord(+rec.divisionRank||0)}</b></span>`;
      if(rec.gamesBack&&rec.gamesBack!=='-')meta+=`<span class="chip">${esc(rec.gamesBack)} GB</span>`;
      if(rec.streak&&rec.streak.streakCode)meta+=`<span class="chip">Streak <b>${esc(rec.streak.streakCode)}</b></span>`;
      if(rd!=null)meta+=`<span class="chip">Run diff <b class="${rd>0?'pos':rd<0?'neg':''}">${rd>0?'+':''}${rd}</b></span>`;
    } else if(div){ meta+=`<span class="chip">${esc(div)}</span>`; }
    document.getElementById('team').innerHTML=`<div class="team-head">
      <img class="team-logo" src="${logo(t.id)}" onerror="this.style.visibility='hidden'">
      <div><h2 class="team-name">${esc(t.name)}</h2><div class="team-meta">${meta}</div></div>
    </div>`;
    document.title='DROPTHIRD — '+t.name+' Trends';
  }

  (async function(){
    try{
      const now=new Date().getFullYear();let d=null;
      for(const y of [now,now-1,now-2]){d=await loadTeam(y);if(d){break;}}
      if(!d){document.getElementById('team').innerHTML='<div class="state">Team not found.</div>';return;}
      renderTeam(d);
    }catch(e){
      document.getElementById('team').innerHTML='<div class="state">Couldn’t load this team.</div>';
    }
  })();
</script>
</body>
</html>
