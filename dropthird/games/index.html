<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:row-reverse}
  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);
    border-left:1px solid var(--border,#1b1e24);padding:30px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:11px 15px;border-radius:11px;color:var(--text3,#aab0b9);
    text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .side-foot{margin-top:auto;padding-top:18px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}
  .main{flex:1 1 auto;min-width:0;padding:40px 30px 70px}
  .page{max-width:1000px;margin:0 auto;width:100%}
  .page-head{margin-bottom:18px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,54px);letter-spacing:1px;line-height:1}
  .page-sub{margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:12px;color:var(--muted,#7e858f)}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .teamsel,.yrsel{appearance:none;-webkit-appearance:none;color-scheme:dark;background-color:var(--panel2,#15161b);color:var(--text,#fff);
    border:1px solid var(--border2,#2f3540);border-radius:10px;font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.5px;cursor:pointer;
    padding:10px 36px 10px 14px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238b929c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:14px}
  .teamsel{font-size:17px;text-transform:uppercase}.yrsel{font-size:14px}
  .teamsel:focus,.yrsel:focus{outline:none;border-color:var(--accent,#4aa3ff)}

  /* game list */
  .glist{display:flex;flex-direction:column;gap:7px}
  .grow{display:grid;grid-template-columns:74px 28px 1fr auto;align-items:center;gap:12px;text-decoration:none;color:inherit;
    background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:11px;padding:11px 15px;cursor:pointer;transition:.13s}
  .grow:hover{background:#15171c;border-color:#2f3540;transform:translateX(2px)}
  .gdate{font-size:12px;color:var(--muted,#7e858f);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .gha{font-size:12px;color:var(--muted2,#5b626c);text-align:center}
  .gopp{display:flex;align-items:center;gap:10px;min-width:0}
  .gopp img{width:28px;height:28px;object-fit:contain;flex:0 0 auto}
  .gopp .on{font-weight:500;font-size:15px;color:var(--text,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gres{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .wl{font-family:"Oswald",sans-serif;font-weight:700;font-size:13px;width:18px;text-align:center;border-radius:5px;padding:2px 0}
  .wl.w{color:#46c77e}.wl.l{color:#e0556a}
  .gscore{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text2,#cfd4da);font-size:15px}

  /* game detail */
  .back{display:inline-block;color:var(--muted,#7e858f);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;cursor:pointer}
  .back:hover{color:var(--text,#fff)}
  .matchup{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px}
  .mteam{display:flex;align-items:center;gap:11px}
  .mteam.away{flex-direction:row-reverse}
  .mteam img{width:48px;height:48px;object-fit:contain}
  .mteam .mn{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(15px,2vw,22px);letter-spacing:.5px}
  .mteam .ms{font-family:"Oswald",sans-serif;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
  .mteam .ms.win{color:#46c77e}
  .mdate{text-align:center;color:var(--muted,#7e858f);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}

  .panel{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:13px;overflow:hidden;margin-top:18px}
  .panel-h{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--text,#fff);
    padding:12px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border,#1b1e24)}
  .panel-h img{width:22px;height:22px;object-fit:contain}
  .scroller{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
  th,td{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;border-top:1px solid var(--panel2,#16181d)}
  th{font-family:"Oswald",sans-serif;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted,#7e858f);border-top:0;border-bottom:1px solid var(--border2,#23262c)}
  td.l,th.l{text-align:left}
  .bn{display:flex;align-items:center;gap:4px}
  .bn .sp{color:var(--muted2,#565d67);font-weight:600;width:14px;display:inline-block;text-align:right}
  .bn .nm{color:var(--text,#fff);font-weight:500}
  .bn .po{color:var(--muted,#7e858f);font-size:11px;margin-left:3px}
  .bn.sub .nm{color:var(--text3,#aab0b9);font-weight:400}
  .bn.sub{padding-left:16px}
  td.h{color:#4aa3ff;font-weight:700}
  .dec{color:#ffd24a;font-weight:700;font-size:11px;margin-left:5px}
  tbody tr.tot td{border-top:1px solid var(--border2,#262a32);color:var(--text2,#cfd4da);font-weight:600}
  tbody tr.tot td.l{color:var(--muted,#7e858f);text-transform:uppercase;font-size:11px;letter-spacing:1px}

  /* line score */
  .ls{margin-top:4px}
  .lstbl{min-width:0;width:100%}
  .lstbl th,.lstbl td{padding:7px 9px;text-align:center}
  .lstbl td.tm,.lstbl th.tm{text-align:left;font-weight:600;color:var(--text,#fff)}
  .lstbl td.rhe{font-weight:700;color:var(--text,#fff)}
  .lstbl th.rhe{color:var(--text2,#cfd4da)}
  .lstbl td{color:var(--text3,#aab0b9)}

  .state{color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:13px;padding:40px 4px;text-align:center}
  @media(max-width:760px){
    body{flex-direction:column}
    .side{position:static;height:auto;width:100%;border-left:0;border-bottom:1px solid var(--border,#1b1e24);padding:20px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:14px;gap:8px}
    .tab{padding:9px 13px}.side-foot{display:none}
    .main{padding:26px 16px 60px}
    .grow{grid-template-columns:64px 22px 1fr auto;gap:8px;padding:10px}
  }
</style>
<script src="/settings.js"></script>
</head>
<body>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <div class="nav-label">Teams</div>
      <a class="tab" href="../clubs/"><span class="dot"></span>Clubs</a>
      <a class="tab" href="../standings/"><span class="dot"></span>Standings</a>
      <a class="tab active" href="../games/"><span class="dot"></span>Games</a>
      <a class="tab" href="../postseason/"><span class="dot"></span>Postseason</a>
      <a class="tab" href="../team-offense/"><span class="dot"></span>Team Offense</a>
      <a class="tab" href="../team-defense/"><span class="dot"></span>Team Defense</a>
      <a class="tab" href="../team-pitching/"><span class="dot"></span>Team Pitching</a>
      <a class="tab" href="../starting-pitching/"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="../bullpen/"><span class="dot"></span>Bullpen</a>
      <a class="tab" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>
      <a class="tab" href="../leaders-relievers/"><span class="dot"></span>Relievers</a>
      <a class="tab" href="../leaders-defense/"><span class="dot"></span>Fielders</a>
    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-t">Games</h1>
        <p class="page-sub" id="sub">Results &amp; box scores</p>
      </div>
      <div class="controls">
        <select class="teamsel" id="teamSel" aria-label="Team"></select>
        <select class="yrsel" id="yrSel" aria-label="Season"></select>
      </div>
      <div id="view"><div class="state">Loading…</div></div>
    </div>
  </main>

<script>
  const NOW=new Date().getFullYear();
  const DEFAULT_ID=119;   // Dodgers
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const showp=p=>(p==null||p==='')?'–':String(p).replace(/^0(?=\.)/,'');
  const mday=s=>{if(!s)return '';const a=String(s).slice(0,10).split('-');return MON[(+a[1])-1]+' '+(+a[2]);};

  let TEAMS=[], TEAM_ID=DEFAULT_ID, SEASON=NOW, tok=0;
  const teamSel=document.getElementById('teamSel'), yrSel=document.getElementById('yrSel'), view=document.getElementById('view');

  // ---------- game list ----------
  async function loadList(){
    const my=++tok; view.innerHTML='<div class="state">Loading games…</div>';
    const sch=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${TEAM_ID}&season=${SEASON}&gameType=R`);
    if(my!==tok)return;
    let games=[];((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(g=>{g.__date=d.date;games.push(g);}));
    const finals=games.filter(g=>g.status&&g.status.abstractGameState==='Final')
      .sort((a,b)=>(b.gameDate||'').localeCompare(a.gameDate||''));
    if(!finals.length){view.innerHTML='<div class="state">No completed games for this season yet.</div>';return;}
    const rows=finals.map(g=>{
      const home=g.teams.home, away=g.teams.away, iAmHome=home.team.id===TEAM_ID;
      const me=iAmHome?home:away, opp=iAmHome?away:home;
      const w=me.isWinner, res=w?'W':'L';
      return `<a class="grow" data-pk="${g.gamePk}">
        <span class="gdate">${esc(mday(g.__date||g.gameDate))}</span>
        <span class="gha">${iAmHome?'vs':'@'}</span>
        <span class="gopp"><img src="${logo(opp.team.id)}" onerror="this.style.visibility='hidden'"><span class="on">${esc(opp.team.name)}</span></span>
        <span class="gres"><span class="wl ${w?'w':'l'}">${res}</span><span class="gscore">${me.score}-${opp.score}</span></span>
      </a>`;
    }).join('');
    view.innerHTML=`<div class="glist">${rows}</div>`;
    view.querySelectorAll('.grow').forEach(el=>el.onclick=()=>showGame(+el.dataset.pk));
    document.getElementById('sub').textContent=`${finals.length} games · ${SEASON} · tap a game for the box score`;
    syncURL();
  }

  // ---------- game detail ----------
  function lineScore(ls,away,home){
    const inns=ls.innings||[]; const n=Math.max(9,inns.length);
    let head='<th class="tm l">&nbsp;</th>';for(let i=1;i<=n;i++)head+=`<th>${i}</th>`;head+='<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th>';
    const row=(side,nm)=>{let r=`<td class="tm">${esc(nm)}</td>`;
      for(let i=1;i<=n;i++){const inn=inns[i-1];const v=inn&&inn[side]&&inn[side].runs;r+=`<td>${(v==null)?'·':v}</td>`;}
      const t=(ls.teams&&ls.teams[side])||{};r+=`<td class="rhe">${t.runs==null?'·':t.runs}</td><td class="rhe">${t.hits==null?'·':t.hits}</td><td class="rhe">${t.errors==null?'·':t.errors}</td>`;
      return `<tr>${r}</tr>`;};
    return `<div class="panel ls"><div class="scroller"><table class="lstbl"><thead><tr>${head}</tr></thead><tbody>${row('away',away.team.name)}${row('home',home.team.name)}</tbody></table></div></div>`;
  }
  function battingTable(side){
    const players=side.players||{};
    const bats=Object.values(players).filter(p=>p.stats&&p.stats.batting&&Object.keys(p.stats.batting).length&&p.battingOrder)
      .sort((a,b)=>(+a.battingOrder)-(+b.battingOrder));
    const head=`<tr><th class="l">Batters</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>AVG</th></tr>`;
    const body=bats.map(p=>{const s=p.stats.batting, ord=+p.battingOrder, starter=ord%100===0, spot=Math.floor(ord/100);
      const avg=p.seasonStats&&p.seasonStats.batting&&p.seasonStats.batting.avg;
      return `<tr><td class="l"><span class="bn ${starter?'':'sub'}"><span class="sp">${starter?spot:''}</span><span class="nm">${esc(p.person.fullName)}</span><span class="po">${esc(p.position&&p.position.abbreviation)}</span></span></td>
        <td>${s.atBats}</td><td>${s.runs}</td><td class="h">${s.hits}</td><td>${s.rbi}</td><td>${s.baseOnBalls}</td><td>${s.strikeOuts}</td><td>${showp(avg)}</td></tr>`;}).join('');
    const t=side.teamStats&&side.teamStats.batting||{};
    const tot=`<tr class="tot"><td class="l">Totals</td><td>${t.atBats}</td><td>${t.runs}</td><td class="h">${t.hits}</td><td>${t.rbi}</td><td>${t.baseOnBalls}</td><td>${t.strikeOuts}</td><td>${showp(t.avg)}</td></tr>`;
    return `<div class="panel"><div class="panel-h"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">${esc(side.team.name)} — Batting</div><div class="scroller"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div></div>`;
  }
  function pitchingTable(side){
    const players=side.players||{};
    const ps=(side.pitchers||[]).map(id=>players['ID'+id]).filter(p=>p&&p.stats&&p.stats.pitching);
    const head=`<tr><th class="l">Pitchers</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>SO</th><th>HR</th><th>P</th><th>ERA</th></tr>`;
    const body=ps.map(p=>{const s=p.stats.pitching;
      let dec='';if(s.wins)dec='W';else if(s.losses)dec='L';else if(s.saves)dec='SV';else if(s.holds)dec='H';else if(s.blownSaves)dec='BS';
      const era=p.seasonStats&&p.seasonStats.pitching&&p.seasonStats.pitching.era;
      return `<tr><td class="l"><span class="bn"><span class="nm">${esc(p.person.fullName)}</span>${dec?`<span class="dec">${dec}</span>`:''}</span></td>
        <td>${s.inningsPitched}</td><td>${s.hits}</td><td>${s.runs}</td><td>${s.earnedRuns}</td><td>${s.baseOnBalls}</td><td>${s.strikeOuts}</td><td>${s.homeRuns}</td><td>${s.numberOfPitches==null?'–':s.numberOfPitches}</td><td>${showp(era)}</td></tr>`;}).join('');
    const t=side.teamStats&&side.teamStats.pitching||{};
    const tot=`<tr class="tot"><td class="l">Totals</td><td>${t.inningsPitched}</td><td>${t.hits}</td><td>${t.runs}</td><td>${t.earnedRuns}</td><td>${t.baseOnBalls}</td><td>${t.strikeOuts}</td><td>${t.homeRuns}</td><td></td><td></td></tr>`;
    return `<div class="panel"><div class="panel-h"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">${esc(side.team.name)} — Pitching</div><div class="scroller"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div></div>`;
  }
  function teamHead(side,cls){
    const w=side.isWinner;
    return `<div class="mteam ${cls}"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">
      <div><div class="mn">${esc(side.team.name)}</div></div><div class="ms ${w?'win':''}">${side.score}</div></div>`;
  }
  async function showGame(pk){
    const my=++tok; view.innerHTML='<div class="state">Loading box score…</div>';
    const [box,ls,sch]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/boxscore`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/linescore`),
      j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${pk}`)
    ]);
    if(my!==tok)return;
    if(!box||!box.teams){view.innerHTML='<div class="state">Couldn’t load this game.</div>';return;}
    const away=box.teams.away, home=box.teams.home;
    let g=null;((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(x=>{if(x.gamePk===pk)g=x;}));
    away.score=(g&&g.teams.away.score); home.score=(g&&g.teams.home.score);
    away.isWinner=(g&&g.teams.away.isWinner); home.isWinner=(g&&g.teams.home.isWinner);
    const date=g?mday(g.officialDate||g.gameDate):'';
    view.innerHTML=
      `<div class="back" id="back">← All games</div>`+
      `<div class="matchup">${teamHead(away,'away')}<span style="color:var(--muted2,#4a5159);font-family:Anton,sans-serif">@</span>${teamHead(home,'home')}</div>`+
      `<div class="mdate">${esc(date)} · Final</div>`+
      lineScore(ls||{},away,home)+
      battingTable(away)+battingTable(home)+
      pitchingTable(away)+pitchingTable(home);
    document.getElementById('back').onclick=()=>{const u=new URL(location.href);u.searchParams.delete('pk');history.replaceState(null,'',u);loadList();};
    try{const u=new URL(location.href);u.searchParams.set('pk',pk);history.replaceState(null,'',u);}catch(e){}
    document.getElementById('sub').textContent=`Box score`;
  }

  // ---------- controls ----------
  function buildYears(){let o='';for(let y=NOW;y>=NOW-12;y--)o+=`<option value="${y}"${y===SEASON?' selected':''}>${y}</option>`;yrSel.innerHTML=o;}
  function syncURL(){try{const u=new URL(location.href);u.searchParams.set('team',TEAM_ID);u.searchParams.set('season',SEASON);u.searchParams.delete('pk');history.replaceState(null,'',u);}catch(e){}}

  (async function(){
    const tj=await j(`https://statsapi.mlb.com/api/v1/teams?sportId=1&season=${NOW}`);
    TEAMS=(((tj&&tj.teams)||[]).filter(t=>t.sport&&t.sport.id===1).map(t=>({id:t.id,name:t.name}))).sort((a,b)=>a.name.localeCompare(b.name));
    const q=new URLSearchParams(location.search);
    const qt=+q.get('team'), qs=+q.get('season');
    if(qt&&TEAMS.some(t=>t.id===qt))TEAM_ID=qt;
    if(qs&&qs<=NOW&&qs>1900)SEASON=qs;
    teamSel.innerHTML=TEAMS.map(t=>`<option value="${t.id}"${t.id===TEAM_ID?' selected':''}>${esc(t.name)}</option>`).join('');
    buildYears();
    teamSel.onchange=()=>{TEAM_ID=+teamSel.value;loadList();};
    yrSel.onchange=()=>{SEASON=+yrSel.value;loadList();};
    const pk=+q.get('pk');
    if(pk)showGame(pk); else loadList();
  })();
</script>
</body>
</html>
