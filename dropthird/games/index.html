<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:row-reverse}
  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);
    border-left:1px solid var(--border,#1b1e24);padding:30px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:11px 15px;border-radius:11px;color:var(--text3,#aab0b9);
    text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .side-foot{margin-top:auto;padding-top:18px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}
  .main{flex:1 1 auto;min-width:0;padding:40px 30px 70px}
  .page{max-width:1000px;margin:0 auto;width:100%}
  .page-head{margin-bottom:18px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,54px);letter-spacing:1px;line-height:1}
  .page-sub{margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:12px;color:var(--muted,#7e858f)}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .teamsel,.yrsel{appearance:none;-webkit-appearance:none;color-scheme:dark;background-color:var(--panel2,#15161b);color:var(--text,#fff);
    border:1px solid var(--border2,#2f3540);border-radius:10px;font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.5px;cursor:pointer;
    padding:10px 36px 10px 14px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238b929c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:14px}
  .teamsel{font-size:17px;text-transform:uppercase}.yrsel{font-size:14px}
  .teamsel:focus,.yrsel:focus{outline:none;border-color:var(--accent,#4aa3ff)}

  /* game list */
  .glist{display:flex;flex-direction:column;gap:7px}
  .grow{display:grid;grid-template-columns:74px 28px 1fr auto;align-items:center;gap:12px;text-decoration:none;color:inherit;
    background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:11px;padding:11px 15px;cursor:pointer;transition:.13s}
  .grow:hover{background:var(--panel2,#15171c);border-color:#2f3540;transform:translateX(2px)}
  .gdate{font-size:12px;color:var(--muted,#7e858f);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .gha{font-size:12px;color:var(--muted2,#5b626c);text-align:center}
  .gopp{display:flex;align-items:center;gap:10px;min-width:0}
  .gopp img{width:28px;height:28px;object-fit:contain;flex:0 0 auto}
  .gopp .on{font-weight:500;font-size:15px;color:var(--text,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gres{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .wl{font-family:"Oswald",sans-serif;font-weight:700;font-size:13px;width:18px;text-align:center;border-radius:5px;padding:2px 0}
  .wl.w{color:#46c77e}.wl.l{color:#e0556a}
  .gscore{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text2,#cfd4da);font-size:15px}

  /* game detail */
  .back{display:inline-block;color:var(--muted,#7e858f);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;cursor:pointer}
  .back:hover{color:var(--text,#fff)}
  .matchup{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px}
  .mteam{display:flex;align-items:center;gap:11px}
  .mteam.away{flex-direction:row-reverse}
  .mteam img{width:48px;height:48px;object-fit:contain}
  .mteam .mn{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(15px,2vw,22px);letter-spacing:.5px}
  .mteam .ms{font-family:"Oswald",sans-serif;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
  .mteam .ms.win{color:#46c77e}
  .mdate{text-align:center;color:var(--muted,#7e858f);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}

  .panel{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:13px;overflow:hidden;margin-top:18px}
  .panel-h{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--text,#fff);
    padding:12px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border,#1b1e24)}
  .panel-h img{width:22px;height:22px;object-fit:contain}
  .scroller{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
  th,td{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;border-top:1px solid var(--panel2,#16181d)}
  th{font-family:"Oswald",sans-serif;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted,#7e858f);border-top:0;border-bottom:1px solid var(--border2,#23262c)}
  td.l,th.l{text-align:left}
  .bn{display:flex;align-items:center;gap:4px}
  .bn .sp{color:var(--muted2,#565d67);font-weight:600;width:14px;display:inline-block;text-align:right}
  .bn .nm{color:var(--text,#fff);font-weight:500}
  .bn .po{color:var(--muted,#7e858f);font-size:11px;margin-left:3px}
  .bn.sub .nm{color:var(--text3,#aab0b9);font-weight:400}
  .bn.sub{padding-left:16px}
  td.h{color:#4aa3ff;font-weight:700}
  .dec{color:#ffd24a;font-weight:700;font-size:11px;margin-left:5px}
  tbody tr.tot td{border-top:1px solid var(--border2,#262a32);color:var(--text2,#cfd4da);font-weight:600}
  tbody tr.tot td.l{color:var(--muted,#7e858f);text-transform:uppercase;font-size:11px;letter-spacing:1px}

  /* line score */
  .ls{margin-top:4px}
  .lstbl{min-width:0;width:100%}
  .lstbl th,.lstbl td{padding:7px 9px;text-align:center}
  .lstbl td.tm,.lstbl th.tm{text-align:left;font-weight:600;color:var(--text,#fff)}
  .lstbl td.rhe{font-weight:700;color:var(--text,#fff)}
  .lstbl th.rhe{color:var(--text2,#cfd4da)}
  .lstbl td{color:var(--text3,#aab0b9)}

  /* ===== gameday ===== */
  .scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);border-radius:14px;padding:16px 20px;margin-bottom:6px}
  .sbteam{display:flex;align-items:center;gap:13px}
  .sbteam.away{justify-content:flex-start}.sbteam.home{flex-direction:row-reverse}
  .sbteam img{width:50px;height:50px;object-fit:contain;flex:0 0 auto}
  .sbteam .sbn{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(15px,2vw,22px);letter-spacing:.5px;line-height:1}
  .sbteam .sbr{font-size:11px;color:var(--muted,#7e858f);letter-spacing:1px;margin-top:3px}
  .sbteam.home .sbn,.sbteam.home .sbr{text-align:right}
  .sbsc{font-family:"Oswald",sans-serif;font-weight:700;font-size:38px;font-variant-numeric:tabular-nums;line-height:1;color:var(--text3,#aab0b9)}
  .sbsc.win{color:var(--text,#fff)}
  .sbmid{text-align:center}
  .sbmid .st{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:2px;font-size:13px;color:var(--text,#fff);text-transform:uppercase}
  .sbmid .sbdate{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#7e858f);margin-top:3px}

  .gdtabs{display:flex;gap:4px;margin:16px 0 16px;border-bottom:1px solid var(--border,#1b1e24)}
  .gdtab{padding:10px 16px;font-family:"Oswald",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted,#7e858f);cursor:pointer;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
  .gdtab.on{color:var(--text,#fff);border-bottom-color:var(--accent,#4aa3ff)}
  .gdtab:hover{color:var(--text2,#cfd4da)}

  .secttl{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:18px;color:var(--text,#fff);margin:24px 0 11px}
  .secttl:first-child{margin-top:4px}
  .playrow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:11px;margin-bottom:7px}
  .inn{flex:0 0 auto;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);
    display:flex;align-items:center;justify-content:center;font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;color:var(--text2,#cfd4da);white-space:nowrap}
  .playrow>img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
  .playrow .pd{flex:1;min-width:0;font-size:13.5px;color:var(--text2,#cfd4da);line-height:1.35}
  .playrow .psc{font-family:"Oswald",sans-serif;font-weight:700;font-size:15px;color:var(--text,#fff);font-variant-numeric:tabular-nums;white-space:nowrap}
  .playrow .wpa{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .playrow .wpa b{font-family:"Oswald",sans-serif;font-weight:700;font-size:14px}
  .playrow .wpa img{width:20px;height:20px;object-fit:contain}
  .pos{color:#46c77e}.neg{color:#e0556a}

  .wpwrap{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:13px;padding:14px 16px 9px}
  .wpchart{width:100%;height:auto;display:block;margin:6px 0}
  .wprow{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#7e858f)}
  .wprow b{color:var(--text,#fff)}
  .wphdr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--text2,#cfd4da)}
  .wphdr.bot{margin-top:1px}
  .wphdr .wpt{display:inline-flex;align-items:center;gap:7px;min-width:0;font-weight:500}
  .wphdr .wpt img{width:18px;height:18px;object-fit:contain;flex:0 0 auto}
  .wphdr .wpt b{font-weight:700;white-space:nowrap}
  .wphdr .wpt i{color:var(--muted,#7e858f);font-style:normal;font-size:11px;letter-spacing:.5px}
  .wphdr .wpwin{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted,#7e858f);white-space:nowrap}
  .wphdr .wpaxis{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted2,#5b6470)}
  .wptick{fill:var(--muted2,#5b6470);font-family:"Oswald",sans-serif;font-size:11px;font-weight:600}
  .wpchart .wpdot{cursor:pointer}
  .wpchart .wpd{transition:r .1s}
  .wpchart .wpdot:hover .wpd{r:8.5}
  .wpchart .wpdot.active .wpd{r:9;stroke:#fff;stroke-width:2.5}
  .wpdetail{margin-top:10px;padding:9px 12px;background:var(--bg2,#0e0f13);border:1px solid var(--border,#1b1e24);border-radius:10px;font-size:12.5px;color:var(--muted,#7e858f);display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:20px}
  .wpdetail .inn{font-weight:700;color:var(--accent,#4aa3ff);font-size:11px;letter-spacing:.5px;flex:0 0 auto}
  .wpdetail .pd{flex:1;min-width:120px;color:var(--text2,#cfd4da);line-height:1.35}
  .wpdetail .psc{font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
  .wpdetail .wpa{display:inline-flex;align-items:center;gap:5px}
  .wpdetail .wpa b{font-weight:700}.wpdetail .wpa img{width:18px;height:18px;object-fit:contain}
  .wpdetail .hw{font-size:11px;color:var(--muted2,#5b6470);letter-spacing:.5px;white-space:nowrap}

  .inhdr{font-family:"Oswald",sans-serif;font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent,#4aa3ff);
    margin:20px 0 9px;display:flex;align-items:center;gap:9px}
  .inhdr .sc{color:var(--muted,#7e858f);letter-spacing:1px}
  .livenote{font-family:"Oswald",sans-serif;font-weight:600;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted,#7e858f);margin:2px 0 4px}
  .livenote.on{color:#46c77e}
  .ab{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:12px;margin-bottom:9px;overflow:hidden}
  .ab.collapsible .abhead{cursor:pointer}
  .ab.collapsible .abhead:hover{background:var(--panel2,#15161b)}
  .ab.live{border-color:rgba(70,199,126,.55);box-shadow:0 0 0 1px rgba(70,199,126,.12)}
  .abhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .ablive{font-family:"Oswald",sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#46c77e;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .ablive::before{content:"";width:7px;height:7px;border-radius:50%;background:#46c77e;animation:gpulse 1.4s infinite}
  @keyframes gpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .ev{font-family:"Oswald",sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;
    background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);color:var(--text2,#cfd4da);flex:0 0 auto}
  .ev.hit{color:#46c77e;border-color:rgba(70,199,126,.4)}.ev.out{color:#e0556a;border-color:rgba(224,85,106,.4)}.ev.walk{color:#ffd24a;border-color:rgba(255,210,74,.4)}
  .abdesc{flex:1;min-width:0;font-size:13.5px;color:var(--text,#fff);line-height:1.4}
  .abdesc .o{color:var(--muted,#7e858f);font-weight:600;font-size:12px}
  .abtog{flex:0 0 auto;color:var(--muted,#7e858f);font-size:13px;transition:transform .18s}
  .ab.open .abtog{transform:rotate(180deg)}
  .abdetail{display:none;padding:2px 14px 12px;border-top:1px solid var(--panel2,#16181d)}
  .ab.open .abdetail{display:block}
  .abcharts{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}
  .chart{text-align:center}
  .chart-lbl{font-family:"Oswald",sans-serif;font-weight:600;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#7e858f);margin-bottom:5px}
  .field{text-align:center;flex:0 0 auto}
  .field .turf{fill:rgba(70,199,126,.06);stroke:var(--border2,#3a4350);stroke-width:1.2}
  .field .dirt{fill:rgba(224,160,90,.13);stroke:none}
  .field .foul{stroke:var(--border2,#3a4350);stroke-width:1}
  .field .base{fill:var(--muted,#7e858f)}
  .field .ball{stroke:#0b0c0e;stroke-width:1.4}
  .pitchrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--panel2,#16181d);font-size:12.5px}
  .pitchrow:first-of-type{border-top:0}
  .pno{width:19px;height:19px;border-radius:50%;color:#fff;font-family:"Oswald",sans-serif;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pno.S{background:#e0556a}.pno.B{background:#4aa3ff}.pno.F{background:#f0973b}.pno.X{background:#ffd24a;color:#1a1205}
  .pcall{flex:1;color:var(--text2,#cfd4da)}
  .pcount{color:var(--muted,#7e858f);font-variant-numeric:tabular-nums;white-space:nowrap;width:34px;text-align:right}
  .pvelo{color:var(--text3,#aab0b9);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ptype{color:var(--muted,#7e858f);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .zone{flex:0 0 auto}
  .zone rect.zbox{fill:none;stroke:var(--border2,#3a4350);stroke-width:1.4}
  .zone line{stroke:var(--border,#23262c);stroke-width:1}
  .zone circle{stroke:#0b0c0e;stroke-width:1}
  .zone text{font-family:"Oswald",sans-serif;font-weight:700;font-size:9px;fill:#fff}
  @media(max-width:560px){.ab{flex-direction:column}.zone{align-self:center}}

  .state{color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:13px;padding:40px 4px;text-align:center}
  @media(max-width:760px){
    body{flex-direction:column}
    .side{position:static;height:auto;width:100%;border-left:0;border-bottom:1px solid var(--border,#1b1e24);padding:20px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:14px;gap:8px}
    .tab{padding:9px 13px}.side-foot{display:none}
    .main{padding:26px 16px 60px}
    .grow{grid-template-columns:64px 22px 1fr auto;gap:8px;padding:10px}
  }
</style>
<script src="/settings.js"></script>
</head>
<body>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <div class="nav-label">Teams</div>
      <a class="tab" href="../clubs/"><span class="dot"></span>Clubs</a>
      <a class="tab" href="../standings/"><span class="dot"></span>Standings</a>
      <a class="tab active" href="../games/"><span class="dot"></span>Games</a>
      <a class="tab" href="../gamehub/"><span class="dot"></span>GameHub</a>
      <a class="tab" href="../probables/"><span class="dot"></span>Probables</a>
      <a class="tab" href="../postseason/"><span class="dot"></span>Postseason</a>
      <a class="tab" href="../team-offense/"><span class="dot"></span>Team Offense</a>
      <a class="tab" href="../team-defense/"><span class="dot"></span>Team Defense</a>
      <a class="tab" href="../team-pitching/"><span class="dot"></span>Team Pitching</a>
      <a class="tab" href="../starting-pitching/"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="../bullpen/"><span class="dot"></span>Bullpen</a>
      <a class="tab" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../awards/"><span class="dot"></span>Awards</a>
      <a class="tab" href="../injuries/"><span class="dot"></span>Injuries</a>
      <a class="tab" href="../transactions/"><span class="dot"></span>Transactions</a>
      <a class="tab" href="../spotlight/"><span class="dot"></span>Spotlight</a>
      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>
      <a class="tab" href="../leaders-relievers/"><span class="dot"></span>Relievers</a>
      <a class="tab" href="../leaders-defense/"><span class="dot"></span>Fielders</a>
    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-t">Games</h1>
        <p class="page-sub" id="sub">Results &amp; box scores</p>
      </div>
      <div class="controls">
        <select class="teamsel" id="teamSel" aria-label="Team"></select>
        <select class="yrsel" id="yrSel" aria-label="Season"></select>
      </div>
      <div id="view"><div class="state">Loading…</div></div>
    </div>
  </main>

<script>
  const NOW=new Date().getFullYear();
  const DEFAULT_ID=119;   // Dodgers
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const TEAMCOLOR={108:'#BA0021',109:'#A71930',110:'#DF4601',111:'#BD3039',112:'#0E3386',113:'#C6011F',114:'#E31937',115:'#33006F',116:'#FA4616',117:'#EB6E1F',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#FF5910',133:'#EFB21E',134:'#FDB827',135:'#FFC425',136:'#2CA6A4',137:'#FD5A1E',138:'#C41E3A',139:'#8FBCE6',140:'#C0111F',141:'#1D7AE0',142:'#D31145',143:'#E81828',144:'#CE1141',145:'#C4CED4',146:'#00A3E0',147:'#5B7DB1',158:'#FFC52F'};
  const tc=id=>TEAMCOLOR[id]||'#4aa3ff';
  const showp=p=>(p==null||p==='')?'–':String(p).replace(/^0(?=\.)/,'');
  const mday=s=>{if(!s)return '';const a=String(s).slice(0,10).split('-');return MON[(+a[1])-1]+' '+(+a[2]);};

  let TEAMS=[], TEAM_ID=DEFAULT_ID, SEASON=NOW, tok=0;
  const teamSel=document.getElementById('teamSel'), yrSel=document.getElementById('yrSel'), view=document.getElementById('view');
  // expand / collapse a finished at-bat's pitches (Apple-style); state survives live refreshes
  view.addEventListener('click',e=>{const head=e.target.closest('.abhead');if(!head)return;
    const ab=head.closest('.ab.collapsible');if(!ab)return;
    const idx=+ab.dataset.ab;const open=ab.classList.toggle('open');
    if(open)gdExpanded.add(idx);else gdExpanded.delete(idx);});

  // ---------- game list ----------
  async function loadList(){
    if(gdTimer){clearInterval(gdTimer);gdTimer=null;}
    const my=++tok; view.innerHTML='<div class="state">Loading games…</div>';
    const sch=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${TEAM_ID}&season=${SEASON}&gameType=R`);
    if(my!==tok)return;
    let games=[];((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(g=>{g.__date=d.date;games.push(g);}));
    const finals=games.filter(g=>g.status&&g.status.abstractGameState==='Final')
      .sort((a,b)=>(b.gameDate||'').localeCompare(a.gameDate||''));
    if(!finals.length){view.innerHTML='<div class="state">No completed games for this season yet.</div>';return;}
    const rows=finals.map(g=>{
      const home=g.teams.home, away=g.teams.away, iAmHome=home.team.id===TEAM_ID;
      const me=iAmHome?home:away, opp=iAmHome?away:home;
      const w=me.isWinner, res=w?'W':'L';
      return `<a class="grow" data-pk="${g.gamePk}">
        <span class="gdate">${esc(mday(g.__date||g.gameDate))}</span>
        <span class="gha">${iAmHome?'vs':'@'}</span>
        <span class="gopp"><img src="${logo(opp.team.id)}" onerror="this.style.visibility='hidden'"><span class="on">${esc(opp.team.name)}</span></span>
        <span class="gres"><span class="wl ${w?'w':'l'}">${res}</span><span class="gscore">${me.score}-${opp.score}</span></span>
      </a>`;
    }).join('');
    view.innerHTML=`<div class="glist">${rows}</div>`;
    view.querySelectorAll('.grow').forEach(el=>el.onclick=()=>showGame(+el.dataset.pk));
    document.getElementById('sub').textContent=`${finals.length} games · ${SEASON} · tap a game for the box score`;
    syncURL();
  }

  // ---------- game detail ----------
  function lineScore(ls,away,home){
    const inns=ls.innings||[]; const n=Math.max(9,inns.length);
    let head='<th class="tm l">&nbsp;</th>';for(let i=1;i<=n;i++)head+=`<th>${i}</th>`;head+='<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th>';
    const row=(side,nm)=>{let r=`<td class="tm">${esc(nm)}</td>`;
      for(let i=1;i<=n;i++){const inn=inns[i-1];const v=inn&&inn[side]&&inn[side].runs;r+=`<td>${(v==null)?'·':v}</td>`;}
      const t=(ls.teams&&ls.teams[side])||{};r+=`<td class="rhe">${t.runs==null?'·':t.runs}</td><td class="rhe">${t.hits==null?'·':t.hits}</td><td class="rhe">${t.errors==null?'·':t.errors}</td>`;
      return `<tr>${r}</tr>`;};
    return `<div class="panel ls"><div class="scroller"><table class="lstbl"><thead><tr>${head}</tr></thead><tbody>${row('away',away.team.name)}${row('home',home.team.name)}</tbody></table></div></div>`;
  }
  function battingTable(side){
    const players=side.players||{};
    const bats=Object.values(players).filter(p=>p.stats&&p.stats.batting&&Object.keys(p.stats.batting).length&&p.battingOrder)
      .sort((a,b)=>(+a.battingOrder)-(+b.battingOrder));
    const head=`<tr><th class="l">Batters</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>AVG</th></tr>`;
    const body=bats.map(p=>{const s=p.stats.batting, ord=+p.battingOrder, starter=ord%100===0, spot=Math.floor(ord/100);
      const avg=p.seasonStats&&p.seasonStats.batting&&p.seasonStats.batting.avg;
      return `<tr><td class="l"><span class="bn ${starter?'':'sub'}"><span class="sp">${starter?spot:''}</span><span class="nm">${esc(p.person.fullName)}</span><span class="po">${esc(p.position&&p.position.abbreviation)}</span></span></td>
        <td>${s.atBats}</td><td>${s.runs}</td><td class="h">${s.hits}</td><td>${s.rbi}</td><td>${s.baseOnBalls}</td><td>${s.strikeOuts}</td><td>${showp(avg)}</td></tr>`;}).join('');
    const t=side.teamStats&&side.teamStats.batting||{};
    const tot=`<tr class="tot"><td class="l">Totals</td><td>${t.atBats}</td><td>${t.runs}</td><td class="h">${t.hits}</td><td>${t.rbi}</td><td>${t.baseOnBalls}</td><td>${t.strikeOuts}</td><td>${showp(t.avg)}</td></tr>`;
    return `<div class="panel"><div class="panel-h"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">${esc(side.team.name)} — Batting</div><div class="scroller"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div></div>`;
  }
  function pitchingTable(side){
    const players=side.players||{};
    const ps=(side.pitchers||[]).map(id=>players['ID'+id]).filter(p=>p&&p.stats&&p.stats.pitching);
    const head=`<tr><th class="l">Pitchers</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>SO</th><th>HR</th><th>P</th><th>ERA</th></tr>`;
    const body=ps.map(p=>{const s=p.stats.pitching;
      let dec='';if(s.wins)dec='W';else if(s.losses)dec='L';else if(s.saves)dec='SV';else if(s.holds)dec='H';else if(s.blownSaves)dec='BS';
      const era=p.seasonStats&&p.seasonStats.pitching&&p.seasonStats.pitching.era;
      return `<tr><td class="l"><span class="bn"><span class="nm">${esc(p.person.fullName)}</span>${dec?`<span class="dec">${dec}</span>`:''}</span></td>
        <td>${s.inningsPitched}</td><td>${s.hits}</td><td>${s.runs}</td><td>${s.earnedRuns}</td><td>${s.baseOnBalls}</td><td>${s.strikeOuts}</td><td>${s.homeRuns}</td><td>${s.numberOfPitches==null?'–':s.numberOfPitches}</td><td>${showp(era)}</td></tr>`;}).join('');
    const t=side.teamStats&&side.teamStats.pitching||{};
    const tot=`<tr class="tot"><td class="l">Totals</td><td>${t.inningsPitched}</td><td>${t.hits}</td><td>${t.runs}</td><td>${t.earnedRuns}</td><td>${t.baseOnBalls}</td><td>${t.strikeOuts}</td><td>${t.homeRuns}</td><td></td><td></td></tr>`;
    return `<div class="panel"><div class="panel-h"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">${esc(side.team.name)} — Pitching</div><div class="scroller"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div></div>`;
  }
  // ===== gameday detail =====
  let GD=null, gdTab='summary', gdTimer=null, gdExpanded=new Set();
  const evClass=et=>{et=et||'';
    if(/single|double|triple|home_run/.test(et))return 'hit';
    if(/walk|hit_by_pitch/.test(et))return 'walk';
    return 'out';
  };
  const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');
  const halfChip=p=>(p.about.halfInning==='top'?'▲':'▼')+p.about.inning;
  const battingTeam=p=>p.about.halfInning==='top'?GD.away:GD.home;
  function zKind(p){const c=(p.details&&p.details.call&&p.details.call.code)||'';
    if(c==='B'||c==='*B'||c==='I'||c==='H'||c==='P'||c==='V')return 'B';     // ball / HBP / pitchout
    if(c==='F'||c==='R'||c==='L'||c==='O'||c==='T')return 'F';               // foul
    if(c==='D'||c==='E'||c==='X')return 'X';                                 // in play
    return 'S';                                                              // called / swinging strike
  }

  function scoreboard(){
    const {away,home,g,date,ls}=GD;
    const abst=g&&g.status&&g.status.abstractGameState;
    let mid;
    if(abst==='Live'){const inn=(((ls&&ls.inningState)||'')+' '+((ls&&ls.currentInning)||'')).trim();
      mid=`<div class="st" style="color:#46c77e">● Live</div><div class="sbdate">${esc(inn||'In progress')}</div>`;}
    else if(abst==='Preview'){mid=`<div class="st">${esc((g&&g.status&&g.status.detailedState)||'Scheduled')}</div><div class="sbdate">${esc(date)}</div>`;}
    else mid=`<div class="st">Final</div><div class="sbdate">${esc(date)}</div>`;
    const rec=s=>{const lr=g&&g.teams&&g.teams[s]&&g.teams[s].leagueRecord;return lr?`${lr.wins}-${lr.losses}`:'';};
    const side=(s,t)=>`<div class="sbteam ${s}"><img src="${logo(t.team.id)}" onerror="this.style.visibility='hidden'">`+
      `<div><div class="sbn">${esc(t.team.name)}</div><div class="sbr">${rec(s)}</div></div>`+
      `<div class="sbsc ${t.isWinner?'win':''}">${t.score==null?'–':t.score}</div></div>`;
    return `<div class="scorebar">${side('away',away)}<div class="sbmid">${mid}</div>${side('home',home)}</div>`;
  }

  function zoneSVG(pitches){
    const W=92,H=116,pad=10;
    const xMin=-2.1,xMax=2.1,zMin=0.6,zMax=4.4;
    const fx=v=>pad+((v-xMin)/(xMax-xMin))*(W-2*pad);
    const fy=v=>pad+((zMax-v)/(zMax-zMin))*(H-2*pad);
    let szT=3.4,szB=1.55;const f=pitches.find(p=>p.pitchData&&p.pitchData.strikeZoneTop!=null);if(f){szT=f.pitchData.strikeZoneTop;szB=f.pitchData.strikeZoneBottom;}
    const x1=fx(-0.83),x2=fx(0.83),y1=fy(szT),y2=fy(szB);
    const gx1=x1+(x2-x1)/3,gx2=x1+2*(x2-x1)/3,gy1=y1+(y2-y1)/3,gy2=y1+2*(y2-y1)/3;
    const COL={S:'#e0556a',B:'#4aa3ff',F:'#f0973b',X:'#ffd24a'};
    const dots=pitches.map((p,i)=>{const c=p.pitchData&&p.pitchData.coordinates;if(!c||c.pX==null)return '';
      const cx=fx(c.pX),cy=fy(c.pZ),k=zKind(p);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7.5" fill="${COL[k]||'#8a8f98'}"/><text x="${cx.toFixed(1)}" y="${(cy+3.2).toFixed(1)}" text-anchor="middle">${i+1}</text>`;}).join('');
    return `<div class="zone"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`+
      `<rect class="zbox" x="${x1.toFixed(1)}" y="${y1.toFixed(1)}" width="${(x2-x1).toFixed(1)}" height="${(y2-y1).toFixed(1)}" rx="2"/>`+
      `<line x1="${gx1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${gx1.toFixed(1)}" y2="${y2.toFixed(1)}"/><line x1="${gx2.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${gx2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`+
      `<line x1="${x1.toFixed(1)}" y1="${gy1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${gy1.toFixed(1)}"/><line x1="${x1.toFixed(1)}" y1="${gy2.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${gy2.toFixed(1)}"/>`+
      `${dots}</svg></div>`;
  }

  // batted-ball spray: home plate bottom-center (coordY~205), outfield top (coordY~30); green = hit, red = out
  function fieldSVG(p){
    const ev=(p.playEvents||[]).filter(e=>e.hitData&&e.hitData.coordinates&&e.hitData.coordinates.coordX!=null);
    if(!ev.length)return '';
    const c=ev[ev.length-1].hitData.coordinates, isOut=!!(p.result&&p.result.isOut);
    const col=isOut?'#e0556a':'#46c77e';
    const sx=Math.max(10,Math.min(130, c.coordX/250*140));
    const sy=Math.max(12,Math.min(122, 14+(c.coordY-30)/175*104));
    return `<div class="field"><div class="chart-lbl">${isOut?'Out':'Hit'}</div>`+
      `<svg width="124" height="120" viewBox="0 0 140 130">`+
      `<path class="turf" d="M70 120 L18 46 A 74 74 0 0 1 122 46 Z"/>`+
      `<path class="dirt" d="M70 120 L48 98 L70 76 L92 98 Z"/>`+
      `<line class="foul" x1="70" y1="120" x2="18" y2="46"/><line class="foul" x1="70" y1="120" x2="122" y2="46"/>`+
      `<circle class="base" cx="92" cy="98" r="2.4"/><circle class="base" cx="70" cy="76" r="2.4"/><circle class="base" cx="48" cy="98" r="2.4"/>`+
      `<circle class="ball" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5.5" fill="${col}"/>`+
      `</svg></div>`;
  }
  function pitchVerb(pe){const d=(pe.details&&pe.details.description)||'',c=(pe.details&&pe.details.code)||'';
    if(/Hit By Pitch/i.test(d))return 'is hit by a';
    if(/Foul/i.test(d))return 'fouls off a';
    if(/Called Strike/i.test(d))return 'watches a';
    if(/Swinging Strike|Missed Bunt|Foul Tip/i.test(d))return 'swings through a';
    if(c==='B'||c==='*B'||/Ball|Pitchout|Intent/i.test(d))return 'takes a';
    if(/In play/i.test(d))return 'puts in play a';
    return 'sees a';}
  function liveBlurb(p,pitches){
    const b=(p.matchup&&p.matchup.batter&&p.matchup.batter.fullName)||'Batter';
    const pit=(p.matchup&&p.matchup.pitcher&&p.matchup.pitcher.fullName)||'';
    if(!pitches.length)return `${b} steps in${pit?` against ${pit}`:''}.`;
    const pe=pitches[pitches.length-1];
    const spd=pe.pitchData&&pe.pitchData.startSpeed, ty=(pe.details&&pe.details.type&&pe.details.type.description)||'pitch';
    const cnt=pe.count?`${pe.count.balls}-${pe.count.strikes}`:'';
    return `${b} ${pitchVerb(pe)} ${spd!=null?(+spd).toFixed(0)+' mph ':''}${ty}${pit?` from ${pit}`:''}. ${cnt}`.replace(/\s+/g,' ').trim();
  }
  function renderAB(p,isCurrent){
    const r=p.result||{}, idx=p.atBatIndex, pitches=(p.playEvents||[]).filter(e=>e.isPitch);
    const open=isCurrent||gdExpanded.has(idx);
    const prows=pitches.map((pe,i)=>({pe,n:i+1})).reverse().map(({pe,n})=>{
      const call=(pe.details&&pe.details.description)||(pe.details&&pe.details.call&&pe.details.call.description)||'';
      const spd=pe.pitchData&&pe.pitchData.startSpeed, ty=pe.details&&pe.details.type&&pe.details.type.description;
      return `<div class="pitchrow"><span class="pno ${zKind(pe)}">${n}</span><span class="pcall">${esc(call)}</span>`+
        `<span class="pcount">${pe.count?pe.count.balls+'-'+pe.count.strikes:''}</span><span class="pvelo">${spd!=null?(+spd).toFixed(1)+' mph':''}</span><span class="ptype">${esc(ty||'')}</span></div>`;}).join('');
    const hasZone=pitches.some(e=>e.pitchData&&e.pitchData.coordinates&&e.pitchData.coordinates.pX!=null);
    const fld=fieldSVG(p);
    const charts=(hasZone||fld)?`<div class="abcharts">${hasZone?`<div class="chart"><div class="chart-lbl">Pitches</div>${zoneSVG(pitches)}</div>`:''}${fld}</div>`:'';
    const outs=p.count&&p.count.outs;
    const head=isCurrent
      ? `<span class="ablive">Now Batting</span><span class="abdesc">${esc(liveBlurb(p,pitches))}</span>`
      : `${r.event?`<span class="ev ${evClass(r.eventType)}">${esc(r.event)}</span>`:''}<span class="abdesc">${esc(r.description||'In progress')} ${outs!=null?`<span class="o">${outs} out${outs===1?'':'s'}</span>`:''}</span><span class="abtog">▾</span>`;
    return `<div class="ab ${open?'open':''} ${isCurrent?'live':'collapsible'}" data-ab="${idx}"><div class="abhead">${head}</div><div class="abdetail">${prows}${charts}</div></div>`;
  }
  function playsTab(){
    const all=(GD.pbp&&GD.pbp.allPlays)||[];
    if(!all.length)return '<div class="state">Play-by-play unavailable for this game.</div>';
    const live=GD.g&&GD.g.status&&GD.g.status.abstractGameState==='Live';
    const curIdx=live?all[all.length-1].atBatIndex:-1;
    const groups=[];let cur=null;
    all.forEach(p=>{const key=p.about.halfInning+p.about.inning;
      if(!cur||cur.key!==key){cur={key,p0:p,plays:[]};groups.push(cur);} cur.plays.push(p);});
    const order=live?groups.slice().reverse():groups;
    let html=`<div class="livenote${live?' on':''}">${live?'● Live — newest first · tap a finished at-bat for its pitches':'Tap any at-bat to see its pitches'}</div>`;
    order.forEach(grp=>{const p0=grp.p0,bt=battingTeam(p0);
      html+=`<div class="inhdr">${p0.about.halfInning==='top'?'Top':'Bottom'} ${ord(p0.about.inning)} <span class="sc">· ${esc(bt.team.name)} batting</span></div>`;
      (live?grp.plays.slice().reverse():grp.plays).forEach(p=>{html+=renderAB(p,p.atBatIndex===curIdx);});});
    return html;
  }

  function wpChart(wp){
    const all=(GD.pbp&&GD.pbp.allPlays)||[];
    const n=wp.length; if(n<2)return '';
    const W=880,H=250,padL=10,padR=10,padT=14,padB=26;
    const plotW=W-padL-padR, plotH=H-padT-padB, mid=padT+plotH/2;
    const hp=x=>x.homeTeamWinProbability!=null?x.homeTeamWinProbability:(x.awayTeamWinProbability!=null?100-x.awayTeamWinProbability:50);
    const X=i=>padL+(i/(n-1))*plotW, Y=p=>padT+(1-p/100)*plotH;
    const pts=wp.map((x,i)=>X(i).toFixed(1)+','+Y(hp(x)).toFixed(1));
    const hc=tc(GD.home.team.id), ac=tc(GD.away.team.id), winner=hp(wp[n-1])>=50?GD.home:GD.away;
    const lastX=X(n-1).toFixed(1), m=mid.toFixed(1);
    const area=`M ${padL},${m} L ${pts.join(' L ')} L ${lastX},${m} Z`;
    // innings along the x-axis (from the play-by-play)
    const inn=i=>{const p=all[wp[i].atBatIndex];return p&&p.about?p.about.inning:null;};
    const segs=[];let s0=0,ci=inn(0);
    for(let i=1;i<n;i++){const v=inn(i);if(v!=null&&v!==ci){segs.push({inn:ci,a:s0,b:i});s0=i;ci=v;}}
    segs.push({inn:ci,a:s0,b:n-1});
    let grid='',labels='';
    segs.forEach((sg,k)=>{ if(k>0){const gx=X(sg.a).toFixed(1);grid+=`<line x1="${gx}" y1="${padT}" x2="${gx}" y2="${(padT+plotH).toFixed(1)}" stroke="var(--border2,#2a2f37)" stroke-width="1" opacity=".5"/>`;}
      if(sg.inn!=null)labels+=`<text x="${((X(sg.a)+X(sg.b))/2).toFixed(1)}" y="${(padT+plotH+16).toFixed(1)}" text-anchor="middle" class="wptick">${sg.inn}</text>`;});
    // clickable dots on the biggest momentum swings
    const dots=wp.map((x,i)=>({i,add:x.homeTeamWinProbabilityAdded})).filter(d=>d.add!=null&&Math.abs(d.add)>=4)
      .sort((a,b)=>Math.abs(b.add)-Math.abs(a.add)).slice(0,8);
    const dotsvg=dots.map(d=>{const x=wp[d.i],cx=X(d.i).toFixed(1),cy=Y(hp(x)).toFixed(1);
      return `<g class="wpdot" data-idx="${x.atBatIndex}"><circle cx="${cx}" cy="${cy}" r="14" fill="transparent"/><circle class="wpd" cx="${cx}" cy="${cy}" r="6" fill="${d.add>0?hc:ac}" stroke="var(--bg,#0b0c0e)" stroke-width="2"/></g>`;}).join('');
    return `<div class="wpwrap">
      <div class="wphdr"><span class="wpt"><img src="${logo(GD.home.team.id)}" onerror="this.style.visibility='hidden'"><b>${esc(GD.home.team.name)}</b> <i>ahead ↑</i></span><span class="wpwin">${esc(winner.team.name)} won${GD.away.score!=null?` ${GD.away.score}–${GD.home.score}`:''}</span></div>
      <svg class="wpchart" viewBox="0 0 ${W} ${H}">
        <path d="${area}" fill="${hc}" opacity=".30" clip-path="url(#wptopc)"/>
        <path d="${area}" fill="${ac}" opacity=".30" clip-path="url(#wpbotc)"/>
        <clipPath id="wptopc"><rect x="${padL}" y="${padT}" width="${plotW}" height="${(mid-padT).toFixed(1)}"/></clipPath>
        <clipPath id="wpbotc"><rect x="${padL}" y="${m}" width="${plotW}" height="${(padT+plotH-mid).toFixed(1)}"/></clipPath>
        ${grid}
        <line x1="${padL}" y1="${m}" x2="${W-padR}" y2="${m}" stroke="var(--border2,#2a2f37)" stroke-width="1.2" stroke-dasharray="5 5"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="#e8edf5" stroke-width="2.2" stroke-linejoin="round"/>
        ${dotsvg}
        ${labels}
      </svg>
      <div class="wphdr bot"><span class="wpt"><img src="${logo(GD.away.team.id)}" onerror="this.style.visibility='hidden'"><b>${esc(GD.away.team.name)}</b> <i>ahead ↓</i></span><span class="wpaxis">Inning →</span></div>
      <div class="wpdetail" id="wpdetail">Tap a ● dot to see the play</div>
    </div>`;
  }
  function showWpPlay(idx){
    const all=(GD.pbp&&GD.pbp.allPlays)||[], d=document.getElementById('wpdetail'); if(!d)return;
    const p=all[idx], w=(GD.wp||[]).find(x=>x.atBatIndex===idx)||{};
    const add=w.homeTeamWinProbabilityAdded, favHome=add>0, fav=favHome?GD.home:GD.away;
    const innTxt=p?`${p.about.halfInning==='top'?'Top':'Bot'} ${ord(p.about.inning)}`:'';
    const desc=(p&&p.result&&p.result.description)||(w.result&&w.result.description)||'';
    const score=(p&&p.result&&p.result.awayScore!=null)?`${p.result.awayScore}–${p.result.homeScore}`:'';
    const hw=w.homeTeamWinProbability;
    d.innerHTML=`${innTxt?`<span class="inn">${esc(innTxt)}</span>`:''}<span class="pd">${esc(desc)||'No description'}</span>`+
      (score?`<span class="psc">${score}</span>`:'')+
      (add!=null?`<span class="wpa"><b class="${favHome?'pos':'neg'}">+${Math.abs(add).toFixed(1)}%</b><img src="${logo(fav.team.id)}" onerror="this.style.display='none'"></span>`:'')+
      (hw!=null?`<span class="hw">${esc((GD.home.team.abbreviation)||'HOME')} ${Math.round(hw)}%</span>`:'');
    view.querySelectorAll('.wpdot').forEach(c=>c.classList.toggle('active',+c.dataset.idx===idx));
  }

  function summaryTab(){
    const pbp=GD.pbp, wp=GD.wp||[], all=(pbp&&pbp.allPlays)||[];
    let html='';
    const sp=(pbp&&pbp.scoringPlays)||[];
    if(sp.length){html+='<div class="secttl">Scoring Plays</div>';
      sp.forEach(idx=>{const p=all[idx];if(!p)return;const bt=battingTeam(p);
        html+=`<div class="playrow"><span class="inn">${halfChip(p)}</span><img src="${logo(bt.team.id)}" onerror="this.style.visibility='hidden'">`+
          `<span class="pd">${esc(p.result.description||'')}</span><span class="psc">${p.result.awayScore}-${p.result.homeScore}</span></div>`;});}
    if(wp.length>1)html+='<div class="secttl">Win Probability</div>'+wpChart(wp);
    if(wp.length){const keys=wp.map(x=>x).filter(x=>x.homeTeamWinProbabilityAdded!=null)
        .sort((a,b)=>Math.abs(b.homeTeamWinProbabilityAdded)-Math.abs(a.homeTeamWinProbabilityAdded)).slice(0,6);
      if(keys.length){html+='<div class="secttl">Key Plays</div>';
        keys.forEach(x=>{const add=x.homeTeamWinProbabilityAdded, favHome=add>0, fav=favHome?GD.home:GD.away;
          const p=all[x.atBatIndex];
          html+=`<div class="playrow"><span class="inn">${p?halfChip(p):''}</span>`+
            `<span class="pd">${esc((x.result&&x.result.description)||(p&&p.result.description)||'')}</span>`+
            `<span class="wpa"><b class="${favHome?'pos':'neg'}">+${Math.abs(add).toFixed(1)}%</b><img src="${logo(fav.team.id)}" onerror="this.style.visibility='hidden'"></span></div>`;});}}
    return html||'<div class="state">No summary available for this game.</div>';
  }

  function boxTab(){const {ls,away,home}=GD;
    return lineScore(ls||{},away,home)+battingTable(away)+battingTable(home)+pitchingTable(away)+pitchingTable(home);}

  function setTab(name,keep){
    gdTab=name;
    document.querySelectorAll('.gdtab').forEach(t=>t.classList.toggle('on',t.dataset.t===name));
    document.getElementById('gdc').innerHTML = name==='plays'?playsTab() : name==='box'?boxTab() : summaryTab();
    try{const u=new URL(location.href);u.searchParams.set('tab',name);history.replaceState(null,'',u);}catch(e){}
    if(!keep)window.scrollTo&&window.scrollTo(0,0);
  }

  function stopPoll(){if(gdTimer){clearInterval(gdTimer);gdTimer=null;}}
  async function refreshGame(){
    if(!GD)return; const pk=GD.pk;
    const [box,ls,sch,pbp,wp]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/boxscore`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/linescore`),
      j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${pk}`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/playByPlay`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/winProbability`)
    ]);
    if(!GD||GD.pk!==pk)return;
    if(box&&box.teams){GD.box=box;GD.away=box.teams.away;GD.home=box.teams.home;}
    if(ls)GD.ls=ls; if(pbp)GD.pbp=pbp; if(wp)GD.wp=wp;
    let g=null;((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(x=>{if(x.gamePk===pk)g=x;}));
    if(g){GD.g=g;GD.away.score=g.teams.away.score;GD.home.score=g.teams.home.score;GD.away.isWinner=g.teams.away.isWinner;GD.home.isWinner=g.teams.home.isWinner;}
    const sb=view.querySelector('.scorebar'); if(sb)sb.outerHTML=scoreboard();
    setTab(gdTab,true);
    if(!(GD.g&&GD.g.status&&GD.g.status.abstractGameState==='Live'))stopPoll();
  }
  async function showGame(pk){
    stopPoll(); gdExpanded=new Set();
    const my=++tok; view.innerHTML='<div class="state">Loading game…</div>';
    const [box,ls,sch,pbp,wp]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/boxscore`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/linescore`),
      j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${pk}`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/playByPlay`),
      j(`https://statsapi.mlb.com/api/v1/game/${pk}/winProbability`)
    ]);
    if(my!==tok)return;
    if(!box||!box.teams){view.innerHTML='<div class="state">Couldn’t load this game.</div>';return;}
    const away=box.teams.away, home=box.teams.home;
    let g=null;((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(x=>{if(x.gamePk===pk)g=x;}));
    away.score=(g&&g.teams.away.score); home.score=(g&&g.teams.home.score);
    away.isWinner=(g&&g.teams.away.isWinner); home.isWinner=(g&&g.teams.home.isWinner);
    GD={pk,box,ls,sch,g,away,home,pbp,wp,date:g?mday(g.officialDate||g.gameDate):''};
    const live=g&&g.status&&g.status.abstractGameState==='Live';
    const src=new URLSearchParams(location.search).get('src');
    view.innerHTML=
      `<div class="back" id="back">${src==='watch'?'← Watch':src==='hub'?'← GameHub':'← All games'}</div>`+scoreboard()+
      `<div class="gdtabs"><button class="gdtab" data-t="summary">Summary</button><button class="gdtab" data-t="plays">Plays</button><button class="gdtab" data-t="box">Box Score</button></div>`+
      `<div id="gdc"></div>`;
    document.getElementById('back').onclick=()=>{stopPoll();
      if(src==='watch'){location.href='/watch/';return;}
      if(src==='hub'){location.href='../gamehub/';return;}
      const u=new URL(location.href);u.searchParams.delete('pk');u.searchParams.delete('tab');u.searchParams.delete('src');history.replaceState(null,'',u);loadList();};
    view.querySelectorAll('.gdtab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
    const gdcEl=document.getElementById('gdc');
    if(gdcEl)gdcEl.addEventListener('click',e=>{const dot=e.target.closest('.wpdot');if(dot)showWpPlay(+dot.dataset.idx);});
    const q=new URLSearchParams(location.search), t=q.get('tab');
    setTab(live?(t==='box'||t==='summary'?t:'plays'):(t==='plays'||t==='box'?t:'summary'));
    try{const u=new URL(location.href);u.searchParams.set('pk',pk);history.replaceState(null,'',u);}catch(e){}
    document.getElementById('sub').textContent=`${esc(away.team.name)} @ ${esc(home.team.name)}`;
    if(live)gdTimer=setInterval(refreshGame,8000);
  }

  // ---------- controls ----------
  function buildYears(){let o='';for(let y=NOW;y>=NOW-12;y--)o+=`<option value="${y}"${y===SEASON?' selected':''}>${y}</option>`;yrSel.innerHTML=o;}
  function syncURL(){try{const u=new URL(location.href);u.searchParams.set('team',TEAM_ID);u.searchParams.set('season',SEASON);u.searchParams.delete('pk');history.replaceState(null,'',u);}catch(e){}}

  (async function(){
    const tj=await j(`https://statsapi.mlb.com/api/v1/teams?sportId=1&season=${NOW}`);
    TEAMS=(((tj&&tj.teams)||[]).filter(t=>t.sport&&t.sport.id===1).map(t=>({id:t.id,name:t.name}))).sort((a,b)=>a.name.localeCompare(b.name));
    const q=new URLSearchParams(location.search);
    const qt=+q.get('team'), qs=+q.get('season');
    if(qt&&TEAMS.some(t=>t.id===qt))TEAM_ID=qt;
    if(qs&&qs<=NOW&&qs>1900)SEASON=qs;
    teamSel.innerHTML=TEAMS.map(t=>`<option value="${t.id}"${t.id===TEAM_ID?' selected':''}>${esc(t.name)}</option>`).join('');
    buildYears();
    teamSel.onchange=()=>{TEAM_ID=+teamSel.value;loadList();};
    yrSel.onchange=()=>{SEASON=+yrSel.value;loadList();};
    const pk=+q.get('pk');
    if(pk)showGame(pk); else loadList();
  })();
</script>
</body>
</html>
