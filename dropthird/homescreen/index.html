<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:row-reverse}

  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);
    border-left:1px solid var(--border,#1b1e24);padding:32px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:13px 15px;border-radius:11px;color:var(--text3,#aab0b9);
    text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .side-foot{margin-top:auto;padding-top:20px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}

  .main{flex:1 1 auto;min-width:0;padding:40px 34px 80px}
  .page{max-width:1040px;margin:0 auto;width:100%}

  /* empty / welcome */
  .welcome{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
  .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none;overflow:hidden}
  .ghost span{font-family:"Anton",sans-serif;font-size:34vh;letter-spacing:6px;color:#0e1014;text-transform:uppercase;white-space:nowrap}
  .welcome .inner{position:relative;z-index:1}
  .welcome h1{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(40px,7vw,92px);letter-spacing:2px;line-height:.9}
  .rule{width:70px;height:4px;background:var(--accent,#4aa3ff);border-radius:2px;margin:22px auto}
  .welcome p{font-weight:300;letter-spacing:3px;text-transform:uppercase;font-size:clamp(12px,1.8vw,15px);color:var(--muted,#7e858f);line-height:1.8}
  .welcome b{color:var(--text,#fff);font-weight:600}
  .cog{display:inline-block;color:var(--accent,#4aa3ff)}

  /* hero */
  .hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:6px}
  .hero img{width:88px;height:88px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
  .hk{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent,#4aa3ff);font-weight:600}
  .hname{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,56px);letter-spacing:1px;line-height:.95}
  .chips{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--text2,#cfd4da);background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);border-radius:8px;padding:6px 11px}
  .chip b{color:var(--text,#fff)}.chip .pos{color:#46c77e}.chip .neg{color:#e0556a}

  .section{margin-top:34px}
  .section-h{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:21px;letter-spacing:1px;line-height:1;margin-bottom:14px}
  .section-h .sm{font-family:"Oswald",sans-serif;font-weight:500;font-size:11px;letter-spacing:3px;color:var(--muted,#7e858f);margin-left:10px}

  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .gcard{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:14px;padding:15px 17px;text-decoration:none;color:inherit;display:block;transition:.13s}
  a.gcard:hover{border-color:#2f3540;background:#13151a}
  .gcard .lab{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted,#7e858f);margin-bottom:10px}
  .gcard .matchup{display:flex;align-items:center;gap:12px}
  .gcard .matchup img{width:38px;height:38px;object-fit:contain;flex:0 0 auto}
  .gcard .tn{font-weight:600;font-size:16px}
  .gcard .meta{margin-top:4px;font-size:12.5px;color:var(--text2,#aeb4bd);letter-spacing:.5px}
  .gcard .res{margin-left:auto;display:flex;align-items:center;gap:8px}
  .wl{font-family:"Oswald",sans-serif;font-weight:700;font-size:13px;padding:2px 7px;border-radius:5px}
  .wl.w{color:#46c77e;background:rgba(70,199,126,.1)}.wl.l{color:#e0556a;background:rgba(224,85,106,.1)}
  .score{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}

  .form{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
  .form .l10{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#7e858f)}
  .form .l10 b{color:var(--text,#fff)}
  .pills{display:flex;gap:5px}
  .pill{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:"Oswald",sans-serif}
  .pill.w{color:#46c77e;background:rgba(70,199,126,.12)}.pill.l{color:#e0556a;background:rgba(224,85,106,.12)}

  /* news */
  .news{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ncard{display:flex;gap:14px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:.13s}
  a.ncard:hover{border-color:#2f3540;background:#13151a}
  .ncard .thumb{flex:0 0 116px;width:116px;background-color:#0c0d11;background-position:center;background-size:cover;background-repeat:no-repeat;border-right:1px solid var(--border,#1b1e24)}
  .ncard .nbody{padding:13px 14px 13px 0;min-width:0}
  .ncard .nhead{font-weight:600;font-size:14px;line-height:1.25;color:var(--text,#fff);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ncard .nblurb{margin-top:6px;font-size:12px;line-height:1.4;color:var(--muted,#7e858f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ncard .ndate{margin-top:8px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent,#4aa3ff)}

  /* player cards */
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
  .pcard{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:14px;padding:15px;text-decoration:none;color:inherit;transition:.13s;display:block}
  a.pcard:hover{border-color:#2f3540;background:#13151a}
  .pcard .top{display:flex;align-items:center;gap:12px}
  .pcard .shot{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#1b1e24;flex:0 0 auto}
  .pcard .pn{font-weight:600;font-size:16px;color:var(--text,#fff);line-height:1.1}
  .pcard .pmeta{margin-top:4px;font-size:11.5px;color:var(--muted,#7e858f);display:flex;align-items:center;gap:7px}
  .pcard .pmeta img{width:16px;height:16px;object-fit:contain}
  .pcard .stiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border,#1b1e24);border:1px solid var(--border,#1b1e24);border-radius:10px;overflow:hidden;margin-top:13px}
  .pcard .stile{background:#0e1015;padding:9px 4px;text-align:center}
  .pcard .stile b{display:block;font-family:"Oswald",sans-serif;font-weight:600;font-size:17px;color:var(--text,#fff);line-height:1;font-variant-numeric:tabular-nums}
  .pcard .stile span{display:block;margin-top:4px;font-size:8.5px;letter-spacing:1px;color:var(--muted,#7e858f);text-transform:uppercase}
  .pcard .last{margin-top:11px;font-size:12px;color:var(--text2,#aeb4bd);letter-spacing:.3px}
  .pcard .last span{color:var(--muted2,#5b626c);text-transform:uppercase;letter-spacing:1px;font-size:10px;margin-right:6px}

  /* pulse */
  .pulse{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pblock h4{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:12px;color:var(--text,#fff);margin-bottom:11px}
  .sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border,#1b1e24);border:1px solid var(--border,#1b1e24);border-radius:11px;overflow:hidden}
  .stile2{background:#0e1015;padding:11px 6px;text-align:center}
  .stile2 b{display:block;font-family:"Oswald",sans-serif;font-weight:600;font-size:18px;color:var(--text,#fff);line-height:1;font-variant-numeric:tabular-nums}
  .stile2 span{display:block;margin-top:4px;font-size:9px;letter-spacing:1px;color:var(--muted,#7e858f);text-transform:uppercase}

  .state{color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:13px;padding:60px 4px;text-align:center}

  @media(max-width:820px){.twocol,.news,.pulse{grid-template-columns:1fr}}
  @media(max-width:760px){
    body{flex-direction:column}
    .side{position:static;height:auto;width:100%;border-left:0;border-bottom:1px solid var(--border,#1b1e24);padding:20px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:14px;gap:8px}
    .tab{padding:9px 13px}.side-foot{display:none}
    .main{padding:26px 16px 60px}
  }
</style>
<script src="/settings.js"></script>
</head>
<body>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <div class="nav-label">Teams</div>
      <a class="tab" href="../clubs/"><span class="dot"></span>Clubs</a>
      <a class="tab" href="../standings/"><span class="dot"></span>Standings</a>
      <a class="tab" href="../games/"><span class="dot"></span>Games</a>
      <a class="tab" href="../postseason/"><span class="dot"></span>Postseason</a>
      <a class="tab" href="../team-offense/"><span class="dot"></span>Team Offense</a>
      <a class="tab" href="../team-defense/"><span class="dot"></span>Team Defense</a>
      <a class="tab" href="../team-pitching/"><span class="dot"></span>Team Pitching</a>
      <a class="tab" href="../starting-pitching/"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="../bullpen/"><span class="dot"></span>Bullpen</a>
      <a class="tab" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>
      <a class="tab" href="../leaders-relievers/"><span class="dot"></span>Relievers</a>
      <a class="tab" href="../leaders-defense/"><span class="dot"></span>Fielders</a>
    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main"><div class="page" id="page"><div class="state">Loading…</div></div></main>

<script>
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const headshot=id=>`https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/${id}/headshot/67/current`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const showp=p=>(p==null||p==='')?'–':String(p).replace(/^0(?=\.)/,'');
  const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');
  const mday=s=>{if(!s)return '';const a=String(s).slice(0,10).split('-');return MON[(+a[1])-1]+' '+(+a[2]);};
  const page=document.getElementById('page');
  let tok=0;

  function favs(){
    const q=new URLSearchParams(location.search);
    const S=(window.getSettings&&window.getSettings())||{favTeam:'',favPlayers:[]};
    const team=q.get('team')||S.favTeam||'';
    let players=[];
    if(q.get('players'))players=q.get('players').split(',').map(x=>+x).filter(Boolean);
    else players=(S.favPlayers||[]).map(p=>p.id);
    return {team:team?+team:0,players:players.slice(0,5)};
  }

  function welcome(){
    page.innerHTML=`<div class="welcome"><div class="ghost"><span>DROPTHIRD</span></div>
      <div class="inner"><h1>Make it yours</h1><div class="rule"></div>
      <p>Pick your <b>favorite team</b> and <b>players</b> in Settings <span class="cog">⚙</span> (top-right)<br>and this page becomes your personal dashboard —<br>your team's recaps, results, standings &amp; your players' stat lines.</p></div></div>`;
    document.title='DROPTHIRD';
  }

  function heroHTML(team,divName,rec){
    let chips='';
    if(rec){
      const rd=rec.runDifferential, l10=((rec.records&&rec.records.splitRecords)||[]).find(x=>x.type==='lastTen');
      chips+=`<span class="chip"><b>${rec.wins}-${rec.losses}</b> · ${showp(rec.winningPercentage)}</span>`;
      if(divName)chips+=`<span class="chip">${esc(divName)} · <b>${ord(+rec.divisionRank||0)}</b></span>`;
      if(rec.gamesBack&&rec.gamesBack!=='-')chips+=`<span class="chip">${esc(rec.gamesBack)} GB</span>`;
      if(rec.streak&&rec.streak.streakCode)chips+=`<span class="chip">Streak <b>${esc(rec.streak.streakCode)}</b></span>`;
      if(rd!=null)chips+=`<span class="chip">Run diff <b class="${rd>0?'pos':rd<0?'neg':''}">${rd>0?'+':''}${rd}</b></span>`;
    }
    return `<div class="hero"><img src="${logo(team.id)}" onerror="this.style.visibility='hidden'">
      <div><div class="hk">Your Team</div><div class="hname">${esc(team.name)}</div><div class="chips">${chips}</div></div></div>`;
  }

  function gameCardLast(g,teamId){
    const home=g.teams.home,away=g.teams.away,iAmHome=home.team.id===teamId,me=iAmHome?home:away,opp=iAmHome?away:home;
    const w=me.isWinner;
    return `<a class="gcard" href="../games/?team=${teamId}&pk=${g.gamePk}"><div class="lab">Last game · ${esc(mday(g.officialDate||g.gameDate))}</div>
      <div class="matchup"><img src="${logo(opp.team.id)}" onerror="this.style.visibility='hidden'"><div><div class="tn">${iAmHome?'vs':'@'} ${esc(opp.team.name)}</div></div>
      <div class="res"><span class="wl ${w?'w':'l'}">${w?'W':'L'}</span><span class="score">${me.score}-${opp.score}</span></div></div></a>`;
  }
  function gameCardNext(g,teamId){
    const home=g.teams.home,away=g.teams.away,iAmHome=home.team.id===teamId,opp=iAmHome?away:home;
    let time='';try{if(g.gameDate&&g.gameDate.length>11)time=new Date(g.gameDate).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){}
    return `<div class="gcard"><div class="lab">Next up · ${esc(mday(g.officialDate||g.gameDate))}</div>
      <div class="matchup"><img src="${logo(opp.team.id)}" onerror="this.style.visibility='hidden'"><div><div class="tn">${iAmHome?'vs':'@'} ${esc(opp.team.name)}</div>
      ${time?`<div class="meta">${esc(time)}</div>`:''}</div></div></div>`;
  }
  function scheduleSection(finals,upcoming,teamId,rec){
    const last=finals[0], next=upcoming[0];
    let cards=(next?gameCardNext(next,teamId):'')+(last?gameCardLast(last,teamId):'');
    if(!cards)return '';
    const l10=((rec&&rec.records&&rec.records.splitRecords)||[]).find(x=>x.type==='lastTen');
    const recent=finals.slice(0,5).map(g=>{const home=g.teams.home,iAmHome=home.team.id===teamId,me=iAmHome?home:g.teams.away;const w=me.isWinner;return `<span class="pill ${w?'w':'l'}">${w?'W':'L'}</span>`;}).join('');
    const form=(l10||recent)?`<div class="form">${l10?`<span class="l10">Last 10 <b>${l10.wins}-${l10.losses}</b></span>`:''}<div class="pills">${recent}</div></div>`:'';
    return `<div class="section"><h3 class="section-h">Schedule</h3><div class="twocol">${cards}</div>${form}</div>`;
  }

  function newsSection(recaps,teamId){
    const cards=recaps.filter(Boolean).map(r=>{
      let img='';const cuts=(r.rec.image&&r.rec.image.cuts)||[];
      if(cuts.length){const sorted=cuts.slice().sort((a,b)=>a.width-b.width);const pick=sorted.find(c=>c.width>=320)||sorted[sorted.length-1];img=pick&&pick.src;}
      return `<a class="ncard" href="../games/?team=${teamId}&pk=${r.pk}">
        <div class="thumb"${img?` style="background-image:url('${esc(img)}')"`:''}></div>
        <div class="nbody"><div class="nhead">${esc(r.rec.headline||'Game recap')}</div>
        <div class="nblurb">${esc(r.rec.blurb||'')}</div><div class="ndate">${esc(mday(r.rec.date||''))}</div></div></a>`;
    }).join('');
    if(!cards)return '';
    return `<div class="section"><h3 class="section-h">Latest<span class="sm">Recaps</span></h3><div class="news">${cards}</div></div>`;
  }

  function playerCard(d){
    const {p,group,season,last}=d;
    const teamId=p.currentTeam&&p.currentTeam.id, pos=(p.primaryPosition&&p.primaryPosition.abbreviation)||'';
    let tiles;
    if(group==='pitching'&&season)tiles=[['W-L',`${season.wins}-${season.losses}`],['ERA',season.era],['WHIP',season.whip],['SO',season.strikeOuts]];
    else if(season)tiles=[['AVG',showp(season.avg)],['HR',season.homeRuns],['RBI',season.rbi],['OPS',showp(season.ops)]];
    else tiles=[['G','–'],['—','–'],['—','–'],['—','–']];
    const stiles=tiles.map(t=>`<div class="stile"><b>${esc(t[1]==null?'–':t[1])}</b><span>${esc(t[0])}</span></div>`).join('');
    const lastLine=last?`<div class="last"><span>Last</span>${esc(last.stat.summary||'—')}${last.opponent?' · '+esc(last.opponent.name):''}</div>`:'';
    return `<a class="pcard" href="../player/?id=${p.id}"><div class="top">
      <img class="shot" src="${headshot(p.id)}" onerror="this.style.visibility='hidden'">
      <div><div class="pn">${esc(p.fullName)}</div><div class="pmeta">${teamId?`<img src="${logo(teamId)}" onerror="this.remove()">`:''}${esc(pos)}</div></div></div>
      <div class="stiles">${stiles}</div>${lastLine}</a>`;
  }

  function pulseSection(hit,pit){
    const tile=(l,v)=>`<div class="stile2"><b>${esc(v==null||v===''?'–':v)}</b><span>${esc(l)}</span></div>`;
    const bat=hit?[['R',hit.runs],['HR',hit.homeRuns],['AVG',showp(hit.avg)],['OBP',showp(hit.obp)],['SLG',showp(hit.slg)],['OPS',showp(hit.ops)],['SB',hit.stolenBases],['BB',hit.baseOnBalls]]:[];
    const pic=pit?[['ERA',pit.era],['WHIP',pit.whip],['SO',pit.strikeOuts],['SV',pit.saves],['BB',pit.baseOnBalls],['HR',pit.homeRuns],['SHO',pit.shutouts],['K/9',pit.strikeoutsPer9Inn]]:[];
    if(!bat.length&&!pic.length)return '';
    return `<div class="section"><h3 class="section-h">Team Pulse<span class="sm">Season</span></h3><div class="pulse">
      <div class="pblock"><h4>Batting</h4><div class="sgrid">${bat.map(t=>tile(t[0],t[1])).join('')}</div></div>
      <div class="pblock"><h4>Pitching</h4><div class="sgrid">${pic.map(t=>tile(t[0],t[1])).join('')}</div></div></div>`;
  }

  // ---------- load ----------
  async function resolveSeason(teamId){
    const now=new Date().getFullYear();
    for(const y of [now,now-1]){
      const s=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}&season=${y}&gameType=R`);
      let n=0;((s&&s.dates)||[]).forEach(d=>n+=(d.games||[]).length);
      if(n)return {y,sch:s};
    }
    return {y:now,sch:null};
  }
  function flat(sch){let g=[];((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(x=>{x.__date=d.date;g.push(x);}));return g;}

  async function loadPlayer(id){
    const pj=await j(`https://statsapi.mlb.com/api/v1/people/${id}?hydrate=currentTeam`);
    const p=pj&&pj.people&&pj.people[0]; if(!p)return null;
    const pos=(p.primaryPosition&&p.primaryPosition.abbreviation)||'';
    const group=pos==='P'?'pitching':'hitting';
    const yr=new Date().getFullYear();
    const [sj,gj]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=season&group=${group}&season=${yr}`),
      j(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=gameLog&group=${group}&season=${yr}`)
    ]);
    let season=sj&&sj.stats&&sj.stats[0]&&sj.stats[0].splits&&sj.stats[0].splits[0]&&sj.stats[0].splits[0].stat;
    if(!season){const lj=await j(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=season&group=${group}&season=${yr-1}`);season=lj&&lj.stats&&lj.stats[0]&&lj.stats[0].splits&&lj.stats[0].splits[0]&&lj.stats[0].splits[0].stat;}
    const sp=(gj&&gj.stats&&gj.stats[0]&&gj.stats[0].splits)||[];
    return {p,group,season,last:sp[sp.length-1]};
  }

  async function load(){
    const my=++tok;
    const F=favs();
    if(!F.team){welcome();return;}
    page.innerHTML='<div class="state">Loading your dashboard…</div>';
    const {y,sch}=await resolveSeason(F.team);
    const base=`https://statsapi.mlb.com/api/v1/teams/${F.team}`;
    const [stand,tinfo,thit,tpit]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=${y}&standingsTypes=regularSeason`),
      j(`${base}?season=${y}`),
      j(`${base}/stats?stats=season&group=hitting&season=${y}`),
      j(`${base}/stats?stats=season&group=pitching&season=${y}`)
    ]);
    if(my!==tok)return;
    const tm=(tinfo&&tinfo.teams&&tinfo.teams[0])||{id:F.team,name:'Team'};
    const divName=(tm.division&&tm.division.name)||'';
    let rec=null;((stand&&stand.records)||[]).forEach(g=>(g.teamRecords||[]).forEach(t=>{if(t.team&&t.team.id===F.team)rec=t;}));
    const all=flat(sch);
    const finals=all.filter(g=>g.status&&g.status.abstractGameState==='Final').sort((a,b)=>(b.gameDate||'').localeCompare(a.gameDate||''));
    const upcoming=all.filter(g=>g.status&&g.status.abstractGameState==='Preview').sort((a,b)=>(a.gameDate||'').localeCompare(b.gameDate||''));
    const hit=thit&&thit.stats&&thit.stats[0]&&thit.stats[0].splits&&thit.stats[0].splits[0]&&thit.stats[0].splits[0].stat;
    const pit=tpit&&tpit.stats&&tpit.stats[0]&&tpit.stats[0].splits&&tpit.stats[0].splits[0]&&tpit.stats[0].splits[0].stat;

    const recapPks=finals.slice(0,4).map(g=>g.gamePk);
    const recaps=await Promise.all(recapPks.map(pk=>j(`https://statsapi.mlb.com/api/v1/game/${pk}/content`).then(c=>{
      const rec=c&&c.editorial&&c.editorial.recap&&c.editorial.recap.mlb; return (rec&&rec.headline)?{pk,rec}:null;})));
    const players=(await Promise.all(F.players.map(loadPlayer))).filter(Boolean);
    if(my!==tok)return;

    let html=heroHTML(tm,divName,rec);
    html+=scheduleSection(finals,upcoming,F.team,rec);
    html+=newsSection(recaps,F.team);
    if(players.length)html+=`<div class="section"><h3 class="section-h">Your Players</h3><div class="players">${players.map(playerCard).join('')}</div></div>`;
    html+=pulseSection(hit,pit);
    page.innerHTML=html;
    document.title='DROPTHIRD — '+(tm.name||'');
  }

  document.addEventListener('dt:settings-changed',load);
  load();
</script>
</body>
</html>
