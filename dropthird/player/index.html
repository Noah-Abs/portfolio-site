<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg,#0b0c0e);color:var(--text2,#cfd4da);font-family:"Roboto",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
  .back{display:inline-block;margin:0 0 14px;color:#5a636d;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
  .back:hover{color:var(--accent,#4aa3ff)}
  .card{flex:0 1 330px;min-width:0;max-width:330px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:8px;overflow:hidden}
  .banner{position:relative;height:150px;background:linear-gradient(150deg,#1f3f6b,#0a1626)}
  .banner img{width:100%;height:100%;object-fit:cover;object-position:top center;opacity:.95}
  .shot{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
    border:4px solid var(--panel,#101115);background:var(--border,#1b1e24);box-shadow:0 2px 6px rgba(0,0,0,.3);overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
  .body{padding:20px 20px 22px;text-align:center}
  .name{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1.05;color:var(--text,#fff)}
  .sub{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:4px;color:var(--text3,#aab0b9);font-size:14px;font-weight:500}
  .sub .pos{color:var(--accent,#4aa3ff);font-weight:700}
  .sub img{width:20px;height:20px;object-fit:contain}
  .bio{margin-top:18px;text-align:left}
  .brow{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid var(--border,#1b1e24);font-size:13.5px}
  .brow:last-child{border-bottom:1px solid var(--border,#1b1e24)}
  .brow span{color:var(--muted,#8a939c);font-weight:500}
  .brow b{color:var(--text,#fff);font-weight:700}
  .state{padding:40px;text-align:center;color:var(--muted,#8a939c);font-size:13px}
  .page{margin:0 auto}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
  .box{flex:0 1 330px;min-width:0;max-width:330px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
  .arsbox,.row.fill .arsbox{flex:1 1 340px;max-width:none}
  .row.top{align-items:flex-start}
  .stack{display:flex;flex-direction:column;gap:16px;flex:0 1 330px;min-width:0;max-width:330px}
  .stack .box{flex:0 0 auto;width:100%;max-width:none}
  .arsbox .ascroll{flex:1}
  .arsbox .atbl{height:100%}
  .box-h{text-align:center;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:18px;padding:15px 14px 0;color:var(--text,#fff)}
  .box-h .yr{color:var(--accent,#4aa3ff)}
  .box-h:after{content:"";display:block;width:64px;border-bottom:3px dotted var(--accent,#4aa3ff);margin:9px auto 0}
  .slist{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;margin-top:12px}
  .scell{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--border,#1b1e24);font-size:13.5px}
  .scell.col2{border-left:1px solid var(--border,#1b1e24)}
  .scell span{color:var(--muted,#8a939c);font-weight:500;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scell b{color:var(--text,#fff);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .footnote{margin:12px 2px 0;font-size:11px;color:#9aa3ac;text-align:left}
  .arsenal{flex:0 0 100%;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:8px;overflow:hidden}
  .ascroll{overflow-x:auto}
  .atbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .atbl th,.atbl td{padding:10px 14px;font-size:13px;text-align:right;border-top:1px solid var(--border,#1b1e24);white-space:nowrap}
  .atbl thead th{color:var(--muted,#8a939c);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;border-top:none;border-bottom:1px solid var(--border2,#262a32);background:var(--panel2,#15161b)}
  .atbl td:first-child,.atbl th:first-child{text-align:left;font-weight:600;color:var(--text,#fff)}
  .atbl tbody tr:hover td{background:var(--panel2,#15161b)}
  .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:middle}
  /* heatmap box */
  .hmbox{flex:1 1 360px;max-width:430px;min-width:300px}
  .hm-cyc{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px 0;flex-wrap:wrap}
  .hm-cyc .arw{width:30px;height:30px;border-radius:8px;border:1px solid var(--border2,#262a32);background:var(--panel2,#15161b);color:#fff;font-size:19px;line-height:1;cursor:pointer;font-family:"Roboto Condensed",sans-serif}
  .hm-cyc .arw:hover{border-color:var(--accent,#4aa3ff);color:var(--accent,#4aa3ff)}
  .hm-cyc .cur{display:flex;align-items:center;gap:7px;min-width:150px;justify-content:center;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:15px;color:var(--text,#fff)}
  .hm-cyc .cur .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .hm-cyc .cur i{font-style:normal;color:#8a939c;font-weight:500;font-size:11.5px}
  .hm-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:9px 14px 0}
  .hm-chip{font-size:10.5px;font-weight:700;color:#aab0b9;background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);border-radius:6px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .hm-chip.on{border-color:var(--accent,#4aa3ff);color:#fff}.hm-chip .sw{width:8px;height:8px;border-radius:2px}
  .hm-stage{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px 4px}
  .hm-stage canvas{background:#fff;border-radius:8px;display:block;max-width:100%;height:auto}
  .hm-cbar{display:flex;flex-direction:column;align-items:center;gap:4px}
  .hm-cbar .l{font-size:10.5px;color:#8a939c;font-variant-numeric:tabular-nums;line-height:1}
  .hm-cbar .blocks{display:flex;flex-direction:column;width:16px;height:200px;border:1px solid var(--border2,#262a32);border-radius:3px;overflow:hidden}
  .hm-cbar .blocks div{flex:1}
  .hm-key{font-size:11px;color:#8a939c;text-align:center;padding:6px 16px 16px;line-height:1.5}
  .hm-key b{color:#aab0b9}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .psearch{position:relative;width:min(280px,48vw)}
  .psearch input{width:100%;background:var(--panel,#101115);border:1px solid var(--border2,#262a32);border-radius:9px;color:#fff;font:inherit;font-size:14px;padding:9px 12px;outline:none}
  .psearch input:focus{border-color:var(--accent,#4aa3ff)}
  .psr{position:absolute;right:0;top:100%;margin-top:5px;width:300px;max-width:86vw;background:var(--panel,#101115);border:1px solid var(--border2,#262a32);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:330px;overflow:auto;display:none;z-index:50}
  .psr.on{display:block}
  .psr a{display:flex;align-items:center;gap:9px;padding:9px 12px;color:var(--text2,#cfd4da);text-decoration:none;font-size:13.5px}
  .psr a:hover{background:var(--panel2,#15161b);color:#fff}
  .psr img{width:18px;height:18px;object-fit:contain}.psr span{color:#8a939c;font-size:11px;margin-left:auto}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <div class="topbar">
    <a class="back" onclick="history.length>1?history.back():location.href='/dropthird/clubs/'">← Back</a>
    <div class="psearch"><input id="psq" placeholder="Search players…" autocomplete="off"><div class="psr" id="psr"></div></div>
  </div>
  <div id="app"><div class="state">Loading…</div></div>

<script>
  const ID=(+new URLSearchParams(location.search).get('id'))||660271, YEAR=2026;
  // how each player entered pro ball (API exposes no clean "signed by" field)
  const META={
    660271:['Signed','2017 · Los Angeles Angels'],
    605141:['Drafted','2011 · Boston Red Sox'],
    808967:['Signed','2024 · Los Angeles Dodgers'],
  };
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const num=v=>(v==null||v===''||isNaN(+v))?null:+v;
  const fmtAvg=v=>String(v).replace(/^0(?=\.)/,'');
  const d1=v=>{const n=num(v);return n==null?'–':n.toFixed(1);};
  const d3=v=>{const n=num(v);return n==null?'–':n.toFixed(3).replace(/^0(?=\.)/,'');};
  const SAV='https://baseballsavant.mlb.com';

  const HIT=[['G','gamesPlayed'],['PA','plateAppearances'],['AB','atBats'],['R','runs'],['H','hits'],['2B','doubles'],
    ['3B','triples'],['HR','homeRuns'],['RBI','rbi'],['BB','baseOnBalls'],['SO','strikeOuts'],['SB','stolenBases'],
    ['AVG','avg','avg'],['OBP','obp','avg'],['SLG','slg','avg'],['OPS','ops','avg']];
  const PIT=[['W','wins'],['L','losses'],['ERA','era'],['G','gamesPlayed'],['GS','gamesStarted'],['SV','saves'],
    ['IP','inningsPitched'],['H','hits'],['R','runs'],['ER','earnedRuns'],['HR','homeRuns'],['BB','baseOnBalls'],
    ['SO','strikeOuts'],['WHIP','whip'],['K/9','strikeoutsPer9Inn'],['BB/9','walksPer9Inn']];
  const PCOL={FF:'#d6273a',FA:'#d6273a',SI:'#f0663b',FC:'#f0973b',FS:'#23a06a',CH:'#2fb673',SC:'#2fb673',
    SL:'#3b82f0',ST:'#5b8def',SV:'#6b6bf0',CU:'#9b5cf0',KC:'#b05cf0',CS:'#9b5cf0',KN:'#8a909a',EP:'#8a909a'};

  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const csv=u=>fetch(u).then(r=>r.ok?r.text():'').then(t=>t?parseCSV(t):[]).catch(()=>[]);
  const find=(rows,id,key)=>rows.find(o=>+o[key||'player_id']===id)||null;
  const seasonStat=jj=>{try{return jj.stats[0].splits[0].stat;}catch(e){return null;}};
  function parseCSV(text){
    const lines=text.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.length);
    const rows=lines.map(l=>{const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){const ch=l[i];
        if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
        else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}
      out.push(cur);return out;});
    const hdr=rows.shift();return rows.map(r=>{const o={};hdr.forEach((h,i)=>o[h]=r[i]);return o;});
  }

  function renderBox(title,rows){
    const gr=Math.max(1,Math.ceil(rows.length/2));
    const cells=rows.map((r,i)=>`<div class="scell${i>=gr?' col2':''}"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('');
    return `<div class="box"><div class="box-h"><span class="yr">${YEAR}</span> ${esc(title)}</div><div class="slist" style="grid-template-rows:repeat(${gr},1fr)">${cells}</div></div>`;
  }
  function statBox(title,fields,stat){
    return renderBox(title,fields.map(f=>{let v=stat[f[1]];
      if(v==null||v==='')v='–';else if(f[2]==='avg')v=fmtAvg(v);return [f[0],v];}));
  }
  const sgn0=v=>{const n=num(v);return n==null?'–':(n>0?'+':'')+Math.round(n);};
  const sgn1=v=>{const n=num(v);return n==null?'–':(n>0?'+':'')+(Math.round(n*10)/10);};
  function advancedBoxes(hStat,cu,xs,spd,bsr,oaa){
    cu=cu||{};xs=xs||{};spd=spd||{};bsr=bsr||{};oaa=oaa||{};
    const iso=(num(hStat.slg)!=null&&num(hStat.avg)!=null)?num(hStat.slg)-num(hStat.avg):null;
    return [
      renderBox('Advanced',[
        ['OPS+','—'],['wRC+','—'],['WAR','—'],
        ['ISO',iso!=null?d3(iso):'–'],['BABIP',d3(hStat.babip)],['BB%',d1(cu.bb_percent)]]),
      renderBox('Quality of Contact',[
        ['Avg EV',d1(cu.exit_velocity_avg)],['Max EV',num(cu.exit_velocity_max)!=null?d1(cu.exit_velocity_max):'—'],['Barrel%',d1(cu.barrel_batted_rate)],
        ['Hard-Hit%',d1(cu.hard_hit_percent)],['Sweet-Spot%',d1(cu.sweet_spot_percent)]]),
      renderBox('Expected & Discipline',[
        ['xBA',d3(xs.est_ba)],['xSLG',d3(xs.est_slg)],['xwOBA',d3(xs.est_woba)],
        ['Chase%',d1(cu.oz_swing_percent)],['Whiff%',d1(cu.whiff_percent)]]),
      renderBox('Fielding & Baserunning',[
        ['OAA',sgn0(oaa.outs_above_average)],['DRS','—'],
        ['Baserunning',sgn1(bsr.runner_runs)],['Sprint Speed',d1(spd.sprint_speed)]]),
    ];
  }
  function arsenalInner(splits,savRows,amap){
    amap=amap||{};
    const savMap={};(savRows||[]).forEach(r=>{if(+r.player_id===ID)savMap[r.pitch_type]=r;});
    const ps=splits.map(s=>s.stat).filter(p=>p&&p.type).sort((a,b)=>(b.percentage||0)-(a.percentage||0));
    const head='<tr><th>Pitch Type</th><th>Usage</th><th>Velo</th><th>Spin</th><th>V-Break</th><th>H-Break</th><th>Whiff%</th><th>Put-Away%</th><th>BA</th><th>xwOBA</th><th>Hard-Hit%</th></tr>';
    const body=ps.map(p=>{const code=p.type.code,sv=savMap[code]||{},ex=amap[code]||{},col=PCOL[code]||'#6b727c';
      return `<tr><td><span class="pdot" style="background:${col}"></span>${esc(p.type.description||code)}</td>
        <td>${d1((p.percentage||0)*100)}%</td><td>${p.averageSpeed!=null?(+p.averageSpeed).toFixed(1):'–'}</td>
        <td>${ex.spin?Math.round(+ex.spin):'–'}</td><td>${d1(ex.vbreak)}</td><td>${d1(ex.hbreak)}</td>
        <td>${d1(sv.whiff_percent)}</td><td>${d1(sv.put_away)}</td>
        <td>${d3(sv.ba)}</td><td>${d3(sv.est_woba)}</td><td>${d1(sv.hard_hit_percent)}</td></tr>`;}).join('');
    return `<div class="box-h"><span class="yr">${YEAR}</span> Pitch Arsenal</div>
      <div class="ascroll"><table class="atbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }
  function arsenalsMap(paSpin,paBz,paBx){
    const m={};
    const add=(rows,key)=>{const row=(rows||[]).find(o=>+o.pitcher===ID);if(!row)return;
      for(const col in row){const mt=col.match(/^([a-z]{2})_avg_(?:spin|break_z|break_x)$/);
        if(mt&&row[col]!==''&&row[col]!=null){const c=mt[1].toUpperCase();(m[c]=m[c]||{})[key]=row[col];}}};
    add(paSpin,'spin');add(paBz,'vbreak');add(paBx,'hbreak');return m;
  }
  function pitcherStatcast(rows){
    const FB={FF:1,SI:1,FC:1};let n=0,ext=0,en=0,rz=0,zn=0,rx=0,xn=0,csw=0,fbMax=null;
    (rows||[]).forEach(r=>{n++;
      const e=parseFloat(r.release_extension);if(!isNaN(e)){ext+=e;en++;}
      const z=parseFloat(r.release_pos_z);if(!isNaN(z)){rz+=z;zn++;}
      const x=parseFloat(r.release_pos_x);if(!isNaN(x)){rx+=x;xn++;}
      const d=r.description;if(d==='called_strike'||d==='swinging_strike'||d==='swinging_strike_blocked')csw++;
      if(FB[r.pitch_type]){const v=parseFloat(r.release_speed);if(!isNaN(v)&&(fbMax==null||v>fbMax))fbMax=v;}});
    if(!n)return {};
    return {extension:en?ext/en:null,relZ:zn?rz/zn:null,relX:xn?rx/xn:null,csw:100*csw/n,fbMax};
  }
  function weightedPutaway(savRows){let num=0,den=0;
    (savRows||[]).forEach(r=>{if(+r.player_id===ID){const w=parseFloat(r.pitches)||0,pa=parseFloat(r.put_away);if(!isNaN(pa)){num+=pa*w;den+=w;}}});
    return den?num/den:null;}
  function pitcherBoxes(cu,xs,sc,wpa){
    cu=cu||{};xs=xs||{};sc=sc||{};const ft=v=>v!=null?d1(v)+"'":'–';
    return [
      renderBox('Velocity & Release',[['Avg FB Velo',d1(cu.fastball_avg_speed)],['Max FB Velo',sc.fbMax!=null?d1(sc.fbMax):'–'],
        ['Extension',ft(sc.extension)],['Release Ht',ft(sc.relZ)],['Release Side',ft(sc.relX)]]),
      renderBox('Plate Discipline',[['Chase%',d1(cu.oz_swing_percent)],['Whiff%',d1(cu.whiff_percent)],
        ['CSW%',sc.csw!=null?d1(sc.csw):'–'],['Put-Away%',wpa!=null?d1(wpa):'–']]),
      renderBox('Batted Ball',[['GB%',d1(cu.groundballs_percent)],['FB%',d1(cu.flyballs_percent)],
        ['Hard-Hit%',d1(cu.hard_hit_percent)],['Barrel%',d1(cu.barrel_batted_rate)]]),
      renderBox('Expected (Allowed)',[['xERA',d1(cu.xera)],['xBA',d3(xs.est_ba)],['xSLG',d3(xs.est_slg)],['xwOBA',d3(xs.est_woba)]]),
    ];
  }

  /* ===== heatmaps — Baseball Savant-style filled contours ===== */
  const HMPAL=['#2747a0','#6f9bd6','#f3f6fa','#ffffff','#f3f6fa','#e7897c','#b81d2c'];
  const _hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  function hmCol(t){t=Math.max(0,Math.min(1,t));const x=t*(HMPAL.length-1),i=Math.floor(x),f=x-i,a=_hx(HMPAL[i]),b=_hx(HMPAL[Math.min(i+1,HMPAL.length-1)]);return [Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];}
  let HS=null;
  function hmPoints(rows){return (rows||[]).map(r=>{const px=parseFloat(r.plate_x),pz=parseFloat(r.plate_z);if(isNaN(px)||isNaN(pz))return null;
    return {px,pz,pt:r.pitch_type||'',pn:r.pitch_name||r.pitch_type||'',desc:r.description||'',ls:parseFloat(r.launch_speed),xw:parseFloat(r.estimated_woba_using_speedangle)};}).filter(Boolean);}
  function hmMetric(p){const M=HS.metric;
    if(M==='freq')return {v:1};
    if(M==='xwoba')return isNaN(p.xw)?null:{v:p.xw};
    if(M==='hardhit')return isNaN(p.ls)?null:{v:p.ls>=95?1:0};
    const sw=/swinging_strike|foul|hit_into_play|missed_bunt/.test(p.desc);if(!sw)return null;return {v:/swinging_strike|missed_bunt/.test(p.desc)?1:0};}
  function hmBlur(a,have,G){const o=new Float64Array(G*G);for(let y=0;y<G;y++)for(let x=0;x<G;x++){let s=0,w=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny<0||nx<0||ny>=G||nx>=G)continue;const k=ny*G+nx,wg=(dx===0&&dy===0)?4:((dx===0||dy===0)?2:1);if(have[k]||a[k]>0){s+=a[k]*wg;w+=wg;}}o[y*G+x]=w?s/w:0;}return o;}
  function hmDraw(){
    const cv=document.getElementById('hmCanvas');if(!cv)return;const ctx=cv.getContext('2d');
    const x0=-2.2,x1=2.2,z0=0.2,z1=4.9,fw=x1-x0,fh=z1-z0,W=300,H=Math.round(W*fh/fw);
    cv.width=W;cv.height=H;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    const pts=HS.pts.filter(p=>{if(HS.mode==='pitcher'&&HS.pitch!=='all'&&p.pt!==HS.pitch)return false;return p.px>=x0&&p.px<=x1&&p.pz>=z0&&p.pz<=z1;});
    const G=30,blur=4,NL=10,sum=new Float64Array(G*G),wt=new Float64Array(G*G);
    pts.forEach(p=>{const m=hmMetric(p);if(!m)return;const gx=Math.min(G-1,Math.floor((p.px-x0)/fw*G)),gy=Math.min(G-1,Math.floor((1-(p.pz-z0)/fh)*G)),k=gy*G+gx;sum[k]+=m.v;wt[k]++;});
    const cell=new Float64Array(G*G),have=new Uint8Array(G*G);
    for(let i=0;i<G*G;i++){if(HS.metric==='freq'){cell[i]=wt[i];have[i]=wt[i]>0?1:0;}else if(wt[i]>=2){cell[i]=sum[i]/wt[i];have[i]=1;}}

      const tj=await j(`https://statsapi.mlb.com/api/v1/people?personIds=${pl.map(p=>p.id).join(',')}&hydrate=currentTeam`);
      const tm={};((tj&&tj.people)||[]).forEach(p=>tm[p.id]={t:(p.currentTeam&&p.currentTeam.id)||0,pos:(p.primaryPosition&&p.primaryPosition.abbreviation)||''});
      box.innerHTML=pl.map(p=>{const m=tm[p.id]||{};return `<a href="?id=${p.id}"><img src="${logo(m.t)}" onerror="this.style.visibility='hidden'">${esc(p.fullName)}<span>${esc(m.pos||'')}</span></a>`;}).join('');
      box.classList.add('on');}
    q.oninput=()=>{clearTimeout(t);const v=q.value.trim();if(v.length<3){box.classList.remove('on');return;}t=setTimeout(()=>run(v),250);};
    q.onkeydown=e=>{if(e.key==='Enter'){const a=box.querySelector('a');if(a)location.href=a.getAttribute('href');}};
    document.addEventListener('click',e=>{if(!e.target.closest('.psearch'))box.classList.remove('on');});
  })();
</script>
</body>
</html>
