<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:row-reverse}
  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);border-left:1px solid var(--border,#1b1e24);padding:30px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:11px 15px;border-radius:11px;color:var(--text3,#aab0b9);text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .side-foot{margin-top:auto;padding-top:18px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}
  .main{flex:1 1 auto;min-width:0;padding:40px 30px 70px}
  .page{max-width:1180px;margin:0 auto;width:100%}

  .gh-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,54px);letter-spacing:1px;line-height:1}
  .page-sub{margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:4px;font-size:12px;color:var(--muted,#7e858f)}
  .page-sub .lv{color:#46c77e}
  .gh-datenav{display:flex;align-items:center;gap:8px}
  .gh-arrow{width:38px;height:38px;border-radius:11px;border:1px solid var(--border2,#262a32);background:var(--panel2,#15161b);color:var(--text3,#aab0b9);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;line-height:1}
  .gh-arrow:hover{background:var(--panel,#101115);color:#fff;border-color:#3b454f}
  .gh-date{min-width:160px;height:38px;border-radius:11px;border:1px solid var(--border2,#262a32);background:var(--panel2,#15161b);color:var(--text,#fff);font-family:"Oswald",sans-serif;font-weight:600;font-size:14px;letter-spacing:.6px;cursor:pointer;padding:0 16px;transition:.14s}
  .gh-date:hover{background:var(--panel,#101115);border-color:#3b454f}

  .gh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
  .gh-card{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;padding:15px 17px 14px;cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:transform .12s,border-color .12s,background .12s}
  .gh-card:hover{transform:translateY(-2px);border-color:var(--border2,#3b454f);background:var(--panel2,#15161b)}
  .gh-status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#7e858f)}
  .gh-status.live{color:#46c77e}
  .gh-status .d{width:7px;height:7px;border-radius:50%;background:#46c77e;animation:ghp 1.6s infinite}
  @keyframes ghp{0%,100%{opacity:1}50%{opacity:.35}}
  .gh-status .sp{flex:1}
  .gh-status .rt{color:var(--muted2,#5b6470);font-weight:500;letter-spacing:.4px;text-transform:none}
  .gh-teams{display:flex;flex-direction:column;gap:9px}
  .gh-row{display:flex;align-items:center;gap:11px}
  .gh-row .bar{width:4px;height:28px;border-radius:99px;background:var(--c,#444);flex:0 0 auto}
  .gh-row img{width:28px;height:28px;object-fit:contain;flex:0 0 auto}
  .gh-row .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .gh-row .nm .n{font-family:"Oswald",sans-serif;font-weight:600;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gh-row .nm .r{font-size:10.5px;font-weight:500;color:var(--muted2,#5b6470);line-height:1;letter-spacing:.3px}
  .gh-row .sc{font-family:"Oswald",sans-serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;flex:0 0 auto}
  .gh-row.lose .nm .n,.gh-row.lose .sc{color:var(--muted,#7e858f)}.gh-row.lose .bar{opacity:.4}
  .gh-live{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border,#1b1e24);font-size:12.5px;font-weight:600;color:var(--muted,#7e858f)}
  .gh-cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text2,#cfd4da)}
  .dia{position:relative;width:24px;height:24px;flex:0 0 auto}
  .dia i{position:absolute;width:32%;aspect-ratio:1;border-radius:2px;border:1.5px solid var(--muted2,#5b6470);transform:rotate(45deg)}
  .dia .d2{top:2%;left:50%;transform:translateX(-50%) rotate(45deg)}.dia .d1{top:50%;right:2%;transform:translateY(-50%) rotate(45deg)}.dia .d3{top:50%;left:2%;transform:translateY(-50%) rotate(45deg)}
  .dia i.on{background:#ffd60a;border-color:#ffd60a}
  .gh-outs{display:flex;gap:4px}.gh-outs i{width:7px;height:7px;border-radius:50%;background:var(--border2,#2a2f37)}.gh-outs i.on{background:#ff453a}
  .gh-state{grid-column:1/-1;text-align:center;color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:13px;padding:62px 10px}

  @media(max-width:760px){
    .gh-grid{grid-template-columns:1fr}
    .gh-head{margin-bottom:16px}
    .gh-datenav{width:100%}.gh-date{flex:1}
  }
</style>
<script src="/settings.js"></script>
</head>
<body>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <a class="tab live" href="../live/"><span class="dot"></span>Live</a>
      <div class="nav-label">Teams</div>
      <a class="tab" href="../clubs/"><span class="dot"></span>Teams</a>
      <a class="tab" href="../standings/"><span class="dot"></span>Standings</a>
      <a class="tab" href="../games/"><span class="dot"></span>Schedule</a>
      <a class="tab active" href="../gamehub/"><span class="dot"></span>Games</a>
      <a class="tab" href="../probables/"><span class="dot"></span>Probables</a>
      <a class="tab" href="../postseason/"><span class="dot"></span>Postseason</a>
      <a class="tab" href="../team-offense/"><span class="dot"></span>Team Offense</a>
      <a class="tab" href="../team-defense/"><span class="dot"></span>Team Defense</a>
      <a class="tab" href="../team-pitching/"><span class="dot"></span>Team Pitching</a>
      <a class="tab" href="../starting-pitching/"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="../bullpen/"><span class="dot"></span>Bullpen</a>
      <a class="tab" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../hall-of-fame/"><span class="dot"></span>Hall of Fame</a>
      <a class="tab" href="../awards/"><span class="dot"></span>Awards</a>
      <a class="tab" href="../injuries/"><span class="dot"></span>Injuries</a>
      <a class="tab" href="../transactions/"><span class="dot"></span>Transactions</a>
      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>
      <a class="tab" href="../leaders-relievers/"><span class="dot"></span>Relievers</a>
      <a class="tab" href="../leaders-defense/"><span class="dot"></span>Fielders</a>
    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main">
    <div class="page">
      <div class="page-head gh-head">
        <div>
          <h1 class="page-t">Games</h1>
          <p class="page-sub" id="sub">Live scoreboard</p>
        </div>
        <div class="gh-datenav">
          <button class="gh-arrow" id="prev" aria-label="Previous day">&lsaquo;</button>
          <button class="gh-date" id="dateBtn"><span id="dateLbl">Today</span></button>
          <button class="gh-arrow" id="next" aria-label="Next day">&rsaquo;</button>
        </div>
      </div>
      <div id="grid" class="gh-grid"><div class="gh-state">Loading…</div></div>
    </div>
  </main>

<script>
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const TEAMCOLOR={108:'#BA0021',109:'#A71930',110:'#DF4601',111:'#BD3039',112:'#0E3386',113:'#C6011F',114:'#E31937',115:'#33006F',116:'#FA4616',117:'#EB6E1F',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#FF5910',133:'#EFB21E',134:'#FDB827',135:'#FFC425',136:'#2CA6A4',137:'#FD5A1E',138:'#C41E3A',139:'#8FBCE6',140:'#C0111F',141:'#1D7AE0',142:'#D31145',143:'#E81828',144:'#CE1141',145:'#C4CED4',146:'#00A3E0',147:'#5B7DB1',158:'#FFC52F'};
  const tc=t=>TEAMCOLOR[t&&t.id]||'#48484a';
  const clubName=t=>{const n=String((t&&t.name)||'');const m=/Red Sox|White Sox|Blue Jays/.exec(n);return m?m[0]:(n.split(' ').pop()||'');};
  const ordinal=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');
  const isLive=g=>g.status&&g.status.abstractGameState==='Live';
  const isFinal=g=>g.status&&g.status.abstractGameState==='Final';
  const isPrev=g=>g.status&&g.status.abstractGameState==='Preview';
  const recOf=(g,s)=>{const lr=g.teams[s]&&g.teams[s].leagueRecord;return lr?lr.wins+'-'+lr.losses:'';};
  const gameTime=g=>{try{return new Date(g.gameDate).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'})+' PT';}catch(e){return '';}};
  const ptDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

  function statusText(g){
    const ls=g.linescore||{},st=g.status||{};
    if(isLive(g)){if(/Middle|End/.test(ls.inningState||''))return (ls.inningState==='End'?'End ':'Mid ')+ordinal(ls.currentInning||0);
      return (ls.isTopInning?'Top ':'Bot ')+ordinal(ls.currentInning||0);}
    if(isFinal(g))return 'Final'+(ls.currentInning&&ls.currentInning!==9?' / '+ordinal(ls.currentInning):'');
    const ds=st.detailedState||'';return /Postponed|Delayed|Suspended/.test(ds)?ds:gameTime(g);
  }
  function diaHTML(ls){const o=k=>(ls.offense&&ls.offense[k])?' on':'';
    return `<span class="dia"><i class="d2${o('second')}"></i><i class="d1${o('first')}"></i><i class="d3${o('third')}"></i></span>`;}
  function outsHTML(o){return `<span class="gh-outs">${[0,1,2].map(i=>`<i class="${i<o?'on':''}"></i>`).join('')}</span>`;}

  function cardHTML(g){
    const live=isLive(g),fin=isFinal(g),ls=g.linescore||{};
    const a=g.teams.away,h=g.teams.home,aS=a.score,hS=h.score;
    const diff=aS!=null&&hS!=null&&aS!==hS;
    const row=(t,s,sc,lose)=>`<div class="gh-row ${lose?'lose':''}"><span class="bar" style="background:${tc(t.team)}"></span><img src="${logo(t.team.id)}" onerror="this.style.visibility='hidden'"><span class="nm"><span class="n">${esc(clubName(t.team))}</span><span class="r">${esc(recOf(g,s))}</span></span><span class="sc">${sc==null?'':sc}</span></div>`;
    let liveStrip='';
    if(live&&!/Middle|End/.test(ls.inningState||'')){
      liveStrip=`<div class="gh-live">${diaHTML(ls)}${outsHTML(ls.outs||0)}<span>${ls.outs||0} out</span><span class="gh-cnt">${ls.balls||0}-${ls.strikes||0}</span></div>`;
    }
    return `<div class="gh-card" data-pk="${g.gamePk}">`+
      `<div class="gh-status ${live?'live':''}">${live?'<span class="d"></span>':''}<span class="lab">${esc(statusText(g))}</span><span class="sp"></span>${live&&ls.currentInning?'':''}</div>`+
      `<div class="gh-teams">${row(a,'away',aS,fin&&diff&&aS<hS)}${row(h,'home',hS,fin&&diff&&hS<aS)}</div>`+
      liveStrip+`</div>`;
  }

  let GAMES=[], curDate=ptDate(), today=ptDate(), pollTimer=null;
  const grid=document.getElementById('grid'), sub=document.getElementById('sub');

  function flatten(d){let g=[];((d&&d.dates)||[]).forEach(x=>(x.games||[]).forEach(y=>g.push(y)));
    return g.sort((a,b)=>{const o=s=>isLive(s)?0:isPrev(s)?1:2;return o(a)-o(b)||((a.gameDate||'').localeCompare(b.gameDate||''));});}
  function fmtShort(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
  function fmtFull(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
  function stepDate(s,delta){const p=s.split('-');const dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setDate(dt.getDate()+delta);
    const z=n=>String(n).padStart(2,'0');return dt.getFullYear()+'-'+z(dt.getMonth()+1)+'-'+z(dt.getDate());}
  function setHead(){
    document.getElementById('dateLbl').textContent=(curDate===today)?('Today · '+fmtShort(curDate)):fmtFull(curDate);
    const live=GAMES.filter(isLive).length;
    if(!GAMES.length)sub.innerHTML='No games scheduled';
    else if(curDate===today&&live)sub.innerHTML=`<span class="lv">● ${live} live</span> · ${GAMES.length} games`;
    else sub.innerHTML=`${GAMES.length} game${GAMES.length===1?'':'s'}`;
  }
  function render(){
    if(!GAMES.length){grid.innerHTML='<div class="gh-state">No games scheduled.</div>';setHead();return;}
    grid.innerHTML=GAMES.map(cardHTML).join('');
    grid.querySelectorAll('.gh-card').forEach(c=>{c.onclick=()=>{location.href=`../games/?pk=${c.dataset.pk}&src=hub`;};});
    setHead();
  }
  async function load(date,silent){
    if(!silent)grid.innerHTML='<div class="gh-state">Loading…</div>';
    const reqDate=date;
    const d=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&hydrate=linescore,team`);
    if(reqDate!==curDate)return;            // user navigated away mid-fetch
    GAMES=d?flatten(d):[];
    render();
  }
  function go(date){curDate=date;load(curDate);schedulePoll();}
  function schedulePoll(){
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
    if(curDate===today)pollTimer=setInterval(()=>{if(curDate===today)load(curDate,true);},12000);
  }

  document.getElementById('prev').onclick=()=>go(stepDate(curDate,-1));
  document.getElementById('next').onclick=()=>go(stepDate(curDate,1));
  document.getElementById('dateBtn').onclick=()=>{if(curDate!==today)go(today);};

  // ?date=YYYY-MM-DD deep link
  const qd=new URLSearchParams(location.search).get('date');
  if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd))curDate=qd;
  load(curDate);
  schedulePoll();
</script>
</body>
</html>
