<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — GameHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#07090d;color:#fff;font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased}
  .app{height:100vh;display:flex;flex-direction:column}

  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 60px 10px 14px;background:rgba(10,13,18,.78);backdrop-filter:blur(8px);border-bottom:1px solid #18202c;z-index:20}
  .ico{width:38px;height:38px;flex:0 0 auto;border-radius:10px;border:1px solid #262f3d;background:#12161e;color:#aab4c2;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:.15s}
  .ico:hover{color:#fff;border-color:#3b475a}.ico svg{width:19px;height:19px}.ico:disabled{opacity:.35;cursor:default}
  .tb-mid{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .tb-title{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:20px;line-height:1}
  .tb-meta{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7e8794}
  .tb-meta .live{color:#46c77e}.tb-meta .pause{color:#e0a23a}
  .pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46c77e;margin-right:5px;vertical-align:middle;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .vsw{display:flex;flex:0 0 auto;background:#12161e;border:1px solid #262f3d;border-radius:11px;padding:3px;gap:2px}
  .vsw button{border:0;background:transparent;color:#7e8794;font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}
  .vsw button:hover{color:#cfd6df}.vsw button.on{background:#4aa3ff;color:#06121f}
  .nav{display:flex;gap:6px}
  body[data-mode=all] .nav{display:none}

  /* ===== SOLO / ROTATE: one game, full screen ===== */
  #solo{flex:1;min-height:0;display:none;flex-direction:column}
  body:not([data-mode=all]) #solo{display:flex}
  .solo-stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr clamp(140px,15vw,260px) 1fr}
  .solo-half{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,18px);padding:clamp(14px,3vw,50px);overflow:hidden;background:linear-gradient(155deg,var(--c,#243049) -25%,#0a0e15 68%)}
  .solo-half::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,transparent 40%,rgba(0,0,0,.4));pointer-events:none}
  .solo-half .lg{position:relative;width:clamp(64px,15vh,210px);height:clamp(64px,15vh,210px);object-fit:contain;filter:drop-shadow(0 6px 22px rgba(0,0,0,.5))}
  .solo-half .nm{position:relative;font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:clamp(22px,3.6vw,62px);line-height:1;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .solo-half .rec{position:relative;font-size:clamp(11px,1.2vw,18px);letter-spacing:2px;color:#c4cad6;text-transform:uppercase}
  .solo-half .sc{position:relative;font-family:"Oswald",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(72px,21vh,250px);line-height:.82;text-shadow:0 4px 24px rgba(0,0,0,.5)}
  .solo-half.lose{filter:saturate(.5)}.solo-half.lose .sc,.solo-half.lose .nm{color:#9aa6b6}
  .solo-half .ptag{position:relative;font-family:"Oswald",sans-serif;font-weight:700;font-size:clamp(9px,.9vw,13px);letter-spacing:1.5px;text-transform:uppercase;color:#0a0e15;background:#ffd24a;border-radius:6px;padding:3px 9px;visibility:hidden}
  .solo-half.bat .ptag{visibility:visible}

  .solo-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,22px);background:rgba(6,9,14,.66);border-left:1px solid #1a2230;border-right:1px solid #1a2230;padding:clamp(8px,1.5vh,20px) 6px}
  .sm-inn{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(20px,2.4vw,40px);line-height:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
  .sm-inn .ar{color:#46c77e;font-size:.7em;line-height:1}
  .sm-cnt{font-family:"Oswald",sans-serif;font-weight:700;font-size:clamp(26px,3vw,56px);line-height:1;font-variant-numeric:tabular-nums;color:#dfe7f2}
  .sm-outs{display:flex;align-items:center;gap:6px;font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(10px,1vw,15px);letter-spacing:1px;text-transform:uppercase;color:#9fb0c8;flex-direction:column}
  .sm-outs .od{display:flex;gap:5px}.sm-outs .od i{width:clamp(8px,1vw,13px);height:clamp(8px,1vw,13px);border-radius:50%;background:#2a3850}.sm-outs .od i.on{background:#e0556a}
  .sm-dia{position:relative;width:clamp(58px,6vw,98px);height:clamp(58px,6vw,98px)}
  .sm-dia i{position:absolute;width:30%;aspect-ratio:1;border-radius:3px;background:#2a3850;transform:rotate(45deg)}
  .sm-dia .d2{top:2%;left:50%;transform:translateX(-50%) rotate(45deg)}
  .sm-dia .d1{top:50%;right:2%;transform:translateY(-50%) rotate(45deg)}
  .sm-dia .d3{top:50%;left:2%;transform:translateY(-50%) rotate(45deg)}
  .sm-dia i.on{background:#ffd24a;box-shadow:0 0 12px rgba(255,210,74,.6)}
  .sm-risp{font-family:"Oswald";font-weight:700;font-size:clamp(9px,.9vw,12px);letter-spacing:1px;color:#ffd24a;border:1px solid rgba(255,210,74,.45);border-radius:6px;padding:2px 8px}
  .sm-big{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:clamp(18px,2vw,34px);color:#cfe0ff;text-align:center}
  .sm-sub{font-size:clamp(10px,1vw,14px);letter-spacing:2px;text-transform:uppercase;color:#7e8ba6;text-align:center}

  .solo-foot{flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(26px,6.5vw,120px);padding:clamp(16px,3vh,38px) clamp(120px,16vw,200px);background:rgba(8,11,16,.92);border-top:1px solid #18202c;min-height:0}
  .mu{text-align:center;min-width:0}
  .mu .lab{font-weight:700;font-size:clamp(11px,1.1vw,16px);letter-spacing:2.5px;text-transform:uppercase;color:#6b7790;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:7px}
  .mu .lab .dt{width:9px;height:9px;border-radius:50%;background:var(--mc,#5b6b86);flex:0 0 auto}
  .mu .nm{font-family:"Oswald",sans-serif;font-weight:700;font-size:clamp(24px,3vw,50px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu .ex{font-size:clamp(13px,1.3vw,21px);color:#9fb0c8;margin-top:4px}
  .solo-foot.empty{display:none}
  .solo-plays{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#aab4c2;border:1px solid #2a3445;border-radius:9px;padding:8px 13px;cursor:pointer;background:#10141c}
  .solo-plays:hover{color:#fff;border-color:#4aa3ff}
  .solo-prog{flex:0 0 auto;height:4px;background:#11161f}
  .solo-prog .bar{height:100%;width:0;background:#4aa3ff;transition:width .15s linear}
  body:not([data-mode=rotate]) .solo-prog{display:none}
  .rotwhich{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:12px;letter-spacing:1px;color:#5b6b86;font-variant-numeric:tabular-nums}
  body:not([data-mode=rotate]) .rotwhich{display:none}

  /* ===== ALL: fit-to-screen wall ===== */
  #wall{flex:1;min-height:0;display:none;gap:calc(10px*var(--s,1));padding:calc(10px*var(--s,1));grid-template-columns:repeat(auto-fill,minmax(min(calc(250px*var(--s,1)),100%),1fr));grid-auto-rows:min-content;align-content:start;align-items:start;overflow:auto}
  body[data-mode=all] #wall{display:grid}
  .tile{position:relative;background:#0f131b;border:1px solid #232d3c;border-radius:calc(15px*var(--s,1));padding:calc(11px*var(--s,1)) calc(14px*var(--s,1)) calc(12px*var(--s,1));display:flex;flex-direction:column;gap:calc(6px*var(--s,1));cursor:pointer;transition:.14s;box-shadow:0 5px 18px rgba(0,0,0,.4)}
  .tile:hover{transform:translateY(-2px);border-color:#3f5170}
  .tile.live{border-color:rgba(70,199,126,.5);box-shadow:0 0 0 1px rgba(70,199,126,.16),0 6px 20px rgba(0,0,0,.5)}
  .tile.done{opacity:.6}.tile.sched{opacity:.82}
  .t-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .t-state{display:flex;align-items:center;gap:6px;font-family:"Oswald",sans-serif;font-weight:700;font-size:calc(12px*var(--s,1));letter-spacing:1.3px;text-transform:uppercase;color:#8fa0b8;white-space:nowrap}
  .tile.live .t-state{color:#46c77e}.t-state .ld{width:calc(8px*var(--s,1));height:calc(8px*var(--s,1));border-radius:50%;background:#46c77e;animation:pulse 1.4s infinite}
  .t-cnt{font-family:"Oswald",sans-serif;font-weight:700;font-size:calc(13px*var(--s,1));color:#cfe0ff;font-variant-numeric:tabular-nums}
  .t-row{display:flex;align-items:center;gap:calc(10px*var(--s,1))}
  .t-chip{width:calc(9px*var(--s,1));height:calc(25px*var(--s,1));border-radius:3px;flex:0 0 auto;background:var(--c,#2a3a55)}
  .t-ab{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:calc(26px*var(--s,1));letter-spacing:.5px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-sc{font-family:"Oswald",sans-serif;font-weight:700;font-size:calc(38px*var(--s,1));line-height:.9;font-variant-numeric:tabular-nums;color:#fff}
  .t-row.lose .t-ab{color:#7d8aa0}.t-row.lose .t-sc{color:#6b7c96}.t-row.lose .t-chip{opacity:.5}
  .t-foot{display:flex;align-items:center;gap:calc(12px*var(--s,1))}
  .t-dia{position:relative;width:calc(28px*var(--s,1));height:calc(20px*var(--s,1));flex:0 0 auto}
  .t-dia i{position:absolute;width:38%;height:38%;border-radius:2px;background:#2a3850;transform:rotate(45deg)}
  .t-dia .d2{top:0;left:31%}.t-dia .d1{top:31%;right:0}.t-dia .d3{top:31%;left:0}.t-dia i.on{background:#ffd24a}
  .t-outs{display:flex;align-items:center;gap:calc(5px*var(--s,1));font-family:"Oswald",sans-serif;font-weight:600;font-size:calc(11px*var(--s,1));letter-spacing:1px;text-transform:uppercase;color:#8fa0b8}
  .t-outs .od{display:flex;gap:4px}.t-outs .od i{width:calc(6px*var(--s,1));height:calc(6px*var(--s,1));border-radius:50%;background:#2a3850}.t-outs .od i.on{background:#e0556a}
  .tile .eye{position:absolute;top:7px;right:7px;z-index:5;width:24px;height:24px;border:0;background:rgba(0,0,0,.4);color:#aebbd0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:7px;opacity:0;transition:.14s}
  .tile:hover .eye{opacity:1}@media(hover:none){.tile .eye{opacity:.5}}.tile .eye svg{width:15px;height:15px}

  /* panel */
  .panel-sec{padding:15px 18px 17px;border-bottom:1px solid #18202c}
  .panel-lbl{font-family:"Oswald",sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#7e8794;margin-bottom:13px;display:flex;justify-content:space-between}.panel-lbl b{color:#4aa3ff}
  .sizer{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#262f3d;outline:none;cursor:pointer}
  .sizer::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#4aa3ff;cursor:pointer;border:3px solid #0e121a;box-shadow:0 2px 9px rgba(0,0,0,.55)}
  .sizer::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#4aa3ff;cursor:pointer;border:3px solid #0e121a}
  .sizescale{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#474f5c}
  .sizer:disabled{opacity:.4;cursor:not-allowed}
  .panel-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-row span{font-size:13.5px;color:#cfd6df}
  .panel-hint{margin-top:11px;font-size:11.5px;color:#7e8794;line-height:1.45}
  .ghtg{width:46px;height:25px;border-radius:13px;background:#262f3d;position:relative;cursor:pointer;border:none;flex:0 0 auto;transition:.18s}
  .ghtg::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .18s}
  .ghtg.on{background:#4aa3ff}.ghtg.on::after{left:24px}
  .panel{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:88vw;z-index:40;background:#0e121a;border-left:1px solid #18202c;box-shadow:-18px 0 50px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
  .panel.open{transform:none}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #18202c}.panel-h b{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:17px}
  .panel-x{cursor:pointer;color:#7e8794;font-size:20px}.panel-x:hover{color:#fff}
  .panel-sech{padding:14px 18px 6px;font-family:"Oswald",sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#474f5c}
  .panel-note{padding:0 18px 11px;font-size:11.5px;color:#7e8794;line-height:1.5}
  .plist{flex:1;overflow-y:auto;padding:4px 0 10px}
  .pgame{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;border-top:1px solid #14181f}
  .pgame:first-child{border-top:0}.pgame:hover{background:#141821}.pgame img{width:18px;height:18px;object-fit:contain;flex:0 0 auto}
  .pgame .pn{flex:1;min-width:0;font-size:13px;color:#cfd6df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pgame.hid .pn{color:#4a525e}
  .pgame .tg{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid #2a3340;color:#7e8794}.pgame.hid .tg{color:#e0a23a;border-color:rgba(224,162,58,.4)}
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:none}.scrim.open{display:block}
  .state{display:flex;align-items:center;justify-content:center;height:100%;color:#7e8794;letter-spacing:2px;text-transform:uppercase;font-size:14px;grid-column:1/-1}
  @media(max-width:600px){.tb-title{font-size:17px}.vsw button{padding:7px 9px;font-size:11px}}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="ico" href="../homescreen/" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div class="tb-mid"><span class="tb-title">GameHub</span><span class="tb-meta" id="meta"></span></div>
      <div class="nav"><button class="ico" id="prev" title="Previous game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><button class="ico" id="next" title="Next game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></div>
      <div class="vsw" id="vsw"><button data-m="solo">Solo</button><button data-m="rotate">Rotate</button><button data-m="all">All</button></div>
      <button class="ico" id="filterBtn" title="Display & hide games" aria-label="Display"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>

    <div id="solo">
      <div class="solo-stage" id="soloStage"><div class="state">Loading…</div></div>
      <div class="solo-foot" id="soloFoot"></div>
      <div class="solo-prog"><div class="bar" id="progBar"></div></div>
    </div>

    <div id="wall"><div class="state">Loading games…</div></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel">
    <div class="panel-h"><b>Display</b><span class="panel-x" id="panelX">✕</span></div>
    <div class="panel-sec">
      <div class="panel-row"><span>Fit all to one screen</span><button class="ghtg" id="autofitTg"></button></div>
      <div class="panel-lbl" style="margin-top:15px">Tile size <b id="sizeVal">100%</b></div>
      <input type="range" id="sizeRange" class="sizer" min="0.8" max="2.6" step="0.05" value="1">
      <div class="sizescale"><span>More games</span><span>Bigger</span></div>
      <div class="panel-hint">Sizing applies to the <b>All</b> view. Solo &amp; Rotate always fill the screen.</div>
    </div>
    <div class="panel-sech">Hide games</div>
    <div class="panel-note">Hidden games drop from every mode (and the rotation) — hide the one on your TV, or the finals.</div>
    <div class="plist" id="plist"></div>
  </div>

<script>
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ptParts=()=>{const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'2-digit',minute:'2-digit',hour12:false});const p=f.formatToParts(new Date());const h=+(p.find(x=>x.type==='hour').value)%24,m=+(p.find(x=>x.type==='minute').value);return {mins:h*60+m};};
  const ptDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const ptClock=()=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}).format(new Date());
  const inWindow=()=>{const t=ptParts().mins;return t>=600&&t<(23*60+45);};
  const gameTime=g=>{try{return new Date(g.gameDate).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'});}catch(e){return '';}};

  let ABBR={}, GAMES=[], busy=false, lastFitSig='';
  const BOX={};
  const HIDDEN=new Set(JSON.parse(localStorage.getItem('dt-gh-hidden')||'[]'));
  const saveHidden=()=>{try{localStorage.setItem('dt-gh-hidden',JSON.stringify([...HIDDEN]));}catch(e){}};
  let MODE=localStorage.getItem('dt-gh-mode')||'rotate';
  let CURPK=+localStorage.getItem('dt-gh-cur')||0;
  let soloPk=0, rotStart=0, rotTimer=null;
  const ROT_MS=10000;
  const abv=t=>ABBR[t.id]||String(t.name||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
  const TEAMCOLOR={108:'#BA0021',109:'#A71930',110:'#DF4601',111:'#BD3039',112:'#0E3386',113:'#C6011F',114:'#E31937',115:'#33006F',116:'#FA4616',117:'#EB6E1F',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#FF5910',133:'#EFB21E',134:'#FDB827',135:'#FFC425',136:'#2CA6A4',137:'#FD5A1E',138:'#C41E3A',139:'#8FBCE6',140:'#C0111F',141:'#1D7AE0',142:'#D31145',143:'#E81828',144:'#CE1141',145:'#C4CED4',146:'#00A3E0',147:'#5B7DB1',158:'#FFC52F'};
  const tc=t=>TEAMCOLOR[t.id]||'#243049';
  const lastName=f=>{const p=String(f||'').trim().split(' ');return p.length>1?p.slice(1).join(' '):(p[0]||'');};
  const clubName=t=>{const n=String(t.name||'');const two=/Red Sox|White Sox|Blue Jays/.exec(n);return two?two[0]:(n.split(' ').pop()||abv(t));};
  const ordinal=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');
  const showp=p=>(p==null||p==='')?'':String(p).replace(/^0(?=\.)/,'');
  const isLive=g=>g.status&&g.status.abstractGameState==='Live';
  const isFinal=g=>g.status&&g.status.abstractGameState==='Final';
  const isPrev=g=>g.status&&g.status.abstractGameState==='Preview';
  const visGames=()=>GAMES.filter(g=>!HIDDEN.has(g.gamePk));
  const goPBP=pk=>{location.href=`../games/?pk=${pk}&src=hub`;};
  function muInfo(g){const ls=g.linescore||{},top=!!ls.isTopInning,bx=BOX[g.gamePk];
    const batP=ls.offense&&ls.offense.batter,pitP=ls.defense&&ls.defense.pitcher;let pCount='',bAvg='';
    if(bx&&bx.teams){const def=top?'home':'away',bat=top?'away':'home';
      const pp=pitP&&bx.teams[def]&&bx.teams[def].players&&bx.teams[def].players['ID'+pitP.id];
      if(pp&&pp.stats&&pp.stats.pitching&&pp.stats.pitching.numberOfPitches!=null)pCount=pp.stats.pitching.numberOfPitches;
      const bp=batP&&bx.teams[bat]&&bx.teams[bat].players&&bx.teams[bat].players['ID'+batP.id];
      if(bp&&bp.seasonStats&&bp.seasonStats.batting)bAvg=bp.seasonStats.batting.avg;}
    return {batP,pitP,pCount,bAvg,top};}

  /* ===== SOLO ===== */
  function curGame(){const v=visGames();return v.find(g=>g.gamePk===CURPK)||v.find(isLive)||v[0]||null;}
  function buildSolo(g){
    const a=g.teams.away,h=g.teams.home;
    document.getElementById('soloStage').innerHTML=
      `<div class="solo-half away" style="--c:${tc(a.team)}"><img class="lg" src="${logo(a.team.id)}" onerror="this.style.display='none'"><div class="nm">${esc(clubName(a.team))}</div><div class="rec"></div><div class="sc"></div><div class="ptag">▲ At Bat</div></div>`+
      `<div class="solo-mid" id="soloMid"></div>`+
      `<div class="solo-half home" style="--c:${tc(h.team)}"><img class="lg" src="${logo(h.team.id)}" onerror="this.style.display='none'"><div class="nm">${esc(clubName(h.team))}</div><div class="rec"></div><div class="sc"></div><div class="ptag">▲ At Bat</div></div>`;
    soloPk=g.gamePk;
  }
  function paintSolo(){
    const g=curGame(); const stage=document.getElementById('soloStage');
    if(!g){stage.innerHTML='<div class="state">No games to show.</div>';document.getElementById('soloFoot').className='solo-foot empty';soloPk=0;return;}
    if(g.gamePk!==soloPk)buildSolo(g);
    CURPK=g.gamePk;
    const ls=g.linescore||{},st=g.status||{},live=isLive(g),fin=isFinal(g);
    const a=g.teams.away,h=g.teams.home,aS=a.score,hS=h.score;
    const aw=stage.querySelector('.solo-half.away'),hw=stage.querySelector('.solo-half.home');
    const rec=s=>{const lr=g.teams[s]&&g.teams[s].leagueRecord;return lr?lr.wins+'-'+lr.losses:'';};
    aw.querySelector('.rec').textContent=rec('away');hw.querySelector('.rec').textContent=rec('home');
    aw.querySelector('.sc').textContent=(aS==null?'–':aS);hw.querySelector('.sc').textContent=(hS==null?'–':hS);
    const diff=aS!=null&&hS!=null&&aS!==hS;
    aw.classList.toggle('lose',(fin&&diff&&aS<hS));hw.classList.toggle('lose',(fin&&diff&&hS<aS));
    const top=!!ls.isTopInning;
    aw.classList.toggle('bat',live&&top);hw.classList.toggle('bat',live&&!top);
    const mid=document.getElementById('soloMid');
    if(live){
      const brk=/Middle|End/.test(ls.inningState||''),o=ls.outs||0;
      if(brk){mid.innerHTML=`<div class="sm-inn"><span class="ar">${ls.inningState==='End'?'▼':'▲'}</span>${ordinal(ls.currentInning||0)}</div><div class="sm-sub">Mid-Inning</div>`;}
      else{const od=[0,1,2].map(i=>`<i class="${i<o?'on':''}"></i>`).join('');
        const risp=(ls.offense&&(ls.offense.second||ls.offense.third))?'<span class="sm-risp">RISP</span>':'';
        mid.innerHTML=`<div class="sm-inn"><span class="ar">${top?'▲':'▼'}</span>${ordinal(ls.currentInning||0)}</div>`+
          `<div class="sm-dia"><i class="d2 ${ls.offense&&ls.offense.second?'on':''}"></i><i class="d1 ${ls.offense&&ls.offense.first?'on':''}"></i><i class="d3 ${ls.offense&&ls.offense.third?'on':''}"></i></div>`+
          `<div class="sm-cnt">${ls.balls||0}-${ls.strikes||0}</div>`+
          `<div class="sm-outs"><span class="od">${od}</span>${o} OUT</div>${risp}`;}
    }else if(fin){mid.innerHTML=`<div class="sm-big">Final</div>${ls.currentInning&&ls.currentInning!==9?`<div class="sm-sub">${ordinal(ls.currentInning)}</div>`:''}`;}
    else{mid.innerHTML=`<div class="sm-big">${esc(gameTime(g))}</div><div class="sm-sub">First Pitch</div>`;}
    const foot=document.getElementById('soloFoot');
    if(live){const {batP,pitP,pCount,bAvg,top:tp}=muInfo(g);
      const pitchTeam=tp?h.team:a.team, batTeam=tp?a.team:h.team;
      foot.className='solo-foot';
      foot.innerHTML=`<span class="rotwhich" id="rotWhich"></span>`+
        `<div class="mu" style="--mc:${tc(pitchTeam)}"><div class="lab"><span class="dt"></span>Pitching · ${esc(abv(pitchTeam))}</div><div class="nm">${pitP?esc(lastName(pitP.fullName)):'—'}</div><div class="ex">${pCount!==''?pCount+' pitches':''}</div></div>`+
        `<div class="mu" style="--mc:${tc(batTeam)}"><div class="lab"><span class="dt"></span>At Bat · ${esc(abv(batTeam))}</div><div class="nm">${batP?esc(lastName(batP.fullName)):'—'}</div><div class="ex">${bAvg?esc(showp(bAvg)):''}</div></div>`+
        `<span class="solo-plays" id="soloPlays">Plays →</span>`;
    }else{foot.className='solo-foot';foot.innerHTML=`<span class="rotwhich" id="rotWhich"></span><span class="solo-plays" id="soloPlays">Box Score →</span>`;}
    const sp=document.getElementById('soloPlays');if(sp)sp.onclick=()=>goPBP(g.gamePk);
    updRotWhich();
  }
  function updRotWhich(){const el=document.getElementById('rotWhich');if(!el)return;const v=visGames();const i=v.findIndex(x=>x.gamePk===CURPK);el.textContent=(i+1)+' / '+v.length;}
  function advance(dir){const v=visGames();if(!v.length)return;let i=v.findIndex(x=>x.gamePk===CURPK);if(i<0)i=0;i=(i+dir+v.length)%v.length;CURPK=v[i].gamePk;try{localStorage.setItem('dt-gh-cur',CURPK);}catch(e){}paintSolo();if(MODE==='rotate')rotStart=Date.now();}

  /* rotation */
  function startRot(){stopRot();rotStart=Date.now();rotTimer=setInterval(()=>{const p=Math.min(1,(Date.now()-rotStart)/ROT_MS);document.getElementById('progBar').style.width=(p*100)+'%';if(p>=1){advance(1);rotStart=Date.now();}},120);}
  function stopRot(){if(rotTimer){clearInterval(rotTimer);rotTimer=null;}const b=document.getElementById('progBar');if(b)b.style.width='0';}

  /* ===== ALL wall ===== */
  function tileHTML(g){const a=g.teams.away.team,h=g.teams.home.team;
    const row=s=>`<div class="t-row ${s}"><span class="t-chip"></span><span class="t-ab"></span><span class="t-sc"></span></div>`;
    return `<div class="tile" data-pk="${g.gamePk}"><button class="eye" title="Hide">${EYE}</button>
      <div class="t-top"><span class="t-state"></span><span class="t-cnt"></span></div>
      <div class="t-teams">${row('away')}${row('home')}</div>
      <div class="t-foot"><span class="t-dia"><i class="d2"></i><i class="d1"></i><i class="d3"></i></span><span class="t-outs"></span></div></div>`;}
  function paintTile(t,g){const ls=g.linescore||{},st=g.status||{},live=isLive(g),fin=isFinal(g);
    t.classList.toggle('live',live);t.classList.toggle('done',fin);t.classList.toggle('sched',!live&&!fin);
    const a=g.teams.away,h=g.teams.home,aS=a.score,hS=h.score;
    const ar=t.querySelector('.t-row.away'),hr=t.querySelector('.t-row.home');
    ar.querySelector('.t-chip').style.background=tc(a.team);hr.querySelector('.t-chip').style.background=tc(h.team);
    ar.querySelector('.t-ab').textContent=abv(a.team);hr.querySelector('.t-ab').textContent=abv(h.team);
    ar.querySelector('.t-sc').textContent=(aS==null?'–':aS);hr.querySelector('.t-sc').textContent=(hS==null?'–':hS);
    const diff=aS!=null&&hS!=null&&aS!==hS;ar.classList.toggle('lose',diff&&aS<hS);hr.classList.toggle('lose',diff&&hS<aS);
    const stEl=t.querySelector('.t-state'),cntEl=t.querySelector('.t-cnt'),foot=t.querySelector('.t-foot');
    if(live){const brk=/Middle|End/.test(ls.inningState||''),top=!!ls.isTopInning;
      stEl.innerHTML=`<span class="ld"></span>${brk?(ls.inningState==='End'?'▼':'▲'):(top?'▲':'▼')} ${ordinal(ls.currentInning||0)}`;
      cntEl.textContent=brk?'MID':`${ls.balls||0}-${ls.strikes||0}`;foot.style.display='';
      const sb=(sel,k)=>t.querySelector('.t-dia .'+sel).classList.toggle('on',!!(ls.offense&&ls.offense[k]));sb('d1','first');sb('d2','second');sb('d3','third');
      const o=ls.outs||0,od=[0,1,2].map(i=>`<i class="${i<o?'on':''}"></i>`).join('');
      t.querySelector('.t-outs').innerHTML=brk?'':`<span class="od">${od}</span>${o} OUT`;
    }else if(fin){stEl.innerHTML=`Final${ls.currentInning&&ls.currentInning!==9?' · '+ordinal(ls.currentInning):''}`;cntEl.textContent='';foot.style.display='none';}
    else{const ds=st.detailedState||'';stEl.textContent=/Postponed|Delayed|Suspended/.test(ds)?ds:gameTime(g);cntEl.textContent='';foot.style.display='none';}}
  function ensureWall(games){const wall=document.getElementById('wall');const vis=games.filter(g=>!HIDDEN.has(g.gamePk));
    const want=vis.map(g=>g.gamePk).join(',');
    if(wall.dataset.want!==want){wall.dataset.want=want;
      wall.innerHTML=vis.length?vis.map(tileHTML).join(''):(games.length?'<div class="state">All games hidden.</div>':'<div class="state">No games today.</div>');
      wall.querySelectorAll('.tile').forEach(t=>{const pk=+t.dataset.pk;
        t.querySelector('.eye').onclick=e=>{e.stopPropagation();HIDDEN.add(pk);saveHidden();renderActive();buildPanel();};
        t.onclick=()=>goPBP(pk);});}
    vis.forEach(g=>{const t=wall.querySelector(`.tile[data-pk="${g.gamePk}"]`);if(t)paintTile(t,g);});
    const sig=vis.map(g=>g.gamePk+':'+((g.status||{}).abstractGameState||'')).join(',');if(sig!==lastFitSig){lastFitSig=sig;fit();}}

  function renderActive(){if(MODE==='all')ensureWall(GAMES);else paintSolo();}

  function buildPanel(){const list=document.getElementById('plist');
    list.innerHTML=GAMES.map(g=>{const a=g.teams.away.team,h=g.teams.home.team,hid=HIDDEN.has(g.gamePk);
      return `<div class="pgame ${hid?'hid':''}" data-pk="${g.gamePk}"><img src="${logo(a.id)}" onerror="this.style.visibility='hidden'"><span class="pn">${esc(abv(a))} @ ${esc(abv(h))}</span><span class="tg">${hid?'Hidden':'Shown'}</span></div>`;}).join('')||'<div class="state">No games.</div>';
    list.querySelectorAll('.pgame').forEach(el=>el.onclick=()=>{const pk=+el.dataset.pk;if(HIDDEN.has(pk))HIDDEN.delete(pk);else HIDDEN.add(pk);saveHidden();renderActive();buildPanel();});}
  function setMeta(state){const live=GAMES.filter(isLive).length;const m=document.getElementById('meta');
    if(state==='paused')m.innerHTML=`<span class="pause">Paused</span> · updates 10 AM–11:45 PM PT · ${esc(ptClock())} PT`;
    else m.innerHTML=`<span class="live"><span class="pdot"></span>Live</span> · ${live} in progress · ${esc(ptClock())} PT`;}
  function flatten(d){let g=[];((d&&d.dates)||[]).forEach(x=>(x.games||[]).forEach(y=>g.push(y)));
    return g.sort((a,b)=>{const o=s=>isLive(s)?0:isPrev(s)?1:2;return o(a)-o(b)||((a.gameDate||'').localeCompare(b.gameDate||''));});}

  async function tick(){if(!inWindow()){setMeta('paused');return;}if(busy)return;busy=true;
    const d=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${ptDate()}&hydrate=linescore,team`);busy=false;
    if(d){GAMES=flatten(d);renderActive();setMeta('live');if(panel.classList.contains('open'))buildPanel();}}
  async function enrich(){if(!inWindow())return;const live=GAMES.filter(isLive);if(!live.length)return;
    await Promise.all(live.map(g=>j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/boxscore`).then(b=>{if(b&&b.teams)BOX[g.gamePk]=b;})));
    if(MODE!=='all')paintSolo();}

  /* ===== controls ===== */
  const panel=document.getElementById('panel'),scrim=document.getElementById('scrim');
  document.getElementById('filterBtn').onclick=()=>{buildPanel();panel.classList.add('open');scrim.classList.add('open');};
  const closePanel=()=>{panel.classList.remove('open');scrim.classList.remove('open');};
  document.getElementById('panelX').onclick=closePanel;scrim.onclick=closePanel;
  document.getElementById('prev').onclick=()=>advance(-1);
  document.getElementById('next').onclick=()=>advance(1);
  function setMode(m){MODE=m;try{localStorage.setItem('dt-gh-mode',m);}catch(e){}
    document.body.setAttribute('data-mode',m);
    document.querySelectorAll('#vsw button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    stopRot();
    if(m==='all'){renderActive();fit();}else{paintSolo();if(m==='rotate')startRot();}}
  document.querySelectorAll('#vsw button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

  /* All-view sizing */
  const sizeRange=document.getElementById('sizeRange'),sizeVal=document.getElementById('sizeVal'),autofitTg=document.getElementById('autofitTg');
  let SIZE=parseFloat(localStorage.getItem('dt-gh-size'));if(!(SIZE>=0.8&&SIZE<=2.6))SIZE=1.2;
  let AUTOFIT=(localStorage.getItem('dt-gh-autofit')||'1')!=='0';
  const applySize=s=>{document.body.style.setProperty('--s',s);if(sizeVal)sizeVal.textContent=Math.round(s*100)+'%';if(sizeRange)sizeRange.value=Math.max(0.8,Math.min(2.6,s));};
  const persistSize=()=>{try{localStorage.setItem('dt-gh-size',SIZE);}catch(e){}};
  const saveAutofit=()=>{try{localStorage.setItem('dt-gh-autofit',AUTOFIT?'1':'0');}catch(e){}};
  const reflectAutofit=()=>{autofitTg.classList.toggle('on',AUTOFIT);sizeRange.disabled=AUTOFIT;};
  function fit(){if(!AUTOFIT||MODE!=='all')return;const wall=document.getElementById('wall');if(!wall||!wall.querySelector('.tile'))return;
    const avail=wall.clientHeight;if(avail<90)return;let lo=0.6,hi=3.2;
    for(let i=0;i<12;i++){const mid=(lo+hi)/2;document.body.style.setProperty('--s',mid);if(wall.scrollHeight<=avail)lo=mid;else hi=mid;}
    SIZE=Math.max(0.8,Math.min(2.6,lo));applySize(lo);}
  applySize(SIZE);reflectAutofit();
  sizeRange.oninput=()=>{AUTOFIT=false;reflectAutofit();SIZE=parseFloat(sizeRange.value);applySize(SIZE);};
  sizeRange.onchange=()=>{AUTOFIT=false;saveAutofit();reflectAutofit();persistSize();};
  autofitTg.onclick=()=>{AUTOFIT=!AUTOFIT;saveAutofit();reflectAutofit();if(AUTOFIT)fit();else{applySize(SIZE);persistSize();}};
  window.addEventListener('resize',()=>{if(AUTOFIT)fit();});

  (async function(){
    if(!['solo','rotate','all'].includes(MODE))MODE='rotate';
    document.body.setAttribute('data-mode',MODE);
    document.querySelectorAll('#vsw button').forEach(b=>b.classList.toggle('on',b.dataset.m===MODE));
    const tj=await j(`https://statsapi.mlb.com/api/v1/teams?sportId=1&season=${new Date().getFullYear()}`);
    ((tj&&tj.teams)||[]).forEach(t=>{if(t.sport&&t.sport.id===1)ABBR[t.id]=t.abbreviation;});
    const d=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${ptDate()}&hydrate=linescore,team`);
    if(d){GAMES=flatten(d);renderActive();}
    setMeta(inWindow()?'live':'paused');
    enrich();
    if(MODE==='rotate')startRot();
    setInterval(tick,1000); setInterval(enrich,6000);
  })();
</script>
</body>
</html>
