<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:row-reverse}

  /* ===== persistent side rail (right) ===== */
  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);
    border-left:1px solid var(--border,#1b1e24);padding:32px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:13px 15px;border-radius:11px;color:var(--text3,#aab0b9);
    text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab.soon{color:var(--muted,#5b626c);cursor:default}
  .tab.soon:hover{background:transparent;border-color:transparent;color:var(--muted,#5b626c)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .side-foot{margin-top:auto;padding-top:20px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}

  /* ===== main / standings ===== */
  .main{flex:1 1 auto;min-width:0;padding:40px 30px 70px}
  .page{max-width:1000px;margin:0 auto;width:100%}
  .page-head{margin-bottom:18px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,54px);letter-spacing:1px;line-height:1}
  .page-sub{margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:12px;color:var(--muted,#7e858f)}

  .vtabs{display:flex;gap:8px;margin-bottom:16px}
  .vtab{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:12px;
    color:#9098a2;background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);border-radius:10px;padding:9px 18px;cursor:pointer;transition:.15s}
  .vtab:hover{color:var(--text,#fff);border-color:#3b454f}
  .vtab.on{background:var(--text,#fff);color:var(--bg,#0b0c0e);border-color:var(--text,#fff)}

  .scroller{overflow-x:auto;border:1px solid var(--border,#1b1e24);border-radius:16px;background:var(--panel,#101115)}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  thead th{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:11px;
    color:var(--muted,#7e858f);text-align:right;padding:13px 12px;border-bottom:1px solid var(--border,#23262c);white-space:nowrap;background:var(--panel,#101115)}
  thead th.l{text-align:left}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--text2,#cfd4da)}
  thead th.active{color:var(--text,#fff)}
  th .arr{font-size:9px;margin-left:3px}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--panel2,#16181d);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody td.l{text-align:left}
  tbody tr:hover{background:var(--border,#15171c)}
  .rank{color:var(--muted,#565d67);width:30px;text-align:right;font-weight:600}
  .team{display:flex;align-items:center;gap:11px;min-width:180px}
  .team img{width:26px;height:26px;object-fit:contain;flex:0 0 auto}
  .team .nm{font-weight:500;color:var(--text,#fff)}
  .clinch{color:#46c77e;font-size:11px;font-weight:700;margin-left:5px}
  .wl{font-weight:600}
  .pct{color:var(--text2,#c7ccd3)}
  .gb{color:var(--text2,#aeb4bd)}
  .pos{color:#46c77e;font-weight:600}.neg{color:#e0556a;font-weight:600}.zero{color:#8a8f98}
  .stw{color:#46c77e}.stl{color:#e0556a}
  .divc{color:#8a8f98;font-size:12.5px;letter-spacing:.5px}
  .state{text-align:center;color:var(--muted,#7e858f);padding:50px 10px;letter-spacing:2px;text-transform:uppercase;font-size:13px}

  /* division / wild-card sections */
  .sec{margin-top:18px}
  .sec:first-child{margin-top:0}
  .sec-h{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;font-size:13px;
    color:var(--text,#fff);padding:0 4px 9px}
  .sec-h.wc{color:#ffd24a}
  .sec .scroller{border-radius:13px}
  tr.wc-cut td{border-bottom:2px solid #3a4350}
  tr.wc-out td .nm,tr.wc-out td.rank{opacity:.62}

  @media(max-width:760px){
    body{flex-direction:column}
    .side{position:static;height:auto;width:100%;border-left:0;border-bottom:1px solid var(--border,#1b1e24);padding:20px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:16px;gap:8px}
    .tab{padding:10px 14px}
    .side-foot{display:none}
    .main{padding:26px 16px 60px}
  }
  /* right-click stat glossary */
  .ghint{margin-top:7px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2,#4a5159)}
  .gloss{position:fixed;z-index:1000;width:330px;max-width:92vw;max-height:72vh;overflow:auto;background:var(--panel2,#15161b);
    border:1px solid var(--border2,#2f3540);border-radius:12px;padding:8px 0;box-shadow:0 18px 55px rgba(0,0,0,.65)}
  .gloss-h{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--muted,#7e858f);padding:5px 15px 9px;border-bottom:1px solid var(--border,#23262c)}
  .gloss-row{display:flex;gap:12px;padding:7px 15px}
  .gloss-row+.gloss-row{border-top:1px solid var(--border,#14161b)}
  .gl-k{flex:0 0 60px;font-weight:700;color:var(--text,#fff);font-size:13px;font-family:"Oswald",sans-serif}
  .gl-d{color:var(--text2,#aeb4bd);font-size:12.5px;line-height:1.36}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <div class="nav-label">Teams</div>
      <a class="tab" href="../clubs/"><span class="dot"></span>Clubs</a>
      <a class="tab active" href="../standings/"><span class="dot"></span>Standings</a>
      <a class="tab" href="../games/"><span class="dot"></span>Games</a>
      <a class="tab" href="../gamehub/"><span class="dot"></span>GameHub</a>
      <a class="tab" href="../probables/"><span class="dot"></span>Probables</a>
      <a class="tab" href="../postseason/"><span class="dot"></span>Postseason</a>
      <a class="tab" href="../team-offense/"><span class="dot"></span>Team Offense</a>
      <a class="tab" href="../team-defense/"><span class="dot"></span>Team Defense</a>
      <a class="tab" href="../team-pitching/"><span class="dot"></span>Team Pitching</a>
      <a class="tab" href="../starting-pitching/"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="../bullpen/"><span class="dot"></span>Bullpen</a>
      <a class="tab" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../awards/"><span class="dot"></span>Awards</a>
      <a class="tab" href="../injuries/"><span class="dot"></span>Injuries</a>
      <a class="tab" href="../transactions/"><span class="dot"></span>Transactions</a>
      <a class="tab" href="../spotlight/"><span class="dot"></span>Spotlight</a>
      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>
      <a class="tab" href="../leaders-relievers/"><span class="dot"></span>Relievers</a>
      <a class="tab" href="../leaders-defense/"><span class="dot"></span>Fielders</a>
    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-t">Standings</h1>
        <p class="page-sub" id="sub">Loading…</p>
      </div>
      <div class="vtabs">
        <button class="vtab" id="tabFlat">Overall</button>
        <button class="vtab on" id="tabDiv">Divisions</button>
      </div>
      <div id="content"><div class="scroller"><div class="state">Loading standings…</div></div></div>
    </div>
  </main>

<script>
  const DIV={200:'AL West',201:'AL East',202:'AL Central',203:'NL West',204:'NL East',205:'NL Central'};
  const DIV_ORDER=[201,202,200,204,205,203];
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let TEAMS=[], YEAR, mode='div', sortKey='pct', sortDir=-1;

  const pctv=t=>parseFloat(t.pct)||0;
  const l10w=t=>{const m=/^(\d+)/.exec(t.l10);return m?+m[1]:0;};
  const stkv=t=>{const m=/^([WL])(\d+)/.exec(t.streak);return m?(m[1]==='W'?1:-1)*(+m[2]):0;};
  const sorters={w:t=>t.w,pct:pctv,diff:t=>t.rd,l10:l10w,streak:stkv};
  const games=(a,b)=>((a.w-b.w)+(b.l-a.l))/2;

  async function fetchYear(y){
    const r=await fetch(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=${y}&standingsTypes=regularSeason`);
    if(!r.ok)return [];
    const j=await r.json();const out=[];
    (j.records||[]).forEach(g=>{
      const dId=g.division&&g.division.id, div=DIV[dId]||'';
      (g.teamRecords||[]).forEach(t=>{
        const l10=((t.records&&t.records.splitRecords)||[]).find(x=>x.type==='lastTen');
        out.push({id:t.team.id,name:t.team.name,w:+t.wins||0,l:+t.losses||0,
          pct:t.winningPercentage||'.000',rd:(t.runDifferential==null?0:+t.runDifferential),
          l10:l10?`${l10.wins}-${l10.losses}`:'—',streak:(t.streak&&t.streak.streakCode)||'—',
          divId:dId,div,league:(dId<=202?'AL':'NL'),divRank:+t.divisionRank||9,
          gb:t.gamesBack,clinch:(t.clinchIndicator||'').replace('-','')});
      });
    });
    return out;
  }

  function teamCell(t){
    return `<span class="team"><img src="${logo(t.id)}" onerror="this.style.visibility='hidden'"><span class="nm">${esc(t.name)}</span>${t.clinch?`<span class="clinch">${esc(t.clinch)}</span>`:''}</span>`;
  }
  function statCells(t){
    const rdc=t.rd>0?'pos':t.rd<0?'neg':'zero',rds=(t.rd>0?'+':'')+t.rd;
    const stc=/^W/.test(t.streak)?'stw':/^L/.test(t.streak)?'stl':'';
    return `<td class="${rdc}">${esc(rds)}</td><td>${esc(t.l10)}</td><td class="${stc}">${esc(t.streak)}</td>`;
  }
  const showpct=p=>String(p).replace(/^0/,'');

  function renderFlat(){
    const arr=k=>sortKey===k?`<span class="arr">${sortDir<0?'▼':'▲'}</span>`:'';
    const act=k=>sortKey===k?' active':'';
    const ts=[...TEAMS].sort((a,b)=>(sorters[sortKey](a)-sorters[sortKey](b))*sortDir||(pctv(b)-pctv(a)));
    const head=`<thead><tr>
      <th class="l rank">#</th>
      <th class="l">Team</th>
      <th class="sortable${act('w')}" data-k="w">Record${arr('w')}</th>
      <th class="sortable${act('pct')}" data-k="pct">Pct${arr('pct')}</th>
      <th class="sortable${act('diff')}" data-k="diff">Diff${arr('diff')}</th>
      <th class="sortable${act('l10')}" data-k="l10">L10${arr('l10')}</th>
      <th class="sortable${act('streak')}" data-k="streak">Streak${arr('streak')}</th>
      <th class="l sortable" data-mode="div">Division</th>
    </tr></thead>`;
    const body=ts.map((t,i)=>`<tr>
      <td class="rank">${i+1}</td>
      <td class="l">${teamCell(t)}</td>
      <td class="wl">${t.w}-${t.l}</td>
      <td class="pct">${esc(showpct(t.pct))}</td>
      ${statCells(t)}
      <td class="l divc">${esc(t.div)}</td>
    </tr>`).join('');
    return `<div class="scroller"><table>${head}<tbody>${body}</tbody></table></div>`;
  }

  function miniTable(teams,gbLabel,gbFn,markCut){
    const head=`<thead><tr><th class="l rank">#</th><th class="l">Team</th><th>Record</th><th>Pct</th><th>${gbLabel}</th><th>Diff</th><th>L10</th><th>Streak</th></tr></thead>`;
    const body=teams.map((t,i)=>{
      const cut=(markCut&&i===2)?' class="wc-cut"':'';
      const out=(markCut&&i>2)?' wc-out':'';
      return `<tr${cut?cut:(out?` class="${out.trim()}"`:'')}>
        <td class="rank">${i+1}</td>
        <td class="l">${teamCell(t)}</td>
        <td class="wl">${t.w}-${t.l}</td>
        <td class="pct">${esc(showpct(t.pct))}</td>
        <td class="gb">${gbFn(t,i)}</td>
        ${statCells(t)}
      </tr>`;
    }).join('');
    return `<div class="scroller"><table>${head}<tbody>${body}</tbody></table></div>`;
  }

  function renderDiv(){
    let html='';
    DIV_ORDER.forEach(d=>{
      const ts=TEAMS.filter(t=>t.divId===d).sort((a,b)=>a.divRank-b.divRank||pctv(b)-pctv(a));
      html+=`<div class="sec"><div class="sec-h">${esc(DIV[d])}</div>`+
        miniTable(ts,'GB',t=>{const g=t.gb;return (!g||g==='-'||g==='—')?'—':esc(g);},false)+`</div>`;
    });
    ['AL','NL'].forEach(lg=>{
      const divs=lg==='AL'?[201,202,200]:[204,205,203];
      const leader={};
      divs.forEach(d=>{const top=TEAMS.filter(t=>t.divId===d).sort((a,b)=>a.divRank-b.divRank||pctv(b)-pctv(a))[0];if(top)leader[top.id]=1;});
      const wc=TEAMS.filter(t=>t.league===lg&&!leader[t.id]).sort((a,b)=>pctv(b)-pctv(a)||(b.rd-a.rd));
      const cut=wc[2]||wc[wc.length-1];
      const gbFn=(t,i)=>{const lead=cut?games(t,cut):0;return lead>0?('+'+lead.toFixed(1)):lead<0?Math.abs(lead).toFixed(1):'—';};
      html+=`<div class="sec"><div class="sec-h wc">Wild Card · ${lg==='AL'?'American League':'National League'}</div>`+
        miniTable(wc,'WCGB',gbFn,true)+`</div>`;
    });
    return html;
  }

  function render(){
    document.getElementById('content').innerHTML = mode==='div'?renderDiv():renderFlat();
    document.getElementById('tabFlat').classList.toggle('on',mode==='flat');
    document.getElementById('tabDiv').classList.toggle('on',mode==='div');
    document.getElementById('sub').textContent = `${YEAR} Standings · ${mode==='div'?'divisions & wild card':'by '+({w:'record',pct:'win%',diff:'run diff',l10:'last 10',streak:'streak'}[sortKey])}`;
    document.querySelectorAll('thead th[data-k]').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k; if(k===sortKey)sortDir*=-1; else{sortKey=k;sortDir=-1;} render();
    });
    document.querySelectorAll('thead th[data-mode]').forEach(th=>th.onclick=()=>{mode='div';render();});
  }

  document.getElementById('tabFlat').onclick=()=>{mode='flat';render();};
  document.getElementById('tabDiv').onclick=()=>{mode='div';render();};

  const GLOSS_ROWS=[
    ['#','Rank (overall list is by win%)'],['Team','Club name & logo'],['Record','Wins–Losses'],
    ['Pct','Winning percentage'],['GB','Games behind the division leader'],
    ['WCGB','Games behind the last wild-card spot (+ = ahead of the cut line)'],
    ['Diff','Run differential (runs scored − runs allowed)'],['L10','Record over the last 10 games'],
    ['Streak','Current win (W) or loss (L) streak'],['Division','MLB division']
  ];
  function buildGloss(){return '<div class="gloss-h">Stat Glossary</div>'+GLOSS_ROWS.map(x=>`<div class="gloss-row"><span class="gl-k">${esc(x[0])}</span><span class="gl-d">${esc(x[1])}</span></div>`).join('');}
  let glossEl=null;
  function closeGloss(){if(glossEl){glossEl.remove();glossEl=null;}}
  function openGloss(x,y){closeGloss();glossEl=document.createElement('div');glossEl.className='gloss';glossEl.innerHTML=buildGloss();glossEl.addEventListener('mousedown',ev=>ev.stopPropagation());document.body.appendChild(glossEl);
    const w=glossEl.offsetWidth,h=glossEl.offsetHeight;glossEl.style.left=Math.max(8,Math.min(x,innerWidth-w-10))+'px';glossEl.style.top=Math.max(8,Math.min(y,innerHeight-h-10))+'px';}
  document.addEventListener('contextmenu',e=>{if(e.target.closest('.main')){e.preventDefault();openGloss(e.clientX,e.clientY);}});
  document.addEventListener('click',closeGloss);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGloss();});
  window.addEventListener('scroll',closeGloss);
  (function(){const ph=document.querySelector('.page-head');if(ph&&!ph.querySelector('.ghint')){const h=document.createElement('div');h.className='ghint';h.textContent='↳ right-click any stat for its definition';ph.appendChild(h);}})();

  (async function(){
    try{
      const now=new Date().getFullYear();let teams=[];YEAR=now;
      for(const y of [now,now-1,now-2]){teams=await fetchYear(y);if(teams.length){YEAR=y;break;}}
      if(!teams.length){document.getElementById('content').innerHTML='<div class="scroller"><div class="state">No standings available.</div></div>';return;}
      TEAMS=teams;render();
    }catch(e){
      document.getElementById('content').innerHTML='<div class="scroller"><div class="state">Couldn’t load standings.</div></div>';
    }
  })();
</script>
</body>
</html>
