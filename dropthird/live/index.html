<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:row-reverse}
  .side{position:sticky;top:0;align-self:flex-start;flex:0 0 248px;height:100vh;overflow-y:auto;background:var(--bg2,#0e0f13);border-left:1px solid var(--border,#1b1e24);padding:30px 18px;display:flex;flex-direction:column}
  .brand-link{text-decoration:none;color:inherit;display:block}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:27px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:var(--muted,#6b7280)}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:5px}
  .nav-label{width:100%;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted2,#474d56);padding:14px 15px 5px}
  .nav-label:first-child{padding-top:0}
  .tab{position:relative;display:flex;align-items:center;padding:11px 15px;border-radius:11px;color:var(--text3,#aab0b9);text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#262a32)}
  .tab.active{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540)}
  .tab.active .dot{background:var(--accent,#4aa3ff)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2a2f37);margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:var(--text,#fff)}
  .tab.live .dot{background:#e0556a}.tab.live.active .dot{background:#e0556a}
  .side-foot{margin-top:auto;padding-top:18px;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2,#3a4048);text-transform:uppercase}
  .main{flex:1 1 auto;min-width:0;padding:40px 30px 70px}
  .page{max-width:760px;margin:0 auto;width:100%}
  .page-head{margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(28px,5vw,48px);letter-spacing:1px;line-height:1}
  .livedot{width:10px;height:10px;border-radius:50%;background:#e0556a;box-shadow:0 0 0 0 rgba(224,85,106,.6);animation:pulse 1.5s infinite;display:none}
  .livedot.on{display:inline-block}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,85,106,.55)}70%{box-shadow:0 0 0 8px rgba(224,85,106,0)}100%{box-shadow:0 0 0 0 rgba(224,85,106,0)}}

  .sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .sb-t{display:flex;align-items:center;gap:11px;min-width:0}
  .sb-t.home{justify-content:flex-end;flex-direction:row-reverse}
  .sb-t img{width:40px;height:40px;object-fit:contain;flex:0 0 auto}
  .sb-t .ab{font-family:"Anton",sans-serif;font-size:21px;letter-spacing:.5px;line-height:1}
  .sb-t .rec{font-size:11px;color:var(--muted,#7e858f);margin-top:2px}
  .sb-c{text-align:center}
  .sb-c .sc{font-family:"Oswald",sans-serif;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sb-c .st{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#7e858f);margin-top:6px}
  .sb-c .st.liveT{color:#e0556a}

  .nowcard{background:linear-gradient(180deg,rgba(224,85,106,.08),transparent),var(--panel,#101115);border:1px solid #3a2630;border-radius:14px;padding:13px 16px;margin-bottom:16px}
  .now-h{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#e0556a;margin-bottom:7px}
  .now-b{font-family:"Oswald",sans-serif;font-weight:700;font-size:16px;margin-bottom:11px}
  .now-b .vs{color:var(--muted,#7e858f);font-weight:500;font-size:13px;margin:0 6px}
  .now-b .side{font-weight:600;font-size:11px;color:var(--muted,#7e858f);letter-spacing:1px}

  /* at-bat detail: numbered pitch list + strike zone + field */
  .abx{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .abx-list{flex:1 1 210px;min-width:180px}
  .abx-viz{display:flex;gap:14px;flex-wrap:wrap}
  .vz{display:flex;flex-direction:column;gap:5px}
  .vzh{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#7e858f)}
  .prow{display:grid;grid-template-columns:22px 1fr auto auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:13px}
  .prow:last-child{border-bottom:none}
  .pn{font-family:"Oswald";font-weight:700;color:var(--muted,#7e858f);text-align:center;font-variant-numeric:tabular-nums}
  .pty{color:var(--text2,#cfd4da);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pvel{font-variant-numeric:tabular-nums;color:#fff;font-weight:600;white-space:nowrap}
  .pres{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:5px;border:1px solid var(--border2,#2f3540);color:var(--text3,#aab0b9);white-space:nowrap}
  .pres.ball{color:#5aa9e6;border-color:#274a6b}
  .pres.strike{color:#e0707a;border-color:#5a2a30}
  .pres.foul{color:#e9a23f;border-color:#5a431e}
  .pres.inplay{color:#46c77e;border-color:#2f4a3a}
  .pl-empty{font-size:12px;color:var(--muted,#7e858f);padding:4px 0}

  .zone{width:116px;height:145px;display:block}
  .zone .zbox{fill:rgba(255,255,255,.03);stroke:var(--border2,#3a4048);stroke-width:1.4}
  .zone .zg{stroke:rgba(255,255,255,.09);stroke-width:.8}
  .zone .zd circle{fill:#9aa0a6;stroke:rgba(0,0,0,.55);stroke-width:1}
  .zone .zd.ball circle{fill:#5aa9e6}
  .zone .zd.strike circle{fill:#e0707a}
  .zone .zd.foul circle{fill:#e9a23f}
  .zone .zd.inplay circle{fill:#46c77e}
  .zone .zd text{fill:#0b0c0e;font-size:8px;font-weight:700;text-anchor:middle;font-family:"Oswald"}
  .field{width:150px;height:139px;display:block}
  .field .grass{fill:rgba(70,160,90,.10)}
  .field .foul{stroke:var(--border2,#3a4048);stroke-width:1.2;fill:none}
  .field .inf{fill:rgba(180,120,70,.16);stroke:var(--border2,#3a4048);stroke-width:1}
  .field .base{fill:#cfd4da}
  .field .hit{fill:#e9b949;stroke:#0b0c0e;stroke-width:1.5}
  .field .cap{fill:var(--muted,#7e858f);font-size:9px;font-family:"Oswald";font-weight:600}

  .inn-h{font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#7e858f);margin:22px 0 9px;display:flex;align-items:center;gap:9px}
  .inn-h::before{content:"";width:5px;height:15px;border-radius:3px;background:var(--accent,#4aa3ff)}
  .play{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:12px;padding:11px 14px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:11px;margin-bottom:7px;cursor:pointer;transition:border-color .15s}
  .play:hover{border-color:var(--border2,#2f3540)}
  .play.open{border-color:#2f3540;margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .play.score{border-color:#2f4a3a;background:linear-gradient(90deg,rgba(70,199,126,.07),transparent)}
  .play .ev{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3,#aab0b9);background:var(--panel2,#15161b);border:1px solid var(--border2,#2f3540);border-radius:6px;padding:4px 7px;min-width:78px;text-align:center;margin-top:1px}
  .play .ev.hit{color:#46c77e;border-color:#2f4a3a}
  .play .ev.hr{color:#e9b949;border-color:#5a4a1e}
  .play .ev.bb{color:#5aa9e6;border-color:#274a6b}
  .play .ev.k{color:#e0707a;border-color:#5a2a30}
  .play .pd{min-width:0;font-size:13.5px;color:var(--text2,#cfd4da);line-height:1.42}
  .play .psc{font-family:"Oswald",sans-serif;font-weight:700;font-size:14px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px;display:flex;align-items:center;gap:7px}
  .play .chev{color:var(--muted,#7e858f);font-size:17px;line-height:1;transition:transform .15s,color .15s}
  .play.open .chev{transform:rotate(90deg);color:#fff}
  .abdetail{background:var(--panel,#101115);border:1px solid #2f3540;border-top:1px dashed #2f3540;border-radius:0 0 11px 11px;margin:0 0 9px;padding:13px 14px}

  /* ===== Live status panel — premium, persistent, always at the bottom ===== */
  .main{padding-bottom:138px}
  .lsp{position:fixed;left:0;right:248px;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 30px 16px;pointer-events:none}
  .lsp.hide{display:none}
  .lsp-card{pointer-events:auto;width:100%;max-width:760px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 24px}
  .lsp-left{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;gap:9px}
  .bd{position:relative;width:58px;height:58px}
  .bd i{position:absolute;width:18px;height:18px;transform:rotate(45deg);border-radius:3px;background:#fff;transition:background .2s ease,box-shadow .2s ease}
  .bd .b2{top:0;left:50%;margin-left:-9px}
  .bd .b1{top:50%;right:0;margin-top:-9px}
  .bd .b3{top:50%;left:0;margin-top:-9px}
  .bd i.on{background:#FFD23F;box-shadow:0 0 11px rgba(255,210,63,.6)}
  .outs{display:flex;gap:9px;justify-content:center;margin-top:11px}
  .outs i{width:11px;height:11px;border-radius:50%;background:#c7cace;transition:background .2s ease,box-shadow .2s ease}
  .outs i.on{background:#e23b3b;box-shadow:0 0 8px rgba(226,59,59,.55)}
  .outs.flash i{background:#e23b3b;box-shadow:0 0 8px rgba(226,59,59,.55)}
  .lsp-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;column-gap:16px;row-gap:5px}
  .lsp-tm{display:flex;align-items:center;gap:6px}
  .lsp-tm .tl{width:20px;height:20px;object-fit:contain}
  .lsp-tm .ab{font-size:12px;font-weight:700;letter-spacing:1px;color:#9aa0a6}
  .lsp-mid .rn{font-family:"Oswald";font-weight:700;font-size:40px;line-height:.85;color:#fff;font-variant-numeric:tabular-nums;min-width:32px;text-align:center;transition:transform .2s ease;will-change:transform}
  .lsp-mid .rn.bump{transform:scale(1.12)}
  .lsp-inn{display:flex;flex-direction:column;align-items:center;line-height:1}
  .lsp-inn .ar{font-size:12px;line-height:1;color:var(--accent,#4aa3ff)}
  .lsp-inn .nm{font-family:"Oswald";font-weight:700;font-size:18px;line-height:1;color:var(--text2,#cfd4da);font-variant-numeric:tabular-nums}
  .lsp-right{text-align:right;min-width:118px;flex:0 0 auto}
  .lsp-right .ln{font-size:13.5px;font-weight:500;color:#cfd4da;letter-spacing:.2px;white-space:nowrap;transition:opacity .15s ease;line-height:1.5}
  .lsp-right .ln b{font-weight:700;color:#fff}
  .lsp-right .ct{font-family:"Oswald";font-weight:700;font-size:25px;margin-top:4px;color:#fff;font-variant-numeric:tabular-nums;transition:opacity .15s ease}

  /* toasts / event alerts */
  .toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:92vw}
  .toast{pointer-events:auto;background:#15161b;border:1px solid #2f3540;border-left:3px solid #e0556a;border-radius:12px;padding:9px 14px;font-size:13px;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.55);max-width:440px;animation:tin .25s ease;cursor:pointer}
  .toast b{font-weight:700;margin-right:7px}
  .toast .td{color:var(--text3,#aab0b9)}
  .toast.run{border-left-color:#46c77e}.toast.change{border-left-color:#5aa9e6}.toast.review{border-left-color:#e9b949}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  @media(max-width:760px){
    html,body{overflow-x:hidden;max-width:100%}
    body{flex-direction:column}
    .side{position:static;height:auto;width:100%;max-width:100%;border-left:0;border-bottom:1px solid var(--border,#1b1e24);padding:14px 12px}
    .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;margin-top:12px;gap:7px;-webkit-overflow-scrolling:touch}
    .nav-label{display:none}
    .tab{padding:9px 14px;flex:0 0 auto;white-space:nowrap}
    .side-foot{display:none}
    .main{width:100%;max-width:100vw;padding:28px 16px 150px;overflow-x:hidden}
    .lsp{right:0;padding:0 9px 10px}
    .lsp-card{padding:11px 13px;gap:10px;border-radius:22px}
    .lsp-left{padding:9px 11px}
    .lsp-mid{column-gap:12px}.lsp-mid .rn{font-size:32px}.lsp-tm .ab{font-size:11px}.lsp-tm .tl{width:18px;height:18px}.lsp-inn .nm{font-size:16px}.lsp-inn .ar{font-size:11px}
    .lsp-right{min-width:0}.lsp-right .ln{font-size:12px}.lsp-right .ct{font-size:22px}
    .bd{width:52px;height:52px}
  }
  .state{text-align:center;color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:13px;padding:54px 14px;line-height:1.7}
  .state a{color:var(--accent,#4aa3ff);text-decoration:none}

  /* collapse arrow for the side nav */
  .navtoggle{position:fixed;top:16px;right:250px;z-index:80;width:28px;height:30px;border-radius:8px;
    background:var(--panel2,#15161b);border:1px solid var(--border2,#2f3540);color:var(--text2,#cfd4da);cursor:pointer;
    font-family:"Oswald",sans-serif;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
    transition:right .2s ease,background .15s,color .15s}
  .navtoggle:hover{color:var(--text,#fff);border-color:var(--border2,#3a4048);background:var(--panel,#101115)}
  body.navhidden .side{display:none}
  body.navhidden .navtoggle{right:59px}
  body.navhidden .lsp{right:0}
  @media(max-width:760px){.navtoggle{display:none}}

  /* tabs (Plays / Summary / Box) + box-score & summary tables */
  .ltabs{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid var(--border,#1b1e24)}
  .ltab{padding:10px 16px;font-family:"Oswald",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#7e858f);cursor:pointer;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
  .ltab.on{color:var(--text,#fff);border-bottom-color:var(--accent,#4aa3ff)}
  .ltab:hover{color:var(--text2,#cfd4da)}
  .panel{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:13px;overflow:hidden;margin-top:18px}
  .panel-h{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--text,#fff);padding:12px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border,#1b1e24)}
  .panel-h img{width:22px;height:22px;object-fit:contain}
  .scroller{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
  th,td{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;border-top:1px solid var(--panel2,#16181d)}
  th{font-family:"Oswald",sans-serif;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted,#7e858f);border-top:0;border-bottom:1px solid var(--border2,#23262c)}
  td.l,th.l{text-align:left}
  .bn{display:flex;align-items:center;gap:4px}
  .bn .sp{color:var(--muted2,#565d67);font-weight:600;width:14px;display:inline-block;text-align:right}
  .bn .nm{color:var(--text,#fff);font-weight:500}
  .bn .po{color:var(--muted,#7e858f);font-size:11px;margin-left:3px}
  .bn.sub .nm{color:var(--text3,#aab0b9);font-weight:400}
  .bn.sub{padding-left:16px}
  td.h{color:#4aa3ff;font-weight:700}
  .dec{color:#ffd24a;font-weight:700;font-size:11px;margin-left:5px}
  tbody tr.tot td{border-top:1px solid var(--border2,#262a32);color:var(--text2,#cfd4da);font-weight:600}
  tbody tr.tot td.l{color:var(--muted,#7e858f);text-transform:uppercase;font-size:11px;letter-spacing:1px}
  .ls{margin-top:4px}
  .lstbl{min-width:0;width:100%}
  .lstbl th,.lstbl td{padding:7px 9px;text-align:center}
  .lstbl td.tm,.lstbl th.tm{text-align:left;font-weight:600;color:var(--text,#fff)}
  .lstbl td.rhe{font-weight:700;color:var(--text,#fff)}
  .lstbl th.rhe{color:var(--text2,#cfd4da)}
  .lstbl td{color:var(--text3,#aab0b9)}
  .secttl{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:18px;color:var(--text,#fff);margin:24px 0 11px}
  .secttl:first-child{margin-top:4px}
  .playrow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:11px;margin-bottom:7px}
  .playrow>img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
  .playrow .pd{flex:1;min-width:0;font-size:13.5px;color:var(--text2,#cfd4da);line-height:1.35}
  .playrow .psc{font-family:"Oswald",sans-serif;font-weight:700;font-size:15px;color:var(--text,#fff);font-variant-numeric:tabular-nums;white-space:nowrap}
  .inn{flex:0 0 auto;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);display:flex;align-items:center;justify-content:center;font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;color:var(--text2,#cfd4da);white-space:nowrap}
</style>
<script src="/settings.js"></script>
</head>

  <button id="navToggle" class="navtoggle" aria-label="Toggle menu" title="Hide menu">&rsaquo;</button>
  <aside class="side">
    <a class="brand-link" href="../homescreen/"><div class="brand">DROPTHIRD</div><div class="brand-sub">Statistics</div></a>
    <nav class="nav">
      <a class="tab live active" href="../live/"><span class="dot"></span>Live</a>
      <div class="nav-label">Teams</div>

      <a class="tab" href="../gamehub/"><span class="dot"></span>Games</a>

      <a class="tab" href="../team-trends/"><span class="dot"></span>Team Trends</a>
      <div class="nav-label">Players</div>
      <a class="tab" href="../hall-of-fame/"><span class="dot"></span>Hall of Fame</a>
      <a class="tab" href="../awards/"><span class="dot"></span>Awards</a>

      <a class="tab" href="../leaders-hitting/"><span class="dot"></span>Hitters</a>
      <a class="tab" href="../leaders-starters/"><span class="dot"></span>Starters</a>

    </nav>
    <div class="side-foot">2026 Season</div>
  </aside>

  <main class="main">
    <div class="page">
      <div class="page-head"><div class="page-t">Live</div><span class="livedot" id="livedot"></span></div>
      <div id="content"><div class="state">Loading…</div></div>
    </div>
  </main>

  <!-- persistent live status panel (updated in place, never re-created) -->
  <div class="lsp hide" id="lsp"><div class="lsp-card">
    <div class="lsp-left">
      <div class="bd"><i class="b2" id="lsp-b2"></i><i class="b3" id="lsp-b3"></i><i class="b1" id="lsp-b1"></i></div>
      <div class="outs" id="lsp-outs"><i id="lsp-o0"></i><i id="lsp-o1"></i><i id="lsp-o2"></i></div>
    </div>
    <div class="lsp-mid">
      <div class="lsp-tm"><img class="tl" id="lsp-aLogo" alt="" onerror="this.style.visibility='hidden'"><span class="ab" id="lsp-aAb">—</span></div>
      <span class="lsp-gap"></span>
      <div class="lsp-tm"><img class="tl" id="lsp-hLogo" alt="" onerror="this.style.visibility='hidden'"><span class="ab" id="lsp-hAb">—</span></div>
      <span class="rn" id="lsp-aR">0</span>
      <div class="lsp-inn" id="lsp-inn"><span class="ar" id="lsp-innAr">▲</span><span class="nm" id="lsp-innNm">1</span></div>
      <span class="rn" id="lsp-hR">0</span>
    </div>
    <div class="lsp-right">
      <div class="ln" id="lsp-pit">—</div>
      <div class="ln" id="lsp-bat">—</div>
      <div class="ct" id="lsp-ct">0-0</div>
    </div>
  </div></div>
  <div class="toasts" id="toasts"></div>

<script>
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const abv=t=>(t&&t.abbreviation)||String((t&&t.name)||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
  const lastName=n=>{n=String(n||'').trim();const p=n.split(/\s+/);let x=p[p.length-1]||'—';if(p.length>1&&/^(jr|sr|ii|iii|iv|v)\.?$/i.test(x))x=p[p.length-2];return x;};
  const el=id=>document.getElementById(id);
  const TEAMS={108:'Angels',109:'D-backs',110:'Orioles',111:'Red Sox',112:'Cubs',113:'Reds',114:'Guardians',115:'Rockies',116:'Tigers',117:'Astros',118:'Royals',119:'Dodgers',120:'Nationals',121:'Mets',133:'Athletics',134:'Pirates',135:'Padres',136:'Mariners',137:'Giants',138:'Cardinals',139:'Rays',140:'Rangers',141:'Blue Jays',142:'Twins',143:'Phillies',144:'Braves',145:'White Sox',146:'Marlins',147:'Yankees',158:'Brewers'};
  const ptToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const shiftDate=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
  const gameTime=g=>{try{return new Date(g.gameDate).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'})+' PT';}catch(e){return '';}};
  const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');

  const content=el('content'), livedot=el('livedot');
  const FAV=new URLSearchParams(location.search).get('team')||(window.getSettings&&window.getSettings().favTeam)||(localStorage.getItem('dt-fav-team')||'');
  let PK=null, GAME=null, timer=null, tok=0, baseTitle='';
  let ALLPLAYS=[];                              // latest plays (for expand-on-click)
  let LS=null, BOX=null, PBP=null;              // latest linescore / boxscore / play-by-play (for the Box & Summary tabs)
  let liveTab='plays';                          // active tab: plays | summary | box
  const expanded=new Set();                     // atBatIndex set the user has opened
  const seen=new Set(); let seeded=false;       // notified-event ids
  let prevP={};                                 // previous panel state (for animations)
  let sbSig='', nowSig='', feedSig='', tabSig='';// section render signatures
  let urls={};
  const showp=p=>(p==null||p==='')?'–':String(p).replace(/^0(?=\.)/,'');

  async function findGame(){
    const t=ptToday();
    const sch=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${FAV}&startDate=${shiftDate(t,-1)}&endDate=${shiftDate(t,2)}&hydrate=team,linescore`);
    const games=[];((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(g=>games.push(g)));
    if(!games.length)return null;
    const live=games.find(g=>g.status&&g.status.abstractGameState==='Live'); if(live)return live;
    const today=games.find(g=>g.officialDate===t); if(today)return today;
    const now=Date.now();
    const past=games.filter(g=>new Date(g.gameDate)<=now).sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate));
    if(past[0])return past[0];
    return games.sort((a,b)=>new Date(a.gameDate)-new Date(b.gameDate))[0];
  }
  function setURLs(){urls={
    pbp:`https://statsapi.mlb.com/api/v1/game/${PK}/playByPlay`,
    ls:`https://statsapi.mlb.com/api/v1/game/${PK}/linescore`,
    sch:`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${PK}&hydrate=team,linescore`,
    box:`https://statsapi.mlb.com/api/v1/game/${PK}/boxscore`
  };}

  function statusOf(g,ls){const a=g.status&&g.status.abstractGameState;
    if(a==='Live'){const st=(ls&&ls.inningState)||'', inn=(ls&&ls.currentInningOrdinal)||'';return {live:true,t:`${st} ${inn} · ${(ls&&ls.outs)||0} out`};}
    if(a==='Final')return {live:false,t:'Final'};
    return {live:false,t:gameTime(g)};}

  function scoreboard(g,ls,st){
    const a=g.teams.away,h=g.teams.home;
    return `<div class="sb">
      <div class="sb-t"><img src="${logo(a.team.id)}" onerror="this.style.visibility='hidden'"><div><div class="ab">${esc(abv(a.team))}</div><div class="rec">${esc(TEAMS[a.team.id]||a.team.name)}</div></div></div>
      <div class="sb-c"><div class="sc">${a.score==null?'':a.score} <span style="color:var(--muted2,#4a5159)">–</span> ${h.score==null?'':h.score}</div><div class="st ${st.live?'liveT':''}">${st.live?'● ':''}${esc(st.t)}</div></div>
      <div class="sb-t home"><img src="${logo(h.team.id)}" onerror="this.style.visibility='hidden'"><div><div class="ab">${esc(abv(h.team))}</div><div class="rec">${esc(TEAMS[h.team.id]||h.team.name)}</div></div></div>
    </div>`;
  }

  /* ---- pitch list / strike zone / field for one at-bat ---- */
  function callClass(d){d=d||{};
    if(d.isInPlay)return 'inplay';
    if(d.isBall)return 'ball';
    const c=(d.call&&d.call.code)||'';
    if(c==='F'||/foul/i.test(d.description||''))return 'foul';
    if(d.isStrike)return 'strike';
    return '';}
  function pitchRows(play){
    const ps=(play.playEvents||[]).filter(e=>e.isPitch);
    if(!ps.length)return '<div class="pl-empty">No pitches in this play.</div>';
    return ps.slice().sort((a,b)=>(b.pitchNumber||0)-(a.pitchNumber||0)).map(e=>{
      const d=e.details||{}, ty=(d.type&&(d.type.description||d.type.code))||'Pitch';
      const sp=e.pitchData&&e.pitchData.startSpeed?Math.round(e.pitchData.startSpeed)+' mph':'';
      const res=d.description||(d.call&&d.call.description)||'';
      return `<div class="prow"><span class="pn">${e.pitchNumber||''}</span><span class="pty">${esc(ty)}</span><span class="pvel">${esc(sp)}</span><span class="pres ${callClass(d)}">${esc(res)}</span></div>`;
    }).join('');
  }
  function zoneSVG(play){
    const ps=(play.playEvents||[]).filter(e=>e.isPitch&&e.pitchData&&e.pitchData.coordinates&&e.pitchData.coordinates.pX!=null);
    if(!ps.length)return '';
    let tops=[],bots=[];ps.forEach(e=>{const p=e.pitchData;if(p.strikeZoneTop)tops.push(p.strikeZoneTop);if(p.strikeZoneBottom)bots.push(p.strikeZoneBottom);});
    const avg=a=>a.length?a.reduce((s,c)=>s+c,0)/a.length:0;
    const topFt=avg(tops)||3.4, botFt=avg(bots)||1.55, cx=58, SX=40, pad=1.25;
    const SY=125/((topFt-botFt)+2*pad), yTop=10, yOf=z=>yTop+((topFt+pad)-z)*SY;
    const zTopY=yOf(topFt), zBotY=yOf(botFt), zL=cx-28, w=56, h=zBotY-zTopY;
    const cX=x=>Math.max(7,Math.min(109,x)), cY=y=>Math.max(7,Math.min(138,y));
    const dots=ps.map(e=>{const c=e.pitchData.coordinates, x=cX(cx+c.pX*SX), y=cY(yOf(c.pZ));
      return `<g class="zd ${callClass(e.details)}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/><text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}">${e.pitchNumber||''}</text></g>`;}).join('');
    return `<svg class="zone" viewBox="0 0 116 145" aria-label="strike zone">
      <rect class="zbox" x="${zL}" y="${zTopY.toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="2"/>
      <line class="zg" x1="${zL+w/3}" y1="${zTopY.toFixed(1)}" x2="${zL+w/3}" y2="${zBotY.toFixed(1)}"/>
      <line class="zg" x1="${zL+2*w/3}" y1="${zTopY.toFixed(1)}" x2="${zL+2*w/3}" y2="${zBotY.toFixed(1)}"/>
      <line class="zg" x1="${zL}" y1="${(zTopY+h/3).toFixed(1)}" x2="${zL+w}" y2="${(zTopY+h/3).toFixed(1)}"/>
      <line class="zg" x1="${zL}" y1="${(zTopY+2*h/3).toFixed(1)}" x2="${zL+w}" y2="${(zTopY+2*h/3).toFixed(1)}"/>
      ${dots}</svg>`;
  }
  function fieldSVG(play){
    let hit=null;for(const e of (play.playEvents||[]))if(e.hitData&&e.hitData.coordinates&&e.hitData.coordinates.coordX!=null)hit=e.hitData;
    if(!hit)return '';
    const c=hit.coordinates, fx=100+(c.coordX-125.4)*0.62, fy=150+(c.coordY-203.5)*0.62;
    const x=Math.max(8,Math.min(192,fx)), y=Math.max(8,Math.min(170,fy));
    const cap=[hit.totalDistance?hit.totalDistance+' ft':'', hit.launchSpeed?Math.round(hit.launchSpeed)+' mph':''].filter(Boolean).join('  ·  ');
    return `<svg class="field" viewBox="0 0 200 185" aria-label="hit location">
      <path class="grass" d="M100 150 L30 64 A 99 99 0 0 1 170 64 Z"/>
      <line class="foul" x1="100" y1="150" x2="28" y2="62"/>
      <line class="foul" x1="100" y1="150" x2="172" y2="62"/>
      <polygon class="inf" points="100,150 133,117 100,84 67,117"/>
      <circle class="base" cx="133" cy="117" r="3"/><circle class="base" cx="100" cy="84" r="3"/><circle class="base" cx="67" cy="117" r="3"/>
      <circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5"/>
      ${cap?`<text class="cap" x="100" y="182" text-anchor="middle">${esc(cap)}</text>`:''}
    </svg>`;
  }
  function atBatDetail(play){
    const z=zoneSVG(play), f=fieldSVG(play);
    const viz=[z?`<div class="vz"><div class="vzh">Strike Zone</div>${z}</div>`:'', f?`<div class="vz"><div class="vzh">Field</div>${f}</div>`:''].join('');
    return `<div class="abx"><div class="abx-list">${pitchRows(play)}</div>${viz?`<div class="abx-viz">${viz}</div>`:''}</div>`;
  }

  function nowCard(cur){
    if(!cur||!cur.matchup)return '';
    const m=cur.matchup, b=m.batter&&m.batter.fullName, p=m.pitcher&&m.pitcher.fullName;
    const code=m.batSide&&m.batSide.code, side=code==='S'?'Switch':(code?code+'HB':'');
    return `<div class="nowcard"><div class="now-h">● At Bat</div>
      <div class="now-b">${esc(b||'—')}${side?` <span class="side">${esc(side)}</span>`:''}<span class="vs">vs</span>${esc(p||'—')}</div>
      ${atBatDetail(cur)}</div>`;
  }

  function evClass(ev){const e=(ev||'').toLowerCase();
    if(/home run/.test(e))return 'hr';
    if(/single|double|triple/.test(e))return 'hit';
    if(/walk|hit by pitch|intent/.test(e))return 'bb';
    if(/strikeout|strikes out/.test(e))return 'k';
    return 'out';}

  function feedHTML(g,done,live){
    if(!done.length)return '<div class="state">No plays yet.</div>';
    const bt=p=>p.about.halfInning==='top'?g.teams.away:g.teams.home;
    const groups=[];let cur=null;
    done.forEach(p=>{const k=p.about.halfInning+p.about.inning;if(!cur||cur.k!==k){cur={k,inn:p.about.inning,half:p.about.halfInning,team:bt(p),plays:[]};groups.push(cur);}cur.plays.push(p);});
    const order=live?groups.slice().reverse():groups;
    return order.map(grp=>{
      const plays=live?grp.plays.slice().reverse():grp.plays;
      const rows=plays.map(p=>{const ev=p.result.event||'Play';
        return `<div class="play${p.about.isScoringPlay?' score':''}" data-ab="${p.about.atBatIndex}"><span class="ev ${evClass(ev)}">${esc(ev)}</span><span class="pd">${esc(p.result.description)}</span><span class="psc">${p.result.awayScore}–${p.result.homeScore}<span class="chev">›</span></span></div>`;}).join('');
      return `<div class="inn-h">${grp.half==='top'?'Top':'Bottom'} ${ord(grp.inn)} · ${esc(TEAMS[grp.team.team.id]||grp.team.team.name)} batting</div>${rows}`;
    }).join('');
  }

  /* expand / collapse a past at-bat */
  function insertDetail(ab){
    const feed=el('feed');if(!feed)return;
    const row=feed.querySelector(`.play[data-ab="${ab}"]`);if(!row)return;
    if(feed.querySelector(`.abdetail[data-ab="${ab}"]`))return;
    const play=ALLPLAYS.find(p=>p.about.atBatIndex===ab);if(!play)return;
    const d=document.createElement('div');d.className='abdetail';d.dataset.ab=ab;
    try{d.innerHTML=atBatDetail(play);}catch(err){d.innerHTML='<div class="pl-empty">Pitch detail unavailable for this at-bat.</div>';}
    row.after(d);row.classList.add('open');
  }
  function removeDetail(ab){const feed=el('feed');if(!feed)return;
    const d=feed.querySelector(`.abdetail[data-ab="${ab}"]`);if(d)d.remove();
    const row=feed.querySelector(`.play[data-ab="${ab}"]`);if(row)row.classList.remove('open');}
  function toggleAb(ab){if(expanded.has(ab)){expanded.delete(ab);removeDetail(ab);}else{expanded.add(ab);insertDetail(ab);}}
  function applyExpanded(){expanded.forEach(ab=>insertDetail(ab));}
  content.addEventListener('click',e=>{
    const tab=e.target.closest('.ltab'); if(tab){setLiveTab(tab.dataset.t);return;}
    const row=e.target.closest('.play[data-ab]'); if(row)toggleAb(+row.dataset.ab);
  });

  /* ---- Box Score & Summary tabs (same look as the Games tab) ---- */
  function lineScore(ls,away,home){
    const inns=(ls&&ls.innings)||[]; const n=Math.max(9,inns.length);
    let head='<th class="tm l">&nbsp;</th>';for(let i=1;i<=n;i++)head+=`<th>${i}</th>`;head+='<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th>';
    const row=(side,nm)=>{let r=`<td class="tm">${esc(nm)}</td>`;
      for(let i=1;i<=n;i++){const inn=inns[i-1];const v=inn&&inn[side]&&inn[side].runs;r+=`<td>${(v==null)?'·':v}</td>`;}
      const t=(ls.teams&&ls.teams[side])||{};r+=`<td class="rhe">${t.runs==null?'·':t.runs}</td><td class="rhe">${t.hits==null?'·':t.hits}</td><td class="rhe">${t.errors==null?'·':t.errors}</td>`;
      return `<tr>${r}</tr>`;};
    return `<div class="panel ls"><div class="scroller"><table class="lstbl"><thead><tr>${head}</tr></thead><tbody>${row('away',away.team.name)}${row('home',home.team.name)}</tbody></table></div></div>`;
  }
  function battingTable(side){
    const players=side.players||{};
    const bats=Object.values(players).filter(p=>p.stats&&p.stats.batting&&Object.keys(p.stats.batting).length&&p.battingOrder).sort((a,b)=>(+a.battingOrder)-(+b.battingOrder));
    const head=`<tr><th class="l">Batters</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>AVG</th></tr>`;
    const body=bats.map(p=>{const s=p.stats.batting, o=+p.battingOrder, starter=o%100===0, spot=Math.floor(o/100);
      const avg=p.seasonStats&&p.seasonStats.batting&&p.seasonStats.batting.avg;
      return `<tr><td class="l"><span class="bn ${starter?'':'sub'}"><span class="sp">${starter?spot:''}</span><span class="nm">${esc(p.person.fullName)}</span><span class="po">${esc(p.position&&p.position.abbreviation)}</span></span></td>
        <td>${s.atBats}</td><td>${s.runs}</td><td class="h">${s.hits}</td><td>${s.rbi}</td><td>${s.baseOnBalls}</td><td>${s.strikeOuts}</td><td>${showp(avg)}</td></tr>`;}).join('');
    const t=side.teamStats&&side.teamStats.batting||{};
    const tot=`<tr class="tot"><td class="l">Totals</td><td>${t.atBats}</td><td>${t.runs}</td><td class="h">${t.hits}</td><td>${t.rbi}</td><td>${t.baseOnBalls}</td><td>${t.strikeOuts}</td><td>${showp(t.avg)}</td></tr>`;
    return `<div class="panel"><div class="panel-h"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">${esc(side.team.name)} — Batting</div><div class="scroller"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div></div>`;
  }
  function pitchingTable(side){
    const players=side.players||{};
    const ps=(side.pitchers||[]).map(id=>players['ID'+id]).filter(p=>p&&p.stats&&p.stats.pitching);
    const head=`<tr><th class="l">Pitchers</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>SO</th><th>HR</th><th>P</th><th>ERA</th></tr>`;
    const body=ps.map(p=>{const s=p.stats.pitching;
      let dec='';if(s.wins)dec='W';else if(s.losses)dec='L';else if(s.saves)dec='SV';else if(s.holds)dec='H';else if(s.blownSaves)dec='BS';
      const era=p.seasonStats&&p.seasonStats.pitching&&p.seasonStats.pitching.era;
      return `<tr><td class="l"><span class="bn"><span class="nm">${esc(p.person.fullName)}</span>${dec?`<span class="dec">${dec}</span>`:''}</span></td>
        <td>${s.inningsPitched}</td><td>${s.hits}</td><td>${s.runs}</td><td>${s.earnedRuns}</td><td>${s.baseOnBalls}</td><td>${s.strikeOuts}</td><td>${s.homeRuns}</td><td>${s.numberOfPitches==null?'–':s.numberOfPitches}</td><td>${showp(era)}</td></tr>`;}).join('');
    const t=side.teamStats&&side.teamStats.pitching||{};
    const tot=`<tr class="tot"><td class="l">Totals</td><td>${t.inningsPitched}</td><td>${t.hits}</td><td>${t.runs}</td><td>${t.earnedRuns}</td><td>${t.baseOnBalls}</td><td>${t.strikeOuts}</td><td>${t.homeRuns}</td><td></td><td></td></tr>`;
    return `<div class="panel"><div class="panel-h"><img src="${logo(side.team.id)}" onerror="this.style.visibility='hidden'">${esc(side.team.name)} — Pitching</div><div class="scroller"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div></div>`;
  }
  function boxTab(){
    if(!BOX||!BOX.teams)return '<div class="state">Box score not available yet.</div>';
    const a=BOX.teams.away, h=BOX.teams.home;
    return lineScore(LS||{},a,h)+battingTable(a)+battingTable(h)+pitchingTable(a)+pitchingTable(h);
  }
  function summaryTab(){
    const all=(PBP&&PBP.allPlays)||[], sp=(PBP&&PBP.scoringPlays)||[];
    let html='';
    if(sp.length){html+='<div class="secttl">Scoring Plays</div>';
      sp.forEach(idx=>{const p=all[idx];if(!p)return;const bt=p.about.halfInning==='top'?GAME.teams.away:GAME.teams.home;
        html+=`<div class="playrow"><span class="inn">${p.about.halfInning==='top'?'▲':'▼'}${p.about.inning}</span><img src="${logo(bt.team.id)}" onerror="this.style.visibility='hidden'"><span class="pd">${esc(p.result.description||'')}</span><span class="psc">${p.result.awayScore}-${p.result.homeScore}</span></div>`;});}
    return html||'<div class="state">No scoring plays yet.</div>';
  }
  function setLiveTab(name){
    liveTab=name; tabSig='';
    document.querySelectorAll('.ltab').forEach(b=>b.classList.toggle('on',b.dataset.t===name));
    const plays=el('plays'), extra=el('tabextra');
    if(plays)plays.style.display=name==='plays'?'':'none';
    if(extra)extra.style.display=name==='plays'?'none':'';
    renderTab();
  }
  function renderTab(){
    if(liveTab==='plays')return;
    const extra=el('tabextra'); if(!extra)return;
    const sig=liveTab+'|'+(ALLPLAYS.length)+'|'+(GAME&&GAME.teams.away.score)+'-'+(GAME&&GAME.teams.home.score);
    if(sig===tabSig)return; tabSig=sig;
    extra.innerHTML=liveTab==='box'?boxTab():summaryTab();
  }

  /* ---- live status panel: in-place updates with animations ---- */
  function setOn(id,on){el(id).classList.toggle('on',!!on);}
  function bump(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}
  function flashOuts(){const o=el('lsp-outs');o.classList.add('flash');setTimeout(()=>o.classList.remove('flash'),650);}
  function fade(e,html,prev,plain){
    if(prev===undefined){plain?e.textContent=html:e.innerHTML=html;return;}
    if(html===prev)return;
    e.style.opacity=0;setTimeout(()=>{plain?e.textContent=html:e.innerHTML=html;e.style.opacity=1;},150);
  }
  function boxStats(box){const m={};if(!box)return m;['away','home'].forEach(s=>{const pl=(box.teams&&box.teams[s]&&box.teams[s].players)||{};Object.values(pl).forEach(p=>{if(p.person)m[p.person.id]=p.stats||{};});});return m;}
  function buildPanelState(g,ls,cur,box,st){
    const a=g.teams.away,h=g.teams.home,map=boxStats(box),lt=(ls&&ls.teams)||{};
    const awayR=(lt.away&&lt.away.runs!=null)?lt.away.runs:(a.score||0);
    const homeR=(lt.home&&lt.home.runs!=null)?lt.home.runs:(h.score||0);
    const live=!!(st&&st.live);
    const head={awayAb:abv(a.team),homeAb:abv(h.team),awayR,homeR,live,awayId:a.team.id,homeId:h.team.id};
    if(!live)return Object.assign(head,{first:false,second:false,third:false,outs:0,inningKey:'',
      pitLine:'',batLine:'',count:String((st&&st.t)||'').toUpperCase()});
    const m=(cur&&cur.matchup)||{};
    const pit=m.pitcher||(ls&&ls.defense&&ls.defense.pitcher);
    const bat=m.batter||(ls&&ls.offense&&ls.offense.batter);
    const pid=pit&&pit.id, bid=bat&&bat.id;
    let pc=null;if(pid&&map[pid]&&map[pid].pitching){const pp=map[pid].pitching;pc=pp.pitchesThrown!=null?pp.pitchesThrown:pp.numberOfPitches;}
    const pitLine=`<b>${esc(lastName(pit&&pit.fullName))}:</b>${pc!=null?' '+pc:''}`;
    const bb=bid&&map[bid]&&map[bid].batting;
    const bl=(bb&&bb.atBats!=null)?`${bb.hits||0}-${bb.atBats}`:'0-0';
    const batLine=`<b>${esc(lastName(bat&&bat.fullName))}:</b> ${bl}`;
    const o=(ls&&ls.offense)||{};
    return Object.assign(head,{
      first:!!o.first,second:!!o.second,third:!!o.third,outs:(ls&&ls.outs)||0,
      inn:(ls&&ls.currentInning)||null,top:!!(ls&&ls.isTopInning),
      inningKey:(ls?((ls.isTopInning?'T':'B')+ls.currentInning):''),
      pitLine,batLine,count:`${(ls&&ls.balls)||0}-${(ls&&ls.strikes)||0}`});
  }
  function paintPanel(s){
    el('lsp').classList.remove('hide');
    setOn('lsp-b1',s.first);setOn('lsp-b2',s.second);setOn('lsp-b3',s.third);
    for(let i=0;i<3;i++)setOn('lsp-o'+i,i<s.outs);
    if(prevP.inningKey&&s.inningKey&&s.inningKey!==prevP.inningKey)flashOuts();
    const aR=el('lsp-aR'),hR=el('lsp-hR');
    if(prevP.awayR!=null&&s.awayR!==prevP.awayR)bump(aR);
    if(prevP.homeR!=null&&s.homeR!==prevP.homeR)bump(hR);
    aR.textContent=s.awayR;hR.textContent=s.homeR;
    el('lsp-aAb').textContent=s.awayAb;el('lsp-hAb').textContent=s.homeAb;
    if(prevP.awayId!==s.awayId)el('lsp-aLogo').src=logo(s.awayId);
    if(prevP.homeId!==s.homeId)el('lsp-hLogo').src=logo(s.homeId);
    const innEl=el('lsp-inn');
    if(s.live&&s.inn){innEl.style.display='';el('lsp-innAr').textContent=s.top?'▲':'▼';el('lsp-innNm').textContent=s.inn;}
    else innEl.style.display='none';
    const pit=el('lsp-pit'),bat=el('lsp-bat');
    pit.style.display=s.live?'':'none';bat.style.display=s.live?'':'none';
    el('lsp-ct').style.fontSize=s.live?'':'17px';
    if(s.live){fade(pit,s.pitLine,prevP.pitLine);fade(bat,s.batLine,prevP.batLine);fade(el('lsp-ct'),s.count,prevP.count,true);}
    else{el('lsp-ct').textContent=s.count;}
    prevP=s;
  }

  /* ---- event notifications (so you know what's happening) ---- */
  function collectEvents(plays){
    const out=[];
    for(const p of plays){const ab=p.about.atBatIndex;
      for(const e of (p.playEvents||[])){
        if(e.type==='action'){const name=(e.details||{}).event||'';
          if(/Game Advisory|Batter Timeout|Status Change/i.test(name))continue;
          out.push({id:`a${ab}.${e.index}`,kind:'action',name,desc:(e.details||{}).description||name});
        }
        if(e.isPitch&&e.details&&e.details.hasReview)out.push({id:`r${ab}.${e.index}`,kind:'review',name:'Review',desc:'Umpire review / challenge'});
      }
      if(p.about.isComplete&&p.about.isScoringPlay)out.push({id:`s${ab}`,kind:'score',name:'Run',desc:p.result.description});
    }
    return out;
  }
  function toast(title,desc,kind){
    const d=document.createElement('div');d.className='toast '+(kind||'');
    d.innerHTML=`<b>${esc(title)}</b><span class="td">${esc(desc||'')}</span>`;
    d.onclick=()=>d.remove();el('toasts').appendChild(d);
    setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity=0;setTimeout(()=>d.remove(),400);},9000);
  }
  function notify(ev){
    let title=ev.name,kind='';
    if(ev.kind==='score'){title='Run Scores';kind='run';}
    else if(ev.kind==='review'){title='Challenge / Review';kind='review';}
    else{const n=ev.name;
      if(/Stolen Base/i.test(n)){title='Stolen Base';kind='run';}
      else if(/Pitching Sub/i.test(n)){title='Pitching Change';kind='change';}
      else if(/Offensive Sub/i.test(n)){title='Pinch Hitter / Sub';kind='change';}
      else if(/Defensive/i.test(n)){title='Defensive Change';kind='change';}
      else if(/Mound Visit/i.test(n))title='Mound Visit';
      else if(/Wild Pitch/i.test(n))title='Wild Pitch';
      else if(/Passed Ball/i.test(n))title='Passed Ball';
      else if(/Pickoff/i.test(n))title='Pickoff';
      else if(/Caught Stealing/i.test(n))title='Caught Stealing';
      else if(/Error/i.test(n))title='Error';
      else if(/Disengagement/i.test(n)){title='Disengagement';kind='change';}
    }
    toast(title,ev.desc,kind);
    if('Notification'in window&&Notification.permission==='granted'&&document.hidden){try{new Notification('DROPTHIRD — '+title,{body:ev.desc||''});}catch(_){}}
    if(document.hidden)document.title='● '+baseTitle;
  }
  function handleEvents(all){
    const events=collectEvents(all);
    if(!seeded){events.forEach(e=>seen.add(e.id));seeded=true;return;}
    for(const e of events)if(!seen.has(e.id)){seen.add(e.id);notify(e);}
  }

  /* ---- section renderers (only redraw when their data changes) ---- */
  function renderSb(g,ls,st){
    const sig=[g.teams.away.score,g.teams.home.score,st.t,st.live].join('|');
    if(sig===sbSig)return;sbSig=sig;el('sb').innerHTML=scoreboard(g,ls,st);
  }
  function renderNow(cur){
    if(!cur||!cur.matchup){if(nowSig!==''){nowSig='';el('now').innerHTML='';}return;}
    const ps=(cur.playEvents||[]).filter(e=>e.isPitch),last=ps[ps.length-1];
    const sig=[cur.about.atBatIndex,ps.length,(last&&last.details&&last.details.description)||''].join('|');
    if(sig===nowSig)return;nowSig=sig;el('now').innerHTML=nowCard(cur);
  }
  function renderFeed(g,all,live){
    const done=all.filter(p=>p.result&&p.result.description),last=done[done.length-1];
    const sig=[done.length,last?last.about.atBatIndex+last.result.description+last.result.awayScore+'-'+last.result.homeScore:'',live].join('|');
    if(sig===feedSig)return;feedSig=sig;
    const y=window.scrollY;
    el('feed').innerHTML=feedHTML(g,done,live);
    applyExpanded();
    window.scrollTo(0,y);
  }

  function ensureScaffold(){
    if(el('feed'))return;
    content.innerHTML='<div id="sb"></div>'+
      '<div class="ltabs" id="ltabs"><button class="ltab on" data-t="plays">Plays</button><button class="ltab" data-t="summary">Summary</button><button class="ltab" data-t="box">Box Score</button></div>'+
      '<div id="plays"><div id="now"></div><div id="feed"><div class="state">Loading…</div></div></div>'+
      '<div id="tabextra" style="display:none"></div>';
  }

  async function load(){
    const my=++tok;
    const [pbp,ls,sch,box]=await Promise.all([j(urls.pbp),j(urls.ls),j(urls.sch),j(urls.box)]);
    if(my!==tok)return;
    if(!pbp&&!ls)return;                                  // transient failure — keep last good UI
    ((sch&&sch.dates)||[]).forEach(d=>(d.games||[]).forEach(x=>{if(x.gamePk===PK)GAME=x;}));
    const all=(pbp&&pbp.allPlays)||ALLPLAYS;ALLPLAYS=all;
    const st=statusOf(GAME,ls),live=st.live;
    livedot.classList.toggle('on',live);
    document.body.classList.toggle('islive',live);
    handleEvents(all);
    ensureScaffold();
    LS=ls; BOX=box; PBP=pbp;                            // keep latest for the Box & Summary tabs
    renderSb(GAME,ls,st);
    const cur=live?(pbp&&pbp.currentPlay):null;
    renderNow(cur);
    renderFeed(GAME,all,live);
    renderTab();                                         // refresh Box/Summary if one of them is open
    paintPanel(buildPanelState(GAME,ls,cur,box,st));   // panel stays at the bottom the whole time
  }

  function schedule(){
    clearTimeout(timer);
    const live=document.body.classList.contains('islive');
    const final=GAME&&GAME.status&&GAME.status.abstractGameState==='Final';
    timer=setTimeout(tick, live?8000:(final?120000:20000));
  }
  async function tick(){
    if(!document.body.classList.contains('islive')){     // not live → follow the schedule for a newer/live game
      const g=await findGame();
      if(g&&g.gamePk!==PK){GAME=g;PK=g.gamePk;setURLs();seeded=false;seen.clear();prevP={};expanded.clear();sbSig=nowSig=feedSig=tabSig='';liveTab='plays';ensureScaffold();setLiveTab('plays');el('feed').innerHTML='<div class="state">Loading…</div>';}
      else if(g)GAME=g;
    }
    await load();
    schedule();
  }

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    document.title=baseTitle;
    clearTimeout(timer);tick();
  });
  document.addEventListener('click',()=>{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});},{once:true});

  (async function(){
    if(!FAV){el('lsp').classList.add('hide');content.innerHTML='<div class="state">No favorite team set.<br>Open settings (⚙, top-right) and pick your <b>Favorite team</b> — the Live tab follows it automatically.</div>';return;}
    document.title=`Live · ${TEAMS[FAV]||'My team'}`;baseTitle=document.title;
    if('Notification'in window&&Notification.permission==='default'){try{Notification.requestPermission();}catch(_){}}
    GAME=await findGame();
    if(!GAME){el('lsp').classList.add('hide');content.innerHTML=`<div class="state">No recent or upcoming game for the ${esc(TEAMS[FAV]||'')} right now.</div>`;return;}
    PK=GAME.gamePk;setURLs();
    await load();
    schedule();
  })();
  document.addEventListener('dt:fav-changed',()=>location.reload());

  /* side-nav collapse — arrow hides the tab bar and recenters the content */
  (function(){const KEY='dt-nav-hidden',btn=el('navToggle');
    const apply=h=>{document.body.classList.toggle('navhidden',h);if(btn){btn.innerHTML=h?'&lsaquo;':'&rsaquo;';btn.title=h?'Show menu':'Hide menu';}};
    apply(localStorage.getItem(KEY)==='1');
    if(btn)btn.onclick=()=>{const h=!document.body.classList.contains('navhidden');localStorage.setItem(KEY,h?'1':'0');apply(h);};
  })();
</script>
</body>
