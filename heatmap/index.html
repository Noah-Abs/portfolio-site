<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Heatmap Studio — DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .top{display:flex;align-items:baseline;gap:10px;padding:18px 26px;border-bottom:1px solid var(--border,#1b1e24)}
  .top a.brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:21px;letter-spacing:1px;color:var(--text,#fff);text-decoration:none}
  .top .sep{color:var(--muted2,#474d56)}.top .t2{font-weight:600;text-transform:uppercase;letter-spacing:3px;font-size:11px;color:var(--muted,#7e858f)}
  .main{max-width:1160px;margin:0 auto;padding:26px 22px 70px}
  .page-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,5.5vw,52px);letter-spacing:1px;line-height:.95}
  .page-sub{margin-top:7px;font-weight:500;text-transform:uppercase;letter-spacing:4px;font-size:12px;color:var(--muted,#7e858f)}

  .seg{display:inline-flex;background:var(--panel2,#15161b);border:1px solid var(--border2,#2f3540);border-radius:10px;padding:3px;gap:2px}
  .seg button{background:none;border:none;color:var(--text3,#aab0b9);font-family:"Oswald",sans-serif;font-weight:600;font-size:13px;letter-spacing:.5px;padding:7px 15px;border-radius:8px;cursor:pointer;text-transform:uppercase}
  .seg button.on{background:var(--accent,#4aa3ff);color:#06121f}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 16px}
  .search{display:flex;gap:0;flex:1 1 280px;max-width:420px}
  .search input{flex:1;min-width:0;background:var(--panel2,#15161b);border:1px solid var(--border2,#2f3540);border-right:0;border-radius:10px 0 0 10px;color:#fff;font:inherit;font-size:14px;padding:10px 13px;outline:none}
  .search input:focus{border-color:var(--accent,#4aa3ff)}
  .search button{background:var(--accent,#4aa3ff);color:#06121f;border:none;border-radius:0 10px 10px 0;font-weight:700;padding:0 16px;cursor:pointer;font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.5px}
  .sresults{position:absolute;z-index:30;background:var(--panel,#101115);border:1px solid var(--border2,#2f3540);border-radius:10px;margin-top:4px;max-height:280px;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.55);min-width:280px}
  .sresults div{padding:9px 13px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:9px}
  .sresults div:hover{background:var(--panel2,#15161b)}.sresults img{width:18px;height:18px;object-fit:contain}

  .wrap{display:grid;grid-template-columns:1fr 326px;gap:20px;align-items:start}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
  .stage{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .who{display:flex;align-items:center;gap:11px;align-self:flex-start}
  .who img{width:34px;height:34px;object-fit:contain}
  .who .nm{font-family:"Oswald",sans-serif;font-weight:700;font-size:19px;line-height:1.05}
  .who .meta{font-size:11.5px;color:var(--muted,#7e858f);letter-spacing:.5px}
  .canv-wrap{position:relative;line-height:0}
  #hm{border-radius:10px;display:block;touch-action:none}
  .pchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .pchip{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text3,#aab0b9);background:var(--panel2,#15161b);border:1px solid var(--border2,#2f3540);border-radius:7px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .pchip .sw{width:9px;height:9px;border-radius:2px}
  .pchip.on{border-color:var(--accent,#4aa3ff);color:#fff;background:rgba(74,163,255,.12)}
  .legend{display:flex;flex-direction:column;gap:7px;width:100%;max-width:440px;align-items:stretch;margin-top:2px}
  .legend .keyt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2,#cfd4da);text-align:center}
  .legend .keybar{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--muted,#7e858f);letter-spacing:.3px;white-space:nowrap}
  .legend .keybar .grad{flex:1;height:12px;border-radius:6px;border:1px solid var(--border2,#2f3540)}
  .legend .keynote{font-size:10.5px;color:var(--muted2,#5b6470);letter-spacing:.2px;text-align:center;line-height:1.45}

  .panel{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:16px;padding:6px 16px 16px}
  .ctl{padding:11px 0;border-bottom:1px solid var(--bg2,#0e0f13)}
  .ctl:last-child{border-bottom:0}
  .ctl .lab{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#7e858f);margin-bottom:8px}
  .ctl .lab .val{color:var(--accent,#4aa3ff);font-weight:700}
  .ctl .seg{display:flex;width:100%}.ctl .seg button{flex:1;padding:7px 4px;font-size:11.5px}
  select.sel,input.txt{width:100%;background:var(--panel2,#15161b);color:#fff;border:1px solid var(--border2,#2f3540);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;outline:none;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--accent,#4aa3ff);cursor:pointer}
  .tg{position:relative;width:44px;height:24px;border-radius:13px;background:var(--border2,#2f3540);border:none;cursor:pointer;flex:0 0 auto}
  .tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .tg.on{background:var(--accent,#4aa3ff)}.tg.on:after{left:23px}
  .ctl.row{display:flex;align-items:center;justify-content:space-between}
  .ctl.row .lab{margin:0}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .swatches .pal{width:34px;height:18px;border-radius:5px;cursor:pointer;border:2px solid transparent}
  .swatches .pal.on{border-color:#fff}
  .state{color:var(--muted,#7e858f);font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:30px}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <header class="top"><a class="brand" href="../dropthird/homescreen/">DROPTHIRD</a><span class="sep">/</span><span class="t2">Heatmap Studio</span></header>
  <main class="main">
    <div class="page-t">Heatmap Studio</div>
    <div class="page-sub" id="sub">Statcast location heatmaps · build your own</div>

    <div class="bar">
      <div class="seg" id="modeSeg"><button data-m="pitcher" class="on">Pitcher</button><button data-m="hitter">Hitter</button></div>
      <div class="search" style="position:relative"><input id="q" placeholder="Search a player…" autocomplete="off"><button id="qb">Go</button>
        <div class="sresults" id="sr" style="display:none"></div></div>
    </div>

    <div class="wrap">
      <div class="stage">
        <div class="who" id="who"></div>
        <div class="canv-wrap"><canvas id="hm" width="420" height="480"></canvas></div>
        <div class="pchips" id="pchips"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel" id="panel"></div>
    </div>
  </main>

<script>
  const $=id=>document.getElementById(id);
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const jget=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);

  // ---- color palettes ----
  const PAL={
    savant:['#2747a0','#6f9bd6','#f3f6fa','#ffffff','#f3f6fa','#e7897c','#b81d2c'],
    mlb:['#2b5bb0','#6aa0d8','#eef2f7','#e89178','#c0392b'],
    plasma:['#0d0887','#6a00a8','#b12a90','#e16462','#fca636','#f0f921'],
    magma:['#000004','#3b0f70','#8c2981','#de4968','#fe9f6d','#fcfdbf'],
    viridis:['#440154','#414487','#2a788e','#22a884','#7ad151','#fde725'],
    turbo:['#30123b','#3e9bfe','#46f884','#e1dd37','#f05b12','#7a0403'],
    ice:['#03045e','#0077b6','#00b4d8','#90e0ef','#caf0f8'],
    heat:['#03071e','#6a040f','#d00000','#f48c06','#ffba08','#ffffff'],
    mono:['#0b0c0e','#3a3f47','#777e88','#b6bcc4','#ffffff']
  };
  const PAL_LIST=[['savant','Savant'],['mlb','Blue→Red'],['plasma','Plasma'],['magma','Magma'],['viridis','Viridis'],['turbo','Turbo'],['ice','Ice'],['heat','Heat'],['mono','Mono']];
  const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  function palColor(name,t,rev){let s=PAL[name]||PAL.mlb;t=Math.max(0,Math.min(1,t));if(rev)t=1-t;
    const x=t*(s.length-1),i=Math.floor(x),f=x-i,a=hex2rgb(s[i]),b=hex2rgb(s[Math.min(i+1,s.length-1)]);
    return [Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];}
  const palCSS=name=>`linear-gradient(90deg,${(PAL[name]||PAL.mlb).join(',')})`;

  // pitch-type colors (Savant-ish)
  const PT_COL={FF:'#d22d49',SI:'#fe9d00',FC:'#933f2c',FT:'#fe9d00',SL:'#eee716',ST:'#ddb33a',CU:'#00d1ed',KC:'#3c44cd',CH:'#1dbe3a',FS:'#3bacac',SC:'#60db33',KN:'#888888',FO:'#55cc88',CS:'#996699',SV:'#93afd4'};
  const ptCol=c=>PT_COL[c]||'#9aa3ad';

  // ---- state (the customization options) ----
  const S={mode:'pitcher',pid:694973,pname:'Paul Skenes',pteam:134,season:2026,
    hand:'all',metric:'freq',pitch:'all',
    palette:'savant',reverse:false,res:16,smooth:'smooth',blur:3,opacity:100,intensity:100,
    view:'catcher',extent:'zone',size:420,shape:'square',
    zone:true,grid:false,values:false,dots:false,dotsize:3,bg:'light',legend:true,mincount:2};
  let PITCHES=[], PT_LIST=[];

  // ---- controls config (drives the panel) ----
  const CONTROLS=[
    {k:'season',t:'seg',label:'Season',opts:[[2026,'2026'],[2025,'2025'],[2024,'2024']]},
    {k:'hand',t:'seg',label:'Batter side',opts:[['all','All'],['R','vs R'],['L','vs L']],pitcherLabel:'Batter side',hitterLabel:'Pitcher hand'},
    {k:'metric',t:'sel',label:'Metric',opts:[['freq','Frequency'],['xwoba','xwOBA'],['hardhit','Hard-hit %'],['whiff','Whiff %']]},
    {k:'palette',t:'pal',label:'Color palette'},
    {k:'reverse',t:'tg',label:'Reverse colors'},
    {k:'res',t:'range',label:'Resolution',min:3,max:25,step:1,suf:' cells'},
    {k:'smooth',t:'seg',label:'Style',opts:[['smooth','Smooth'],['blocks','Blocks']]},
    {k:'blur',t:'range',label:'Smoothing',min:0,max:6,step:1},
    {k:'opacity',t:'range',label:'Opacity',min:25,max:100,step:5,suf:'%'},
    {k:'intensity',t:'range',label:'Intensity',min:50,max:250,step:10,suf:'%'},
    {k:'view',t:'seg',label:'Direction',opts:[['catcher','Catcher'],['pitcher','Pitcher']]},
    {k:'extent',t:'seg',label:'Zoom',opts:[['zone','Zone'],['wide','Wide']]},
    {k:'size',t:'range',label:'Map size',min:280,max:560,step:20,suf:'px'},
    {k:'shape',t:'seg',label:'Cell shape',opts:[['square','Square'],['round','Round'],['circle','Circle']]},
    {k:'mincount',t:'range',label:'Min per cell',min:0,max:12,step:1},
    {k:'dotsize',t:'range',label:'Dot size',min:1,max:6,step:1},
    {k:'bg',t:'seg',label:'Background',opts:[['dark','Dark'],['light','Light'],['field','Field']]},
    {k:'zone',t:'tg',label:'Strike zone'},
    {k:'grid',t:'tg',label:'Grid lines'},
    {k:'values',t:'tg',label:'Show values'},
    {k:'dots',t:'tg',label:'Pitch dots'},
    {k:'legend',t:'tg',label:'Legend'}
  ];

  function buildPanel(){
    let h='';
    CONTROLS.forEach(c=>{
      const lbl=c.pitcherLabel&&S.mode==='hitter'?c.hitterLabel:c.label;
      if(c.t==='tg'){h+=`<div class="ctl row" data-k="${c.k}"><div class="lab">${lbl}</div><button class="tg ${S[c.k]?'on':''}" data-tg="${c.k}"></button></div>`;return;}
      h+=`<div class="ctl" data-k="${c.k}"><div class="lab">${lbl}${c.t==='range'?`<span class="val" id="v_${c.k}">${S[c.k]}${c.suf||''}</span>`:''}</div>`;
      if(c.t==='seg'){h+=`<div class="seg">${c.opts.map(o=>`<button data-set="${c.k}" data-v="${o[0]}" class="${String(S[c.k])===String(o[0])?'on':''}">${o[1]}</button>`).join('')}</div>`;}
      else if(c.t==='sel'){h+=`<select class="sel" data-sel="${c.k}">${c.opts.map(o=>`<option value="${o[0]}" ${S[c.k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;}
      else if(c.t==='range'){h+=`<input type="range" data-rng="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${S[c.k]}">`;}
      else if(c.t==='pal'){h+=`<div class="swatches">${PAL_LIST.map(p=>`<div class="pal ${S.palette===p[0]?'on':''}" data-pal="${p[0]}" title="${p[1]}" style="background:${palCSS(p[0])}"></div>`).join('')}</div>`;}
      h+='</div>';
    });
    $('panel').innerHTML=h;
    $('panel').querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(!isNaN(+v))v=+v;set(b.dataset.set,v);});
    $('panel').querySelectorAll('[data-sel]').forEach(s=>s.onchange=()=>set(s.dataset.sel,s.value));
    $('panel').querySelectorAll('[data-rng]').forEach(r=>r.oninput=()=>{set(r.dataset.rng,+r.value,true);});
    $('panel').querySelectorAll('[data-tg]').forEach(t=>t.onclick=()=>set(t.dataset.tg,!S[t.dataset.tg]));
    $('panel').querySelectorAll('[data-pal]').forEach(p=>p.onclick=()=>set('palette',p.dataset.pal));
  }
  function set(k,v,quiet){
    S[k]=v;
    if(quiet){const el=$('v_'+k);if(el){const c=CONTROLS.find(x=>x.k===k);el.textContent=v+(c&&c.suf||'');}}
    else buildPanel();
    if(k==='season'){loadPlayer(S.pid,S.pname,S.pteam);return;}
    draw();
  }

  // ---- CSV ----
  function parseCSV(text){
    const lines=text.replace(/^﻿/,'').trim().split(/\r?\n/);
    const pl=l=>{const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
      if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
      else{if(ch==='"')q=true;else if(ch===','){o.push(c);c='';}else c+=ch;}}o.push(c);return o;};
    return {head:pl(lines[0]),rows:lines.slice(1).filter(l=>l).map(pl)};
  }

  async function loadPlayer(id,name,team){
    S.pid=id;S.pname=name;S.pteam=team;
    $('who').innerHTML=`<img src="${logo(team)}" onerror="this.style.visibility='hidden'"><div><div class="nm">${esc(name)}</div><div class="meta">Loading Statcast…</div></div>`;
    const ctx=$('hm').getContext('2d');ctx.clearRect(0,0,$('hm').width,$('hm').height);
    const url=`https://baseballsavant.mlb.com/statcast_search/csv?hfSea=${S.season}%7C&player_type=${S.mode}&player_id=${id}&group_by=name&type=details&min_pitches=0&min_results=0&min_pas=0`;
    let txt='';try{const r=await fetch(url);txt=r.ok?await r.text():'';}catch(e){txt='';}
    if(S.pid!==id)return;
    if(!txt){$('who').querySelector('.meta').textContent='No Statcast data';PITCHES=[];PT_LIST=[];draw();return;}
    const {head,rows}=parseCSV(txt);
    const I=n=>head.indexOf(n);
    const iPT=I('pitch_type'),iPN=I('pitch_name'),iX=I('plate_x'),iZ=I('plate_z'),iSt=I('stand'),iTh=I('p_throws'),
      iDesc=I('description'),iLS=I('launch_speed'),iXW=I('estimated_woba_using_speedangle');
    const cnt={};
    PITCHES=rows.map(r=>{const px=parseFloat(r[iX]),pz=parseFloat(r[iZ]);if(isNaN(px)||isNaN(pz))return null;
      const pt=r[iPT]||'';if(pt&&pt!=='null')cnt[pt]=(cnt[pt]||0)+1;
      return {px,pz,pt,pn:r[iPN]||pt,stand:r[iSt],throws:r[iTh],desc:r[iDesc]||'',
        ls:parseFloat(r[iLS]),xw:parseFloat(r[iXW])};}).filter(Boolean);
    PT_LIST=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
    if(S.pitch!=='all'&&!PT_LIST.includes(S.pitch))S.pitch='all';
    const hand=PITCHES[0]?(S.mode==='pitcher'?PITCHES[0].throws:PITCHES[0].stand):'';
    $('who').innerHTML=`<img src="${logo(team)}" onerror="this.style.visibility='hidden'"><div><div class="nm">${esc(name)}</div><div class="meta">${S.season} · ${PITCHES.length} pitches${hand?` · ${S.mode==='pitcher'?'throws':'bats'} ${hand}`:''}</div></div>`;
    buildPitchChips();draw();
  }

  function buildPitchChips(){
    if(S.mode!=='pitcher'||!PT_LIST.length){$('pchips').innerHTML='';return;}
    $('pchips').innerHTML=`<div class="pchip ${S.pitch==='all'?'on':''}" data-pt="all">All</div>`+
      PT_LIST.map(p=>`<div class="pchip ${S.pitch===p?'on':''}" data-pt="${p}"><span class="sw" style="background:${ptCol(p)}"></span>${p}</div>`).join('');
    $('pchips').querySelectorAll('.pchip').forEach(c=>c.onclick=()=>{S.pitch=c.dataset.pt;buildPitchChips();draw();});
  }

  // metric per pitch -> {w, v} weight & value (null to skip)
  function metricOf(p){
    if(S.metric==='freq')return {w:1,v:1};
    if(S.metric==='xwoba')return isNaN(p.xw)?null:{w:1,v:p.xw};
    if(S.metric==='hardhit')return isNaN(p.ls)?null:{w:1,v:p.ls>=95?1:0};
    if(S.metric==='whiff'){const sw=/swinging_strike|foul|hit_into_play|missed_bunt/.test(p.desc);if(!sw)return null;
      return {w:1,v:/swinging_strike|missed_bunt/.test(p.desc)?1:0};}
    return {w:1,v:1};
  }
  const MRANGE={xwoba:[.25,.5],hardhit:[.2,.6],whiff:[0,.45]};

  function box(){ // display extent in feet [x0,x1,z0,z1]
    return S.extent==='zone'?[-1.45,1.45,1.1,4.05]:[-2.3,2.3,0,5.0];
  }

  function draw(){
    const cv=$('hm'),ctx=cv.getContext('2d');
    const [x0,x1,z0,z1]=box(), fw=x1-x0, fh=z1-z0;
    const W=S.size, H=Math.round(W*fh/fw);
    cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';
    // background
    ctx.clearRect(0,0,W,H);
    if(S.bg==='light'){ctx.fillStyle='#eef1f4';ctx.fillRect(0,0,W,H);}
    else if(S.bg==='field'){ctx.fillStyle='#234d27';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2f7d3f';ctx.fillRect(0,H*0.18,W,H*0.82);}
    else{ctx.fillStyle='#0a0d12';ctx.fillRect(0,0,W,H);}
    const flip=S.view==='pitcher';
    const fx=px=>{let u=(px-x0)/fw;if(flip)u=1-u;return u*W;};
    const fz=pz=>(1-(pz-z0)/fh)*H;
    const pitches=PITCHES.filter(p=>{
      if(S.mode==='pitcher'&&S.pitch!=='all'&&p.pt!==S.pitch)return false;
      if(S.hand!=='all'){const hv=S.mode==='pitcher'?p.stand:p.throws;if(hv!==S.hand)return false;}
      return p.px>=x0&&p.px<=x1&&p.pz>=z0&&p.pz<=z1;});
    if(!PITCHES.length){ctx.fillStyle='#7e858f';ctx.font='13px Oswald';ctx.textAlign='center';ctx.fillText('No data',W/2,H/2);drawZone(ctx,W,H,x0,x1,z0,z1,flip);return;}
    // bin
    const G=S.res, sum=new Float64Array(G*G), wt=new Float64Array(G*G);
    pitches.forEach(p=>{const m=metricOf(p);if(!m)return;
      let u=(p.px-x0)/fw;if(flip)u=1-u;const gx=Math.min(G-1,Math.floor(u*G));
      const gy=Math.min(G-1,Math.floor((1-(p.pz-z0)/fh)*G));const k=gy*G+gx;sum[k]+=m.v*m.w;wt[k]+=m.w;});
    // cell value
    const cell=new Float64Array(G*G);const have=new Uint8Array(G*G);
    for(let i=0;i<G*G;i++){if(S.metric==='freq'){cell[i]=wt[i];have[i]=wt[i]>0?1:0;}
      else{if(wt[i]>=Math.max(1,S.mincount)){cell[i]=sum[i]/wt[i];have[i]=1;}}}
    // blur
    let val=cell;for(let b=0;b<S.blur;b++)val=blur3(val,have,G);
    // diverging mapping centered like Savant: blue = below average (cold), white = average, red = above (hot)
    let center,halfW;
    if(S.metric==='freq'){let s=0,c=0,mx=0;for(let i=0;i<G*G;i++){if(val[i]>0){s+=val[i];c++;}if(val[i]>mx)mx=val[i];}center=c?s/c:0;halfW=Math.max(mx-center,center,1e-6);}
    else{const MC={xwoba:[.315,.135],hardhit:[.38,.17],whiff:[.23,.17]};center=MC[S.metric][0];halfW=MC[S.metric][1];}
    const gam=100/S.intensity;
    const tt=v=>{let d=(v-center)/halfW;d=Math.max(-1,Math.min(1,d));d=(d<0?-1:1)*Math.pow(Math.abs(d),gam);return 0.5+0.5*d;};
    const colAt=i=>(S.metric!=='freq'&&!have[i])?palColor(S.palette,0.5,S.reverse):palColor(S.palette,tt(val[i]),S.reverse);
    ctx.globalAlpha=S.opacity/100;
    if(S.smooth==='smooth'){
      const off=document.createElement('canvas');off.width=G;off.height=G;const oc=off.getContext('2d');const img=oc.createImageData(G,G);
      for(let i=0;i<G*G;i++){const col=colAt(i);img.data[i*4]=col[0];img.data[i*4+1]=col[1];img.data[i*4+2]=col[2];img.data[i*4+3]=255;}
      oc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(off,0,0,G,G,0,0,W,H);
    }else{
      const cw=W/G,ch=H/G;
      for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){const i=gy*G+gx;const col=colAt(i);ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
        const x=gx*cw,y=gy*ch;
        if(S.shape==='circle'){ctx.beginPath();ctx.arc(x+cw/2,y+ch/2,Math.min(cw,ch)/2*0.92,0,7);ctx.fill();}
        else if(S.shape==='round'){rrect(ctx,x+1,y+1,cw-2,ch-2,Math.min(cw,ch)*0.22);ctx.fill();}
        else ctx.fillRect(x,y,cw+0.5,ch+0.5);
        if(S.values&&S.metric!=='freq'&&have[i]){ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,.72)';ctx.font=`${Math.min(13,cw/3)}px Oswald`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(val[i].toFixed(S.metric==='xwoba'?3:2).replace(/^0/,''),x+cw/2,y+ch/2);ctx.globalAlpha=S.opacity/100;}
      }
    }
    ctx.globalAlpha=1;
    if(S.grid){ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;const cw=W/G,ch=H/G;
      for(let i=1;i<G;i++){ctx.beginPath();ctx.moveTo(i*cw,0);ctx.lineTo(i*cw,H);ctx.moveTo(0,i*ch);ctx.lineTo(W,i*ch);ctx.stroke();}}
    if(S.dots){pitches.forEach(p=>{ctx.beginPath();ctx.arc(fx(p.px),fz(p.pz),S.dotsize,0,7);
      ctx.fillStyle=S.mode==='pitcher'?ptCol(p.pt):'rgba(255,255,255,.5)';ctx.globalAlpha=.55;ctx.fill();});ctx.globalAlpha=1;}
    drawZone(ctx,W,H,x0,x1,z0,z1,flip);
    drawLegend();
  }
  function drawZone(ctx,W,H,x0,x1,z0,z1,flip){
    if(!S.zone)return;
    const fw=x1-x0,fh=z1-z0;const zx0=-0.83,zx1=0.83,zb=1.5,zt=3.5;
    const X=px=>{let u=(px-x0)/fw;if(flip)u=1-u;return u*W;};const Z=pz=>(1-(pz-z0)/fh)*H;
    const lx=Math.min(X(zx0),X(zx1)),rx=Math.max(X(zx0),X(zx1)),ty=Z(zt),by=Z(zb);
    if(S.grid){ctx.lineWidth=.7;ctx.strokeStyle=S.bg==='light'?'rgba(0,0,0,.2)':'rgba(255,255,255,.26)';
      for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(lx+(rx-lx)*i/3,ty);ctx.lineTo(lx+(rx-lx)*i/3,by);ctx.moveTo(lx,ty+(by-ty)*i/3);ctx.lineTo(rx,ty+(by-ty)*i/3);ctx.stroke();}}
    ctx.strokeStyle=S.bg==='light'?'rgba(20,24,30,.62)':'rgba(255,255,255,.7)';ctx.lineWidth=2;
    ctx.strokeRect(lx,ty,rx-lx,by-ty);
    // home plate
    ctx.fillStyle=S.bg==='light'?'rgba(20,24,30,.42)':'rgba(255,255,255,.45)';
    const pw=(rx-lx)*0.62,cx=(lx+rx)/2,py=H-10;ctx.beginPath();ctx.moveTo(cx-pw/2,py-6);ctx.lineTo(cx+pw/2,py-6);ctx.lineTo(cx+pw/2,py-1);ctx.lineTo(cx,py+5);ctx.lineTo(cx-pw/2,py-1);ctx.closePath();ctx.fill();
  }
  function drawLegend(){
    if(!S.legend){$('legend').innerHTML='';return;}
    const M=S.metric;
    const title=M==='freq'?'Pitch frequency':M==='xwoba'?'xwOBA · contact quality':M==='hardhit'?'Hard-hit rate (95+ mph)':'Whiff rate (per swing)';
    const low={freq:'Fewer',xwoba:'Cold · .250',hardhit:'Cold · 20%',whiff:'Low · 0%'}[M];
    const high={freq:'More',xwoba:'Hot · .500',hardhit:'Hot · 60%',whiff:'High · 45%'}[M];
    const grad=S.reverse?`linear-gradient(270deg,${(PAL[S.palette]||PAL.savant).join(',')})`:palCSS(S.palette);
    const who=S.mode==='pitcher'?`where ${esc(S.pname)} locates ${S.pitch==='all'?'all pitches':'the '+S.pitch}`:`where pitches end up against ${esc(S.pname)}`;
    const tail=M==='freq'?'red = thrown there most, blue = least':'red = better for the hitter, blue = worse';
    $('legend').innerHTML=`<div class="keyt">${esc(title)}</div>
      <div class="keybar"><span>${low}</span><div class="grad" style="background:${grad}"></div><span>${high}</span></div>
      <div class="keynote">Catcher's view — box = strike zone, home plate below. Colored by ${who}; ${tail}.</div>`;
  }
  function blur3(a,have,G){const o=new Float64Array(G*G);
    for(let y=0;y<G;y++)for(let x=0;x<G;x++){let s=0,w=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny<0||nx<0||ny>=G||nx>=G)continue;
        const k=ny*G+nx;const wgt=(dx===0&&dy===0)?4:((dx===0||dy===0)?2:1);if(have[k]||a[k]>0){s+=a[k]*wgt;w+=wgt;}}
      o[y*G+x]=w?s/w:0;}return o;}
  function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  // ---- player search ----
  let st=null;
  $('q').oninput=()=>{clearTimeout(st);const v=$('q').value.trim();if(v.length<3){$('sr').style.display='none';return;}st=setTimeout(()=>search(v),250);};
  $('qb').onclick=()=>{const v=$('q').value.trim();if(v)search(v);};
  $('q').onkeydown=e=>{if(e.key==='Enter'){const v=$('q').value.trim();if(v)search(v);}};
  async function search(v){
    const j=await jget(`https://statsapi.mlb.com/api/v1/people/search?names=${encodeURIComponent(v)}`);
    let pl=((j&&j.people)||[]).slice(0,12);
    if(!pl.length){$('sr').style.display='none';return;}
    const tj=await jget(`https://statsapi.mlb.com/api/v1/people?personIds=${pl.map(p=>p.id).join(',')}&hydrate=currentTeam`);
    const tm={};((tj&&tj.people)||[]).forEach(p=>tm[p.id]={team:(p.currentTeam&&p.currentTeam.id)||0,pos:(p.primaryPosition&&p.primaryPosition.abbreviation)||''});
    $('sr').innerHTML=pl.map(p=>{const t=tm[p.id]||{};return `<div data-id="${p.id}" data-team="${t.team||0}" data-name="${esc(p.fullName)}"><img src="${logo(t.team)}" onerror="this.style.visibility='hidden'">${esc(p.fullName)} <span style="color:#7e858f">${esc(t.pos||'')}</span></div>`;}).join('');
    $('sr').style.display='block';
    $('sr').querySelectorAll('div[data-id]').forEach(d=>d.onclick=()=>{$('sr').style.display='none';$('q').value=d.dataset.name;loadPlayer(+d.dataset.id,d.dataset.name,+d.dataset.team);});
  }
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sr').style.display='none';});

  // mode toggle
  $('modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(S.mode===b.dataset.m)return;S.mode=b.dataset.m;
    $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m===S.mode));
    if(S.mode==='hitter'){S.pid=592450;S.pname='Aaron Judge';S.pteam=147;S.metric='xwoba';}
    else{S.pid=694973;S.pname='Paul Skenes';S.pteam=134;S.metric='freq';}
    S.pitch='all';buildPanel();loadPlayer(S.pid,S.pname,S.pteam);
  });

  const Q=new URLSearchParams(location.search);
  if(Q.get('mode')==='hitter'){S.mode='hitter';S.pid=592450;S.pname='Aaron Judge';S.pteam=147;S.metric='xwoba';
    $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m==='hitter'));}
  buildPanel();
  loadPlayer(S.pid,S.pname,S.pteam);
</script>
</body>
