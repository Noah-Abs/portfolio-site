<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f6f8;color:#1b1f24;font-family:"Roboto",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
  .card{flex:0 1 330px;min-width:0;max-width:330px;background:#fff;border:1px solid #e2e7ec;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
  .banner{position:relative;height:150px;background:linear-gradient(150deg,#2a5da8,#0a2342)}
  .banner img{width:100%;height:100%;object-fit:cover;object-position:top center;opacity:.95}
  .shot{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
    border:4px solid #fff;background:#dfe4ea;box-shadow:0 2px 6px rgba(0,0,0,.3);overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .body{padding:46px 20px 22px;text-align:center}
  .name{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1.05}
  .sub{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:4px;color:#3a4450;font-size:14px;font-weight:500}
  .sub .pos{color:#157f8c;font-weight:700}
  .sub img{width:20px;height:20px;object-fit:contain}
  .bio{margin-top:18px;text-align:left}
  .brow{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid #eef1f4;font-size:13.5px}
  .brow:last-child{border-bottom:1px solid #eef1f4}
  .brow span{color:#8a939c;font-weight:500}
  .brow b{color:#1b1f24;font-weight:700}
  .state{padding:40px;text-align:center;color:#8a939c;font-size:13px}
  .page{margin:0 auto}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
  .box{flex:0 1 330px;min-width:0;max-width:330px;background:#fff;border:1px solid #e2e7ec;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;display:flex;flex-direction:column}
  .arsbox,.row.fill .arsbox{flex:1 1 340px;max-width:none}
  .arsbox .ascroll{flex:1}
  .arsbox .atbl{height:100%}
  .box-h{text-align:center;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:18px;padding:15px 14px 0}
  .box-h .yr{color:#157f8c}
  .box-h:after{content:"";display:block;width:64px;border-bottom:3px dotted #157f8c;margin:9px auto 0}
  .slist{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;margin-top:12px}
  .scell{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px;border-top:1px solid #eef1f4;font-size:13.5px}
  .scell.col2{border-left:1px solid #eef1f4}
  .scell span{color:#6b757f;font-weight:500;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scell b{color:#1b1f24;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .footnote{margin:12px 2px 0;font-size:11px;color:#9aa3ac;text-align:left}
  .arsenal{flex:0 0 100%;background:#fff;border:1px solid #e2e7ec;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
  .ascroll{overflow-x:auto}
  .atbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .atbl th,.atbl td{padding:10px 14px;font-size:13px;text-align:right;border-top:1px solid #eef1f4;white-space:nowrap}
  .atbl thead th{color:#8a939c;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;border-top:none;border-bottom:1px solid #e2e7ec;background:#fafbfc}
  .atbl td:first-child,.atbl th:first-child{text-align:left;font-weight:600}
  .atbl tbody tr:hover td{background:#f7f9fb}
  .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:middle}
</style>
</head>
<body>
  <div id="app"><div class="state">Loading…</div></div>

<script>
  const ID=605141, YEAR=2026;
  // how each player entered pro ball (API exposes no clean "signed by" field)
  const META={
    660271:['Signed','2017 · Los Angeles Angels'],
    605141:['Drafted','2011 · Boston Red Sox'],
    808967:['Signed','2024 · Los Angeles Dodgers'],
  };
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const num=v=>(v==null||v===''||isNaN(+v))?null:+v;
  const fmtAvg=v=>String(v).replace(/^0(?=\.)/,'');
  const d1=v=>{const n=num(v);return n==null?'–':n.toFixed(1);};
  const d3=v=>{const n=num(v);return n==null?'–':n.toFixed(3).replace(/^0(?=\.)/,'');};
  const SAV='https://baseballsavant.mlb.com';

  const HIT=[['G','gamesPlayed'],['PA','plateAppearances'],['AB','atBats'],['R','runs'],['H','hits'],['2B','doubles'],
    ['3B','triples'],['HR','homeRuns'],['RBI','rbi'],['BB','baseOnBalls'],['SO','strikeOuts'],['SB','stolenBases'],
    ['AVG','avg','avg'],['OBP','obp','avg'],['SLG','slg','avg'],['OPS','ops','avg']];
  const PIT=[['W','wins'],['L','losses'],['ERA','era'],['G','gamesPlayed'],['GS','gamesStarted'],['SV','saves'],
    ['IP','inningsPitched'],['H','hits'],['R','runs'],['ER','earnedRuns'],['HR','homeRuns'],['BB','baseOnBalls'],
    ['SO','strikeOuts'],['WHIP','whip'],['K/9','strikeoutsPer9Inn'],['BB/9','walksPer9Inn']];
  const PCOL={FF:'#d6273a',FA:'#d6273a',SI:'#f0663b',FC:'#f0973b',FS:'#23a06a',CH:'#2fb673',SC:'#2fb673',
    SL:'#3b82f0',ST:'#5b8def',SV:'#6b6bf0',CU:'#9b5cf0',KC:'#b05cf0',CS:'#9b5cf0',KN:'#8a909a',EP:'#8a909a'};

  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const csv=u=>fetch(u).then(r=>r.ok?r.text():'').then(t=>t?parseCSV(t):[]).catch(()=>[]);
  const find=(rows,id,key)=>rows.find(o=>+o[key||'player_id']===id)||null;
  const seasonStat=jj=>{try{return jj.stats[0].splits[0].stat;}catch(e){return null;}};
  function parseCSV(text){
    const lines=text.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.length);
    const rows=lines.map(l=>{const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){const ch=l[i];
        if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
        else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}
      out.push(cur);return out;});
    const hdr=rows.shift();return rows.map(r=>{const o={};hdr.forEach((h,i)=>o[h]=r[i]);return o;});
  }

  function renderBox(title,rows){
    const gr=Math.max(1,Math.ceil(rows.length/2));
    const cells=rows.map((r,i)=>`<div class="scell${i>=gr?' col2':''}"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('');
    return `<div class="box"><div class="box-h"><span class="yr">${YEAR}</span> ${esc(title)}</div><div class="slist" style="grid-template-rows:repeat(${gr},1fr)">${cells}</div></div>`;
  }
  function statBox(title,fields,stat){
    return renderBox(title,fields.map(f=>{let v=stat[f[1]];
      if(v==null||v==='')v='–';else if(f[2]==='avg')v=fmtAvg(v);return [f[0],v];}));
  }
  const sgn0=v=>{const n=num(v);return n==null?'–':(n>0?'+':'')+Math.round(n);};
  const sgn1=v=>{const n=num(v);return n==null?'–':(n>0?'+':'')+(Math.round(n*10)/10);};
  function advancedBoxes(hStat,cu,xs,spd,bsr,oaa){
    cu=cu||{};xs=xs||{};spd=spd||{};bsr=bsr||{};oaa=oaa||{};
    const iso=(num(hStat.slg)!=null&&num(hStat.avg)!=null)?num(hStat.slg)-num(hStat.avg):null;
    return [
      renderBox('Advanced',[
        ['OPS+','—'],['wRC+','—'],['WAR','—'],
        ['ISO',iso!=null?d3(iso):'–'],['BABIP',d3(hStat.babip)],['BB%',d1(cu.bb_percent)]]),
      renderBox('Quality of Contact',[
        ['Avg EV',d1(cu.exit_velocity_avg)],['Max EV',num(cu.exit_velocity_max)!=null?d1(cu.exit_velocity_max):'—'],['Barrel%',d1(cu.barrel_batted_rate)],
        ['Hard-Hit%',d1(cu.hard_hit_percent)],['Sweet-Spot%',d1(cu.sweet_spot_percent)]]),
      renderBox('Expected & Discipline',[
        ['xBA',d3(xs.est_ba)],['xSLG',d3(xs.est_slg)],['xwOBA',d3(xs.est_woba)],
        ['Chase%',d1(cu.oz_swing_percent)],['Whiff%',d1(cu.whiff_percent)]]),
      renderBox('Fielding & Baserunning',[
        ['OAA',sgn0(oaa.outs_above_average)],['DRS','—'],
        ['Baserunning',sgn1(bsr.runner_runs)],['Sprint Speed',d1(spd.sprint_speed)]]),
    ];
  }
  function arsenalInner(splits,savRows){
    const savMap={};(savRows||[]).forEach(r=>{if(+r.player_id===ID)savMap[r.pitch_type]=r;});
    const ps=splits.map(s=>s.stat).filter(p=>p&&p.type).sort((a,b)=>(b.percentage||0)-(a.percentage||0));
    const head='<tr><th>Pitch Type</th><th>Usage</th><th>Velo</th><th>Whiff%</th><th>K%</th><th>Put-Away%</th><th>BA</th><th>xwOBA</th><th>Hard-Hit%</th></tr>';
    const body=ps.map(p=>{const code=p.type.code,sv=savMap[code]||{},col=PCOL[code]||'#6b727c';
      return `<tr><td><span class="pdot" style="background:${col}"></span>${esc(p.type.description||code)}</td>
        <td>${d1((p.percentage||0)*100)}%</td><td>${p.averageSpeed!=null?(+p.averageSpeed).toFixed(1):'–'}</td>
        <td>${d1(sv.whiff_percent)}</td><td>${d1(sv.k_percent)}</td><td>${d1(sv.put_away)}</td>
        <td>${d3(sv.ba)}</td><td>${d3(sv.est_woba)}</td><td>${d1(sv.hard_hit_percent)}</td></tr>`;}).join('');
    return `<div class="box-h"><span class="yr">${YEAR}</span> Pitch Arsenal</div>
      <div class="ascroll"><table class="atbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  (async function(){
    const [pj,hj,pij,arsJ]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/people/${ID}?hydrate=currentTeam`),
      j(`https://statsapi.mlb.com/api/v1/people/${ID}/stats?stats=season&group=hitting&season=${YEAR}`),
      j(`https://statsapi.mlb.com/api/v1/people/${ID}/stats?stats=season&group=pitching&season=${YEAR}`),
      j(`https://statsapi.mlb.com/api/v1/people/${ID}/stats?stats=pitchArsenal&group=pitching&season=${YEAR}`),
    ]);
    const p=pj&&pj.people&&pj.people[0];
    if(!p){document.getElementById('app').innerHTML='<div class="state">Couldn’t load player.</div>';return;}

    const tm=p.currentTeam;
    const posAbbr=(p.primaryPosition&&p.primaryPosition.abbreviation)||'';
    const pos=posAbbr==='TWP'?'DH/P':posAbbr;
    const bats=(p.batSide&&p.batSide.code)||'–', throws=(p.pitchHand&&p.pitchHand.code)||'–';
    const banner=`https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:action:hero:current.png/w_640,q_auto:good/v1/people/${ID}/action/hero/current`;
    const shot=`https://img.mlbstatic.com/mlb-photos/image/upload/w_180,q_auto:best/v1/people/${ID}/headshot/67/current`;
    const entry=META[ID]||['Drafted',p.draftYear?String(p.draftYear):'–'];

    const bioRows=[
      ['Bats / Throws',`${bats} / ${throws}`],
      ['Height',p.height||'–'],
      ['Weight',p.weight?p.weight+' lbs':'–'],
      ['Age',p.currentAge!=null?p.currentAge:'–'],
      [entry[0],entry[1]],
    ];
    const card=`<div class="card">
      <div class="banner"><img src="${banner}" onerror="this.style.display='none'">
        <div class="shot"><img src="${shot}" onerror="this.src='https://midfield.mlbstatic.com/v1/people/${ID}/spots/120'"></div></div>
      <div class="body">
        <div class="name">${esc(p.fullName)}</div>
        <div class="sub"><span class="pos">${esc(pos)}</span> | ${tm?`<img src="${logo(tm.id)}" onerror="this.remove()">`:''}${esc(tm?tm.name:'')}</div>
        <div class="bio">${bioRows.map(r=>`<div class="brow"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>
      </div></div>`;

    const pStat=seasonStat(pij), hStat=seasonStat(hj);
    const arsSplits=((arsJ&&arsJ.stats||[]).find(s=>s.type&&s.type.displayName==='pitchArsenal')||{}).splits||[];

    // stage 2: leaderboard data this page needs (arsenal for pitchers, advanced stats for hitters)
    let savRows=[],cuR=[],xsR=[],spdR=[],bsrR=[],oaaR=[];
    const fx=[];
    if(arsSplits.length)fx.push(csv(`${SAV}/leaderboard/pitch-arsenal-stats?type=pitcher&year=${YEAR}&min=1&csv=true`).then(r=>savRows=r));
    if(hStat){
      fx.push(csv(`${SAV}/leaderboard/custom?year=${YEAR}&type=batter&filter=&min=1&selections=exit_velocity_avg,exit_velocity_max,barrel_batted_rate,hard_hit_percent,sweet_spot_percent,oz_swing_percent,whiff_percent,bb_percent&chart=false&x=exit_velocity_avg&csv=true`).then(r=>cuR=r));
      fx.push(csv(`${SAV}/leaderboard/expected_statistics?type=batter&year=${YEAR}&min=1&csv=true`).then(r=>xsR=r));
      fx.push(csv(`${SAV}/leaderboard/sprint_speed?type=batter&year=${YEAR}&min=1&csv=true`).then(r=>spdR=r));
      fx.push(csv(`${SAV}/leaderboard/baserunning?type=runner&year=${YEAR}&csv=true`).then(r=>bsrR=r));
      fx.push(csv(`${SAV}/leaderboard/outs_above_average?type=Fielder&startYear=${YEAR}&endYear=${YEAR}&split=no&team=&range=year&min=q&csv=true`).then(r=>oaaR=r));
    }
    await Promise.all(fx);

    const pitcherOnly=!!pStat&&!hStat, isFill=pitcherOnly&&arsSplits.length;
    const items=[card];
    let pageMaxW, rowClass, foot='';
    if(isFill){
      if(pStat)items.push(statBox('Pitching',PIT,pStat));
      items.push(`<div class="box arsbox">${arsenalInner(arsSplits,savRows)}</div>`);
      pageMaxW=1400; rowClass='row fill';
    }else{
      const nBox=1+(pStat?1:0)+(hStat?1:0);
      if(pStat)items.push(statBox('Pitching',PIT,pStat));
      if(hStat)items.push(statBox('Hitting',HIT,hStat));
      if(arsSplits.length)items.push(`<div class="arsenal">${arsenalInner(arsSplits,savRows)}</div>`);
      if(hStat){
        const cu=find(cuR,ID),xs=find(xsR,ID),spd=find(spdR,ID),bsr=find(bsrR,ID,'entity_id'),oaa=find(oaaR,ID);
        items.push(...advancedBoxes(hStat,cu,xs,spd,bsr,oaa));
        foot=`<div class="footnote">OPS+, wRC+, WAR, DRS and Max EV aren’t available from the free MLB/Statcast feeds, so they show “—”.</div>`;
      }
      pageMaxW=nBox*330+(nBox-1)*16; rowClass='row';
    }
    document.getElementById('app').innerHTML=`<div class="page" style="max-width:${pageMaxW}px"><div class="${rowClass}">${items.join('')}</div>${foot}</div>`;
    document.title=p.fullName;
  })();
</script>
</body>
</html>
