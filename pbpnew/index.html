<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Play-by-Play · DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg,#0b0c0e);
    color:var(--text,#fff);
    font-family:"Oswald",sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;height:100dvh;
    overflow:hidden;
    position:relative;
  }

  /* Left box — ~28% of the width, tall, leaving ~1/6 of the screen open below it */
  .lbox{
    position:absolute;
    left:1.5vw;
    top:1.5vh;
    width:28vw;
    bottom:17vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }

  /* Right box — same top/bottom, a bit less wide */
  .rbox{
    position:absolute;
    right:1.5vw;
    top:2.5vh;
    width:22vw;
    bottom:2.5vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }

  /* Center box — fills the remaining space between the three boxes */
  .cbox{
    position:absolute;
    left:30.5vw;
    right:24.5vw;
    top:2.5vh;
    bottom:16vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }

  /* Bottom strip — under the left box, spanning across to the right box */
  .brect{
    position:absolute;
    left:1.5vw;
    right:24.5vw;
    top:85vh;
    bottom:2.5vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }
</style>
<script src="/settings.js"></script>
</head>
<body>
  <div class="lbox"></div>
  <div class="rbox"></div>
  <div class="cbox"></div>
  <div class="brect"></div>
</body>
</html>
