<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Play-by-Play · DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg,#0b0c0e);
    color:var(--text,#fff);
    font-family:"Oswald",sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;height:100dvh;
    overflow:hidden;
    position:relative;
  }

  /* Left box — ~28% of the width, tall, leaving ~1/6 of the screen open below it */
  .lbox{
    position:absolute;
    left:1.5vw;
    top:1.5vh;
    width:28vw;
    bottom:17vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
    padding:6px 11px 10px;
    overflow-y:auto;scrollbar-width:none;
  }
  .lbox::-webkit-scrollbar{display:none;}

  /* Play-by-play feed (box 1) — dropthird /live/ style */
  .inn-h{font-family:"Oswald",sans-serif;font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted,#7e858f);margin:14px 0 7px;display:flex;align-items:center;gap:8px;}
  .inn-h:first-child{margin-top:2px;}
  .inn-h::before{content:"";width:4px;height:13px;border-radius:3px;background:var(--accent,#4aa3ff);}
  .play{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:9px;padding:8px 10px;background:var(--panel2,#15161b);border:1px solid var(--border,#1b1e24);border-radius:9px;margin-bottom:5px;}
  .play.score{border-color:#2f4a3a;background:linear-gradient(90deg,rgba(70,199,126,.07),transparent);}
  .play .ev{font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3,#aab0b9);background:var(--panel,#101115);border:1px solid var(--border2,#2f3540);border-radius:5px;padding:3px 4px;min-width:50px;text-align:center;margin-top:1px;}
  .play .ev.hit{color:#46c77e;border-color:#2f4a3a;}
  .play .ev.hr{color:#e9b949;border-color:#5a4a1e;}
  .play .ev.bb{color:#5aa9e6;border-color:#274a6b;}
  .play .ev.k{color:#e0707a;border-color:#5a2a30;}
  .play .pd{min-width:0;font-size:12px;color:var(--text2,#cfd4da);line-height:1.4;}
  .play .psc{font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px;}
  .state{text-align:center;color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:12px;padding:40px 14px;}

  /* Right column split vertically into 2 — top ~30% of box 3 */
  .rbox{
    position:absolute;
    right:1.5vw;
    width:22vw;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }
  .r1{top:2.5vh;height:28.2vh;padding:13px 15px;display:flex;flex-direction:column;overflow:hidden;}
  .r2{top:31.7vh;bottom:2.5vh;padding:11px 11px 9px;display:flex;flex-direction:column;overflow:hidden;}

  /* Box score (box 3b) */
  .bx-tabs{display:flex;gap:5px;margin-bottom:9px;flex:0 0 auto;}
  .bx-tab{flex:1;min-width:0;padding:6px 4px;border-radius:8px;border:1px solid var(--border,#1b1e24);background:var(--bg2,#0e0f13);color:var(--muted,#7e858f);font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:11px;cursor:pointer;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bx-tab.on{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540);}
  .bx-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .bx-body::-webkit-scrollbar{display:none;}
  .bx-lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2,#4a5159);font-weight:700;margin:9px 0 3px;}
  .bx-lbl:first-child{margin-top:0;}
  .bxt{width:100%;border-collapse:collapse;font-family:"Oswald",sans-serif;font-variant-numeric:tabular-nums;}
  .bxt th{font-size:9px;color:var(--muted,#7e858f);font-weight:600;text-align:right;padding:2px 2px;}
  .bxt th.nm{text-align:left;}
  .bxt td{font-size:11px;color:var(--text3,#aab0b9);text-align:right;padding:2px 2px;border-top:1px solid var(--bg2,#0e0f13);font-weight:500;}
  .bxt td.nm{text-align:left;color:var(--text2,#cfd4da);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%;font-weight:600;}
  .bxt td.nm.sub{padding-left:15px;color:var(--muted,#7e858f);font-weight:500;}
  .bxt td.nm .po{color:var(--muted2,#5b6470);font-size:9px;margin-left:4px;font-weight:500;}
  .bxt tr.tot td{color:var(--text,#fff);font-weight:700;border-top:1px solid var(--border2,#262a32);}

  /* Matchup content (box 3a) */
  .mu-head{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10.5px;color:var(--muted,#7e858f);margin-bottom:9px;}
  .mu-team{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;}
  .mu-team.lead{background:var(--panel2,#15161b);}
  .mu-logo{width:28px;height:28px;object-fit:contain;flex:0 0 auto;}
  .mu-info{flex:1;min-width:0;}
  .mu-nm{font-family:"Oswald",sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3,#aab0b9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;}
  .mu-team.lead .mu-nm{color:var(--text,#fff);}
  .mu-sub{font-size:11px;color:var(--muted,#7e858f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mu-sc{font-family:"Anton",sans-serif;font-size:25px;color:var(--text3,#aab0b9);min-width:1ch;text-align:center;flex:0 0 auto;}
  .mu-team.lead .mu-sc{color:var(--text,#fff);}
  .mu-foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--border,#1b1e24);display:flex;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.4px;color:var(--muted,#7e858f);text-transform:uppercase;}
  .mu-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Corner number labels (temporary reference) */
  .tag{position:absolute;bottom:7px;right:10px;font-family:"Oswald",sans-serif;font-weight:600;font-size:14px;color:var(--muted,#7e858f);}

  /* Center column split into 3 stacked boxes — heights ~1 : 2 : 4 (top:mid:bottom) */
  .cbox{
    position:absolute;
    left:30.5vw;
    right:24.5vw;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }
  .c1{top:2.5vh;height:11.4vh;padding:0 26px;display:flex;align-items:center;overflow:hidden;}
  .c2{top:14.9vh;height:22.7vh;padding:0 24px;display:flex;align-items:center;overflow:hidden;}
  .c3{top:38.6vh;height:45.4vh;}

  /* Matchup (box 2b) — pitcher | bases+count | batter */
  .mm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:100%;}
  .mm-side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;}
  .mm-hs{width:clamp(48px,9vh,76px);height:clamp(48px,9vh,76px);border-radius:50%;object-fit:cover;object-position:center;background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);flex:0 0 auto;}
  .mm-nm{font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.4px;color:var(--text,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .mm-pos{color:var(--muted,#7e858f);font-size:11px;font-weight:500;}
  .mm-pc{font-family:"Anton",sans-serif;font-size:17px;line-height:1;color:var(--accent,#4aa3ff);}
  .mm-st{font-size:11px;color:var(--text3,#aab0b9);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .mm-mid{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .mm-diamond{width:clamp(64px,11vh,84px);height:clamp(64px,11vh,84px);overflow:visible;}
  .mm-diamond .path{fill:none;stroke:var(--border2,#2a2f37);stroke-width:2.5;stroke-linejoin:round;}
  .mm-diamond .base{fill:var(--panel2,#15161b);stroke:var(--border2,#2a2f37);stroke-width:1.5;}
  .mm-diamond .base.on{fill:#f6c445;stroke:#f6c445;filter:drop-shadow(0 0 4px rgba(246,196,69,.6));}
  .mm-count{font-family:"Anton",sans-serif;font-size:23px;line-height:1;color:var(--text,#fff);}

  /* Scoreboard (box 2a) */
  .sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:100%;}
  .sb-side{display:flex;align-items:center;gap:13px;min-width:0;}
  .sb-side.home{justify-content:flex-end;}
  .sb-logo{width:clamp(26px,3.4vh,38px);height:clamp(26px,3.4vh,38px);object-fit:contain;flex:0 0 auto;}
  .sb-ab{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:clamp(14px,2.4vh,20px);color:var(--text3,#aab0b9);}
  .sb-sc{font-family:"Anton",sans-serif;font-size:clamp(28px,5.4vh,46px);line-height:1;color:var(--text3,#aab0b9);min-width:1.1ch;text-align:center;}
  .sb-side.lead .sb-sc,.sb-side.lead .sb-ab{color:var(--text,#fff);}
  .sb-mid{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;}
  .sb-inn{display:flex;align-items:center;gap:5px;}
  .sb-arrow{color:var(--accent,#4aa3ff);font-size:12px;line-height:1;}
  .sb-num{font-family:"Anton",sans-serif;font-size:clamp(18px,3vh,24px);line-height:1;}
  .sb-state{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted,#7e858f);white-space:nowrap;}

  /* Bottom strip — linescore grid (box 4) */
  .brect{
    position:absolute;
    left:1.5vw;
    right:24.5vw;
    top:85vh;
    bottom:2.5vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
    padding:4px 12px;
    display:flex;align-items:center;
    overflow:hidden;
  }
  .ls{border-collapse:collapse;width:100%;font-family:"Oswald",sans-serif;font-variant-numeric:tabular-nums;}
  .ls th,.ls td{border:1px solid var(--border,#1b1e24);text-align:center;padding:2px 0;font-size:12.5px;font-weight:500;color:var(--text3,#aab0b9);min-width:0;}
  .ls th{font-size:10px;font-weight:600;color:var(--muted,#7e858f);letter-spacing:.5px;}
  .ls .tm{border-left:0;text-align:left;white-space:nowrap;padding:2px 10px 2px 2px;min-width:0;}
  .ls .tm img{width:19px;height:19px;object-fit:contain;vertical-align:middle;margin-right:7px;}
  .ls .tm span{font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:12.5px;color:var(--text2,#cfd4da);vertical-align:middle;}
  .ls th.tm{border:0;}
  .ls .rhe{color:var(--text,#fff);font-weight:700;background:rgba(255,255,255,.02);}
  .ls th.rhe{color:var(--text3,#aab0b9);}
  .ls .cur{color:var(--accent,#4aa3ff);}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <div class="lbox" id="lbox"><span class="tag">1</span></div>
  <div class="cbox c1" id="c1"><span class="tag">2a</span></div>
  <div class="cbox c2" id="c2"><span class="tag">2b</span></div>
  <div class="cbox c3"><span class="tag">2c</span></div>
  <div class="rbox r1" id="r1"><span class="tag">3a</span></div>
  <div class="rbox r2" id="b3b">
    <div class="bx-tabs" id="bxTabs"></div>
    <div class="bx-body" id="bxBody"></div>
    <span class="tag">3b</span>
  </div>
  <div class="brect" id="b4"><span class="tag">4</span></div>

<script>
  const LOGO=id=>`https://www.mlbstatic.com/team-logos/team-cap-on-dark/${id}.svg`;
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const qp=k=>new URLSearchParams(location.search).get(k);
  const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date());
  const abbr=n=>{const p=String(n||'').trim().split(' ');return p.length>1?p[0][0]+'. '+p.slice(1).join(' '):p[0]||'';};
  const lastN=n=>{const p=String(n||'').trim().split(' ');return p.length>1?p.slice(1).join(' '):p[0]||'';};
  const HEAD=id=>`https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_120,q_auto/v1/people/${id}/headshot/67/current`;
  const gTime=g=>{try{return new Date(g.gameDate).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'})+' PT';}catch(e){return '';}};

  async function pickGame(){
    if(qp('gamePk')){const f=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${qp('gamePk')}&hydrate=team,linescore,probablePitcher,venue`);return ((f?.dates||[])[0]||{}).games?.[0]||null;}
    const s=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today()}&hydrate=team,linescore,probablePitcher,venue`);
    let games=[];for(const d of s?.dates||[])for(const g of d.games||[])games.push(g);
    const team=qp('team');if(team){const f=games.filter(g=>[g.teams.home.team.id,g.teams.away.team.id].includes(+team));if(f.length)games=f;}
    if(!games.length)return null;
    const rank=g=>({Live:0,Final:1,Preview:2}[g.status.abstractGameState]??3);
    games.sort((a,b)=>rank(a)-rank(b)||Date.parse(a.gameDate)-Date.parse(b.gameDate));
    return games[0];
  }

  function teamRow(t,lead){
    const nm=t.team.teamName||t.team.name||'';
    const rec=t.leagueRecord?`${t.leagueRecord.wins}-${t.leagueRecord.losses}`:'';
    const sp=t.probablePitcher&&t.probablePitcher.fullName?abbr(t.probablePitcher.fullName):'';
    const sub=[rec,sp].filter(Boolean).join(' · ');
    const sc=(t.score!=null)?t.score:'';
    return `<div class="mu-team${lead?' lead':''}">
      <img class="mu-logo" src="${LOGO(t.team.id)}" onerror="this.style.visibility='hidden'">
      <div class="mu-info"><div class="mu-nm">${nm}</div><div class="mu-sub">${sub}</div></div>
      <div class="mu-sc">${sc}</div></div>`;
  }

  function render3a(g){
    const el=document.getElementById('r1');
    el.querySelectorAll('.mu-head,.mu-team,.mu-foot,.mu-sub').forEach(n=>n.remove());
    if(!g){el.insertAdjacentHTML('afterbegin','<div class="mu-head">Matchup</div><div class="mu-sub">No game found.</div>');return;}
    const a=g.teams.away,h=g.teams.home,st=g.status.abstractGameState;
    const lead=(a.score!=null&&h.score!=null)?(a.score>h.score?'a':h.score>a.score?'h':''):'';
    const foot=st==='Final'?'Final':st==='Live'?`${(g.linescore&&g.linescore.inningState)||''} ${(g.linescore&&g.linescore.currentInning)||''}`.trim():gTime(g);
    const venue=(g.venue&&g.venue.name)||'';
    el.insertAdjacentHTML('afterbegin',
      `<div class="mu-head">Matchup</div>`+
      teamRow(a,lead==='a')+teamRow(h,lead==='h')+
      `<div class="mu-foot"><span>${venue}</span><span>${foot}</span></div>`);
  }

  function render4(g,ls){
    const el=document.getElementById('b4');
    el.querySelectorAll('.ls').forEach(n=>n.remove());
    if(!g)return;
    const innings=(ls&&ls.innings)||[];
    const n=Math.max(9,innings.length);
    const cur=(ls&&ls.currentInning)||0, live=g.status.abstractGameState==='Live';
    const aT=(ls&&ls.teams&&ls.teams.away)||{}, hT=(ls&&ls.teams&&ls.teams.home)||{};
    const ab=t=>t.team.abbreviation||String(t.team.teamName||t.team.name||'').slice(0,3).toUpperCase();
    let head='<tr><th class="tm"></th>';
    for(let i=1;i<=n;i++)head+=`<th class="${live&&i===cur?'cur':''}">${i}</th>`;
    head+='<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th></tr>';
    const row=(side,team,tot)=>{
      let r=`<tr><td class="tm"><img src="${LOGO(team.team.id)}" onerror="this.style.visibility='hidden'"><span>${ab(team)}</span></td>`;
      for(let i=1;i<=n;i++){const inn=innings.find(x=>x.num===i);const v=inn&&inn[side]?inn[side].runs:undefined;r+=`<td>${v==null?'':v}</td>`;}
      r+=`<td class="rhe">${tot.runs!=null?tot.runs:(team.score!=null?team.score:'')}</td><td class="rhe">${tot.hits!=null?tot.hits:''}</td><td class="rhe">${tot.errors!=null?tot.errors:''}</td></tr>`;
      return r;
    };
    el.insertAdjacentHTML('afterbegin',`<table class="ls"><tbody>${head}${row('away',g.teams.away,aT)}${row('home',g.teams.home,hT)}</tbody></table>`);
  }

  let BX=null, bxTeam='away';
  function render3b(g){
    if(!g||!BX)return;
    const nm=t=>t.team.teamName||t.team.name||'';
    document.getElementById('bxTabs').innerHTML=
      `<div class="bx-tab" data-t="away">${nm(g.teams.away)}</div><div class="bx-tab" data-t="home">${nm(g.teams.home)}</div>`;
    document.querySelectorAll('#bxTabs .bx-tab').forEach(b=>b.onclick=()=>{bxTeam=b.dataset.t;paintBox();});
    paintBox();
  }
  function paintBox(){
    document.querySelectorAll('#bxTabs .bx-tab').forEach(b=>b.classList.toggle('on',b.dataset.t===bxTeam));
    const el=document.getElementById('bxBody');
    const bx=BX&&BX.teams&&BX.teams[bxTeam];
    if(!bx){el.innerHTML='<div class="bx-lbl">No box score</div>';return;}
    const P=bx.players||{};
    let html='<div class="bx-lbl">Batting</div><table class="bxt"><tr><th class="nm">Batter</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr>';
    for(const id of bx.batters||[]){const p=P['ID'+id];if(!p)continue;const s=(p.stats&&p.stats.batting)||{};
      const sub=p.battingOrder&&(parseInt(p.battingOrder,10)%100!==0);
      const pos=(p.position&&p.position.abbreviation)||'';
      html+=`<tr><td class="nm${sub?' sub':''}">${abbr(p.person&&p.person.fullName)}<span class="po">${pos}</span></td><td>${s.atBats??0}</td><td>${s.runs??0}</td><td>${s.hits??0}</td><td>${s.rbi??0}</td><td>${s.baseOnBalls??0}</td><td>${s.strikeOuts??0}</td></tr>`;}
    const tb=(bx.teamStats&&bx.teamStats.batting)||{};
    html+=`<tr class="tot"><td class="nm">Team</td><td>${tb.atBats??0}</td><td>${tb.runs??0}</td><td>${tb.hits??0}</td><td>${tb.rbi??0}</td><td>${tb.baseOnBalls??0}</td><td>${tb.strikeOuts??0}</td></tr></table>`;
    html+='<div class="bx-lbl">Pitching</div><table class="bxt"><tr><th class="nm">Pitcher</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th></tr>';
    for(const id of bx.pitchers||[]){const p=P['ID'+id];if(!p)continue;const s=(p.stats&&p.stats.pitching)||{};
      html+=`<tr><td class="nm">${abbr(p.person&&p.person.fullName)}</td><td>${s.inningsPitched??'0.0'}</td><td>${s.hits??0}</td><td>${s.runs??0}</td><td>${s.earnedRuns??0}</td><td>${s.baseOnBalls??0}</td><td>${s.strikeOuts??0}</td></tr>`;}
    html+='</table>';
    el.innerHTML=html;
  }

  function render2a(g){
    const el=document.getElementById('c1');
    el.querySelectorAll('.sb').forEach(n=>n.remove());
    if(!g)return;
    const a=g.teams.away,h=g.teams.home,st=g.status.abstractGameState,ls=g.linescore||{};
    const ab=t=>t.team.abbreviation||String(t.team.teamName||t.team.name||'').slice(0,3).toUpperCase();
    const lead=(a.score!=null&&h.score!=null)?(a.score>h.score?'a':h.score>a.score?'h':''):'';
    let mid;
    if(st==='Final')mid=`<div class="sb-num">F</div><div class="sb-state">Final${ls.currentInning>9?' / '+ls.currentInning:''}</div>`;
    else if(st==='Live'){const top=ls.isTopInning||/top/i.test(ls.inningState||'');
      mid=`<div class="sb-inn"><span class="sb-arrow">${top?'▲':'▼'}</span><span class="sb-num">${ls.currentInning||''}</span></div><div class="sb-state">${((ls.inningState||'')+' '+(ls.currentInningOrdinal||ls.currentInning||'')).trim()}</div>`;}
    else mid=`<div class="sb-num" style="font-size:16px">—</div><div class="sb-state">${gTime(g)}</div>`;
    const sc=v=>v!=null?v:'';
    el.insertAdjacentHTML('afterbegin',
      `<div class="sb">
        <div class="sb-side${lead==='a'?' lead':''}"><img class="sb-logo" src="${LOGO(a.team.id)}" onerror="this.style.visibility='hidden'"><span class="sb-ab">${ab(a)}</span><span class="sb-sc">${sc(a.score)}</span></div>
        <div class="sb-mid">${mid}</div>
        <div class="sb-side home${lead==='h'?' lead':''}"><span class="sb-sc">${sc(h.score)}</span><span class="sb-ab">${ab(h)}</span><img class="sb-logo" src="${LOGO(h.team.id)}" onerror="this.style.visibility='hidden'"></div>
      </div>`);
  }

  const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  function evClass(ev){const e=(ev||'').toLowerCase();if(/home run/.test(e))return 'hr';if(/single|double|triple/.test(e))return 'hit';if(/walk|hit by pitch|intent/.test(e))return 'bb';if(/strikeout|strikes out/.test(e))return 'k';return 'out';}
  function feedHTML(g,done,live){
    if(!done.length)return '<div class="state">No plays yet.</div>';
    const bt=p=>p.about.halfInning==='top'?g.teams.away:g.teams.home;
    const groups=[];let cur=null;
    done.forEach(p=>{const k=p.about.halfInning+p.about.inning;if(!cur||cur.k!==k){cur={k,inn:p.about.inning,half:p.about.halfInning,team:bt(p),plays:[]};groups.push(cur);}cur.plays.push(p);});
    const order=live?groups.slice().reverse():groups;
    return order.map(grp=>{
      const plays=live?grp.plays.slice().reverse():grp.plays;
      const rows=plays.map(p=>{const ev=(p.result&&p.result.event)||'Play';
        return `<div class="play${p.about.isScoringPlay?' score':''}"><span class="ev ${evClass(ev)}">${ev}</span><span class="pd">${(p.result&&p.result.description)||''}</span><span class="psc">${(p.result&&p.result.awayScore)??''}–${(p.result&&p.result.homeScore)??''}</span></div>`;}).join('');
      const tnm=grp.team.team.teamName||grp.team.team.name||'';
      return `<div class="inn-h">${grp.half==='top'?'Top':'Bottom'} ${ord(grp.inn)} · ${tnm}</div>${rows}`;
    }).join('');
  }
  function render1(g,pbp){
    const el=document.getElementById('lbox');
    [...el.children].forEach(c=>{if(!c.classList.contains('tag'))c.remove();});
    if(!g)return;
    const all=(pbp&&pbp.allPlays)||[];
    const done=all.filter(p=>p.about&&p.about.isComplete);
    el.insertAdjacentHTML('afterbegin',feedHTML(g,done,g.status.abstractGameState==='Live'));
  }

  function render2b(g,ls,box){
    const el=document.getElementById('c2');
    el.querySelectorAll('.mm').forEach(n=>n.remove());
    if(!ls||!ls.offense||!ls.offense.batter||!ls.defense||!ls.defense.pitcher){el.insertAdjacentHTML('afterbegin','<div class="mm"><div></div><div class="mm-st" style="text-align:center">No at-bat</div><div></div></div>');return;}
    const isTop=ls.isTopInning, offSide=isTop?'away':'home', defSide=isTop?'home':'away';
    const bid=ls.offense.batter.id, pid=ls.defense.pitcher.id;
    const bBox=box&&box.teams[offSide].players['ID'+bid];
    const pBox=box&&box.teams[defSide].players['ID'+pid];
    const bs=(bBox&&bBox.stats&&bBox.stats.batting)||{}, ps=(pBox&&pBox.stats&&pBox.stats.pitching)||{};
    const bPos=(bBox&&bBox.position&&bBox.position.abbreviation)||'';
    const on=b=>b?' on':'';
    const base=(cls,x,y)=>`<rect class="base${cls}" x="${x-9}" y="${y-9}" width="18" height="18" transform="rotate(45 ${x} ${y})"/>`;
    const mid=`<div class="mm-mid">
      <svg class="mm-diamond" viewBox="0 0 60 60">
        <polygon class="path" points="30,9 51,30 30,51 9,30"/>
        ${base(on(ls.offense.second),30,10)}${base(on(ls.offense.first),50,30)}${base(on(ls.offense.third),10,30)}
      </svg>
      <div class="mm-count">${ls.balls||0}-${ls.strikes||0}</div></div>`;
    const pitcher=`<div class="mm-side">
      <img class="mm-hs" src="${HEAD(pid)}" onerror="this.style.visibility='hidden'">
      <div class="mm-nm">${lastN(ls.defense.pitcher.fullName)} <span class="mm-pos">P</span></div>
      <div class="mm-pc">${ps.numberOfPitches!=null?ps.numberOfPitches+' P':''}</div>
      <div class="mm-st">${[(ps.inningsPitched||'0.0')+' IP',(ps.baseOnBalls||0)+' BB',(ps.strikeOuts||0)+' K'].join(' · ')}</div></div>`;
    const batter=`<div class="mm-side">
      <img class="mm-hs" src="${HEAD(bid)}" onerror="this.style.visibility='hidden'">
      <div class="mm-nm">${lastN(ls.offense.batter.fullName)} <span class="mm-pos">${bPos}</span></div>
      <div class="mm-st">${bs.summary||('0-'+(bs.atBats||0))}</div></div>`;
    el.insertAdjacentHTML('afterbegin',`<div class="mm">${pitcher}${mid}${batter}</div>`);
  }

  async function renderAll(){
    const g=await pickGame();
    render2a(g);render3a(g);
    if(!g)return;
    const [ls,box,pbp]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/linescore`),
      j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/boxscore`),
      j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/playByPlay`)
    ]);
    BX=box;
    render1(g,pbp);render4(g,ls);render2b(g,ls,box);render3b(g);
  }
  renderAll();
  setInterval(renderAll,20000);
</script>
</body>
</html>
