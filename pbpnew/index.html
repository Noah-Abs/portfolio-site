<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Play-by-Play · DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg,#0b0c0e);
    color:var(--text,#fff);
    font-family:"Oswald",sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;height:100dvh;
    overflow:hidden;
    position:relative;
  }

  /* Left box — ~28% of the width, tall, leaving ~1/6 of the screen open below it */
  .lbox{
    position:absolute;
    left:1.5vw;
    top:1.5vh;
    width:28vw;
    bottom:17vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
    padding:6px 11px 10px;
    overflow-y:auto;scrollbar-width:none;
  }
  .lbox::-webkit-scrollbar{display:none;}

  /* Play-by-play feed (box 1) — dropthird /live/ style */
  .inn-h{font-family:"Oswald",sans-serif;font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted,#7e858f);margin:14px 0 7px;display:flex;align-items:center;gap:8px;}
  .inn-h:first-child{margin-top:2px;}
  .inn-h::before{content:"";width:4px;height:13px;border-radius:3px;background:var(--accent,#4aa3ff);}
  .play{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:9px;padding:8px 10px;background:var(--panel2,#15161b);border:1px solid var(--border,#1b1e24);border-radius:9px;margin-bottom:5px;}
  .play.score{border-color:#2f4a3a;background:linear-gradient(90deg,rgba(70,199,126,.07),transparent);}
  .play .ev{font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3,#aab0b9);background:var(--panel,#101115);border:1px solid var(--border2,#2f3540);border-radius:5px;padding:3px 4px;min-width:50px;text-align:center;margin-top:1px;}
  .play .ev.hit{color:#46c77e;border-color:#2f4a3a;}
  .play .ev.hr{color:#e9b949;border-color:#5a4a1e;}
  .play .ev.bb{color:#5aa9e6;border-color:#274a6b;}
  .play .ev.k{color:#e0707a;border-color:#5a2a30;}
  .play .pd{min-width:0;font-size:12px;color:var(--text2,#cfd4da);line-height:1.4;}
  .play .psc{font-family:"Oswald",sans-serif;font-weight:700;font-size:12px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px;}
  .state{text-align:center;color:var(--muted,#7e858f);letter-spacing:2px;text-transform:uppercase;font-size:12px;padding:40px 14px;}
  .play{cursor:pointer;transition:border-color .15s;}
  .play:hover{border-color:var(--border2,#2f3540);}
  .play.open{border-color:#2f3540;margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .play .chev{color:var(--muted,#7e858f);font-size:14px;line-height:1;margin-left:5px;transition:transform .15s,color .15s;}
  .play.open .chev{transform:rotate(90deg);color:#fff;}
  /* at-bat detail (pitches + strike zone + field) */
  .abdetail{background:var(--panel,#101115);border:1px solid #2f3540;border-top:1px dashed #2f3540;border-radius:0 0 9px 9px;margin:0 0 5px;padding:10px 11px;}
  .abx{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .abx-list{flex:1 1 150px;min-width:140px;}
  .abx-viz{display:flex;gap:11px;flex-wrap:wrap;}
  .vz{display:flex;flex-direction:column;gap:4px;}
  .vzh{font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted,#7e858f);}
  .prow{display:grid;grid-template-columns:18px 1fr auto auto;gap:7px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:11.5px;}
  .prow:last-child{border-bottom:none;}
  .pn{font-family:"Oswald",sans-serif;font-weight:700;color:var(--muted,#7e858f);text-align:center;font-variant-numeric:tabular-nums;}
  .pty{color:var(--text2,#cfd4da);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pvel{font-variant-numeric:tabular-nums;color:#fff;font-weight:600;white-space:nowrap;}
  .pres{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 5px;border-radius:5px;border:1px solid var(--border2,#2f3540);color:var(--text3,#aab0b9);white-space:nowrap;}
  .pres.ball{color:#5aa9e6;border-color:#274a6b;}
  .pres.strike{color:#e0707a;border-color:#5a2a30;}
  .pres.foul{color:#e9a23f;border-color:#5a431e;}
  .pres.inplay{color:#46c77e;border-color:#2f4a3a;}
  .pl-empty{font-size:11px;color:var(--muted,#7e858f);padding:4px 0;}
  .zone{width:92px;height:115px;display:block;}
  .zone .zbox{fill:rgba(255,255,255,.03);stroke:var(--border2,#3a4048);stroke-width:1.4;}
  .zone .zg{stroke:rgba(255,255,255,.09);stroke-width:.8;}
  .zone .zd circle{fill:#9aa0a6;stroke:rgba(0,0,0,.55);stroke-width:1;}
  .zone .zd.ball circle{fill:#5aa9e6;}
  .zone .zd.strike circle{fill:#e0707a;}
  .zone .zd.foul circle{fill:#e9a23f;}
  .zone .zd.inplay circle{fill:#46c77e;}
  .zone .zd text{fill:#0b0c0e;font-size:8px;font-weight:700;text-anchor:middle;font-family:"Oswald",sans-serif;}
  .field{width:120px;height:111px;display:block;}
  .field .grass{fill:rgba(70,160,90,.10);}
  .field .foul{stroke:var(--border2,#3a4048);stroke-width:1.2;fill:none;}
  .field .inf{fill:rgba(180,120,70,.16);stroke:var(--border2,#3a4048);stroke-width:1;}
  .field .base{fill:#cfd4da;}
  .field .hit{fill:#e9b949;stroke:#0b0c0e;stroke-width:1.5;}
  .field .cap{fill:var(--muted,#7e858f);font-size:9px;font-family:"Oswald",sans-serif;font-weight:600;}
  .dfield{width:100%;max-width:148px;height:auto;display:block;margin:0 auto;}
  .dcap{font-size:9px;color:var(--muted,#7e858f);text-align:center;margin-top:3px;font-family:"Oswald",sans-serif;letter-spacing:.3px;}

  /* Right column split vertically into 2 — top ~30% of box 3 */
  .rbox{
    position:absolute;
    right:1.5vw;
    width:22vw;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }
  .r1{top:2.5vh;height:28.2vh;padding:13px 15px;display:flex;flex-direction:column;overflow:hidden;}
  .r2{top:31.7vh;bottom:2.5vh;padding:11px 11px 9px;display:flex;flex-direction:column;overflow:hidden;}

  /* Box score (box 3b) */
  .bx-tabs{display:flex;gap:5px;margin-bottom:9px;flex:0 0 auto;}
  .bx-tab{flex:1;min-width:0;padding:6px 4px;border-radius:8px;border:1px solid var(--border,#1b1e24);background:var(--bg2,#0e0f13);color:var(--muted,#7e858f);font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:11px;cursor:pointer;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bx-tab.on{background:var(--panel2,#15161b);color:var(--text,#fff);border-color:var(--border2,#2f3540);}
  .bx-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .bx-body::-webkit-scrollbar{display:none;}
  .bx-lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2,#4a5159);font-weight:700;margin:9px 0 3px;}
  .bx-lbl:first-child{margin-top:0;}
  .bxt{width:100%;border-collapse:collapse;font-family:"Oswald",sans-serif;font-variant-numeric:tabular-nums;}
  .bxt th{font-size:9px;color:var(--muted,#7e858f);font-weight:600;text-align:right;padding:2px 2px;}
  .bxt th.nm{text-align:left;}
  .bxt td{font-size:11px;color:var(--text3,#aab0b9);text-align:right;padding:2px 2px;border-top:1px solid var(--bg2,#0e0f13);font-weight:500;}
  .bxt td.nm{text-align:left;color:var(--text2,#cfd4da);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%;font-weight:600;}
  .bxt td.nm.sub{padding-left:15px;color:var(--muted,#7e858f);font-weight:500;}
  .bxt td.nm .po{color:var(--muted2,#5b6470);font-size:9px;margin-left:4px;font-weight:500;}
  .bxt tr.tot td{color:var(--text,#fff);font-weight:700;border-top:1px solid var(--border2,#262a32);}

  /* Matchup content (box 3a) */
  .mu-head{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:10.5px;color:var(--muted,#7e858f);margin-bottom:9px;}
  .mu-team{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;}
  .mu-team.lead{background:var(--panel2,#15161b);}
  .mu-logo{width:28px;height:28px;object-fit:contain;flex:0 0 auto;}
  .mu-info{flex:1;min-width:0;}
  .mu-nm{font-family:"Oswald",sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3,#aab0b9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;}
  .mu-team.lead .mu-nm{color:var(--text,#fff);}
  .mu-sub{font-size:11px;color:var(--muted,#7e858f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mu-sc{font-family:"Anton",sans-serif;font-size:25px;color:var(--text3,#aab0b9);min-width:1ch;text-align:center;flex:0 0 auto;}
  .mu-team.lead .mu-sc{color:var(--text,#fff);}
  .mu-foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--border,#1b1e24);display:flex;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.4px;color:var(--muted,#7e858f);text-transform:uppercase;}
  .mu-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Corner number labels (temporary reference) */
  .tag{position:absolute;bottom:7px;right:10px;font-family:"Oswald",sans-serif;font-weight:600;font-size:14px;color:var(--muted,#7e858f);}

  /* Center column split into 3 stacked boxes — heights ~1 : 2 : 4 (top:mid:bottom) */
  .cbox{
    position:absolute;
    left:30.5vw;
    right:24.5vw;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
  }
  .c1{top:2.5vh;height:11.4vh;padding:0 26px;display:flex;align-items:center;overflow:hidden;}
  .c2{top:14.9vh;height:22.7vh;padding:0 24px;display:flex;align-items:center;overflow:hidden;}
  /* 2c split: 2/3 left + 1/3 right */
  .c3{top:38.6vh;height:45.4vh;right:auto;width:29.3vw;overflow:hidden;}
  .c3b{top:38.6vh;height:45.4vh;left:auto;width:14.6vw;}

  /* Spray chart (box 2c) — Dodger Stadium field */
  .spray,.spray2{position:absolute;inset:0;width:100%;height:100%;}
  .spray .grass{fill:#2f6b39;}
  .spray .grass2{fill:#357a41;}
  .spray .wtrack{fill:none;stroke:#6f4a2c;stroke-width:9;}
  .spray .fence{fill:none;stroke:#123a7a;stroke-width:3;}
  .spray .dirt{fill:#8a5a34;}
  .spray .igrass{fill:#357a41;}
  .spray .mound{fill:#8a5a34;}
  .spray .foul{stroke:#e8ecef;stroke-width:1.4;fill:none;opacity:.85;}
  .spray .base{fill:#fff;}
  .spray .plate{fill:#fff;}
  .spray .dot{stroke:#0b0c0e;stroke-width:.7;}
  .spray-h{position:absolute;left:0;right:0;top:9px;text-align:center;font-family:"Oswald",sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted,#7e858f);z-index:2;}
  .spray-lg{position:absolute;left:11px;bottom:9px;display:flex;flex-direction:column;gap:4px;z-index:2;}
  .spray-lg span{display:flex;align-items:center;gap:6px;font-family:"Oswald",sans-serif;font-size:10px;font-weight:600;color:var(--text2,#cfd4da);text-transform:uppercase;letter-spacing:.6px;}
  .spray-lg i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}

  /* carousel */
  .slides{position:absolute;inset:0;}
  .slide{position:absolute;inset:0;display:none;}
  .slide.on{display:block;}
  .snav{position:absolute;left:0;right:0;bottom:5px;display:flex;align-items:center;justify-content:center;gap:9px;z-index:6;}
  .sar{background:none;border:none;color:var(--muted,#7e858f);font-size:17px;cursor:pointer;line-height:1;padding:0 3px;}
  .sar:hover{color:#fff;}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--border2,#2f3540);cursor:pointer;}
  .sdot.on{background:var(--accent,#4aa3ff);}
  /* team toggle (top of spray) */
  .ttog{position:absolute;top:7px;left:9px;display:flex;gap:3px;z-index:5;}
  .tt{background:var(--bg2,#0e0f13);border:1px solid var(--border,#1b1e24);color:var(--muted,#7e858f);font-family:"Oswald",sans-serif;font-size:9px;font-weight:600;letter-spacing:.5px;padding:3px 7px;border-radius:6px;cursor:pointer;text-transform:uppercase;}
  .tt.on{background:var(--panel2,#15161b);color:#fff;border-color:var(--border2,#2f3540);}
  /* zone slide */
  .zhead{position:absolute;left:0;right:0;top:9px;text-align:center;font-family:"Oswald",sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted,#7e858f);}
  .zwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:28px 8px 22px;}
  .zcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;min-width:0;}
  .zname{display:flex;align-items:center;justify-content:center;gap:5px;font-family:"Oswald",sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2,#cfd4da);white-space:nowrap;overflow:hidden;max-width:100%;}
  .zlogo{width:16px;height:16px;object-fit:contain;flex:0 0 auto;}
  .zchart{width:100%;max-width:130px;height:auto;}
  .zchart .zbox{fill:rgba(255,255,255,.03);stroke:var(--border2,#3a4048);stroke-width:1.4;}
  .zchart .zg{stroke:rgba(255,255,255,.09);stroke-width:.8;}
  .zempty{font-size:10px;color:var(--muted,#7e858f);padding:22px 0;}
  .ptog{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;max-height:100%;overflow-y:auto;scrollbar-width:none;}
  .ptog::-webkit-scrollbar{display:none;}
  .ptog-h{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2,#4a5159);font-weight:700;margin-bottom:2px;}
  .pt{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text3,#aab0b9);font-family:"Oswald",sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:5px;text-align:left;white-space:nowrap;}
  .pt:hover,.pt.on{background:var(--panel2,#15161b);color:#fff;}
  .pt i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .pt.clr{color:var(--muted,#7e858f);}
  .pdot,.hdot{cursor:pointer;}
  .dtip{position:fixed;z-index:9999;transform:translate(-50%,-100%);background:var(--panel,#101115);border:1px solid var(--border2,#2f3540);border-radius:8px;padding:6px 10px;box-shadow:0 10px 30px rgba(0,0,0,.65);pointer-events:none;white-space:nowrap;font-family:"Oswald",sans-serif;}
  .dtip b{display:block;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.3px;}
  .dtip span{display:block;font-size:10px;color:var(--muted,#7e858f);margin-top:1px;letter-spacing:.2px;}

  /* Matchup (box 2b) — pitcher | bases+count | batter */
  .mm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:100%;}
  .mm-side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;}
  .mm-hs{width:clamp(48px,9vh,76px);height:clamp(48px,9vh,76px);border-radius:50%;object-fit:cover;object-position:center;background:var(--panel2,#15161b);border:1px solid var(--border2,#262a32);flex:0 0 auto;}
  .mm-nm{font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.4px;color:var(--text,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .mm-pos{color:var(--muted,#7e858f);font-size:11px;font-weight:500;}
  .mm-pc{font-family:"Anton",sans-serif;font-size:17px;line-height:1;color:var(--accent,#4aa3ff);}
  .mm-st{font-size:11px;color:var(--text3,#aab0b9);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .mm-mid{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .mm-diamond{width:clamp(64px,11vh,84px);height:clamp(64px,11vh,84px);overflow:visible;}
  .mm-diamond .path{fill:none;stroke:var(--border2,#2a2f37);stroke-width:2.5;stroke-linejoin:round;}
  .mm-diamond .base{fill:var(--panel2,#15161b);stroke:var(--border2,#2a2f37);stroke-width:1.5;}
  .mm-diamond .base.on{fill:#f6c445;stroke:#f6c445;filter:drop-shadow(0 0 4px rgba(246,196,69,.6));}
  .mm-count{font-family:"Anton",sans-serif;font-size:23px;line-height:1;color:var(--text,#fff);}

  /* Scoreboard (box 2a) */
  .sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:100%;}
  .sb-side{display:flex;align-items:center;gap:13px;min-width:0;}
  .sb-side.home{justify-content:flex-end;}
  .sb-logo{width:clamp(26px,3.4vh,38px);height:clamp(26px,3.4vh,38px);object-fit:contain;flex:0 0 auto;}
  .sb-ab{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:clamp(14px,2.4vh,20px);color:var(--text3,#aab0b9);}
  .sb-sc{font-family:"Anton",sans-serif;font-size:clamp(28px,5.4vh,46px);line-height:1;color:var(--text3,#aab0b9);min-width:1.1ch;text-align:center;}
  .sb-side.lead .sb-sc,.sb-side.lead .sb-ab{color:var(--text,#fff);}
  .sb-mid{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;}
  .sb-inn{display:flex;align-items:center;gap:5px;}
  .sb-arrow{color:var(--accent,#4aa3ff);font-size:12px;line-height:1;}
  .sb-num{font-family:"Anton",sans-serif;font-size:clamp(18px,3vh,24px);line-height:1;}
  .sb-state{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted,#7e858f);white-space:nowrap;}

  /* Bottom strip — linescore grid (box 4) */
  .brect{
    position:absolute;
    left:1.5vw;
    right:24.5vw;
    top:85vh;
    bottom:2.5vh;
    background:var(--panel,#101115);
    border:1px solid var(--border,#1b1e24);
    border-radius:16px;
    padding:4px 12px;
    display:flex;align-items:center;
    overflow:hidden;
  }
  .ls{border-collapse:collapse;width:100%;font-family:"Oswald",sans-serif;font-variant-numeric:tabular-nums;}
  .ls th,.ls td{border:1px solid var(--border,#1b1e24);text-align:center;padding:2px 0;font-size:12.5px;font-weight:500;color:var(--text3,#aab0b9);min-width:0;}
  .ls th{font-size:10px;font-weight:600;color:var(--muted,#7e858f);letter-spacing:.5px;}
  .ls .tm{border-left:0;text-align:left;white-space:nowrap;padding:2px 10px 2px 2px;min-width:0;}
  .ls .tm img{width:19px;height:19px;object-fit:contain;vertical-align:middle;margin-right:7px;}
  .ls .tm span{font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:12.5px;color:var(--text2,#cfd4da);vertical-align:middle;}
  .ls th.tm{border:0;}
  .ls .rhe{color:var(--text,#fff);font-weight:700;background:rgba(255,255,255,.02);}
  .ls th.rhe{color:var(--text3,#aab0b9);}
  .ls .cur{color:var(--accent,#4aa3ff);}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <div class="lbox" id="lbox"><span class="tag">1</span></div>
  <div class="cbox c1" id="c1"><span class="tag">2a</span></div>
  <div class="cbox c2" id="c2"><span class="tag">2b</span></div>
  <div class="cbox c3" id="c3"><span class="tag">2c</span></div>
  <div class="cbox c3b" id="c3b"><span class="tag">2d</span></div>
  <div class="rbox r1" id="r1"><span class="tag">3a</span></div>
  <div class="rbox r2" id="b3b">
    <div class="bx-tabs" id="bxTabs"></div>
    <div class="bx-body" id="bxBody"></div>
    <span class="tag">3b</span>
  </div>
  <div class="brect" id="b4"><span class="tag">4</span></div>

<script>
  const LOGO=id=>`https://www.mlbstatic.com/team-logos/team-cap-on-dark/${id}.svg`;
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const qp=k=>new URLSearchParams(location.search).get(k);
  const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date());
  const abbr=n=>{const p=String(n||'').trim().split(' ');return p.length>1?p[0][0]+'. '+p.slice(1).join(' '):p[0]||'';};
  const lastN=n=>{const p=String(n||'').trim().split(' ');return p.length>1?p.slice(1).join(' '):p[0]||'';};
  const HEAD=id=>`https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_120,q_auto/v1/people/${id}/headshot/67/current`;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TEAMCOLOR={108:'#BA0021',109:'#A71930',110:'#DF4601',111:'#BD3039',112:'#0E3386',113:'#C6011F',114:'#E31937',115:'#33006F',116:'#FA4616',117:'#EB6E1F',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#FF5910',133:'#EFB21E',134:'#FDB827',135:'#FFC425',136:'#2CA6A4',137:'#FD5A1E',138:'#C41E3A',139:'#8FBCE6',140:'#C0111F',141:'#1D7AE0',142:'#D31145',143:'#E81828',144:'#CE1141',145:'#C4CED4',146:'#00A3E0',147:'#5B7DB1',158:'#FFC52F'};
  const tc=id=>TEAMCOLOR[id]||'#4aa3ff';
  const PCOL={FF:'#e0707a',FA:'#e0707a',SI:'#e9884a',FT:'#e9884a',FC:'#c78ce0',SL:'#e9c23f',ST:'#d4b13a',SV:'#b0d040',CU:'#5aa9e6',KC:'#5aa9e6',CS:'#5aa9e6',CH:'#46c77e',FS:'#3ac7a8',FO:'#3ac7a8',SC:'#3ac7a8',KN:'#9aa0a6',EP:'#9aa0a6'};
  const pcolor=c=>PCOL[c]||'#9aa0a6';
  let slideIdx=0, sprayTeam='away', zoneFilter=null, FIELDINFO=null;
  const DTIP=document.createElement('div');DTIP.className='dtip';DTIP.style.display='none';document.body.appendChild(DTIP);
  function showTip(c){
    if(c.dataset.t==='pitch') DTIP.innerHTML=`<b>${c.dataset.desc||'Pitch'}${c.dataset.velo?' · '+c.dataset.velo+' mph':''}</b><span>${[c.dataset.inn,c.dataset.ct?c.dataset.ct:'',c.dataset.b?'vs '+c.dataset.b:''].filter(Boolean).join(' · ')}</span>`;
    else DTIP.innerHTML=`<b>${[c.dataset.ev,c.dataset.dist?c.dataset.dist+' ft':'',c.dataset.evz?c.dataset.evz+' mph EV':''].filter(Boolean).join(' · ')}</b><span>${[c.dataset.b?c.dataset.b:'',c.dataset.p?'off '+c.dataset.p:''].filter(Boolean).join(' ')}</span>`;
    const r=c.getBoundingClientRect();
    DTIP.style.display='block';DTIP.style.left=(r.left+r.width/2)+'px';DTIP.style.top=(r.top-6)+'px';
  }
  const hideTip=()=>{DTIP.style.display='none';};
  /* smooth cubic-Bézier path through points (Catmull-Rom) */
  function smoothPath(pts){
    if(pts.length<2)return '';
    let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
      const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }
  /* data-driven field: wall from venue fieldInfo (feet), infield from MLB dims */
  function fieldSVG2(fi,hits,cls){
    const uid='f'+Math.random().toString(36).slice(2,7);
    const VBW=460,VBH=430,pad=0.10, HX=125.42,HY=198.5,K=2.5;
    const map=[['leftLine',-45],['left',-33.75],['leftCenter',-22.5],['center',0],['rightCenter',22.5],['right',33.75],['rightLine',45]];
    let wpts=[];
    map.forEach(([k,a])=>{const d=fi&&fi[k];if(d){const r=a*Math.PI/180;wpts.push([d*Math.sin(r),d*Math.cos(r)]);}});
    if(wpts.length<3)[[-45,330],[-22.5,380],[0,400],[22.5,380],[45,330]].forEach(([a,d])=>{const r=a*Math.PI/180;wpts.push([d*Math.sin(r),d*Math.cos(r)]);});
    let minX=0,maxX=0,maxY=0;wpts.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);});
    const S=Math.min(VBW*(1-2*pad)/(maxX-minX),VBH*(1-2*pad)/maxY);
    const cx=(minX+maxX)/2,cy=maxY/2;
    const T=(x,y)=>[VBW/2+(x-cx)*S,VBH/2-(y-cy)*S];
    const home=T(0,0),wsvg=wpts.map(p=>T(p[0],p[1]));
    const inset=wpts.map(p=>{const r=Math.hypot(p[0],p[1])||1,s=(r-9)/r;return T(p[0]*s,p[1]*s);});
    const wallD=smoothPath(wsvg),trackD=smoothPath(inset);
    const curves=wallD.slice(wallD.indexOf('C'));
    const fillD=`M${home[0].toFixed(1)},${home[1].toFixed(1)} L${wsvg[0][0].toFixed(1)},${wsvg[0][1].toFixed(1)} ${curves} L${home[0].toFixed(1)},${home[1].toFixed(1)} Z`;
    const b90=90/Math.SQRT2,B1=T(b90,b90),B2=T(0,127.28),B3=T(-b90,b90),MD=T(0,60.5);
    const infD=`M${home[0]},${home[1]} L${B1[0]},${B1[1]} L${B2[0]},${B2[1]} L${B3[0]},${B3[1]} Z`;
    const sq=(p,s,f)=>`<rect x="${(p[0]-s).toFixed(1)}" y="${(p[1]-s).toFixed(1)}" width="${(s*2).toFixed(1)}" height="${(s*2).toFixed(1)}" transform="rotate(45 ${p[0].toFixed(1)} ${p[1].toFixed(1)})" fill="${f}"/>`;
    const HITC='#5ce089', OUTC='#9aa1ad';
    const dots=hits.map(h=>{const isHit=/single|double|triple|home\s?run/i.test(h.ev);const col=isHit?HITC:OUTC;const [sx,sy]=T((h.x-HX)*K,(HY-h.y)*K);return `<circle class="hdot" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${isHit?4.4:3.8}" fill="${col}" opacity="${isHit?1:.92}" stroke="rgba(255,255,255,.22)" stroke-width=".8" data-t="hit" data-ev="${esc(h.ev)}" data-dist="${h.dist||''}" data-evz="${h.evz||''}" data-p="${esc(h.pitcher||'')}" data-b="${esc(h.batter||'')}"/>`;}).join('');
    return `<svg class="${cls||'spray2'}" viewBox="0 0 ${VBW} ${VBH}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="ofg${uid}" cx="50%" cy="82%" r="82%"><stop offset="0" stop-color="#121316"/><stop offset="1" stop-color="#0A0A0A"/></radialGradient>
        <filter id="wsh${uid}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.65"/></filter>
        <filter id="hglow${uid}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path d="${fillD}" fill="url(#ofg${uid})"/>
      <path d="${trackD}" fill="none" stroke="#1f2226" stroke-width="6" stroke-linecap="round"/>
      <path d="${wallD}" fill="none" stroke="#3A3A3A" stroke-width="3.2" stroke-linecap="round" filter="url(#wsh${uid})"/>
      <path d="${infD}" fill="#1C1C1C" stroke="#2a2a2a" stroke-width="1"/>
      <line x1="${home[0].toFixed(1)}" y1="${home[1].toFixed(1)}" x2="${wsvg[0][0].toFixed(1)}" y2="${wsvg[0][1].toFixed(1)}" stroke="#c3c8ce" stroke-width="1.3" opacity=".5"/>
      <line x1="${home[0].toFixed(1)}" y1="${home[1].toFixed(1)}" x2="${wsvg[wsvg.length-1][0].toFixed(1)}" y2="${wsvg[wsvg.length-1][1].toFixed(1)}" stroke="#c3c8ce" stroke-width="1.3" opacity=".5"/>
      <circle cx="${MD[0].toFixed(1)}" cy="${MD[1].toFixed(1)}" r="${(9*S).toFixed(1)}" fill="#242424"/>
      ${sq(B1,3.2,'#4a4a4a')}${sq(B2,3.2,'#4a4a4a')}${sq(B3,3.2,'#4a4a4a')}${sq(home,3,'#5a5a5a')}
      <g filter="url(#hglow${uid})">${dots}</g>
    </svg>`;
  }
  const gTime=g=>{try{return new Date(g.gameDate).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'})+' PT';}catch(e){return '';}};

  async function pickGame(){
    if(qp('gamePk')){const f=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${qp('gamePk')}&hydrate=team,linescore,probablePitcher,venue`);return ((f?.dates||[])[0]||{}).games?.[0]||null;}
    const dY=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date(Date.now()-864e5));
    const s=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${dY}&endDate=${today()}&hydrate=team,linescore,probablePitcher,venue`);
    let games=[];for(const d of s?.dates||[])for(const g of d.games||[])games.push(g);
    const team=qp('team');if(team){const f=games.filter(g=>[g.teams.home.team.id,g.teams.away.team.id].includes(+team));if(f.length)games=f;}
    if(!games.length)return null;
    const rank=g=>({Live:0,Final:1,Preview:2}[g.status.abstractGameState]??3);
    games.sort((a,b)=>{const r=rank(a)-rank(b);if(r)return r;const t=Date.parse(a.gameDate)-Date.parse(b.gameDate);return rank(a)===1?-t:t;});
    return games[0];
  }

  function teamRow(t,lead){
    const nm=t.team.teamName||t.team.name||'';
    const rec=t.leagueRecord?`${t.leagueRecord.wins}-${t.leagueRecord.losses}`:'';
    const sp=t.probablePitcher&&t.probablePitcher.fullName?abbr(t.probablePitcher.fullName):'';
    const sub=[rec,sp].filter(Boolean).join(' · ');
    const sc=(t.score!=null)?t.score:'';
    return `<div class="mu-team${lead?' lead':''}">
      <img class="mu-logo" src="${LOGO(t.team.id)}" onerror="this.style.visibility='hidden'">
      <div class="mu-info"><div class="mu-nm">${nm}</div><div class="mu-sub">${sub}</div></div>
      <div class="mu-sc">${sc}</div></div>`;
  }

  function render3a(g){
    const el=document.getElementById('r1');
    el.querySelectorAll('.mu-head,.mu-team,.mu-foot,.mu-sub').forEach(n=>n.remove());
    if(!g){el.insertAdjacentHTML('afterbegin','<div class="mu-head">Matchup</div><div class="mu-sub">No game found.</div>');return;}
    const a=g.teams.away,h=g.teams.home,st=g.status.abstractGameState;
    const lead=(a.score!=null&&h.score!=null)?(a.score>h.score?'a':h.score>a.score?'h':''):'';
    const foot=st==='Final'?'Final':st==='Live'?`${(g.linescore&&g.linescore.inningState)||''} ${(g.linescore&&g.linescore.currentInning)||''}`.trim():gTime(g);
    const venue=(g.venue&&g.venue.name)||'';
    el.insertAdjacentHTML('afterbegin',
      `<div class="mu-head">Matchup</div>`+
      teamRow(a,lead==='a')+teamRow(h,lead==='h')+
      `<div class="mu-foot"><span>${venue}</span><span>${foot}</span></div>`);
  }

  function render4(g,ls){
    const el=document.getElementById('b4');
    el.querySelectorAll('.ls').forEach(n=>n.remove());
    if(!g)return;
    const innings=(ls&&ls.innings)||[];
    const n=Math.max(9,innings.length);
    const cur=(ls&&ls.currentInning)||0, live=g.status.abstractGameState==='Live';
    const aT=(ls&&ls.teams&&ls.teams.away)||{}, hT=(ls&&ls.teams&&ls.teams.home)||{};
    const ab=t=>t.team.abbreviation||String(t.team.teamName||t.team.name||'').slice(0,3).toUpperCase();
    let head='<tr><th class="tm"></th>';
    for(let i=1;i<=n;i++)head+=`<th class="${live&&i===cur?'cur':''}">${i}</th>`;
    head+='<th class="rhe">R</th><th class="rhe">H</th><th class="rhe">E</th></tr>';
    const row=(side,team,tot)=>{
      let r=`<tr><td class="tm"><img src="${LOGO(team.team.id)}" onerror="this.style.visibility='hidden'"><span>${ab(team)}</span></td>`;
      for(let i=1;i<=n;i++){const inn=innings.find(x=>x.num===i);const v=inn&&inn[side]?inn[side].runs:undefined;r+=`<td>${v==null?'':v}</td>`;}
      r+=`<td class="rhe">${tot.runs!=null?tot.runs:(team.score!=null?team.score:'')}</td><td class="rhe">${tot.hits!=null?tot.hits:''}</td><td class="rhe">${tot.errors!=null?tot.errors:''}</td></tr>`;
      return r;
    };
    el.insertAdjacentHTML('afterbegin',`<table class="ls"><tbody>${head}${row('away',g.teams.away,aT)}${row('home',g.teams.home,hT)}</tbody></table>`);
  }

  let BX=null, bxTeam='away';
  function render3b(g){
    if(!g||!BX)return;
    const nm=t=>t.team.teamName||t.team.name||'';
    document.getElementById('bxTabs').innerHTML=
      `<div class="bx-tab" data-t="away">${nm(g.teams.away)}</div><div class="bx-tab" data-t="home">${nm(g.teams.home)}</div>`;
    document.querySelectorAll('#bxTabs .bx-tab').forEach(b=>b.onclick=()=>{bxTeam=b.dataset.t;paintBox();});
    paintBox();
  }
  function paintBox(){
    document.querySelectorAll('#bxTabs .bx-tab').forEach(b=>b.classList.toggle('on',b.dataset.t===bxTeam));
    const el=document.getElementById('bxBody');
    const bx=BX&&BX.teams&&BX.teams[bxTeam];
    if(!bx){el.innerHTML='<div class="bx-lbl">No box score</div>';return;}
    const P=bx.players||{};
    let html='<div class="bx-lbl">Batting</div><table class="bxt"><tr><th class="nm">Batter</th><th>AB</th><th>R</th><th>H</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th></tr>';
    for(const id of bx.batters||[]){const p=P['ID'+id];if(!p||!p.battingOrder)continue;const s=(p.stats&&p.stats.batting)||{};
      const sub=parseInt(p.battingOrder,10)%100!==0;
      const pos=(p.position&&p.position.abbreviation)||'';
      html+=`<tr><td class="nm${sub?' sub':''}">${abbr(p.person&&p.person.fullName)}<span class="po">${pos}</span></td><td>${s.atBats??0}</td><td>${s.runs??0}</td><td>${s.hits??0}</td><td>${s.homeRuns??0}</td><td>${s.rbi??0}</td><td>${s.baseOnBalls??0}</td><td>${s.strikeOuts??0}</td></tr>`;}
    const tb=(bx.teamStats&&bx.teamStats.batting)||{};
    html+=`<tr class="tot"><td class="nm">Team</td><td>${tb.atBats??0}</td><td>${tb.runs??0}</td><td>${tb.hits??0}</td><td>${tb.homeRuns??0}</td><td>${tb.rbi??0}</td><td>${tb.baseOnBalls??0}</td><td>${tb.strikeOuts??0}</td></tr></table>`;
    html+='<div class="bx-lbl">Pitching</div><table class="bxt"><tr><th class="nm">Pitcher</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>HR</th><th>BB</th><th>K</th></tr>';
    for(const id of bx.pitchers||[]){const p=P['ID'+id];if(!p)continue;const s=(p.stats&&p.stats.pitching)||{};
      html+=`<tr><td class="nm">${abbr(p.person&&p.person.fullName)}</td><td>${s.inningsPitched??'0.0'}</td><td>${s.hits??0}</td><td>${s.runs??0}</td><td>${s.earnedRuns??0}</td><td>${s.homeRuns??0}</td><td>${s.baseOnBalls??0}</td><td>${s.strikeOuts??0}</td></tr>`;}
    html+='</table>';
    el.innerHTML=html;
  }

  function spraySlide(g){
    const aId=g.teams.away.team.id, hId=g.teams.home.team.id, wall=tc(hId);
    const teamId=sprayTeam==='away'?aId:hId;
    const balls=[];
    for(const p of PLAYS){
      const side=(p.about&&p.about.halfInning==='top')?'away':'home';
      if(side!==sprayTeam)continue;
      for(const e of (p.playEvents||[])){const hd=e.hitData;
        if(hd&&hd.coordinates&&hd.coordinates.coordX!=null)balls.push({x:hd.coordinates.coordX,y:hd.coordinates.coordY,ev:(p.result&&p.result.event)||'',dist:hd.totalDistance||null,evz:hd.launchSpeed?Math.round(hd.launchSpeed):null,pitcher:p.matchup&&p.matchup.pitcher&&p.matchup.pitcher.fullName,batter:p.matchup&&p.matchup.batter&&p.matchup.batter.fullName});}
    }
    const venue=(g.venue&&g.venue.name)||'Spray Chart';
    const ta=g.teams.away.team.abbreviation||'AWY', th=g.teams.home.team.abbreviation||'HOM';
    return `<div class="ttog"><button class="tt${sprayTeam==='away'?' on':''}" data-tm="away">${esc(ta)}</button><button class="tt${sprayTeam==='home'?' on':''}" data-tm="home">${esc(th)}</button></div>
      ${fieldSVG2(FIELDINFO,balls)}
      <div class="spray-h">${esc(venue)}</div>
      <div class="spray-lg"><span><i style="background:#5ce089"></i>Hit</span><span><i style="background:#9aa1ad"></i>Out</span></div>`;
  }

  function zoneChart(pitches){
    const shown=zoneFilter?pitches.filter(p=>p.code===zoneFilter):pitches;
    if(!pitches.length)return '<div class="zempty">No pitches</div>';
    let tops=[],bots=[];pitches.forEach(p=>{if(p.top)tops.push(p.top);if(p.bot)bots.push(p.bot);});
    const avg=a=>a.length?a.reduce((s,c)=>s+c,0)/a.length:0;
    const topFt=avg(tops)||3.4, botFt=avg(bots)||1.55;
    const VBW=112,VBH=124, zL=35,zR=77,zT=30,zB=92, w=zR-zL,h=zB-zT, cx=(zL+zR)/2, halfW=0.83;
    const sX=(zR-zL)/(2*halfW), sZ=(zB-zT)/(topFt-botFt);
    const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    const dots=shown.map(p=>{const x=cl(cx+p.pX*sX,5,VBW-5),y=cl(zB-(p.pZ-botFt)*sZ,5,VBH-5);return `<circle class="pdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="${pcolor(p.code)}" stroke="#0b0c0e" stroke-width=".6" data-t="pitch" data-desc="${esc(p.desc)}" data-velo="${p.velo||''}" data-inn="${esc(p.inn)}" data-ct="${p.ct}" data-b="${esc(p.batter||'')}"/>`;}).join('');
    return `<svg class="zchart" viewBox="0 0 ${VBW} ${VBH}">
      <rect class="zbox" x="${zL}" y="${zT}" width="${w}" height="${h}" rx="3"/>
      <line class="zg" x1="${zL+w/3}" y1="${zT}" x2="${zL+w/3}" y2="${zB}"/>
      <line class="zg" x1="${zL+2*w/3}" y1="${zT}" x2="${zL+2*w/3}" y2="${zB}"/>
      <line class="zg" x1="${zL}" y1="${zT+h/3}" x2="${zR}" y2="${zT+h/3}"/>
      <line class="zg" x1="${zL}" y1="${zT+2*h/3}" x2="${zR}" y2="${zT+2*h/3}"/>
      ${dots}</svg>`;
  }

  function zoneSlide(g){
    const aS=BX&&BX.teams&&BX.teams.away.pitchers&&BX.teams.away.pitchers[0];
    const hS=BX&&BX.teams&&BX.teams.home.pitchers&&BX.teams.home.pitchers[0];
    const collect=pid=>{const arr=[];if(!pid)return arr;for(const p of PLAYS){if(!p.matchup||!p.matchup.pitcher||p.matchup.pitcher.id!==pid)continue;const inn=p.about&&p.about.inning,half=p.about&&p.about.halfInning,bat=p.matchup&&p.matchup.batter&&p.matchup.batter.fullName;for(const e of (p.playEvents||[])){if(e.isPitch&&e.pitchData&&e.pitchData.coordinates&&e.pitchData.coordinates.pX!=null)arr.push({pX:e.pitchData.coordinates.pX,pZ:e.pitchData.coordinates.pZ,top:e.pitchData.strikeZoneTop,bot:e.pitchData.strikeZoneBottom,code:(e.details&&e.details.type&&e.details.type.code)||'',desc:(e.details&&e.details.type&&e.details.type.description)||'',velo:e.pitchData.startSpeed?Math.round(e.pitchData.startSpeed):null,inn:inn?(half==='top'?'Top ':'Bot ')+ord(inn):'',ct:e.count?e.count.balls+'-'+e.count.strikes:'',batter:bat});}}return arr;};
    const aP=collect(aS),hP=collect(hS);
    const pname=pid=>{for(const s of ['away','home']){const pl=BX&&BX.teams&&BX.teams[s]&&BX.teams[s].players&&BX.teams[s].players['ID'+pid];if(pl&&pl.person)return lastN(pl.person.fullName);}return '';};
    const typeMap={};[...aP,...hP].forEach(p=>{if(p.code)typeMap[p.code]=p.desc||p.code;});
    const codes=Object.keys(typeMap);
    const toggle=`<div class="ptog"><div class="ptog-h">Pitch</div>${codes.map(c=>`<button class="pt${zoneFilter===c?' on':''}" data-pt="${c}"><i style="background:${pcolor(c)}"></i>${c}</button>`).join('')}${zoneFilter?`<button class="pt clr" data-pt="">All</button>`:''}</div>`;
    return `<div class="zhead">Strike Zone · Pitch Locations</div>
      <div class="zwrap">
        <div class="zcol"><div class="zname"><img class="zlogo" src="${LOGO(g.teams.away.team.id)}" onerror="this.style.display='none'">${esc(pname(aS)||g.teams.away.team.abbreviation||'')}</div>${zoneChart(aP)}</div>
        <div class="zcol"><div class="zname"><img class="zlogo" src="${LOGO(g.teams.home.team.id)}" onerror="this.style.display='none'">${esc(pname(hS)||g.teams.home.team.abbreviation||'')}</div>${zoneChart(hP)}</div>
        ${toggle}
      </div>`;
  }

  function render2c(g){
    const el=document.getElementById('c3');
    [...el.children].forEach(c=>{if(!c.classList.contains('tag'))c.remove();});
    if(!g)return;
    el.insertAdjacentHTML('afterbegin',
      `<div class="slides"><div class="slide${slideIdx===0?' on':''}">${spraySlide(g)}</div><div class="slide${slideIdx===1?' on':''}">${zoneSlide(g)}</div></div>
       <div class="snav"><button class="sar" data-d="-1">‹</button><span class="sdot${slideIdx===0?' on':''}" data-i="0"></span><span class="sdot${slideIdx===1?' on':''}" data-i="1"></span><button class="sar" data-d="1">›</button></div>`);
    el.querySelectorAll('.sar').forEach(b=>b.onclick=()=>{slideIdx=(slideIdx+ +b.dataset.d+2)%2;render2c(g);});
    el.querySelectorAll('.sdot').forEach(d=>d.onclick=()=>{slideIdx=+d.dataset.i;render2c(g);});
    el.querySelectorAll('.tt').forEach(b=>b.onclick=()=>{sprayTeam=b.dataset.tm;render2c(g);});
    el.querySelectorAll('.pt').forEach(b=>b.onclick=()=>{zoneFilter=b.dataset.pt||null;render2c(g);});
    el.querySelectorAll('.pdot').forEach(c=>{c.onmouseenter=()=>showTip(c);c.onmouseleave=hideTip;});
    el.querySelectorAll('.hdot').forEach(c=>{c.onclick=e=>{e.stopPropagation();showTip(c);};});
    const sl=el.querySelector('.slides');if(sl)sl.onclick=e=>{if(!e.target.classList.contains('hdot'))hideTip();};
  }

  function render2a(g){
    const el=document.getElementById('c1');
    el.querySelectorAll('.sb').forEach(n=>n.remove());
    if(!g)return;
    const a=g.teams.away,h=g.teams.home,st=g.status.abstractGameState,ls=g.linescore||{};
    const ab=t=>t.team.abbreviation||String(t.team.teamName||t.team.name||'').slice(0,3).toUpperCase();
    const lead=(a.score!=null&&h.score!=null)?(a.score>h.score?'a':h.score>a.score?'h':''):'';
    let mid;
    if(st==='Final')mid=`<div class="sb-num">F</div><div class="sb-state">Final${ls.currentInning>9?' / '+ls.currentInning:''}</div>`;
    else if(st==='Live'){const top=ls.isTopInning||/top/i.test(ls.inningState||'');
      mid=`<div class="sb-inn"><span class="sb-arrow">${top?'▲':'▼'}</span><span class="sb-num">${ls.currentInning||''}</span></div><div class="sb-state">${((ls.inningState||'')+' '+(ls.currentInningOrdinal||ls.currentInning||'')).trim()}</div>`;}
    else mid=`<div class="sb-num" style="font-size:16px">—</div><div class="sb-state">${gTime(g)}</div>`;
    const sc=v=>v!=null?v:'';
    el.insertAdjacentHTML('afterbegin',
      `<div class="sb">
        <div class="sb-side${lead==='a'?' lead':''}"><img class="sb-logo" src="${LOGO(a.team.id)}" onerror="this.style.visibility='hidden'"><span class="sb-ab">${ab(a)}</span><span class="sb-sc">${sc(a.score)}</span></div>
        <div class="sb-mid">${mid}</div>
        <div class="sb-side home${lead==='h'?' lead':''}"><span class="sb-sc">${sc(h.score)}</span><span class="sb-ab">${ab(h)}</span><img class="sb-logo" src="${LOGO(h.team.id)}" onerror="this.style.visibility='hidden'"></div>
      </div>`);
  }

  const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  function evClass(ev){const e=(ev||'').toLowerCase();if(/home run/.test(e))return 'hr';if(/single|double|triple/.test(e))return 'hit';if(/walk|hit by pitch|intent/.test(e))return 'bb';if(/strikeout|strikes out/.test(e))return 'k';return 'out';}
  function callClass(d){if(!d)return '';if(d.isInPlay)return 'inplay';if(d.isBall)return 'ball';const c=(d.call&&d.call.code)||'';if(c==='F'||/foul/i.test(d.description||''))return 'foul';if(d.isStrike)return 'strike';return '';}
  function pitchRows(play){
    const ps=(play.playEvents||[]).filter(e=>e.isPitch);
    if(!ps.length)return '<div class="pl-empty">No pitches in this play.</div>';
    return ps.slice().sort((a,b)=>(b.pitchNumber||0)-(a.pitchNumber||0)).map(e=>{
      const d=e.details||{}, ty=(d.type&&(d.type.description||d.type.code))||'Pitch';
      const sp=e.pitchData&&e.pitchData.startSpeed?Math.round(e.pitchData.startSpeed)+' mph':'';
      const res=d.description||(d.call&&d.call.description)||'';
      return `<div class="prow"><span class="pn">${e.pitchNumber||''}</span><span class="pty">${esc(ty)}</span><span class="pvel">${esc(sp)}</span><span class="pres ${callClass(d)}">${esc(res)}</span></div>`;
    }).join('');
  }
  function zoneSVG(play){
    const ps=(play.playEvents||[]).filter(e=>e.isPitch&&e.pitchData&&e.pitchData.coordinates&&e.pitchData.coordinates.pX!=null);
    if(!ps.length)return '';
    let tops=[],bots=[];ps.forEach(e=>{const p=e.pitchData;if(p.strikeZoneTop)tops.push(p.strikeZoneTop);if(p.strikeZoneBottom)bots.push(p.strikeZoneBottom);});
    const avg=a=>a.length?a.reduce((s,c)=>s+c,0)/a.length:0;
    const topFt=avg(tops)||3.4, botFt=avg(bots)||1.55;
    const VBW=112,VBH=140, zL=35,zR=77,zT=34,zB=104, w=zR-zL,h=zB-zT, cx=(zL+zR)/2, halfW=0.83;
    const sX=(zR-zL)/(2*halfW), sZ=(zB-zT)/(topFt-botFt);
    const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    const dots=ps.map(e=>{const c=e.pitchData.coordinates, x=cl(cx+c.pX*sX,7,VBW-7), y=cl(zB-(c.pZ-botFt)*sZ,7,VBH-7);
      return `<g class="zd ${callClass(e.details)}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/><text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}">${e.pitchNumber||''}</text></g>`;}).join('');
    return `<svg class="zone" viewBox="0 0 ${VBW} ${VBH}" aria-label="strike zone"><rect class="zbox" x="${zL}" y="${zT}" width="${w}" height="${h}" rx="3"/><line class="zg" x1="${zL+w/3}" y1="${zT}" x2="${zL+w/3}" y2="${zB}"/><line class="zg" x1="${zL+2*w/3}" y1="${zT}" x2="${zL+2*w/3}" y2="${zB}"/><line class="zg" x1="${zL}" y1="${zT+h/3}" x2="${zR}" y2="${zT+h/3}"/><line class="zg" x1="${zL}" y1="${zT+2*h/3}" x2="${zR}" y2="${zT+2*h/3}"/>${dots}</svg>`;
  }
  function atBatDetail(play){
    const z=zoneSVG(play);
    let hit=null;for(const e of (play.playEvents||[]))if(e.hitData&&e.hitData.coordinates&&e.hitData.coordinates.coordX!=null)hit=e.hitData;
    let f='';
    if(hit){
      f=fieldSVG2(FIELDINFO,[{x:hit.coordinates.coordX,y:hit.coordinates.coordY,ev:(play.result&&play.result.event)||''}],'dfield');
      const cap=[hit.totalDistance?hit.totalDistance+' ft':'', hit.launchSpeed?Math.round(hit.launchSpeed)+' mph':''].filter(Boolean).join(' · ');
      if(cap)f+=`<div class="dcap">${cap}</div>`;
    }
    const viz=[z?`<div class="vz"><div class="vzh">Pitch Locations</div>${z}</div>`:'', f?`<div class="vz"><div class="vzh">Where It Went</div>${f}</div>`:''].join('');
    return `<div class="abx"><div class="abx-list">${pitchRows(play)}</div>${viz?`<div class="abx-viz">${viz}</div>`:''}</div>`;
  }

  function feedHTML(g,done){
    if(!done.length)return '<div class="state">No plays yet.</div>';
    const bt=p=>p.about.halfInning==='top'?g.teams.away:g.teams.home;
    const groups=[];let cur=null;
    done.forEach(p=>{const k=p.about.halfInning+p.about.inning;if(!cur||cur.k!==k){cur={k,inn:p.about.inning,half:p.about.halfInning,team:bt(p),plays:[]};groups.push(cur);}cur.plays.push(p);});
    return groups.slice().reverse().map(grp=>{
      const rows=grp.plays.slice().reverse().map(p=>{const ev=(p.result&&p.result.event)||'Play';
        return `<div class="play${p.about.isScoringPlay?' score':''}" data-ab="${p.about.atBatIndex}"><span class="ev ${evClass(ev)}">${ev}</span><span class="pd">${(p.result&&p.result.description)||''}</span><span class="psc">${(p.result&&p.result.awayScore)??''}–${(p.result&&p.result.homeScore)??''}<span class="chev">›</span></span></div>`;}).join('');
      const tnm=grp.team.team.teamName||grp.team.team.name||'';
      return `<div class="inn-h">${grp.half==='top'?'Top':'Bottom'} ${ord(grp.inn)} · ${tnm}</div>${rows}`;
    }).join('');
  }
  let PLAYS=[];
  function render1(g,pbp){
    const el=document.getElementById('lbox');
    [...el.children].forEach(c=>{if(!c.classList.contains('tag'))c.remove();});
    if(!g)return;
    PLAYS=(pbp&&pbp.allPlays)||[];
    el.insertAdjacentHTML('afterbegin',feedHTML(g,PLAYS.filter(p=>p.about&&p.about.isComplete)));
  }
  document.getElementById('lbox').addEventListener('click',e=>{
    const row=e.target.closest('.play');if(!row)return;
    const nx=row.nextElementSibling;
    if(nx&&nx.classList.contains('abdetail')){nx.remove();row.classList.remove('open');return;}
    const play=PLAYS.find(p=>p.about&&p.about.atBatIndex===+row.dataset.ab);if(!play)return;
    const d=document.createElement('div');d.className='abdetail';
    try{d.innerHTML=atBatDetail(play);}catch(err){d.innerHTML='<div class="pl-empty">Detail unavailable.</div>';}
    row.after(d);row.classList.add('open');
  });

  function render2b(g,ls,box){
    const el=document.getElementById('c2');
    el.querySelectorAll('.mm').forEach(n=>n.remove());
    if(!ls||!ls.offense||!ls.offense.batter||!ls.defense||!ls.defense.pitcher){el.insertAdjacentHTML('afterbegin','<div class="mm"><div></div><div class="mm-st" style="text-align:center">No at-bat</div><div></div></div>');return;}
    const isTop=ls.isTopInning, offSide=isTop?'away':'home', defSide=isTop?'home':'away';
    const bid=ls.offense.batter.id, pid=ls.defense.pitcher.id;
    const bBox=box&&box.teams[offSide].players['ID'+bid];
    const pBox=box&&box.teams[defSide].players['ID'+pid];
    const bs=(bBox&&bBox.stats&&bBox.stats.batting)||{}, ps=(pBox&&pBox.stats&&pBox.stats.pitching)||{};
    const bPos=(bBox&&bBox.position&&bBox.position.abbreviation)||'';
    const on=b=>b?' on':'';
    const base=(cls,x,y)=>`<rect class="base${cls}" x="${x-11}" y="${y-11}" width="22" height="22" transform="rotate(45 ${x} ${y})"/>`;
    const mid=`<div class="mm-mid">
      <svg class="mm-diamond" viewBox="0 0 60 60">
        <polygon class="path" points="30,9 51,30 30,51 9,30"/>
        ${base(on(ls.offense.second),30,10)}${base(on(ls.offense.first),50,30)}${base(on(ls.offense.third),10,30)}
      </svg>
      <div class="mm-count">${ls.balls||0}-${ls.strikes||0}</div></div>`;
    const pitcher=`<div class="mm-side">
      <img class="mm-hs" src="${HEAD(pid)}" onerror="this.style.visibility='hidden'">
      <div class="mm-nm">${lastN(ls.defense.pitcher.fullName)} <span class="mm-pos">P</span></div>
      <div class="mm-pc">${ps.numberOfPitches!=null?ps.numberOfPitches+' P':''}</div>
      <div class="mm-st">${[(ps.inningsPitched||'0.0')+' IP',(ps.baseOnBalls||0)+' BB',(ps.strikeOuts||0)+' K'].join(' · ')}</div></div>`;
    const batter=`<div class="mm-side">
      <img class="mm-hs" src="${HEAD(bid)}" onerror="this.style.visibility='hidden'">
      <div class="mm-nm">${lastN(ls.offense.batter.fullName)} <span class="mm-pos">${bPos}</span></div>
      <div class="mm-st">${bs.summary||('0-'+(bs.atBats||0))}</div></div>`;
    el.insertAdjacentHTML('afterbegin',`<div class="mm">${pitcher}${mid}${batter}</div>`);
  }

  async function renderAll(){
    const g=await pickGame();
    render2a(g);render3a(g);
    if(!g)return;
    const [ls,box,pbp,ven]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/linescore`),
      j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/boxscore`),
      j(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/playByPlay`),
      (g.venue&&g.venue.id)?j(`https://statsapi.mlb.com/api/v1/venues/${g.venue.id}?hydrate=fieldInfo`):Promise.resolve(null)
    ]);
    BX=box;
    FIELDINFO=(((ven&&ven.venues)||[])[0]||{}).fieldInfo||null;
    render1(g,pbp);render2c(g);render4(g,ls);render2b(g,ls,box);render3b(g);
  }
  renderAll();
  setInterval(renderAll,20000);
</script>
</body>
