<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0b0c0e;color:#fff;font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}

  header{padding:48px 24px 8px;text-align:center;flex:0 0 auto}
  .brand{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;
    font-size:clamp(46px,11vw,104px);line-height:.92;letter-spacing:2px;color:#fff}
  .sub{margin-top:10px;font-family:"Oswald",sans-serif;font-weight:500;text-transform:uppercase;
    letter-spacing:8px;font-size:clamp(13px,2.4vw,18px);color:#7e858f}

  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:28px 24px 52px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;max-width:1060px}
  .box{background:#15161b;border:1px solid #262a32;border-radius:22px;min-height:200px;
    display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer;
    text-decoration:none;color:inherit;
    transition:border-color .18s ease, background .18s ease, transform .18s ease}
  .box:hover{border-color:#3b454f;background:#181a20;transform:translateY(-3px)}
  .box-label{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:3px;font-size:clamp(15px,1.8vw,21px);color:#fff;text-align:center}

  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header>
    <h1 class="brand">DROPTHIRD</h1>
    <p class="sub">Statistics</p>
  </header>
  <main>
    <div class="grid">
      <div class="box"><span class="box-label">Teams</span></div>
      <div class="box"><span class="box-label">Starting Pitching</span></div>
      <a class="box" href="/startrate/"><span class="box-label">Starter Rating</span></a>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </main>
</body>
</html>
