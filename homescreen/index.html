<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0b0c0e;color:#fff;font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:row-reverse}

  /* side tab rail (right side) */
  .side{flex:0 0 250px;min-height:100vh;background:#0e0f13;border-left:1px solid #1b1e24;
    padding:34px 18px;display:flex;flex-direction:column}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:28px;letter-spacing:1px;line-height:1;color:#fff}
  .brand-sub{margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:5px;font-size:11px;color:#6b7280}
  .nav{margin-top:34px;display:flex;flex-direction:column;gap:6px}
  .tab{position:relative;display:flex;align-items:center;padding:13px 15px;border-radius:11px;
    color:#aab0b9;text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{background:#15161b;color:#fff;border-color:#262a32}
  .tab.soon{color:#5b626c;cursor:default}
  .tab.soon:hover{background:transparent;border-color:transparent;color:#5b626c}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:#2a2f37;margin-right:12px;flex:0 0 auto;transition:background .15s}
  .tab:hover .dot{background:#fff}
  .tab.soon .dot{background:#2a2f37}

  /* main panel */
  .main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:40px 28px;position:relative;overflow:hidden}
  .hero{text-align:center;position:relative;z-index:1}
  .hero-t{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(54px,9vw,120px);line-height:.9;letter-spacing:3px;color:#fff}
  .hero-s{margin-top:14px;font-weight:300;letter-spacing:4px;text-transform:uppercase;font-size:clamp(12px,2vw,15px);color:#6b7280}
  .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none}
  .ghost span{font-family:"Anton",sans-serif;font-size:34vh;letter-spacing:4px;color:#0f1115;text-transform:uppercase;white-space:nowrap}

  @media(max-width:760px){
    body{flex-direction:column}
    .side{flex:0 0 auto;min-height:0;width:100%;border-left:0;border-bottom:1px solid #1b1e24;padding:22px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:18px;gap:8px}
    .tab{padding:10px 14px}
    .main{padding:48px 22px}
    .ghost span{font-size:26vh}
  }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand">DROPTHIRD</div>
    <div class="brand-sub">Statistics</div>
    <nav class="nav">
      <a class="tab" href="/standings/"><span class="dot"></span>Standings</a>
      <a class="tab soon" href="#"><span class="dot"></span>Starting Pitching</a>
      <a class="tab" href="/startrate/"><span class="dot"></span>Starter Rating</a>
    </nav>
  </aside>
  <main class="main">
    <div class="ghost"><span>DROPTHIRD</span></div>
    <div class="hero">
      <div class="hero-t">DROPTHIRD</div>
      <div class="hero-s">Select a section to begin</div>
    </div>
  </main>
</body>
</html>
