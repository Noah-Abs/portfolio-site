<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame frame-tl"></div>
<div class="frame frame-tr"></div>
<div class="frame frame-bl"></div>
<div class="frame frame-br"></div>

<div class="vignette"></div>
<div class="scanline"></div>
<div class="grid-overlay"></div>

<div class="hud">

  <header class="topbar">
    <div class="topbar-zone left">
      <button class="settings-btn" id="settingsBtn" title="System Configuration" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <div class="brand">
        <div class="brand-name">J.A.R.V.I.S.</div>
        <div class="brand-sub">Just A Rather Very Intelligent System</div>
      </div>
    </div>

    <div class="topbar-zone right">
      <div class="telem">
        <span class="telem-label">STATUS</span>
        <span class="telem-val">
          <span class="status-dot" id="statusDot"></span>
          <span id="status">STANDBY</span>
        </span>
      </div>
      <div class="telem">
        <span class="telem-label">SYS.TIME</span>
        <span class="telem-val mono" id="clock">--:--:--</span>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="reactor" id="reactor">
      <div class="halo"></div>
      <div class="ring ring-outer"></div>
      <div class="ring ring-tick"></div>
      <div class="ring ring-mid"></div>
      <div class="ring ring-inner"></div>
      <div class="hex">
        <div class="hex-shape">
          <div class="hex-seg s1"></div>
          <div class="hex-seg s2"></div>
          <div class="hex-seg s3"></div>
          <div class="hex-seg s4"></div>
          <div class="hex-seg s5"></div>
          <div class="hex-seg s6"></div>
        </div>
        <div class="hex-core"></div>
      </div>
      <div class="orbit"><span class="orbit-dot"></span></div>
    </div>

    <section class="transcript-panel" id="transcriptPanel">
      <div class="panel-head">
        <span class="panel-label">// TRANSCRIPT</span>
        <button id="clearChat" class="panel-btn" title="Clear conversation">CLEAR</button>
      </div>
      <div class="transcript" id="transcript">
        <div class="placeholder">Awaiting instruction, sir.</div>
      </div>
    </section>
  </main>

  <footer class="input-bar">
    <button class="mic-btn" id="micBtn" title="Hold to speak" aria-label="Microphone">
      <span class="wave">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </span>
    </button>
    <div class="input-wrap">
      <span class="prompt-glyph">&gt;</span>
      <input type="text" id="textInput" placeholder="Speak or type a command..." autocomplete="off" spellcheck="false">
      <span class="caret"></span>
    </div>
    <button class="send-btn" id="sendBtn" title="Send">
      <span class="send-text">SEND</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </footer>

</div>

<div class="popover" id="settingsPanel" role="dialog" aria-label="Settings">
  <div class="popover-arrow"></div>
  <div class="popover-head">
    <span class="popover-title">SYSTEM CONFIG</span>
    <button id="closeModal" class="popover-close" title="Close" aria-label="Close">×</button>
  </div>
  <div class="popover-body">
    <label for="apiKey">ANTHROPIC API KEY</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
    <p class="hint">Stored locally in this browser only. Get a key at console.anthropic.com.</p>
    <div class="popover-actions">
      <button id="clearKey" class="btn-ghost danger">CLEAR</button>
      <button id="saveKey" class="btn-primary">SAVE</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
