<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Dodger Stadium — DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  :root{--dodger:#005A9C;--dodger-br:#3a86e0;--dodger-gl:rgba(58,134,224,.18)}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

  .topbar{display:flex;align-items:center;gap:12px;padding:18px 28px 4px;position:relative;z-index:3}
  .brand-link{text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:9px}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:21px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{font-weight:500;text-transform:uppercase;letter-spacing:4px;font-size:9px;color:var(--muted,#7e858f)}

  .hero{text-align:center;padding:18px 28px 4px;position:relative}
  .glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:min(820px,118vw);height:330px;
    background:radial-gradient(ellipse at center,var(--dodger-gl),transparent 68%);pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;width:100%;max-width:1120px;margin:0 auto}
  .eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:6px;font-size:12px;color:var(--dodger-br);margin-bottom:10px}
  .eyebrow img{width:15px;height:15px;object-fit:contain;vertical-align:-2px;margin-right:7px}
  .h1{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(30px,8.4vw,118px);line-height:.9;letter-spacing:2px;
    white-space:nowrap;color:var(--text,#fff);text-shadow:0 6px 50px var(--dodger-gl)}
  .rule{width:88px;height:5px;border-radius:3px;margin:18px auto 16px;background:linear-gradient(90deg,var(--dodger),var(--dodger-br))}
  .sub{font-weight:300;letter-spacing:4px;text-transform:uppercase;font-size:clamp(11px,1.7vw,14px);color:var(--muted,#7e858f)}
  .sub b{color:var(--text2,#cfd4da);font-weight:500}

  .facts{margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .fact{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:12px;padding:10px 16px;border-top:2px solid var(--dodger-br);text-align:left;min-width:108px}
  .fact .k{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted,#7e858f)}
  .fact .v{font-family:"Anton",sans-serif;font-size:21px;line-height:1.05;margin-top:5px;letter-spacing:.5px}
  .fact .v small{font-family:"Oswald",sans-serif;font-weight:500;font-size:12px;color:var(--text3,#aab0b9)}

  .bowl-wrap{width:100%;max-width:1000px;margin:24px auto 56px;padding:0 16px}
  .bowl-card{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:20px;padding:14px 14px 8px;position:relative;overflow:hidden}
  .bowl-card::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 46%,var(--dodger-gl),transparent 72%);pointer-events:none}
  #bowl{width:100%;height:auto;display:block;position:relative;z-index:1}
  .seatnum{font-family:"Oswald",sans-serif;font-weight:600;fill:#dce7f7}
  .bowl-cap{text-align:center;font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted2,#5b6470);margin-top:6px;position:relative;z-index:1}

  @media(max-width:560px){.topbar{padding:14px 16px 2px}.hero{padding:12px 14px 2px}.fact{min-width:0;flex:1 1 40%;padding:9px 12px}.fact .v{font-size:18px}.bowl-wrap{padding:0 10px;margin:18px auto 40px}}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="/dropthird/homescreen/"><span class="brand">DROPTHIRD</span><span class="brand-sub">Ballparks</span></a>
  </header>

  <section class="hero">
    <div class="glow"></div>
    <div class="wrap">
      <div class="eyebrow"><img src="https://www.mlbstatic.com/team-logos/119.svg" alt="">MLB Ballpark · Los Angeles</div>
      <h1 class="h1">Dodger Stadium</h1>
      <div class="rule"></div>
      <p class="sub">Home of the <b>Los Angeles Dodgers</b> · Chavez Ravine</p>
      <div class="facts">
        <div class="fact"><div class="k">Opened</div><div class="v">1962</div></div>
        <div class="fact"><div class="k">Capacity</div><div class="v">56,000</div></div>
        <div class="fact"><div class="k">Surface</div><div class="v">Grass</div></div>
        <div class="fact"><div class="k">Field <small>L·C·R</small></div><div class="v">330·395·330</div></div>
      </div>
    </div>
  </section>

  <section class="bowl-wrap">
    <div class="bowl-card">
      <svg id="bowl" viewBox="142 384 716 588" role="img" aria-label="Field-level diagram of Dodger Stadium">
        <defs>
          <clipPath id="fairclip"><path d="M500,815 L733,582 C724,548 690,498 647,459 C600,422 545,420 500,420 C455,420 400,422 353,459 C310,498 276,548 267,582 Z"/></clipPath>
          <linearGradient id="seatg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2f6cdb"/><stop offset="1" stop-color="#234e9e"/>
          </linearGradient>
        </defs>

        <!-- ===== playing surface (fair + foul grass) ===== -->
        <path id="greenfield" d="M500,884
          C470,872 446,862 436,854 L228,621 C236,604 252,592 267,582
          C276,548 310,498 353,459 C400,422 455,420 500,420 C545,420 600,422 647,459
          C690,498 724,548 733,582 C748,592 764,604 772,621 L564,854
          C554,862 530,872 500,884 Z" fill="#2f7d3f" stroke="#296c37" stroke-width="2"/>

        <!-- mow stripes (radial fan from home, clipped to fair territory) -->
        <g clip-path="url(#fairclip)" id="mow"></g>

        <!-- warning track ring just inside the outfield wall -->
        <path d="M267,582 C276,548 310,498 353,459 C400,422 455,420 500,420 C545,420 600,422 647,459 C690,498 724,548 733,582"
          fill="none" stroke="#a9763f" stroke-width="16" stroke-linecap="round" opacity=".92"/>
        <!-- outfield wall (blue padded fence) -->
        <path d="M267,582 C276,548 310,498 353,459 C400,422 455,420 500,420 C545,420 600,422 647,459 C690,498 724,548 733,582"
          fill="none" stroke="#0c2c57" stroke-width="5" stroke-linecap="round"/>

        <!-- ===== infield skin (dirt) ===== -->
        <path d="M500,815 C548,795 575,772 588,738 L598,720 A92 92 0 0 0 402,720 L412,738 C425,772 452,795 500,815 Z"
          fill="#b27a45" stroke="#9c6838" stroke-width="1.5"/>
        <!-- infield grass diamond -->
        <path d="M500,803 L556,750 L500,697 L444,750 Z" fill="#2f7d3f"/>
        <!-- base running paths (dirt) -->
        <path d="M500,808 L560,751 L500,694 L440,751 Z" fill="none" stroke="#b27a45" stroke-width="9" stroke-linejoin="round"/>
        <!-- base cutouts -->
        <circle cx="564" cy="751" r="15" fill="#b27a45"/>
        <circle cx="500" cy="688" r="15" fill="#b27a45"/>
        <circle cx="436" cy="751" r="15" fill="#b27a45"/>
        <circle cx="500" cy="812" r="17" fill="#b27a45"/>
        <!-- mound -->
        <circle cx="500" cy="757" r="10" fill="#bb834c" stroke="#9c6838" stroke-width="1"/>
        <rect x="497.5" y="755.5" width="5" height="2.4" rx="0.6" fill="#f3f5f3"/>

        <!-- foul lines -->
        <path d="M500,812 L268,581 M500,812 L732,581" stroke="#f4f7f4" stroke-width="2.4" opacity=".85"/>
        <!-- batter's boxes + catcher box (chalk) -->
        <g stroke="#f4f7f4" stroke-width="1.5" fill="none" opacity=".8">
          <rect x="486" y="804" width="9" height="18"/><rect x="505" y="804" width="9" height="18"/>
          <rect x="491" y="822" width="18" height="11"/>
        </g>
        <!-- bases (white) -->
        <g fill="#f4f6f4" stroke="#c9ccc9" stroke-width="0.5">
          <rect x="559" y="746" width="9" height="9" rx="1.5" transform="rotate(45 563.5 750.5)"/>
          <rect x="495.5" y="683" width="9" height="9" rx="1.5" transform="rotate(45 500 687.5)"/>
          <rect x="431.5" y="746" width="9" height="9" rx="1.5" transform="rotate(45 436 750.5)"/>
        </g>
        <path d="M495,814 L505,814 L505,820 L500,825 L495,820 Z" fill="#f4f6f4"/>

        <!-- on-deck circles -->
        <circle cx="452" cy="846" r="7" fill="#b27a45" opacity=".9"/>
        <circle cx="548" cy="846" r="7" fill="#b27a45" opacity=".9"/>

        <!-- dugouts -->
        <g>
          <rect x="392" y="792" width="92" height="17" rx="4" transform="rotate(45 438 800)" fill="#14171c" stroke="#2a3550" stroke-width="1.4"/>
          <rect x="516" y="792" width="92" height="17" rx="4" transform="rotate(-45 562 800)" fill="#14171c" stroke="#2a3550" stroke-width="1.4"/>
        </g>

        <!-- bullpens beyond the outfield wall -->
        <g>
          <rect x="276" y="404" width="74" height="26" rx="5" transform="rotate(-52 313 417)" fill="#a9763f" stroke="#8c6030" stroke-width="1.2" opacity=".95"/>
          <circle cx="299" cy="430" r="3.4" fill="#caa06a"/><circle cx="326" cy="404" r="3.4" fill="#caa06a"/>
          <rect x="650" y="404" width="74" height="26" rx="5" transform="rotate(52 687 417)" fill="#a9763f" stroke="#8c6030" stroke-width="1.2" opacity=".95"/>
          <circle cx="701" cy="430" r="3.4" fill="#caa06a"/><circle cx="674" cy="404" r="3.4" fill="#caa06a"/>
        </g>

        <!-- backstop screen behind home -->
        <path d="M432,848 Q500,878 568,848" fill="none" stroke="#39414f" stroke-width="2.4" opacity=".75"/>
        <!-- foul poles -->
        <path d="M267,582 L267,553 M733,582 L733,553" stroke="#f2c200" stroke-width="3" stroke-linecap="round"/>
        <circle cx="267" cy="582" r="5" fill="#f2c200" stroke="#0b0c0e" stroke-width="1"/>
        <circle cx="733" cy="582" r="5" fill="#f2c200" stroke="#0b0c0e" stroke-width="1"/>

        <!-- distance markers -->
        <g fill="#eef3ee" font-family="Oswald,sans-serif" font-weight="600" font-size="13" opacity=".82" text-anchor="middle">
          <text x="286" y="576">330</text>
          <text x="360" y="476">385</text>
          <text x="500" y="438">395</text>
          <text x="640" y="476">385</text>
          <text x="714" y="576">330</text>
        </g>

        <!-- ===== field-level seating ring (generated) ===== -->
        <g id="seats"></g>
      </svg>
      <div class="bowl-cap">Field Level · Overhead</div>
    </div>
  </section>

<script>
  (function(){
    const NS='http://www.w3.org/2000/svg';
    const HP={x:500,y:815};

    /* ---- radial mow stripes (fan from home plate) ---- */
    const mow=document.getElementById('mow');
    const SEG=14, A0=-135, A1=-45, R=470;
    const dir=d=>({x:Math.cos(d*Math.PI/180),y:Math.sin(d*Math.PI/180)});
    for(let i=0;i<SEG;i++){
      if(i%2) continue;
      const a=A0+i*(A1-A0)/SEG, b=A0+(i+1)*(A1-A0)/SEG;
      const p1=dir(a), p2=dir(b);
      const path=document.createElementNS(NS,'path');
      path.setAttribute('d',`M${HP.x},${HP.y} L${(HP.x+R*p1.x).toFixed(1)},${(HP.y+R*p1.y).toFixed(1)} A${R} ${R} 0 0 1 ${(HP.x+R*p2.x).toFixed(1)},${(HP.y+R*p2.y).toFixed(1)} Z`);
      path.setAttribute('fill','#368a48');path.setAttribute('opacity','.55');
      mow.appendChild(path);
    }

    /* ---- field-level seating ring ---- */
    const seats=document.getElementById('seats');
    // inner edge of the field-level seats (LF corner -> behind home -> RF corner)
    const CP=[
      {x:250,y:545},{x:210,y:610},{x:194,y:672},{x:248,y:760},{x:356,y:838},
      {x:438,y:878},{x:500,y:896},{x:562,y:878},{x:644,y:838},{x:752,y:760},
      {x:806,y:672},{x:790,y:610},{x:750,y:545}
    ];
    function catmull(pts,sps){
      const P=[pts[0]].concat(pts).concat([pts[pts.length-1]]);
      const out=[];
      for(let i=1;i<P.length-2;i++){
        const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
        for(let t=0;t<sps;t++){
          const u=t/sps,u2=u*u,u3=u2*u;
          out.push({
            x:0.5*((2*p1.x)+(-p0.x+p2.x)*u+(2*p0.x-5*p1.x+4*p2.x-p3.x)*u2+(-p0.x+3*p1.x-3*p2.x+p3.x)*u3),
            y:0.5*((2*p1.y)+(-p0.y+p2.y)*u+(2*p0.y-5*p1.y+4*p2.y-p3.y)*u2+(-p0.y+3*p1.y-3*p2.y+p3.y)*u3)
          });
        }
      }
      out.push(P[P.length-2]);
      return out;
    }
    function resample(d,N){
      const L=[0];for(let i=1;i<d.length;i++)L.push(L[i-1]+Math.hypot(d[i].x-d[i-1].x,d[i].y-d[i-1].y));
      const tot=L[L.length-1],out=[];let j=0;
      for(let k=0;k<=N;k++){
        const target=tot*k/N;
        while(j<L.length-2&&L[j+1]<target)j++;
        const seg=(L[j+1]-L[j])||1,f=(target-L[j])/seg;
        out.push({x:d[j].x+(d[j+1].x-d[j].x)*f,y:d[j].y+(d[j+1].y-d[j].y)*f});
      }
      return out;
    }
    const dense=catmull(CP,24);
    const N=54, pts=resample(dense,N);
    const C0={x:500,y:660}, DEPTH=58, GAP=1.6;
    const nums=[];
    for(let i=0;i<27;i++)nums[i]=53-2*i;     // 3B / left side: odd descending to 1
    for(let i=0;i<27;i++)nums[27+i]=2+2*i;   // 1B / right side: even ascending to 54
    for(let i=0;i<N;i++){
      let a={...pts[i]}, b={...pts[i+1]};
      const tx=b.x-a.x, ty=b.y-a.y, tl=Math.hypot(tx,ty)||1;
      const ux=tx/tl, uy=ty/tl;          // tangent
      let nx=-uy, ny=ux;                  // normal
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      if((nx*(mx-C0.x)+ny*(my-C0.y))<0){nx=-nx;ny=-ny;}   // point away from field
      // shrink slightly along tangent for aisle gaps
      a={x:a.x+ux*GAP,y:a.y+uy*GAP}; b={x:b.x-ux*GAP,y:b.y-uy*GAP};
      const a2={x:a.x+nx*DEPTH,y:a.y+ny*DEPTH}, b2={x:b.x+nx*DEPTH,y:b.y+ny*DEPTH};
      const poly=document.createElementNS(NS,'path');
      poly.setAttribute('d',`M${a.x.toFixed(1)},${a.y.toFixed(1)} L${b.x.toFixed(1)},${b.y.toFixed(1)} L${b2.x.toFixed(1)},${b2.y.toFixed(1)} L${a2.x.toFixed(1)},${a2.y.toFixed(1)} Z`);
      poly.setAttribute('fill','url(#seatg)');
      poly.setAttribute('stroke','#5b8fe6');poly.setAttribute('stroke-width','1.2');
      poly.setAttribute('stroke-linejoin','round');
      seats.appendChild(poly);
      // section number
      const t=document.createElementNS(NS,'text');
      t.setAttribute('class','seatnum');
      t.setAttribute('x',(mx+nx*DEPTH*0.52).toFixed(1));
      t.setAttribute('y',(my+ny*DEPTH*0.52+3.5).toFixed(1));
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','11');
      t.textContent=nums[i];
      seats.appendChild(t);
    }
  })();
</script>
</body>
</html>
