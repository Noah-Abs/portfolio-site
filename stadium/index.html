<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Dodger Stadium — DROPTHIRD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  :root{--dodger:#005A9C;--dodger-br:#3a86e0;--dodger-gl:rgba(58,134,224,.20)}
  body{background:var(--bg,#0b0c0e);color:var(--text,#fff);font-family:"Oswald",sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

  .topbar{display:flex;align-items:center;gap:12px;padding:20px 28px;position:relative;z-index:3}
  .brand-link{text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:9px}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:21px;letter-spacing:1px;line-height:1;color:var(--text,#fff)}
  .brand-sub{font-weight:500;text-transform:uppercase;letter-spacing:4px;font-size:9px;color:var(--muted,#7e858f)}

  .hero{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:48px 28px 72px;position:relative}
  .glow{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);width:min(900px,120vw);height:560px;
    background:radial-gradient(ellipse at center,var(--dodger-gl),transparent 66%);pointer-events:none;z-index:0}
  .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none;overflow:hidden}
  .ghost img{width:min(70vh,760px);opacity:.05;filter:grayscale(.2)}

  .wrap{position:relative;z-index:1;width:100%;max-width:1000px}
  .badge{display:inline-flex;align-items:center;gap:9px;font-weight:600;text-transform:uppercase;letter-spacing:3px;font-size:11px;
    color:var(--text2,#cfd4da);border:1px solid var(--border2,#2a2f37);border-radius:999px;padding:7px 16px;margin-bottom:30px;background:var(--panel,#101115)}
  .badge img{width:16px;height:16px;object-fit:contain}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--dodger-br);box-shadow:0 0 0 4px var(--dodger-gl)}
  .eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:6px;font-size:13px;color:var(--dodger-br);margin-bottom:14px}
  .h1{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(52px,12vw,164px);line-height:.84;letter-spacing:2px;color:var(--text,#fff);
    text-shadow:0 6px 60px var(--dodger-gl)}
  .rule{width:96px;height:5px;border-radius:3px;margin:30px auto 24px;
    background:linear-gradient(90deg,var(--dodger),var(--dodger-br))}
  .sub{font-weight:300;letter-spacing:4px;text-transform:uppercase;font-size:clamp(12px,2vw,16px);color:var(--muted,#7e858f)}
  .sub b{color:var(--text2,#cfd4da);font-weight:500}

  .facts{margin-top:54px;display:grid;grid-template-columns:repeat(4,1fr);gap:13px;text-align:left}
  .fact{background:var(--panel,#101115);border:1px solid var(--border,#1b1e24);border-radius:14px;padding:17px 18px;
    border-top:2px solid var(--dodger-br)}
  .fact .k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted,#7e858f)}
  .fact .v{font-family:"Anton",sans-serif;font-size:27px;line-height:1.05;margin-top:7px;letter-spacing:.5px}
  .fact .v small{font-family:"Oswald",sans-serif;font-weight:500;font-size:13px;color:var(--text3,#aab0b9);letter-spacing:.5px}

  @media(max-width:820px){.facts{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.topbar{padding:16px 16px}.hero{padding:30px 16px 56px}.facts{grid-template-columns:1fr 1fr;gap:10px}.fact .v{font-size:22px}}
</style>
<script src="/settings.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="/dropthird/homescreen/"><span class="brand">DROPTHIRD</span><span class="brand-sub">Ballparks</span></a>
  </header>

  <main class="hero">
    <div class="glow"></div>
    <div class="ghost"><img src="https://www.mlbstatic.com/team-logos/119.svg" alt=""></div>
    <div class="wrap">
      <div class="badge"><img src="https://www.mlbstatic.com/team-logos/119.svg" alt="">Los Angeles, California</div>
      <div class="eyebrow">MLB Ballpark</div>
      <h1 class="h1">Dodger Stadium</h1>
      <div class="rule"></div>
      <p class="sub">Home of the <b>Los Angeles Dodgers</b> · Chavez Ravine</p>

      <div class="facts">
        <div class="fact"><div class="k">Opened</div><div class="v">1962</div></div>
        <div class="fact"><div class="k">Capacity</div><div class="v">56,000</div></div>
        <div class="fact"><div class="k">Surface</div><div class="v">Grass</div></div>
        <div class="fact"><div class="k">Field <small>(L · C · R)</small></div><div class="v">330·395·330</div></div>
      </div>
    </div>
  </main>
</body>
</html>
