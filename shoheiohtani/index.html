<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Shohei Ohtani | Statcast, Visuals & Advanced Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;color:#1b1f24;font-family:"Roboto",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:inherit}
  .nav{display:flex;align-items:center;gap:26px;padding:10px 22px;border-bottom:2px solid #e6e9ec}
  .nav .logo{display:flex;align-items:center;gap:9px;font-family:"Roboto",sans-serif;font-weight:900;font-size:18px;letter-spacing:-.5px;color:#0a2342}
  .nav .logo .ball{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #c8102e;position:relative;flex:0 0 auto}
  .nav .logo .ball:before,.nav .logo .ball:after{content:"";position:absolute;top:3px;bottom:3px;width:5px;border:1px solid #c8102e;border-radius:50%}
  .nav .logo .ball:before{left:3px;border-right:0}.nav .logo .ball:after{right:3px;border-left:0}
  .nav .logo b{color:#c8102e}
  .nav .navlink{font-size:13px;color:#3a4450;text-decoration:none;font-weight:500}
  .nav .navlink:hover{color:#157f8c}
  .nav .navlink.new:after{content:"NEW";background:#c8102e;color:#fff;font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;margin-left:4px;vertical-align:top}
  .wrap{max-width:1340px;margin:0 auto;padding:20px 16px 80px}

  .grid3{display:grid;grid-template-columns:330px 1fr 430px;gap:16px;align-items:start}
  .panel{background:#fff;border:1px solid #e2e7ec;border-radius:8px}
  .panel-h{position:relative;text-align:center;padding:13px 14px 0;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:18px;color:#222}
  .panel-h .yr{color:#157f8c}
  .panel-h:after{content:"";display:block;width:70px;height:0;border-bottom:3px dotted #157f8c;margin:8px auto 0}
  .panel-b{padding:14px 16px 18px}

  /* player card */
  .pc-banner{position:relative;height:150px;border-radius:8px 8px 0 0;overflow:hidden;background:linear-gradient(150deg,#1f4e8c,#0a2342)}
  .pc-banner img{width:100%;height:100%;object-fit:cover;object-position:top center;opacity:.92}
  .pc-shot{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
    border:4px solid #fff;object-fit:cover;background:#dfe4ea;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .pc-body{padding:44px 16px 16px;text-align:center}
  .pc-name{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:25px;line-height:1.05}
  .pc-sub{color:#3a4450;font-size:14px;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:6px}
  .pc-sub b{color:#157f8c}.pc-sub img{width:18px;height:18px;object-fit:contain}
  .pc-bio{color:#6b757f;font-size:12px;margin-top:3px}
  table.std{width:100%;border-collapse:collapse;margin-top:13px;font-variant-numeric:tabular-nums}
  table.std th,table.std td{font-size:11.5px;padding:5px 3px;text-align:right;border-bottom:1px solid #eef1f4;white-space:nowrap}
  table.std th{color:#9aa3ac;font-weight:700;font-size:10px}
  table.std td:first-child,table.std th:first-child{text-align:left;font-weight:500}
  table.std tr.tot td{background:#f0f3f6;font-weight:700;border-top:2px solid #d7dde2}
  .apps{margin-top:16px;text-align:center}
  .apps-h{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:16px;margin-bottom:8px}
  .apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;color:#157f8c}
  .apps-grid span{cursor:default}

  /* percentile rankings */
  .pr-scale{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:#aab2ba;letter-spacing:1px;margin:4px 0 2px;padding:0 52px 0 158px}
  .pr-grp{display:flex;align-items:center;gap:7px;font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:15px;color:#222;margin:13px 0 4px;border-bottom:1px solid #edf0f3;padding-bottom:3px}
  .pr-grp svg{width:17px;height:17px;fill:#5b6671}
  .pr-row{display:flex;align-items:center;gap:8px;margin:8px 0}
  .pr-label{flex:0 0 150px;font-size:12px;color:#3a4450;text-align:right;line-height:1.05}
  .pr-track{position:relative;flex:1;height:4px;background:#e9edf0;border-radius:3px}
  .pr-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px}
  .pr-bub{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:24px;height:24px;border-radius:12px;padding:0 2px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2}
  .pr-row.muted .pr-track{opacity:.5}
  .pr-val{flex:0 0 46px;font-size:12.5px;font-weight:700;color:#1b1f24;text-align:right;font-variant-numeric:tabular-nums}

  /* spray + rolling */
  .legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:#4a5460}
  .legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%}
  .subnote{font-size:10.5px;color:#aab2ba;text-align:center;margin-top:8px}

  /* tab bars */
  .tabs{display:flex;justify-content:center;gap:0;margin:26px 0 0}
  .tabs .tab{padding:9px 22px;font-size:12.5px;font-weight:700;letter-spacing:.4px;color:#3a4450;background:#eef1f4;border:1px solid #dfe4e8;cursor:default}
  .tabs .tab:first-child{border-radius:5px 0 0 5px}.tabs .tab:last-child{border-radius:0 5px 5px 0}
  .tabs .tab.on{background:#0d7c8e;color:#fff;border-color:#0d7c8e}
  .subtabs{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin-top:14px;background:#f0f3f6;border-radius:6px;padding:4px;width:fit-content;margin-left:auto;margin-right:auto}
  .subtabs .st{padding:6px 14px;font-size:11.5px;font-weight:700;color:#5a636d;border-radius:5px;cursor:default}
  .subtabs .st.on{background:#fff;color:#0d7c8e;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .subtabs .st .nw{color:#c8102e;font-size:8px;vertical-align:top;margin-left:2px}

  /* big stat tables */
  .tblsec{margin-top:34px}
  .tblsec .panel-h{font-size:20px}
  .scroller{overflow-x:auto;margin-top:14px;scrollbar-width:thin}
  table.big{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
  table.big th,table.big td{font-size:12.5px;padding:7px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid #eef1f4}
  table.big thead th{color:#5a636d;font-weight:700;font-size:11px;border-bottom:2px solid #d7dde2;position:sticky;top:0;background:#fff}
  table.big td:first-child,table.big th:first-child{text-align:left;font-weight:600}
  table.big tr.tot td{background:#eef1f4;font-weight:700;border-top:2px solid #cfd6dc}
  table.big tr.mlb td{color:#8a939c;font-style:italic}
  .ars .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .footnote{font-size:11px;color:#c0392b;margin-top:7px}
  .state{color:#8a939c;text-align:center;padding:40px;font-size:13px}
  @media(max-width:1180px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="nav">
    <a class="logo" href="/dropthird/homescreen/"><span class="ball"></span>DROP<b>THIRD</b></a>
    <a class="navlink" href="/dropthird/standings/">Scoreboard</a>
    <a class="navlink" href="/dropthird/leaders-hitting/">Statistics</a>
    <a class="navlink" href="/dropthird/clubs/">Visuals</a>
    <span class="navlink new">Leaderboards</span>
  </div>
  <div class="wrap">
    <div id="app"><div class="state">Loading Shohei Ohtani…</div></div>
  </div>

<script>
  const ID=660271, YEAR=new Date().getFullYear();
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const SAV='https://baseballsavant.mlb.com';
  const logo=id=>`https://www.mlbstatic.com/team-logos/${id}.svg`;
  const num=v=>(v==null||v===''||isNaN(+v))?null:+v;
  const d3=v=>{const n=num(v);return n==null?'–':n.toFixed(3).replace(/^0(?=\.)/,'').replace(/^-0(?=\.)/,'-');};
  const d1=v=>{const n=num(v);return n==null?'–':n.toFixed(1);};
  const sgn=v=>{const n=num(v);return n==null?'–':(n>0?'+':'')+Math.round(n);};

  function parseCSV(text){
    const lines=text.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.length);
    const rows=lines.map(l=>{const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){const ch=l[i];
        if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
        else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}
      out.push(cur);return out;});
    const hdr=rows.shift();return rows.map(r=>{const o={};hdr.forEach((h,i)=>o[h]=r[i]);return o;});
  }
  const j=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  const csv=u=>fetch(u).then(r=>r.ok?r.text():'').then(t=>t?parseCSV(t):[]).catch(()=>[]);
  const find=(rows,id,key)=>rows.find(o=>+o[key||'player_id']===id)||null;

  function pctColor(p){
    const lo=[42,87,161],mid=[155,159,165],hi=[210,45,73];
    const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
    const c=p<=50?mix(lo,mid,p/50):mix(mid,hi,(p-50)/50);
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  function pctRank(values,x,minPool){
    if(x==null)return null;const arr=values.filter(v=>v!=null&&!isNaN(v)).sort((a,b)=>a-b);
    if(arr.length<(minPool||10))return null;let below=0;for(const v of arr)if(v<x)below++;
    return Math.max(1,Math.min(99,Math.round(100*below/(arr.length-1))));
  }
  // heat shading for table cells (good=red, bad=blue) around a midpoint
  function heat(v,lo,hi){const n=num(v);if(n==null)return '';let t=(n-lo)/(hi-lo);t=Math.max(0,Math.min(1,t));
    const a=(Math.abs(t-.5)*2*0.5).toFixed(2);
    return t>=.5?`background:rgba(214,45,73,${a})`:`background:rgba(42,87,161,${a})`;}

  const ICON={
    Value:'<svg viewBox="0 0 24 24"><path d="M18 4h-2V2H8v2H6a2 2 0 0 0-2 2v2a4 4 0 0 0 4 4 4 4 0 0 0 1 .6V16H8v2h8v-2h-3v-3.4A4 4 0 0 0 14 12a4 4 0 0 0 4-4V6a2 2 0 0 0-2-2zM6 8V6h2v3.9A2 2 0 0 1 6 8zm12 0a2 2 0 0 1-2 1.9V6h2z"/></svg>',
    Batting:'<svg viewBox="0 0 24 24"><path d="M20 3.5 18.5 2 8 12.5l-3-3L3 11.5l4.5 4.5L4 19.5 5.5 21 9 17.5l1.5 1.5L12.5 17l-3-3z"/></svg>',
    Fielding:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 4 7 13 7 13s7-9 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>',
    Running:'<svg viewBox="0 0 24 24"><path d="M13.5 5.5a2 2 0 1 0-2-2 2 2 0 0 0 2 2zM9 21l1.8-4.4 2.2 2.1V22h2v-4.9l-2.3-2.2.7-3a6 6 0 0 0 4.6 2.1v-2a4.3 4.3 0 0 1-3.7-2.1l-1-1.6a2 2 0 0 0-2.6-.8L6 7.2V11h2V8.6l1.8-.7L8 17l-3.1 4z"/></svg>'};

  function stdTable(yby,career,seasons){
    const cols=[['PA','plateAppearances'],['AB','atBats'],['R','runs'],['H','hits'],['HR','homeRuns'],['SB','stolenBases'],
      ['AVG','avg'],['OBP','obp'],['SLG','slg'],['OPS','ops']],rate=new Set(['avg','obp','slg','ops']);
    const cell=(st,k)=>rate.has(k)?d3(st[k]):(st[k]!=null?st[k]:'–');
    let h='<table class="std"><thead><tr><th></th>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr></thead><tbody>';
    yby.slice(-3).forEach(sp=>{h+=`<tr><td>${esc(sp.season)}</td>`+cols.map(c=>`<td>${esc(cell(sp.stat,c[1]))}</td>`).join('')+'</tr>';});
    if(career)h+=`<tr class="tot"><td>${seasons} Seasons</td>`+cols.map(c=>`<td>${esc(cell(career,c[1]))}</td>`).join('')+'</tr>';
    return h+'</tbody></table>';
  }

  function percentilePanel(x){
    const P=x.pct||{};
    const groups=[
      ['Value',[
        {l:'Batting Run Value',pct:x.battingRV_pct,raw:x.battingRV==null?'–':Math.round(x.battingRV)},
        {l:'Baserunning Run Value',pct:x.baserunRV_pct,raw:x.baserunRV==null?'–':Math.round(x.baserunRV)},
        {l:'Fielding Run Value',pct:null,raw:'–',muted:true},
      ]],
      ['Batting',[
        {l:'xwOBA',pct:num(P.xwoba),raw:d3(x.xst&&x.xst.est_woba)},
        {l:'xBA',pct:num(P.xba),raw:d3(x.xst&&x.xst.est_ba)},
        {l:'xSLG',pct:num(P.xslg),raw:d3(x.xst&&x.xst.est_slg)},
        {l:'Avg Exit Velocity',pct:num(P.exit_velocity),raw:d1(x.cu&&x.cu.exit_velocity_avg)},
        {l:'Barrel %',pct:num(P.brl_percent),raw:d1(x.cu&&x.cu.barrel_batted_rate)},
        {l:'Hard-Hit %',pct:num(P.hard_hit_percent),raw:d1(x.cu&&x.cu.hard_hit_percent)},
        {l:'Bat Speed',pct:num(P.bat_speed),raw:d1(x.cu&&x.cu.avg_swing_speed)},
        {l:'Squared-Up %',pct:num(P.squared_up_rate),raw:d1(x.squaredUp)},
        {l:'Chase %',pct:num(P.chase_percent),raw:d1(x.cu&&x.cu.oz_swing_percent)},
        {l:'Whiff %',pct:num(P.whiff_percent),raw:d1(x.cu&&x.cu.whiff_percent)},
        {l:'K %',pct:num(P.k_percent),raw:d1(x.cu&&x.cu.k_percent)},
        {l:'BB %',pct:num(P.bb_percent),raw:d1(x.cu&&x.cu.bb_percent)},
      ]],
      ['Running',[
        {l:'Sprint Speed',pct:num(P.sprint_speed),raw:d1(x.spd&&x.spd.sprint_speed)},
      ]],
    ];
    let h='<div class="pr-scale"><span>POOR</span><span>AVERAGE</span><span>GREAT</span></div>';
    groups.forEach(([grp,rows])=>{
      const body=rows.map(r=>{
        if(r.pct==null){return `<div class="pr-row muted"><div class="pr-label">${esc(r.l)}</div>
          <div class="pr-track"></div><div class="pr-val">${esc(r.raw)}</div></div>`;}
        const col=pctColor(r.pct);
        return `<div class="pr-row"><div class="pr-label">${esc(r.l)}</div>
          <div class="pr-track"><div class="pr-fill" style="width:${r.pct}%;background:${col}"></div>
            <div class="pr-bub" style="left:${r.pct}%;background:${col}">${r.pct}</div></div>
          <div class="pr-val">${esc(r.raw)}</div></div>`;
      }).join('');
      h+=`<div class="pr-grp">${ICON[grp]||''}${grp}</div>`+body;
    });
    return h;
  }

  function sprayPanel(rows){
    const EV={single:'#ef8a3a',double:'#6f54c9',triple:'#e0c000',home_run:'#d6336c'};
    const pts=rows.filter(r=>EV[r.events]&&num(r.hc_x)!=null&&num(r.hc_y)!=null);
    const dots=pts.map(r=>`<circle cx="${(+r.hc_x).toFixed(1)}" cy="${(+r.hc_y).toFixed(1)}" r="2.6" fill="${EV[r.events]}" fill-opacity=".88"/>`).join('');
    const field=`<path d="M125,201 L33,109 A 96 96 0 0 1 217,109 Z" fill="#cfe6c6"/>
      <path d="M125,201 L33,109 A 96 96 0 0 1 217,109" fill="none" stroke="#9cc49a" stroke-width="1.3"/>
      <path d="M125,201 L93,168 L125,135 L157,168 Z" fill="#e6d3ad"/>
      <line x1="125" y1="201" x2="41" y2="116" stroke="#fff" stroke-width="1.3"/>
      <line x1="125" y1="201" x2="209" y2="116" stroke="#fff" stroke-width="1.3"/>
      <rect x="122" y="198" width="6" height="6" fill="#fff" transform="rotate(45 125 201)"/>`;
    return `<svg viewBox="0 0 250 210" style="width:100%;height:auto;display:block">${field}${dots}</svg>
      <div class="legend"><span><i style="background:#ef8a3a"></i>Single</span><span><i style="background:#6f54c9"></i>Double</span>
      <span><i style="background:#e0c000"></i>Triple</span><span><i style="background:#d6336c"></i>Home Run</span></div>`;
  }

  function rollingPanel(rows){
    const seq=rows.filter(r=>num(r.estimated_woba_using_speedangle)!=null)
      .map(r=>({d:r.game_date,v:+r.estimated_woba_using_speedangle})).reverse();
    if(seq.length<6)return '<div class="subnote">Not enough batted-ball data.</div>';
    const W=Math.min(40,Math.max(8,Math.floor(seq.length/3))),line=[];
    for(let i=W-1;i<seq.length;i++){let s=0;for(let k=i-W+1;k<=i;k++)s+=seq[k].v;line.push(s/W);}
    const w=400,h=130,pad=6,mn=Math.min(.2,...line),mx=Math.max(.5,...line);
    const X=i=>pad+i*(w-2*pad)/(line.length-1||1),Y=v=>h-pad-(v-mn)/(mx-mn||1)*(h-2*pad);
    const path=line.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    const avgY=Y(.32).toFixed(1);
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
      <line x1="${pad}" y1="${avgY}" x2="${w-pad}" y2="${avgY}" stroke="#bbb" stroke-dasharray="4 3" stroke-width="1"/>
      <text x="${w-pad}" y="${(+avgY-3)}" text-anchor="end" font-size="9" fill="#999">LG AVG</text>
      <path d="${path}" fill="none" stroke="#c8102e" stroke-width="2"/></svg>
      <div class="subnote">Rolling xwOBA over last ${W} batted balls · ${YEAR}</div>`;
  }

  function statcastTable(seasonRows){
    const cols=[['Season','season'],['PA','pa'],['BA','ba'],['xBA','est_ba'],['SLG','slg'],['xSLG','est_slg'],
      ['wOBA','woba'],['xwOBA','est_woba']];
    const rate=new Set(['ba','est_ba','slg','est_slg','woba','est_woba']);
    let h='<div class="scroller"><table class="big"><thead><tr>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr></thead><tbody>';
    seasonRows.forEach(r=>{
      h+='<tr>'+cols.map(c=>{
        let v=r[c[1]];if(c[1]==='season')return `<td>${esc(v)}</td>`;
        const disp=rate.has(c[1])?d3(v):(v!=null&&v!==''?Math.round(+v):'–');
        let style='';if(c[1]==='est_ba')style=heat((num(r.est_ba)||0)-(num(r.ba)||0)+.5,.4,.6);
        if(c[1]==='est_slg')style=heat((num(r.est_slg)||0)-(num(r.slg)||0)+.5,.35,.65);
        if(c[1]==='est_woba')style=heat((num(r.est_woba)||0)-(num(r.woba)||0)+.5,.4,.6);
        return `<td style="${style}">${esc(disp)}</td>`;
      }).join('')+'</tr>';
    });
    return h+'</tbody></table></div>';
  }

  const PCOL={FF:'#d6273a',FA:'#d6273a',SI:'#f0663b',FC:'#f0973b',FS:'#23a06a',CH:'#2fb673',SC:'#2fb673',
    SL:'#3b82f0',ST:'#5b8def',SV:'#6b6bf0',CU:'#9b5cf0',KC:'#b05cf0',CS:'#9b5cf0',KN:'#8a909a',EP:'#8a909a'};
  function arsenalTable(arsSplits,savRows){
    if(!arsSplits||!arsSplits.length)return '';
    const savMap={};(savRows||[]).forEach(r=>{if(+r.player_id===ID)savMap[r.pitch_type]=r;});
    const ps=arsSplits.map(s=>s.stat).filter(p=>p&&p.type).sort((a,b)=>(b.percentage||0)-(a.percentage||0));
    const head='<tr><th>Pitch Type</th><th>Usage</th><th>Velo</th><th>Whiff%</th><th>K%</th><th>Put-Away%</th><th>BA</th><th>xwOBA</th><th>Hard-Hit%</th></tr>';
    const body=ps.map(p=>{const code=p.type.code,sv=savMap[code]||{},col=PCOL[code]||'#6b727c';
      return `<tr><td><span class="pdot" style="background:${col}"></span>${esc(p.type.description||code)}</td>
        <td>${d1((p.percentage||0)*100)}%</td><td>${p.averageSpeed!=null?(+p.averageSpeed).toFixed(1):'–'}</td>
        <td>${d1(sv.whiff_percent)}</td><td>${d1(sv.k_percent)}</td><td>${d1(sv.put_away)}</td>
        <td>${d3(sv.ba)}</td><td>${d3(sv.est_woba)}</td><td>${d1(sv.hard_hit_percent)}</td></tr>`;}).join('');
    return `<div class="tblsec"><div class="panel-h"><span class="yr">${YEAR}</span> Pitch Arsenal</div>
      <div class="scroller"><table class="big ars">${head}${body}</table></div></div>`;
  }

  (async function(){
    const [bio,sj,pctR,cuR,xstR,spdR,stR,brR,sprayR,arsJ,arsSav,btR]=await Promise.all([
      j(`https://statsapi.mlb.com/api/v1/people/${ID}?hydrate=currentTeam`),
      j(`https://statsapi.mlb.com/api/v1/people/${ID}/stats?stats=yearByYear,career&group=hitting`),
      csv(`${SAV}/leaderboard/percentile-rankings?type=batter&csv=true`),
      csv(`${SAV}/leaderboard/custom?year=${YEAR}&type=batter&filter=&min=q&selections=exit_velocity_avg,barrel_batted_rate,hard_hit_percent,sweet_spot_percent,avg_swing_speed,squared_up_per_swing,k_percent,bb_percent,whiff_percent,oz_swing_percent&chart=false&x=exit_velocity_avg&csv=true`),
      csv(`${SAV}/leaderboard/expected_statistics?type=batter&year=${YEAR}&min=1&csv=true`),
      csv(`${SAV}/leaderboard/sprint_speed?type=batter&year=${YEAR}&min=1&csv=true`),
      csv(`${SAV}/leaderboard/swing-take?type=batter&year=${YEAR}&csv=true`),
      csv(`${SAV}/leaderboard/baserunning?type=runner&year=${YEAR}&csv=true`),
      csv(`${SAV}/statcast_search/csv?all=true&type=details&player_type=batter&batters_lookup%5B%5D=${ID}&hfSea=${YEAR}%7C&hfBBT=&hfBBL=`),
      j(`https://statsapi.mlb.com/api/v1/people/${ID}/stats?stats=pitchArsenal&group=pitching&season=${YEAR}`),
      csv(`${SAV}/leaderboard/pitch-arsenal-stats?type=pitcher&year=${YEAR}&min=1&csv=true`),
      csv(`${SAV}/leaderboard/bat-tracking?minSwings=q&type=batter&seasonStart=${YEAR}&seasonEnd=${YEAR}&csv=true`),
    ]);

    const person=bio&&bio.people&&bio.people[0],tm=person&&person.currentTeam;
    const grp=(t)=>(sj&&sj.stats||[]).find(s=>s.type&&s.type.displayName===t&&s.group&&s.group.displayName==='hitting');
    const yby=((grp('yearByYear')||{}).splits||[]).filter(sp=>sp.stat);
    const career=((grp('career')||{}).splits||[])[0]&&grp('career').splits[0].stat;
    const seasons=new Set(yby.map(s=>s.season)).size;

    // value-section percentiles (rank the population)
    const stMe=find(stR,ID),brMe=find(brR,ID,'entity_id');
    const stVals=stR.filter(r=>num(r.pa)>=150).map(r=>num(r.runs_all));
    const brVals=brR.map(r=>num(r.runner_runs));
    const btMe=find(btR,ID,'id');
    const x={pct:find(pctR,ID),cu:find(cuR,ID),xst:find(xstR,ID),spd:find(spdR,ID),
      squaredUp:btMe&&num(btMe.squared_up_per_swing)!=null?num(btMe.squared_up_per_swing)*100:null,
      battingRV:stMe?num(stMe.runs_all):null, battingRV_pct:stMe?pctRank(stVals,num(stMe.runs_all),30):null,
      baserunRV:brMe?num(brMe.runner_runs):null, baserunRV_pct:brMe?pctRank(brVals,num(brMe.runner_runs),30):null};

    const arsSplits=((arsJ&&arsJ.stats||[]).find(s=>s.type&&s.type.displayName==='pitchArsenal')||{}).splits||[];
    const pos=person&&person.primaryPosition&&person.primaryPosition.abbreviation;
    const bt=[person&&person.batSide&&person.batSide.code,person&&person.pitchHand&&person.pitchHand.code].filter(Boolean).join('/');
    const bio2=[person&&person.height,person&&person.weight?person.weight+' lbs':null,person&&person.currentAge?'Age '+person.currentAge:null].filter(Boolean).join(' · ');
    const banner=`https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:action:hero:current.png/w_640,q_auto:good/v1/people/${ID}/action/hero/current`;
    const shot=`https://img.mlbstatic.com/mlb-photos/image/upload/w_180,q_auto:best/v1/people/${ID}/headshot/67/current`;

    const card=`<div class="panel">
      <div class="pc-banner"><img src="${banner}" onerror="this.style.display='none'"><img class="pc-shot" src="${shot}" onerror="this.src='https://midfield.mlbstatic.com/v1/people/${ID}/spots/120'"></div>
      <div class="pc-body">
        <div class="pc-name">${esc(person?person.fullName:'Shohei Ohtani')}</div>
        <div class="pc-sub"><b>${esc(pos||'TWP')}</b> | ${tm?`<img src="${logo(tm.id)}" onerror="this.remove()">`:''}${esc(tm?tm.name:'Los Angeles Dodgers')}</div>
        <div class="pc-bio">Bats/Throws: ${esc(bt||'L/R')}${bio2?' · '+esc(bio2):''}</div>
        ${stdTable(yby,career,seasons)}
        <div class="apps"><div class="apps-h">Player Apps</div><div class="apps-grid">
          <span>Illustrator</span><span>Random Video</span><span>Pitch Highlighter</span><span>Shifts</span>
          <span>Player Comparison</span><span>Swing Take Profile</span><span>Player Similarity</span><span>Zone Swing Profile</span>
        </div></div>
      </div></div>`;
    const pctPanel=`<div class="panel"><div class="panel-h"><span class="yr">${YEAR}</span> MLB Percentile Rankings</div><div class="panel-b">${percentilePanel(x)}</div></div>`;
    const sprayP=`<div class="panel"><div class="panel-h"><span class="yr">${YEAR}</span> Hits Spray Chart</div><div class="panel-b">${sprayPanel(sprayR)}</div></div>
      <div class="panel" style="margin-top:16px"><div class="panel-h"><span class="yr">100 PAs</span> Rolling xwOBA</div><div class="panel-b">${rollingPanel(sprayR)}</div></div>`;

    const tabbar=`<div class="tabs"><div class="tab on">STATCAST</div><div class="tab">STANDARD</div><div class="tab">SPLITS</div><div class="tab">GAME LOGS</div></div>
      <div class="subtabs"><div class="st on">BATTING</div><div class="st">PITCHING</div><div class="st">FIELDING</div><div class="st">BAT TRACKING<span class="nw">NEW</span></div><div class="st">RUNNING</div><div class="st">BREAKDOWNS</div></div>`;

    document.getElementById('app').innerHTML=
      `<div class="grid3">${card}${pctPanel}<div>${sprayP}</div></div>`+
      tabbar+
      `<div class="tblsec"><div class="panel-h"><span class="yr">Statcast</span> Batting — Expected Statistics</div>
        <div id="sctable"><div class="state">Loading season Statcast…</div></div></div>`+
      arsenalTable(arsSplits,arsSav);
    document.title='Shohei Ohtani | Statcast, Visuals & Advanced Metrics';

    // stage 2: per-season expected statistics
    const yrs=[...new Set(yby.map(s=>+s.season))].filter(y=>y>=2018).sort();
    const ageBy={};yby.forEach(s=>{ageBy[s.season]=s.stat;});
    const perYr=await Promise.all(yrs.map(y=>csv(`${SAV}/leaderboard/expected_statistics?type=batter&year=${y}&min=1&csv=true`)
      .then(rows=>{const r=find(rows,ID);return r?{season:y,...r}:null;}).catch(()=>null)));
    const seasonRows=perYr.filter(Boolean);
    document.getElementById('sctable').innerHTML = seasonRows.length
      ? statcastTable(seasonRows)+'<div class="footnote">Note: figures cover the Statcast era (2015–present).</div>'
      : '<div class="state">Season Statcast unavailable.</div>';
  })();
</script>
</body>
</html>
