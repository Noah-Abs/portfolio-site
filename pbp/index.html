<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Play-by-Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════ Top bar ══════════ -->
  <header class="pbp-header">
    <div class="ph-brand">
      <span class="ph-dot"></span>
      <span class="ph-title">Play<span class="ph-title-sep">·</span>by<span class="ph-title-sep">·</span>Play</span>
    </div>
    <div class="ph-matchup" id="ph-matchup">
      <span class="ph-loading">Loading game…</span>
    </div>
    <div class="ph-status">
      <span class="ph-live-badge" id="ph-live-badge" hidden><span class="ph-live-pip"></span>LIVE</span>
      <span class="ph-updated" id="ph-updated"></span>
    </div>
  </header>

  <!-- ══════════ Three-column command center ══════════ -->
  <main class="pbp-grid" id="pbp-grid">

    <!-- ─────── LEFT · 22% · live info center ─────── -->
    <aside class="col col-left">

      <!-- Live status header -->
      <section class="card card-status" id="card-status">
        <div class="status-top">
          <span class="status-badge" id="status-badge">—</span>
          <span class="status-state" id="status-state"></span>
        </div>
        <div class="status-score" id="status-score"></div>
      </section>

      <!-- Game summary -->
      <section class="card card-summary" id="card-summary">
        <div class="card-head"><span class="card-label">Matchup</span></div>
        <div class="gs-teams">
          <div class="gs-team" id="gs-away">
            <img class="gs-logo" id="gs-away-logo" alt="" />
            <div class="gs-meta">
              <span class="gs-name" id="gs-away-name">—</span>
              <span class="gs-sub" id="gs-away-sub"></span>
            </div>
            <span class="gs-score" id="gs-away-score">0</span>
          </div>
          <div class="gs-team" id="gs-home">
            <img class="gs-logo" id="gs-home-logo" alt="" />
            <div class="gs-meta">
              <span class="gs-name" id="gs-home-name">—</span>
              <span class="gs-sub" id="gs-home-sub"></span>
            </div>
            <span class="gs-score" id="gs-home-score">0</span>
          </div>
        </div>
        <div class="gs-foot">
          <span class="gs-venue" id="gs-venue"></span>
          <span class="gs-time" id="gs-time"></span>
        </div>
      </section>

      <!-- Live event timeline -->
      <section class="card card-grow card-timeline" id="card-timeline">
        <div class="card-head">
          <span class="card-label"><span class="tl-live-pip" id="tl-live-pip"></span>Live Feed</span>
          <span class="card-sub" id="tl-count"></span>
        </div>
        <div class="tl-scroll" id="tl-body">
          <div class="empty-note">Waiting for first pitch…</div>
        </div>
        <button class="tl-return" id="tl-return" hidden>↑ Return to live</button>
      </section>

    </aside>

    <!-- ─────── CENTER · 56% · focal point ─────── -->
    <section class="col col-center">

      <!-- Scoreboard header -->
      <section class="card card-scoreboard" id="card-scoreboard">
        <div class="sb-grid">
          <div class="sb-team sb-away" id="sb-away">
            <img class="sb-logo" id="sb-away-logo" alt="" />
            <div class="sb-team-meta">
              <span class="sb-abbr" id="sb-away-abbr">—</span>
              <span class="sb-record" id="sb-away-record"></span>
            </div>
            <span class="sb-score" id="sb-away-score">0</span>
          </div>

          <div class="sb-center">
            <div class="sb-status-pill" id="sb-status-pill" hidden></div>
            <div class="sb-inning" id="sb-inning">
              <span class="sb-inning-arrow" id="sb-inning-arrow">▲</span>
              <span class="sb-inning-num" id="sb-inning-num">—</span>
            </div>
            <div class="sb-state-line" id="sb-state-line">First Pitch</div>
          </div>

          <div class="sb-team sb-home" id="sb-home">
            <span class="sb-score" id="sb-home-score">0</span>
            <div class="sb-team-meta">
              <span class="sb-abbr" id="sb-home-abbr">—</span>
              <span class="sb-record" id="sb-home-record"></span>
            </div>
            <img class="sb-logo" id="sb-home-logo" alt="" />
          </div>
        </div>
      </section>

      <!-- Inning tracker / linescore -->
      <section class="card card-innings" id="card-innings">
        <div class="sb-linescore-wrap card-scroll-x">
          <table class="sb-linescore" id="sb-linescore"></table>
        </div>
      </section>

      <!-- Base / count / outs / game state -->
      <section class="card card-state" id="card-state">
        <div class="gs-panel gs-count-panel">
          <div class="gs-count-big">
            <span class="gs-cn" id="scb-balls">0</span><span class="gs-cn-sep">–</span><span class="gs-cn" id="scb-strikes">0</span>
          </div>
          <div class="gs-count-pips">
            <div class="count-row"><span class="count-key">B</span><span class="count-pips" id="pips-balls"></span></div>
            <div class="count-row"><span class="count-key">S</span><span class="count-pips" id="pips-strikes"></span></div>
          </div>
          <span class="gs-panel-label">Count</span>
        </div>

        <div class="gs-panel gs-diamond-panel">
          <div class="bases-diamond" id="bases-diamond">
            <span class="base base-2b" id="base-2b"></span>
            <span class="base base-3b" id="base-3b"></span>
            <span class="base base-1b" id="base-1b"></span>
            <span class="base base-home"></span>
          </div>
          <span class="gs-situation" id="gs-situation">No runners on base</span>
        </div>

        <div class="gs-panel gs-outs-panel">
          <div class="count-pips outs-pips" id="pips-outs"></div>
          <span class="gs-outs-label" id="gs-outs-label">0 Outs</span>
          <span class="gs-panel-label">Outs</span>
        </div>

        <div class="gs-leverage" id="gs-leverage" hidden><span class="gs-lev-dot"></span>High Leverage</div>
      </section>

      <!-- Batter vs Pitcher matchup -->
      <section class="card card-matchup" id="card-matchup">
        <div class="mu-top">
          <div class="mu-side mu-batter">
            <span class="mu-role">At Bat</span>
            <img class="mu-headshot" id="mu-batter-img" alt="" />
            <div class="mu-info">
              <span class="mu-name" id="mu-batter-name">—</span>
              <span class="mu-meta" id="mu-batter-meta"></span>
              <div class="mu-stats" id="mu-batter-stats"></div>
            </div>
          </div>

          <div class="mu-center">
            <div class="mu-count" id="mu-count">0–0</div>
            <div class="mu-lastpitch" id="mu-lastpitch"></div>
            <div class="mu-h2h" id="mu-h2h"></div>
          </div>

          <div class="mu-side mu-pitcher">
            <span class="mu-role">Pitching</span>
            <img class="mu-headshot" id="mu-pitcher-img" alt="" />
            <div class="mu-info">
              <span class="mu-name" id="mu-pitcher-name">—</span>
              <span class="mu-meta" id="mu-pitcher-meta"></span>
              <div class="mu-stats" id="mu-pitcher-stats"></div>
            </div>
          </div>
        </div>
        <div class="mu-arsenal" id="mu-arsenal"></div>
      </section>

      <!-- Current at-bat pitch sequence -->
      <section class="card card-pitchseq" id="card-pitchseq">
        <div class="card-head">
          <span class="card-label">Current At-Bat</span>
          <span class="card-sub" id="ps-sub"></span>
        </div>
        <div class="ps-track" id="ps-track">
          <div class="empty-note">No pitches yet.</div>
        </div>
      </section>

      <!-- Play-by-play feed (at-bat grouped, newest at bottom) -->
      <section class="card card-grow card-pbp" id="card-pbp">
        <div class="card-head">
          <span class="card-label"><span class="tl-live-pip" id="pbp-live-pip"></span>Play-by-Play</span>
          <span class="card-sub" id="pbp-sub"></span>
        </div>
        <div class="pbp-scroll" id="pbp-scroll">
          <div class="empty-note">Waiting for first pitch…</div>
        </div>
        <button class="tl-return pbp-return" id="pbp-return" hidden>↓ Return to live</button>
      </section>

    </section>

    <!-- ─────── RIGHT · 22% · box score ─────── -->
    <aside class="col col-right">
      <section class="card card-grow card-box" id="card-box">
        <div class="card-head">
          <span class="card-label">Box Score</span>
          <div class="box-tabs" id="box-tabs">
            <button class="box-tab active" data-team="away" id="box-tab-away">Away</button>
            <button class="box-tab" data-team="home" id="box-tab-home">Home</button>
          </div>
        </div>
        <div class="card-body card-scroll" id="box-body">
          <div class="skeleton-lines"><span></span><span></span><span></span><span></span></div>
        </div>
      </section>
    </aside>

  </main>

  <script src="pbp.js"></script>
</body>
</html>
